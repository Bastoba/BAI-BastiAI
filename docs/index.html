const HELP_EN = {"attackBehavior":"Active: searches for eligible monsters automatically.\nPassive: no normal automatic target search; manual commands\nremain available. Assist: helps against the owner's target.\nSeparately enabled defense can still apply. A T mode name\n(such as Passive) does not determine its attack behavior.","attackDance":"Your Homunculus moves between attacks, which can slightly increase its attack speed.","attackGeneral":"This page controls normal automatic targeting and distance limits.\nUse the neighboring tabs for skills and monster rules.\nProtection is configured separately under Defense;\nTank and PvP use their own combat rules.","combatDistance":"Distance in cells from the owner. New automatic targets must be\ninside this limit. If the Homunculus moves too far away during\nnormal automatic combat, the target is released and it follows\nthe owner. Manual targets and Tank have separate rules.","defaultMonsterAction":"Controls monsters without their own Monster Rule.\nSkills only disables normal attacks, No skills allows only normal attacks,\nBoth allows both, and Nothing ignores those monsters automatically.","defense":"Owner and self-defense respect monster priority.\nOnly the additional owner override can take precedence;\nit is off by default. Self-defense applies when no eligible\nhigher-priority target takes precedence.\nFriend protection and assistance keep their separate rules.","finishFight":"The Homunculus does not follow the owner immediately; an already started\nfight continues up to the configured combat distance.","healHpTarget":"Chooses whose HP triggers this healing/special skill.\nHomunculus only completely ignores the owner's HP.\nEither one triggers when an enabled HP threshold is crossed.","idleInterval":"Interval in milliseconds for idle movement decisions in\nWander, Orbit and Route. 1000 ms is one second.\nThis is not the overall AI tick rate or an attack delay.","idleMode":"Movement outside combat. Wander moves randomly, Orbit circles the owner,\nand Route follows the selected grid points.\nIn the current build, Still and Follow Owner behave practically the same and keep the Homunculus near the owner.","idleRadius":"Radius around the owner for Wander and Orbit.\nRoute uses its own grid points.\nMoving and stopped follow distances are configured separately.\nThis is not an automatic attack range.","killSteal":"Prevents your Homunculus from automatically interfering in other players' fights. It only attacks monsters that are free or already fighting you, your Homunculus or a player on its friend list.","lagReduction":"Sets a minimum interval in milliseconds between throttled automatic AI commands. This reduces command output but can make the Homunculus respond more slowly.","modeTransfer":"Exports this T mode's settings to a file so you can save them or share them with friends. Import loads such a file and replaces the settings of the selected T mode.","monsterBehavior":"Do not attack: exclude this monster from normal automatic selection.\nNo skills: normal attacks only. Skills only: no normal hits.\nNormal + skills: allow both. Skill restrictions affect offensive\nskills; healing, buffs, defensive and emergency skills retain\ntheir own conditions.","monsterLevel":"Overrides the general offensive skill level against this monster,\nincluding level 1 and the Automatic selection.\nChoose a level the Homunculus has actually learned.\nHealing, buff and defensive skills keep their own levels.","monsterRules":"Special rules apply only to the selected monster entry.\nWithout a rule, general skills and priority 5 apply.\nSearch by name, AI ID or MidgardHub ID; if numbers collide,\nchoose the correct named entry. The i markers in the column\nheaders explain the settings for every row.","monsterSkill":"Automatic uses enabled general offensive skill rules.\nSelecting a skill restricts offensive skills against this monster.\nIt must also be learned and enabled on the Skills tab.\nIts SP threshold and interval still apply.\nHealing and buffs are not restricted to that selected skill.","moveAttack":"The Homunculus may attack new targets while the owner is moving.\nWhen disabled, it follows the owner instead of starting new fights.","moveRange":"Maximum distance of a new automatic target from the moving owner,\nin cells. Used for targeting while moving;\nthe general combat-distance limit still applies.","normalPlants":"Excludes ordinary plants such as Green Plant from normal automatic target selection.","onlyMonsterRules":"When enabled, this offensive skill is only used against monsters\nwhere this exact skill is selected in Monster Rules.\n'Automatic' does not count as an explicit permission.","overview":"The overview shows the selected T mode.\nT1 and T2 are two configurable modes, not fixed Active/Passive slots.\nOnly settings explicitly marked as shared apply to both.\nSave stores the profile; Install generates the UserAI used by the game.","overviewPvp":"Enables PvP mode. While it is active, you cannot add players to your Homunculus's friend list or remove them.","overviewTank":"Enables Tank mode. Configure its behavior and skills on the Tank page.","ownerPriority":"When the owner and Homunculus are both attacked and their\nattackers have equal monster priority, prefer owner protection.\nUnchecked: distance breaks a tie. Higher monster priority still wins.\nThe separate owner override can explicitly take precedence\nover monster priority.","party":"Alt + right-click another player to add them to your Homunculus's friend list. Repeat this on a saved friend to remove them. The Homunculus moves to the selected player and circles them on its own.\n\nAlt + right-click your own character to have your Homunculus visit saved friends nearby. PvP must be disabled to add or remove friends.","partyAssist":"Allows assist targeting to consider known friends' targets.\nRequires the enabled friend list.\nChoose Assist attack behavior for normal assistance.","partyProtect":"Protects players in the saved friend list.\nRequires Enable party / friends. Unsaved party members\nare not automatically recognized by this option.","preserveNormalAttacks":"Exempts normal attacks from the extra lag delay so the Homunculus can keep as close as possible to its normal attack speed (ASPD).","priority":"1 is highest priority, 10 is lowest. Monsters without a rule use 5.\nFor initial automatic selection, equally ranked eligible targets\nare ordered by distance. Switching during a running fight also\nrequires Interrupt target on the new monster.","protectOwner":"Reacts to eligible monsters attacking your character.\nWithout the additional owner override, monster priority applies.\nCan apply even without normal active target searching.\nProtection rules and distance limits still apply.","protectSelf":"Reacts to eligible monsters attacking the Homunculus.\nIt does not displace eligible higher-priority targets.\nSwitching away from a defense target requires the interrupt checkboxes.\nSelf-defense can resume after the higher-priority target is defeated.","route":"Select up to 30 points in the 15×15 grid. The Homunculus follows\nthem in order while the owner is standing still. P marks the owner;\nclick a point again to remove it. The four X corners are blocked.\nClear route empties the point list.","routeTimeout":"If a route point is not reached within this many milliseconds,\nthe route advances to the next point. Useful for obstacles,\nbut not a guarantee of pathfinding. Applies only to Route.","routeTolerance":"Distance in cells within which a route point counts as reached.\n0 requires the exact target cell. Larger values tolerate\nsmall differences. Applies only to Route.","sharedLag":"Keeps the lag interval and the 'Do not throttle normal attacks' option the same for T1 and T2. While enabled, changes apply to both modes.","skillDistance":"Maximum distance of the Homunculus from the owner for normal\nautomatic skills, in cells. This is not the skill's range to a\nmonster. Automatic healing or support may also wait outside\nthis limit.","skillFields":"Active enables this rule. Skill level: select only learned levels.\nMinimum SP is an absolute value, not a percentage.\nInterval is the minimum time between commands for this rule;\nreadiness, HP conditions and the global skill pause must also allow it.\nHP below %: triggers below the selected percentage.\n0 disables that HP trigger, not the SP check.","skillPause":"Additional minimum interval between normal automatic skill\ncommands, in seconds. Applies alongside each rule's interval.\n0 disables this additional pause. It does not remove\nany cooldown imposed by the game.","skills":"Add rules for skills this Homunculus has actually learned.\nEach rule has a level, minimum SP and an interval. Multiple rules\nfor the same skill are possible. HP conditions apply to the\ncorresponding healing/protection skills. Monster rules can\nrestrict offensive skill selection and level.","skillsEnabled":"Enables or disables the normal automatic skill rules together.\nEach individual rule must also be enabled.\nTank and PvP have separate skill lists and controls.","startupDelay":"Sets how many milliseconds the Homunculus waits after the AI reloads before automatic actions begin. After a map change or teleport, the delay applies if the client reloads the AI. 0 ms disables the delay.","summonedPlants":"Excludes plants summoned by an Alchemist from normal automatic target selection.","tankArea":"Radius for Tank targeting around the owner, in cells.\nOwner rescue is also limited to this area.\nIt is not the Homunculus' desired holding distance.","tankBound":"Continues fighting monsters already bound to the Homunculus when\nno fresh Tank target or owner rescue is pending.\nNew eligible targets still take priority.","tankBoundSkills":"Allows offensive skills against already tanked monsters.\nTank skill levels, SP thresholds and intervals still apply.\nHealing and support retain their own conditions.","tankDistance":"Desired distance from the owner after gathering monsters, in cells.\nOnce all are bound, the Homunculus returns within this distance\nand follows when the owner moves away.\nTank Area is a separate setting.","tankExclusions":"This list excludes monsters from Tank targeting. Search by name\nor ID and add the matching catalog entry.\nUse custom IDs deliberately. Known catalog IDs are mapped during\nexport; matching numbers do not always mean the same monster type.","tankMode":"Fresh eligible monsters inside the Tank Area are pulled first.\nThe Homunculus then returns to Tank distance from the owner\nand may continue fighting bound monsters. Fresh targets and\nowner rescue take priority. Tank replaces normal combat;\nenabling it disables PvP. Configure Tank skills and exclusions\nseparately on this page.\nFresh monsters first receive one pull attempt. After a short execution check, the next monster is selected. A ranged skill does not immediately lead to melee pursuit. If aggro is not acquired, the pull is retried later. An issued command is not a confirmed hit.","tankNormal":"Allows normal attacks in Tank mode, including when no eligible\noffensive skill is ready. Without normal attacks, pulling aggro\ndepends on available skills.","tankPlants":"Excludes the listed normal Plants and mushrooms from Tank\ntargeting. Independent of the normal Attack tab.","tankRescue":"Allows offensive skills when pulling an attacker off the owner.\nWhen disabled, the rescue path uses normal attacks.\nTank Area, exclusions and existing protection checks still apply.","tankSkillFields":"Level: learned skill level. Min. SP: absolute minimum amount.\nInterval: earliest repeat of this skill rule in seconds.\nHP below % is shown for relevant healing/protection skills.\nCheck HP of selects whose health is monitored, not necessarily\nthe actual healing target; Chaotic Blessings is randomized by the game.","tankSkills":"This skill list is used only by Tank. Normal PvE skill rules and\nmonster-specific offensive skill levels do not control it.\nChoose learned skills and levels. Offensive skills also respect\nthe general Tank SP limit. Healing/protection skills use their\nintervals and HP conditions.","tankSp":"Additional minimum SP for offensive Tank skills, as an absolute value.\nEach Tank skill rule's SP threshold also applies.\nA normal attack may take over when SP is too low, if enabled.","tankSummoned":"Excludes the listed summoned Plants from Tank targeting.\nThis setting is independent of the normal Attack tab.","targetSwitching":"Both checkboxes belong to the NEW monster in this row.\nInterrupt target: switch to a lower priority number. Equal priority\nis not enough. Also manual targets: additionally permits replacing\na manually selected monster. Checked while chasing and attacking,\nincluding ranged skills. Self-defense does not block the switch.\nOwner protection blocks it only when its override is enabled\non the Defense page. Friend protection, assist/PvP, distance limits,\nkill-steal protection and exclusions remain protected.\nOngoing snipes keep their bounded confirmation window.","ownerDefenseOverridesPriority":"Default: off. Applies only to monsters attacking your character.\nOn: owner defense takes precedence over monster priorities.\nOff: an eligible higher-priority monster can be fought first.\nSwitching during combat still requires the interrupt checkboxes.\nHomunculus self-defense never receives this override.\nRequires owner protection; saved separately for each T mode.","followMovingDistance":"Positive values = aim behind the player, e.g. +14 for 14 cells behind.\n0 = aim at the player. Negative values = aim ahead of the player, e.g. −3 for 3 cells ahead.\nDirection is derived from the latest movement and updated when turning. Turning in place cannot be detected.\nWithout a recent movement direction, the Homunculus follows normally using the absolute distance. After stopping, the separate stopped distance applies.\nThis is a target position, not a guaranteed gap: speed, obstacles and client response can change the actual distance. Applies to the selected T mode.","followStoppedDistance":"Positive values = stand behind the player. Negative values = stand ahead of the player. 0 = stand at the player.\nThe last detected movement direction is retained after stopping. Turning in place cannot be detected.\nExample: moving −3 and stopped −3 keeps the target three cells ahead. Moving −5 and stopped −2 brings the Homunculus closer to two cells ahead.\nWithout a known direction, the absolute value is used as a normal distance on the current side.\nWander, orbit or route movement resumes after reaching the stand position. Combat rules, Tank holding distance and manual commands still apply.","tankAggroRetry":"Wait before selecting an attempted but still unbound monster for another pull. Default: 1800 ms.\nOther fresh monsters are preferred meanwhile. The short skill execution check may increase the actual minimum wait. Owner rescue is checked independently and retried sooner.","attackDanceMini":"Sends movement commands to the current homunculus cell instead of a neighboring cell. Only one Attack Dance variant can be enabled per T mode. Like classic Attack Dance, runs only with lag reduction Off, Minimal (1 ms) or Light (10 ms). Experimental: faster attacks have not been confirmed in the game. Download both AI.lua and BAI_Config.lua again under Install."};
const CASTLING_HELP = {"de":"HP-Schwelle: 0 = aus bei Treffer/Ziel-Auslöser. HP-Verlust ist kein bestätigter Treffer; Heilung zwischen AI-Ticks kann ihn verdecken. Intervall und Mindest-SP gelten zusätzlich.","en":"HP threshold: 0 = disabled for loss/target triggers. HP loss is not a confirmed hit; healing between AI ticks can mask it. Interval and minimum SP also apply."};
const HELP = {"attackBehavior":"Aktiv: sucht selbstständig gültige Monster.\nPassiv: keine normale automatische Zielsuche; manuelle Befehle\nbleiben möglich. Assistieren: unterstützt das Ziel des Besitzers.\nSeparat aktivierte Verteidigung bleibt möglich. Der Name eines\nT-Modus (z. B. Passive) legt das Angriffsverhalten nicht fest.","attackDance":"Dein Homunculus bewegt sich zwischen den Angriffen. Dadurch kann er etwas schneller angreifen.","attackGeneral":"Diese Seite legt die normale automatische Zielsuche und ihre\nEntfernungsgrenzen fest. Skills und Monsterregeln stehen in den\nNachbarreitern. Schutzregeln sind separat unter Verteidigung;\nTank und PvP verwenden ihre eigenen Kampfregeln.","combatDistance":"Entfernung in Feldern vom Besitzer. Neue automatische Ziele\nmüssen innerhalb dieser Grenze liegen. Entfernt sich der Homunculus\nim normalen automatischen Kampf zu weit, wird das Ziel freigegeben\nund zum Besitzer zurückgekehrt. Manuelle Ziele und Tank haben\neigene Regeln.","defaultMonsterAction":"Bestimmt das Verhalten gegen Monster ohne eigene Monster-Regel.\nNur Skills verhindert normale Angriffe, Keine Skills erlaubt nur normale Angriffe,\nBeides erlaubt beides und Gar nichts ignoriert solche Monster automatisch.","defense":"Spieler- und Selbstverteidigung beachten die Monster-Priorität.\nNur der zusätzliche Spieler-Vorrang kann sie überstimmen;\ndieser ist standardmäßig aus. Selbstverteidigung greift, wenn\nkein höher priorisiertes zulässiges Ziel ansteht.\nFreundes-Verteidigung und Assistenz behalten ihre eigenen Regeln.","finishFight":"Der Homunculus folgt dem Spieler nicht sofort, sondern führt einen bereits\nbegonnenen Kampf bis zur eingestellten Kampfentfernung weiter.","healHpTarget":"Legt fest, wessen HP diesen Heil-/Spezialskill auslösen.\nNur Homunculus ignoriert die Spieler-HP vollständig.\nEiner von beiden löst aus, sobald eine aktivierte HP-Grenze unterschritten wird.","idleInterval":"Zeitabstand in Millisekunden für Leerlauf-Bewegungsentscheidungen\nbei Wander, Orbit und Route. 1000 ms sind eine Sekunde.\nKein allgemeiner AI-Takt und keine Angriffspause.","idleMode":"Bewegungsverhalten außerhalb eines Kampfes. Wander bewegt sich zufällig,\nOrbit läuft um den Spieler und Route folgt den gesetzten Rasterpunkten.\nStill und Follow Owner verhalten sich im aktuellen Stand praktisch gleich und halten das Homu beim Spieler.","idleRadius":"Radius in Feldern um den Spieler für Wander und Orbit.\nDie Route verwendet ihre eigenen Rasterpunkte.\nDie Abstände beim Folgen und nach dem Anhalten werden getrennt eingestellt.\nDas ist keine Reichweite für automatische Angriffe.","killSteal":"Verhindert, dass dein Homunculus automatisch in fremde Kämpfe eingreift. Er greift nur Monster an, die frei sind oder bereits gegen dich, deinen Homunculus oder einen Spieler aus seiner Freundesliste kämpfen.","lagReduction":"Legt einen Mindestabstand in Millisekunden zwischen gedrosselten automatischen AI-Befehlen fest. Dadurch werden weniger Befehle gesendet; der Homunculus kann jedoch langsamer reagieren.","modeTransfer":"Exportiert die Einstellungen dieses T-Modus als Datei, damit du sie sichern oder mit Freunden teilen kannst. Ein Import lädt eine solche Datei und ersetzt die Einstellungen des ausgewählten T-Modus.","monsterBehavior":"Nicht angreifen: keine normale automatische Auswahl dieses Monsters.\nKeine Skills: nur normale Angriffe. Nur Skills: keine normalen Schläge.\nNormal + Skills: beides verwenden. Die Skill-Einschränkung betrifft\nAngriffsskills; Heilung, Buffs, Defensiv- und Notfallskills behalten\nihre eigenen Bedingungen.","monsterLevel":"Überschreibt das allgemeine Level des Angriffsskills gegen dieses\nMonster, auch bei Level 1 und Auswahl Automatisch.\nNur ein tatsächlich gelerntes Level einstellen.\nHeil-, Buff- und Defensivskills behalten ihre eigenen Level.","monsterRules":"Sonderregeln gelten nur für den ausgewählten Monstereintrag.\nOhne Regel gelten die allgemeinen Skills und Priorität 5.\nSuche nach Namen, AI-ID oder MidgardHub-ID; bei gleichen Nummern\nden passenden benannten Eintrag wählen. Die i-Punkte in den\nSpaltenüberschriften erklären die Einstellungen für alle Zeilen.","monsterSkill":"Automatisch verwendet die aktivierten normalen Angriffsskill-Regeln.\nEin ausgewählter Skill begrenzt die Angriffsskills gegen dieses Monster.\nEr muss auch auf der Skills-Seite aktiviert und gelernt sein.\nSP-Grenze und Intervall dieser Skillregel gelten weiter.\nHeilung und Buffs werden nicht auf diesen Skill eingeschränkt.","moveAttack":"Der Homunculus greift neue Ziele auch an, während der Spieler läuft.\nWenn deaktiviert, folgt der Homunculus dem Spieler, statt neue Kämpfe zu beginnen.","moveRange":"Maximaler Abstand eines neuen automatischen Ziels vom laufenden\nBesitzer, in Feldern. Wird für die Zielsuche beim Laufen verwendet;\ndie allgemeine Kampfgrenze gilt zusätzlich.","normalPlants":"Schließt einfache Pflanzen wie Green Plant von der normalen automatischen Zielauswahl aus.","onlyMonsterRules":"Wenn aktiviert, wird dieser Angriffsskill nur gegen Monster verwendet,\nbei denen genau dieser Skill in den Monster-Regeln ausgewählt wurde.\n'Automatisch' zählt dabei nicht als ausdrückliche Freigabe.","overview":"Die Übersicht zeigt die Einstellungen des ausgewählten T-Modus.\nT1 und T2 sind zwei frei einstellbare Modi, nicht fest Aktiv/Passiv.\nNur ausdrücklich gemeinsam markierte Einstellungen gelten für beide.\nSpeichern sichert das Profil; Installieren erzeugt die UserAI für das Spiel.","overviewPvp":"Aktiviert den PvP-Modus. Solange er aktiv ist, lassen sich keine Spieler in die Freundesliste des Homunculus aufnehmen oder daraus entfernen.","overviewTank":"Aktiviert die Tank-Funktion. Das Verhalten und die zugehörigen Skills stellst du auf der Tank-Seite ein.","ownerPriority":"Wenn Spieler und Homunculus angegriffen werden und die\nAngreifer dieselbe Monster-Priorität haben: Spielerschutz bevorzugen.\nOhne Haken entscheidet bei Gleichstand die Entfernung.\nHöhere Monster-Prioritäten bleiben maßgeblich. Der separate\nSpieler-Vorrang kann die Monster-Priorität ausdrücklich überstimmen.","party":"Mit Alt + Rechtsklick auf einen anderen Spieler fügst du ihn zur Freundesliste deines Homunculus hinzu. Bei einem bereits gespeicherten Freund entfernst du ihn wieder. Der Homunculus läuft selbstständig zu dem Spieler und umrundet ihn.\n\nMit Alt + Rechtsklick auf deinen eigenen Charakter besucht dein Homunculus die gespeicherten Freunde in der Nähe. PvP muss zum Ein- und Austragen ausgeschaltet sein.","partyAssist":"Erlaubt der Assistenz-Zielsuche, Ziele bekannter Freunde\nzu berücksichtigen. Benötigt die aktivierte Freundesliste.\nFür normale aktive Unterstützung Angriffsverhalten Assistieren wählen.","partyProtect":"Schützt Spieler aus der gespeicherten Freundesliste.\nBenötigt Party / Freunde aktivieren. Nicht gespeicherte\nParty-Mitglieder werden dadurch nicht automatisch erkannt.","preserveNormalAttacks":"Nimmt normale Angriffe von der zusätzlichen Lag-Pause aus, damit der Homunculus möglichst mit seiner gewohnten Angriffsgeschwindigkeit (ASPD) zuschlägt.","priority":"1 ist die höchste Priorität, 10 die niedrigste. Ohne Regel gilt 5.\nBei gleicher Priorität wird für die erste automatische Auswahl\ndas nähere gültige Ziel bevorzugt. Für einen Wechsel im laufenden\nKampf braucht das neue Monster zusätzlich Wechsel erzwingen.","protectOwner":"Reagiert auf gültige Monsterangreifer deines Spielers.\nOhne zusätzlichen Spieler-Vorrang gilt die Monster-Priorität.\nKann auch ohne aktive normale Zielsuche greifen.\nSchutz- und Entfernungsregeln bleiben maßgeblich.","protectSelf":"Reagiert auf gültige Monster, die den Homunculus angreifen.\nHöher priorisierte zulässige Ziele werden dadurch nicht verdrängt.\nBeim Wechsel vom Verteidigungsziel gelten die Wechsel-Haken.\nNach dem priorisierten Ziel kann die Selbstverteidigung wieder greifen.","route":"Wähle im 15×15-Raster bis zu 30 Punkte aus, die dein Homunculus\nin dieser Reihenfolge abläuft, wenn der Spieler still steht.\nP markiert den Spieler; erneutes Anklicken entfernt einen Punkt.\nDie vier X-Ecken sind gesperrt. Route löschen leert die Punktliste.","routeTimeout":"Wird ein Routenpunkt nicht innerhalb dieser Millisekunden erreicht,\nwechselt die Route zum nächsten Punkt. Hilft bei Hindernissen;\nist keine garantierte Wegfindung. Gilt nur für Route.","routeTolerance":"Abstand in Feldern, in dem ein Routenpunkt als erreicht gilt.\n0 verlangt die genaue Zielzelle. Größere Werte tolerieren\nkleine Abweichungen. Gilt nur für Route.","sharedLag":"Gleicht das Lag-Intervall und die Option „Normale Angriffe nicht drosseln“ zwischen T1 und T2 ab. Solange der Haken gesetzt ist, gelten Änderungen für beide Modi.","skillDistance":"Maximaler Abstand des Homunculus zum Besitzer für normale\nautomatische Skills, in Feldern. Das ist nicht die Reichweite\ndes Skills zum Monster. Außerhalb dieser Grenze kann auch\nautomatische Heilung oder Unterstützung warten.","skillFields":"Aktiv schaltet diese Regel ein. Skill-Level: nur gelernte Level wählen.\nMindest-SP ist ein absoluter SP-Wert, kein Prozentsatz.\nIntervall ist die Mindestzeit zwischen Ausgaben dieser Regel;\nBereitschaft, HP-Bedingung und globale Skillpause müssen passen.\nHP unter %: löst unterhalb der eingestellten Prozentgrenze aus.\n0 deaktiviert diese HP-Auslösebedingung, nicht die Prüfung auf SP.","skillPause":"Zusätzlicher Mindestabstand zwischen normalen automatischen\nSkillbefehlen, in Sekunden. Gilt zusätzlich zum Intervall der\neinzelnen Regel. 0 schaltet diese zusätzliche Pause aus.\nSpielseitige Sperrzeiten werden dadurch nicht aufgehoben.","skills":"Lege Regeln für tatsächlich gelernte Skills dieses Homunculus an.\nJede Regel hat Level, Mindest-SP und ein Intervall. Mehrere Regeln\nfür denselben Skill sind möglich. HP-Bedingungen gelten nur für\ndie jeweiligen Heil-/Schutzskills. Monsterregeln können den\nAngriffsskill und sein Level gezielt einschränken.","skillsEnabled":"Schaltet die normalen automatischen Skillregeln gemeinsam ein\noder aus. Die einzelnen Regeln müssen ebenfalls aktiviert sein.\nTank und PvP besitzen eigene Skilllisten und Schalter.","startupDelay":"Legt fest, wie viele Millisekunden der Homunculus nach dem Neuladen der AI wartet, bevor automatische Aktionen beginnen. Bei einem Mapwechsel oder Teleport gilt die Pause, wenn der Client dabei die AI neu lädt. 0 ms deaktiviert die Verzögerung.","summonedPlants":"Schließt die beschworenen Pflanzen eines Alchemisten von der normalen automatischen Zielauswahl aus.","tankArea":"Radius der Tank-Zielsuche um den Besitzer, in Feldern.\nAuch die Besitzerrettung bleibt auf diese Area begrenzt.\nDie Area ist nicht der gewünschte Halteabstand des Homunculus.","tankBound":"Bekämpft bereits am Homunculus gebundene Monster weiter, sobald\nkein frisches Tank-Ziel und keine Besitzerrettung anstehen.\nNeue gültige Ziele werden weiterhin bevorzugt.","tankBoundSkills":"Erlaubt Angriffsskills gegen bereits getankte Monster.\nDie Tank-Skillregeln mit Level, SP-Grenzen und Intervallen gelten\nweiterhin. Heilung und Unterstützung haben eigene Bedingungen.","tankDistance":"Gewünschter Abstand zum Besitzer nach dem Sammeln der Monster,\nin Feldern. Ist alles gebunden, kehrt der Homunculus bis zu\ndiesem Abstand zurück. Er folgt entsprechend, wenn der Besitzer\nsich entfernt. Die Tank-Area ist davon getrennt.","tankExclusions":"Diese Liste schließt Monster vom Tanken aus. Suche über Namen\noder ID und füge den passenden Katalogeintrag hinzu.\nEigene IDs nur bewusst verwenden. Bekannte Katalog-IDs werden\nbeim Export zugeordnet; gleiche Zahlen sind nicht immer derselbe Typ.","tankMode":"Neue gültige Monster in der Tank-Area werden zuerst angetankt.\nDanach kehrt der Homunculus auf Tank-Abstand zum Besitzer zurück\nund kann gebundene Monster weiter bekämpfen. Neue Ziele und\nBesitzerrettung haben Vorrang. Tank ersetzt den normalen\nAngriffsmodus; PvP wird beim Einschalten deaktiviert.\nTank-Skills und Ausschlüsse werden hier separat eingestellt.\nNeue Monster erhalten zunächst einen Angriffsversuch. Nach einer kurzen Ausführungsprüfung kommt das nächste Monster dran. Ein Fernskill führt dabei nicht direkt zum Nahkampf. Bleibt die Aggro aus, folgt später ein erneuter Versuch. Ein ausgegebener Befehl ist kein bestätigter Treffer.","tankNormal":"Erlaubt normale Angriffe im Tank-Modus, auch als Alternative,\nwenn kein zulässiger Angriffsskill bereit ist.\nOhne normalen Angriff ist das Antanken auf verfügbare Skills angewiesen.","tankPlants":"Schließt die hinterlegten normalen Plants und Pilze aus der\nTank-Zielsuche aus. Unabhängig vom normalen Angriffstab.","tankRescue":"Erlaubt Angriffsskills beim Ablösen eines Angreifers vom Besitzer.\nAusgeschaltet verwendet der Rettungspfad normale Angriffe.\nTank-Area, Ausschlüsse und die vorhandenen Schutzprüfungen gelten weiter.","tankSkillFields":"Level: gelerntes Skill-Level. Min. SP: absoluter Mindestwert.\nIntervall: früheste erneute Ausgabe dieser Skillregel in Sekunden.\nHP unter % wird nur bei passenden Heil-/Schutzskills angeboten.\nHP prüfen von wählt die überwachte Person, nicht zwingend das\ntatsächliche Heilziel; Chaotic Blessings entscheidet spielseitig zufällig.","tankSkills":"Diese Skillliste gilt nur für Tank. Normale PvE-Skillregeln und\nmonsterbezogene Angriffsskill-Level werden dafür nicht verwendet.\nWähle gelernte Skills und Level. Offensive Skills beachten auch\ndie allgemeine Tank-SP-Grenze. Heil-/Schutzskills verwenden\nihr Intervall und ihre HP-Bedingungen.","tankSp":"Zusätzliche Mindest-SP für offensive Tank-Skills als absoluter Wert.\nDie SP-Grenze jeder Tank-Skillregel gilt ebenfalls.\nBei zu wenig SP kann ein normaler Angriff übernehmen, wenn erlaubt.","tankSummoned":"Schließt die hinterlegten beschworenen Plants aus der Tank-Zielsuche\naus. Dieser Haken ist unabhängig vom normalen Angriffstab.","targetSwitching":"Beide Haken gehören zum NEUEN Monster in dieser Zeile.\nWechsel erzwingen: wechselt zu einer kleineren Prioritätszahl.\nGleiche Priorität reicht nicht. Auch manuelle Ziele: erlaubt\nzusätzlich das Ablösen eines manuell gewählten Monsters.\nGeprüft beim Verfolgen und Angreifen, auch während Fernskills.\nSelbstverteidigung blockiert diesen Wechsel nicht. Spielerschutz\nblockiert ihn nur mit aktiviertem Spieler-Vorrang unter Verteidigung.\nFreundes-Verteidigung, Assist/PvP sowie Distanz-, KS- und\nAusschlussregeln bleiben geschützt. Laufende Snipes behalten\nihr begrenztes Bestätigungsfenster.","ownerDefenseOverridesPriority":"Standard: aus. Gilt nur für Angreifer deines Spielers.\nAn: Spieler-Verteidigung hat Vorrang vor Monster-Prioritäten.\nAus: Ein höher priorisiertes Monster kann zuerst bekämpft werden.\nBeim Wechsel im Kampf gelten weiterhin die Wechsel-Haken.\nDie Selbstverteidigung des Homunculus erhält diesen Vorrang nie.\nSetzt aktivierten Spielerschutz voraus; wird je T-Modus gespeichert.","followMovingDistance":"Positive Werte = Zielposition hinter dem Spieler, z. B. +14 für 14 Felder dahinter.\n0 = Zielposition beim Spieler. Negative Werte = Zielposition vor dem Spieler, z. B. −3 für 3 Felder davor.\nDie Richtung wird aus der letzten Bewegung abgeleitet und bei Kurven angepasst. Drehen im Stand wird nicht erkannt.\nOhne aktuelle Laufrichtung folgt der Homu mit dem Betrag des eingestellten Abstands normal. Nach dem Anhalten gilt der separate Standabstand.\nDie Zielposition ist keine garantierte Entfernung: Geschwindigkeit, Hindernisse und die Reaktion des Clients können den tatsächlichen Abstand verändern. Gilt für den ausgewählten T-Modus.","followStoppedDistance":"Positive Werte = Standposition hinter dem Spieler. Negative Werte = Standposition vor dem Spieler. 0 = Position beim Spieler.\nMaßgeblich ist die letzte erkannte Laufrichtung. Diese bleibt nach dem Anhalten gespeichert; Drehen im Stand wird nicht erkannt.\nBeispiel: Laufen −3 und Stand −3 hält das Ziel drei Felder vor dem Spieler. Laufen −5 und Stand −2 lässt den Homu vorne auf zwei Felder herankommen.\nOhne bekannte Richtung gilt der Betrag als normaler Abstand auf der aktuellen Seite.\nWander-, Orbit- oder Routenbewegung beginnt nach Erreichen der Standposition wieder. Kampfregeln, Tank-Halteabstand und manuelle Befehle gelten weiterhin.","tankAggroRetry":"Wartezeit, bevor ein bereits angegriffenes, aber noch nicht gebundenes Monster erneut zum Sammeln ausgewählt wird. Standard: 1800 ms.\nWährenddessen werden andere neue Monster bevorzugt. Die kurze Ausführungsprüfung eines Skills kann die tatsächliche Mindestwartezeit verlängern. Spielerrettung wird unabhängig davon häufiger geprüft.","attackDanceMini":"Bewegungsbefehl auf die aktuelle Homunculus-Zelle statt auf eine Nachbarzelle. Nur eine Attack-Dance-Variante kann pro T-Modus aktiv sein. Wie klassisches Attack Dance nur bei Lag-Reduktion Aus, Minimal (1 ms) oder Leicht (10 ms). Experimentell: höhere Angriffsgeschwindigkeit ist im Spiel noch nicht bestätigt. Unter Installieren sowohl AI.lua als auch BAI_Config.lua neu herunterladen."};

\nlocal debugLastTick = 0\r\nlocal debugLastTarget = -1\r\nlocal returnToOwnerAfterCombat = false\r\nlocal returnToOwnerAfterMovement = false\r\nlocal attackDanceStanceX = 0\r\nlocal attackDanceStanceY = 0\r\nlocal attackDanceTarget = 0\r\nlocal partyFriendsLoaded = false\r\nlocal partyFriends = {}\r\nlocal friendMotionQueue = {}\r\nlocal friendMotionQueueIndex = 0\r\nlocal friendMotionActor = 0\r\nlocal friendMotionRounds = 0\r\nlocal friendMotionRound = 0\r\nlocal friendMotionStep = 1\r\nlocal friendMotionPendingAction = nil\r\nlocal friendMotionWaypointX = nil\r\nlocal friendMotionWaypointY = nil\r\nlocal friendMotionWaypointStarted = 0\r\nlocal friendMoveProbePending = false\r\nlocal friendMoveProbeStarted = 0\r\nlocal friendMoveProbeSawMovement = false\r\n\r\nlocal function AttackDanceAbsUnit(value)\r\n    if value < 0 then return -1 end\r\n    if value > 0 then return 1 end\r\n    return 0\r\nend\r\n\r\n-- Melee-cell rotation used by the classic Attack Dance.\r\nlocal function AttackDanceAdjustCW(x, y, ox, oy)\r\n    local newx, newy\r\n    if x == ox then\r\n        if y == oy then\r\n            newx, newy = ox + 1, oy\r\n        else\r\n            local dy = y - oy\r\n            newx = x + AttackDanceAbsUnit(dy)\r\n            newy = y\r\n        end\r\n    elseif y == oy then\r\n        local dx = x - ox\r\n        newy = y - AttackDanceAbsUnit(dx)\r\n        newx = x\r\n    elseif y > oy then\r\n        if x > ox then\r\n            newy = y - 1\r\n            newx = x\r\n        else\r\n            newy = y\r\n            newx = x + 1\r\n        end\r\n    else\r\n        if x > ox then\r\n            newx = x - 1\r\n            newy = y\r\n        else\r\n            newx = x\r\n            newy = y + 1\r\n        end\r\n    end\r\n    return newx, newy\r\nend\r\n\r\nlocal function AttackDanceAdjustCCW(x, y, ox, oy)\r\n    local newx, newy\r\n    if x == ox then\r\n        if y == oy then\r\n            newx, newy = ox - 1, oy\r\n        else\r\n            local dy = y - oy\r\n            newx = x - AttackDanceAbsUnit(dy)\r\n            newy = y\r\n        end\r\n    elseif y == oy then\r\n        local dx = x - ox\r\n        newy = y + AttackDanceAbsUnit(dx)\r\n        newx = x\r\n    elseif y > oy then\r\n        if x > ox then\r\n            newy = y\r\n            newx = x - 1\r\n        else\r\n            newy = y - 1\r\n            newx = x\r\n        end\r\n    else\r\n        if x > ox then\r\n            newx = x\r\n            newy = y + 1\r\n        else\r\n            newx = x + 1\r\n            newy = y\r\n        end\r\n    end\r\n    return newx, newy\r\nend\r\n\r\nlocal function GetAttackDanceCell(x, y, target)\r\n    if target == nil or target == 0 or IsMonster(target) ~= 1 then return nil, nil end\r\n    if not IsInAttackSight(MyID, target) then return nil, nil end\r\n\r\n    local enemyX, enemyY = GetV(V_POSITION, target)\r\n    if enemyX == nil or enemyY == nil then return nil, nil end\r\n\r\n    if math.random(2) == 1 then\r\n        return AttackDanceAdjustCW(x, y, enemyX, enemyY)\r\n    end\r\n    return AttackDanceAdjustCCW(x, y, enemyX, enemyY)\r\nend\r\n\r\nlocal function ResetAttackDance()\r\n    attackDanceStanceX = 0\r\n    attackDanceStanceY = 0\r\n    attackDanceTarget = 0\r\nend\r\n\r\nlocal function AttackWithDance(target)\r\n    if BaiTraffic.interval() > 10 or BAI_CONFIG.attackDanceEnabled ~= true or target == nil or target == 0 or IsMonster(target) ~= 1 then\r\n        ResetAttackDance()\r\n        local _, issued = Attack(MyID, target)\r\n        return issued\r\n    end\r\n\r\n    if not IsInAttackSight(MyID, target) then\r\n        ResetAttackDance()\r\n        local _, issued = Attack(MyID, target)\r\n        return issued\r\n    end\r\n\r\n    -- Classic Attack Dance: store the attack stance once when attack state begins\r\n    -- and dance between that stance and a neighboring melee cell until the target/state resets.\r\n    if attackDanceTarget ~= target or attackDanceStanceX == 0 or attackDanceStanceY == 0 then\r\n        local x, y = GetV(V_POSITION, MyID)\r\n        if x == nil or y == nil then\r\n            ResetAttackDance()\r\n            local _, issued = Attack(MyID, target)\r\n            return issued\r\n        end\r\n        attackDanceTarget = target\r\n        attackDanceStanceX = x\r\n        attackDanceStanceY = y\r\n    end\r\n\r\n    local danceX, danceY = GetAttackDanceCell(attackDanceStanceX, attackDanceStanceY, target)\r\n    if danceX == nil or danceY == nil then\r\n        local _, issued = Attack(MyID, target)\r\n        return issued\r\n    end\r\n\r\n    -- At 1/10 ms preserve the whole dance; never queue its two moves separately.\r\n    if BaiTraffic.level() > 0 then\r\n        return BaiTraffic.dance(MyID, target, danceX, danceY, attackDanceStanceX, attackDanceStanceY)\r\n    end\r\n    -- Unchanged when Lag Reduction is off: Move -> Attack -> Move back.\r\n    Move(MyID, danceX, danceY)\r\n    Attack(MyID, target)\r\n    Move(MyID, attackDanceStanceX, attackDanceStanceY)\r\n    return true\r\nend\r\n\r\nlocal function ResetAutoTarget()\r\n    BaiTraffic.cancel(false)\r\n    local hadCombatTarget = (MyEnemy ~= 0 or acceptedCombatTarget ~= 0)\r\n    MyEnemy = 0\r\n    MySkill = 0\r\n    MyDestX = 0\r\n    MyDestY = 0\r\n    currentTargetAttackStarted = false\r\n    currentPvpAction = nil\r\n    currentPvpJobId = nil\r\n    currentPvpMaxDistance = nil\r\n    ResetAttackDance()\r\n\r\n    -- Combat is over/cancelled: release the KS/manual claim and allow the\r\n    -- configured idle movement to start immediately on the next AI tick.\r\n    acceptedCombatTarget = 0\r\n    manualCombatTarget = 0\r\n    lastIdleTick = 0\r\n    if hadCombatTarget then returnToOwnerAfterCombat = true end\r\nend\r\n\r\nlocal function DistanceFromOwner()\r\n    return GetDistanceFromOwner(MyID)\r\nend\r\n\r\nlocal function CurrentIdle()\r\n    if BAI_Passive then return BAI_CONFIG.passiveIdle end\r\n    return BAI_CONFIG.aggressiveIdle\r\nend\r\n\r\n-- Distances belong to the active T mode's existing idle/movement settings.\r\nfunction BaiTraffic.followDistance(moving)\r\n    local idle = CurrentIdle() or {}\r\n    local value = tonumber(moving and idle.movingFollowDistance or idle.stoppedFollowDistance)\r\n    if not value then\r\n        if moving then value=1\r\n        elseif idle.mode==\"Still\" or idle.mode==\"FollowOwner\" then value=tonumber(idle.radius) or 3\r\n        else value=math.min(3,tonumber(idle.radius) or 3) end\r\n    end\r\n    if value~=value then value=1 end\r\n    return math.max(-14,math.min(14,math.floor(value)))\r\nend\r\n-- The client exposes position, not facing. Only recent, continuous position\r\n-- changes provide a heading; never project a teleport or a stale observation.\r\nfunction BaiTraffic.observeHeading(owner,x,y,now)\r\n    if not owner or owner==0 or type(x)~=\"number\" or type(y)~=\"number\" or\r\n       x~=x or y~=y or x<0 or y<0 then\r\n        BaiTraffic.ownerHeading=nil\r\n        return\r\n    end\r\n    local h=BaiTraffic.ownerHeading\r\n    if not h or h.owner~=owner or now<h.sampleAt or\r\n       (now-h.sampleAt>1000 and (x~=h.x or y~=h.y)) then\r\n        BaiTraffic.ownerHeading={owner=owner,x=x,y=y,sampleAt=now}\r\n        return\r\n    end\r\n    local dx,dy=x-h.x,y-h.y\r\n    local span=math.max(math.abs(dx),math.abs(dy))\r\n    if span>15 then\r\n        h.dx,h.dy,h.changedAt=nil,nil,nil\r\n    elseif span>0 then\r\n        h.dx,h.dy,h.changedAt=dx/span,dy/span,now\r\n    end\r\n    h.x,h.y,h.sampleAt=x,y,now\r\nend\r\nfunction BaiTraffic.followTarget(owner,x,y,now,moving)\r\n    local distance=BaiTraffic.followDistance(moving)\r\n    if distance==0 then return x,y end\r\n    local h=BaiTraffic.ownerHeading\r\n    if not h or h.owner~=owner or not h.changedAt or\r\n       now<h.changedAt or (moving and now-h.changedAt>=500) then return nil end\r\n    -- At rest keep the last known heading: a forward stand position must not\r\n    -- disappear when the movement observation's freshness window expires.\r\n    -- Positive is behind; negative is ahead. Use map-cell distance and round\r\n    -- symmetrically so mirrored directions produce mirrored destinations.\r\n    local function round(value)\r\n        if value<0 then return -math.floor(-value+0.5) end\r\n        return math.floor(value+0.5)\r\n    end\r\n    local dx,dy=round(-h.dx*distance),round(-h.dy*distance)\r\n    if x+dx<0 or y+dy<0 then return nil end\r\n    return x+dx,y+dy\r\nend\r\nfunction BaiTraffic.ownerFollowDistance()\r\n    local owner = GetV(V_OWNER,MyID)\r\n    if not owner or owner==0 then return -1 end\r\n    local ox,oy=GetV(V_POSITION,owner)\r\n    local mx,my=GetV(V_POSITION,MyID)\r\n    if type(ox)~=\"number\" or type(oy)~=\"number\" or type(mx)~=\"number\" or type(my)~=\"number\" or\r\n       ox<0 or oy<0 or mx<0 or my<0 then return -1 end\r\n    -- Follow geometry uses square map cells; diagonal targets must satisfy the\r\n    -- same arrival metric, otherwise a finished path can block idle routes.\r\n    return math.max(math.abs(ox-mx),math.abs(oy-my))\r\nend\r\n\r\nlocal function OwnerIsMoving()\r\n    local owner = GetV(V_OWNER, MyID)\r\n    if owner == 0 then\r\n        observedOwner, observedOwnerX, observedOwnerY = nil, nil, nil\r\n        ownerStoppedSince = nil\r\n        BaiTraffic.ownerHeading = nil\r\n        return false\r\n    end\r\n\r\n    local now = GetTick()\r\n    local x, y = GetV(V_POSITION, owner)\r\n    BaiTraffic.observeHeading(owner,x,y,now)\r\n    local validPosition = type(x) == \"number\" and type(y) == \"number\" and x >= 0 and y >= 0\r\n    local changedPosition = validPosition and observedOwner == owner and observedOwnerX ~= nil and\r\n        (x ~= observedOwnerX or y ~= observedOwnerY)\r\n    if observedOwner ~= owner then ownerStoppedSince = nil end\r\n    observedOwner = owner\r\n    if validPosition then observedOwnerX, observedOwnerY = x, y\r\n    else observedOwnerX, observedOwnerY = nil, nil end\r\n\r\n    -- Position updates also count as movement when the client briefly reports\r\n    -- a standing/other animation. Repeated checks in one tick retain the grace.\r\n    if GetV(V_MOTION, owner) == MOTION_MOVE or changedPosition then\r\n        ownerStoppedSince = nil\r\n        return true\r\n    end\r\n\r\n    -- After the owner stops, keep treating him as moving for 500 ms.\r\n    -- This prevents the AI from immediately switching back to route/aggro\r\n    -- during tiny pauses between movement updates.\r\n    if ownerStoppedSince == nil or now < ownerStoppedSince then\r\n        ownerStoppedSince = now\r\n    end\r\n\r\n    return now - ownerStoppedSince < 500\r\nend\r\n\r\nfunction BaiTraffic.atStoppedPosition()\r\n    local owner=GetV(V_OWNER,MyID)\r\n    if not owner or owner==0 then return false end\r\n    local ox,oy=GetV(V_POSITION,owner)\r\n    local mx,my=GetV(V_POSITION,MyID)\r\n    if type(ox)~=\"number\" or type(oy)~=\"number\" or type(mx)~=\"number\" or type(my)~=\"number\" or\r\n       ox<0 or oy<0 or mx<0 or my<0 then return false end\r\n    local tx,ty=BaiTraffic.followTarget(owner,ox,oy,GetTick(),false)\r\n    if tx then return mx==tx and my==ty end\r\n    -- Without a known direction, retain ordinary near-owner following.\r\n    return math.max(math.abs(mx-ox),math.abs(my-oy))<=math.abs(BaiTraffic.followDistance(false))\r\nend\r\n\r\nlocal function FollowMovingOwner()\r\n    local owner = GetV(V_OWNER, MyID)\r\n    if owner ~= 0 then\r\n        returnToOwnerAfterMovement = true\r\n        local distance = math.abs(BaiTraffic.followDistance(true))\r\n        MoveToOwner(MyID, distance + 1, distance, \"moving\")\r\n    end\r\nend\r\n\r\nlocal function MoveNearOwner(x, y)\r\n    local ownerX, ownerY = GetV(V_POSITION, GetV(V_OWNER, MyID))\r\n    Move(MyID, ownerX + x, ownerY + y)\r\nend\r\n\r\nlocal function RunIdleMovement()\r\n    -- This entry is also used by Tank with no mobs and by post-combat regroup.\r\n    -- Neither may resume a stationary route while the owner is walking away.\r\n    if OwnerIsMoving() then\r\n        FollowMovingOwner()\r\n        return\r\n    end\r\n    local cfg = CurrentIdle()\r\n    if cfg == nil then return end\r\n\r\n    local mode = cfg.mode or \"Still\"\r\n    local radius = math.max(1, tonumber(cfg.radius) or 3)\r\n    local interval = math.max(250, tonumber(cfg.intervalMs) or 2500)\r\n    local now = GetTick()\r\n\r\n    -- After following or an automatic/manual fight, regroup before resuming\r\n    -- Still/Wander/Orbit/Route. This prevents the Homu from remaining at the\r\n    -- position of the last defeated target.\r\n    if returnToOwnerAfterCombat or returnToOwnerAfterMovement then\r\n        local returnDistance = math.abs(BaiTraffic.followDistance(false))\r\n        if not BaiTraffic.atStoppedPosition() or (BaiTraffic.followPath and BaiTraffic.followPath.directedFollow) then\r\n            MoveToOwner(MyID, returnDistance, returnDistance, \"stopped\")\r\n            return\r\n        end\r\n        returnToOwnerAfterCombat = false\r\n        returnToOwnerAfterMovement = false\r\n        lastIdleTick = 0\r\n        -- Start idle movement from a clean movement state. Otherwise an old\r\n        -- route target from before combat can immediately time out and leave\r\n        -- the Homu standing at the owner instead of resuming the route.\r\n        routeTargetX = nil\r\n        routeTargetY = nil\r\n        routeMoveStarted = 0\r\n    end\r\n\r\n    if mode == \"Still\" or mode == \"FollowOwner\" then\r\n        -- Both modes hold the selected stand position; roaming uses the other modes.\r\n        local stopDistance = math.abs(BaiTraffic.followDistance(false))\r\n        if not BaiTraffic.atStoppedPosition() then\r\n            MoveToOwner(MyID, stopDistance, stopDistance, \"stopped\")\r\n        end\r\n        return\r\n    end\r\n\r\n    if now - lastIdleTick < interval then\r\n        return\r\n    end\r\n    lastIdleTick = now\r\n\r\n    if mode == \"Wander\" then\r\n        local dx = math.random(-radius, radius)\r\n        local dy = math.random(-radius, radius)\r\n        -- Avoid constantly choosing the owner's exact cell.\r\n        if dx == 0 and dy == 0 then dx = 1 end\r\n        MoveNearOwner(dx, dy)\r\n        return\r\n    end\r\n\r\n    if mode == \"Orbit\" then\r\n        local points = {\r\n            { radius, 0 }, { radius, radius }, { 0, radius }, { -radius, radius },\r\n            { -radius, 0 }, { -radius, -radius }, { 0, -radius }, { radius, -radius }\r\n        }\r\n        local p = points[orbitStep]\r\n        MoveNearOwner(p[1], p[2])\r\n        orbitStep = orbitStep + 1\r\n        if orbitStep > #points then orbitStep = 1 end\r\n    end\r\n    if mode == \"Route\" then\r\n        local route = cfg.route or {}\r\n        if #route == 0 then return end\r\n        if routeStep > #route then routeStep = 1 end\r\n\r\n        local owner = GetV(V_OWNER, MyID)\r\n        local ownerX, ownerY = GetV(V_POSITION, owner)\r\n        local myX, myY = GetV(V_POSITION, MyID)\r\n        local tolerance = math.max(0, tonumber(cfg.routeArrivalTolerance) or 0)\r\n        local timeoutMs = math.max(1000, tonumber(cfg.routeTimeoutMs) or 5000)\r\n\r\n        local p = route[routeStep]\r\n        local tx = ownerX + (tonumber(p.x) or 0)\r\n        local ty = ownerY + (tonumber(p.y) or 0)\r\n\r\n        -- If the owner moved, the waypoint moves with the owner too.\r\n        if routeTargetX ~= tx or routeTargetY ~= ty then\r\n            routeTargetX, routeTargetY = tx, ty\r\n            routeMoveStarted = now\r\n            Move(MyID, tx, ty)\r\n            return\r\n        end\r\n\r\n        local reached = GetDistance(myX, myY, tx, ty) <= tolerance\r\n        local timedOut = (now - routeMoveStarted) >= timeoutMs\r\n\r\n        if reached or timedOut then\r\n            routeStep = routeStep + 1\r\n            if routeStep > #route then routeStep = 1 end\r\n            routeTargetX, routeTargetY = nil, nil\r\n            routeMoveStarted = 0\r\n            lastIdleTick = now\r\n            return\r\n        end\r\n\r\n        -- Re-issue movement if the homunculus stopped before reaching the point.\r\n        if GetV(V_MOTION, MyID) == MOTION_STAND then\r\n            Move(MyID, tx, ty)\r\n        end\r\n    end\r\nend\r\n\r\nlocal function PartyFriendFilePath()\r\n    local owner = GetV(V_OWNER, MyID)\r\n    return \"./AI/USER_AI/BAI_Friends_\" .. tostring(owner or 0) .. \".txt\"\r\nend\r\n\r\nlocal function SavePartyFriends()\r\n    if BAI_CONFIG.partyEnabled ~= true then return end\r\n    local ids = {}\r\n    for actor, enabled in pairs(partyFriends) do\r\n        if enabled == true and tonumber(actor) and tonumber(actor) > 0 then\r\n            table.insert(ids, tonumber(actor))\r\n        end\r\n    end\r\n    table.sort(ids)\r\n    local file = io.open(PartyFriendFilePath(), \"w\")\r\n    if file == nil then\r\n        TraceAI(\"BAI: could not save friend list\")\r\n        return\r\n    end\r\n    for _, actor in ipairs(ids) do\r\n        file:write(tostring(actor), \"\\n\")\r\n    end\r\n    file:close()\r\nend\r\n\r\nlocal function EnsurePartyFriendsLoaded()\r\n    if partyFriendsLoaded then return end\r\n    partyFriendsLoaded = true\r\n    partyFriends = {}\r\n\r\n    -- Keep v36/manual profile IDs as a one-time compatibility seed.\r\n    for _, friendId in ipairs(BAI_CONFIG.partyMemberActorIds or {}) do\r\n        local actor = tonumber(friendId) or 0\r\n        if actor > 0 then partyFriends[actor] = true end\r\n    end\r\n\r\n    local file = io.open(PartyFriendFilePath(), \"r\")\r\n    if file ~= nil then\r\n        for line in file:lines() do\r\n            local actor = tonumber(line)\r\n            if actor ~= nil and actor > 0 then partyFriends[actor] = true end\r\n        end\r\n        file:close()\r\n    elseif next(partyFriends) ~= nil then\r\n        SavePartyFriends()\r\n    end\r\nend\r\n\r\nlocal function IsPartyMember(actor)\r\n    if BAI_CONFIG.partyEnabled ~= true or actor == nil or actor == 0 then return false end\r\n    EnsurePartyFriendsLoaded()\r\n    return partyFriends[tonumber(actor) or 0] == true\r\nend\r\n\r\nlocal function FriendCircleResetWaypoint()\r\n    friendMotionWaypointX = nil\r\n    friendMotionWaypointY = nil\r\n    friendMotionWaypointStarted = 0\r\nend\r\n\r\nlocal function FriendCircleFinishCurrent()\r\n    if friendMotionPendingAction == \"add\" and friendMotionActor ~= 0 then\r\n        partyFriends[friendMotionActor] = true\r\n        SavePartyFriends()\r\n        TraceAI(\"BAI: friend added \" .. tostring(friendMotionActor))\r\n    elseif friendMotionPendingAction == \"remove\" and friendMotionActor ~= 0 then\r\n        partyFriends[friendMotionActor] = nil\r\n        SavePartyFriends()\r\n        TraceAI(\"BAI: friend removed \" .. tostring(friendMotionActor))\r\n    end\r\n    friendMotionPendingAction = nil\r\nend\r\n\r\nlocal function FriendCircleStartActor(actor, rounds, pendingAction)\r\n    friendMotionActor = actor or 0\r\n    friendMotionRounds = math.max(1, tonumber(rounds) or 1)\r\n    friendMotionRound = 1\r\n    friendMotionStep = 1\r\n    friendMotionPendingAction = pendingAction\r\n    FriendCircleResetWaypoint()\r\n    ResetAutoTarget()\r\n    MyEnemy = 0\r\n    MySkill = 0\r\n    MyState = FRIEND_CIRCLE_ST\r\nend\r\n\r\nlocal function StartFriendToggle(actor)\r\n    EnsurePartyFriendsLoaded()\r\n    if actor == nil or actor == 0 or actor == MyID then return false end\r\n    if IsMonster(actor) == 1 then return false end\r\n    local action = IsPartyMember(actor) and \"remove\" or \"add\"\r\n    friendMotionQueue = {}\r\n    friendMotionQueueIndex = 0\r\n    FriendCircleStartActor(actor, 2, action)\r\n    return true\r\nend\r\n\r\nlocal function StartFriendShowcase()\r\n    EnsurePartyFriendsLoaded()\r\n    local owner = GetV(V_OWNER, MyID)\r\n    friendMotionQueue = {}\r\n    friendMotionQueueIndex = 1\r\n    if owner ~= nil and owner ~= 0 then table.insert(friendMotionQueue, owner) end\r\n\r\n    for _, actor in ipairs(TickActors()) do\r\n        if actor ~= owner and actor ~= MyID and IsPartyMember(actor) and GetV(V_MOTION, actor) ~= MOTION_DEAD then\r\n            table.insert(friendMotionQueue, actor)\r\n        end\r\n    end\r\n\r\n    if #friendMotionQueue == 0 then return false end\r\n    FriendCircleStartActor(friendMotionQueue[1], 1, nil)\r\n    return true\r\nend\r\n\r\nlocal function FriendCircleAdvanceActor()\r\n    FriendCircleFinishCurrent()\r\n    if #friendMotionQueue > 0 then\r\n        friendMotionQueueIndex = friendMotionQueueIndex + 1\r\n        if friendMotionQueueIndex <= #friendMotionQueue then\r\n            FriendCircleStartActor(friendMotionQueue[friendMotionQueueIndex], 1, nil)\r\n            return\r\n        end\r\n    end\r\n    friendMotionQueue = {}\r\n    friendMotionQueueIndex = 0\r\n    friendMotionActor = 0\r\n    FriendCircleResetWaypoint()\r\n    MyState = IDLE_ST\r\nend\r\n\r\nlocal function OnFRIEND_CIRCLE_ST()\r\n    if BAI_CONFIG.partyEnabled ~= true or friendMotionActor == 0 then\r\n        FriendCircleAdvanceActor()\r\n        return\r\n    end\r\n\r\n    local tx, ty = GetV(V_POSITION, friendMotionActor)\r\n    if tx == nil or ty == nil or (tx == 0 and ty == 0) then\r\n        FriendCircleAdvanceActor()\r\n        return\r\n    end\r\n\r\n    local offsets = {\r\n        {0, -1},\r\n        {1, 0},\r\n        {0, 1},\r\n        {-1, 0}\r\n    }\r\n    local offset = offsets[friendMotionStep] or offsets[1]\r\n    local wx, wy = tx + offset[1], ty + offset[2]\r\n    local now = GetTick()\r\n\r\n    if friendMotionWaypointX ~= wx or friendMotionWaypointY ~= wy then\r\n        friendMotionWaypointX, friendMotionWaypointY = wx, wy\r\n        friendMotionWaypointStarted = now\r\n        Move(MyID, wx, wy)\r\n        return\r\n    end\r\n\r\n    local mx, my = GetV(V_POSITION, MyID)\r\n    local reached = mx == wx and my == wy\r\n    local timedOut = now - friendMotionWaypointStarted >= 700\r\n    if not reached and not timedOut then\r\n        if GetV(V_MOTION, MyID) == MOTION_STAND then Move(MyID, wx, wy) end\r\n        return\r\n    end\r\n\r\n    friendMotionStep = friendMotionStep + 1\r\n    FriendCircleResetWaypoint()\r\n    if friendMotionStep <= 4 then return end\r\n\r\n    friendMotionStep = 1\r\n    friendMotionRound = friendMotionRound + 1\r\n    if friendMotionRound <= friendMotionRounds then return end\r\n    FriendCircleAdvanceActor()\r\nend\r\n\r\nlocal function PartyMemberTargeting(monster)\r\n    if BAI_CONFIG.partyEnabled ~= true or BAI_CONFIG.partyAssistMembers ~= true then return false end\r\n    for _, actor in ipairs(TickActors()) do\r\n        if IsPartyMember(actor) and GetV(V_MOTION, actor) ~= MOTION_DEAD and GetV(V_TARGET, actor) == monster then\r\n            return true\r\n        end\r\n    end\r\n    return false\r\nend\r\n\r\nlocal function MonsterDbId(actor)\r\n    local ok, mobId = pcall(GetV, V_HOMUNTYPE, actor)\r\n    if not ok then return nil end\r\n    return tonumber(mobId)\r\nend\r\n\r\nBaiCombat = { targets = {}, blocked = {} }\r\nfunction BaiCombat.begin()\r\n    local now = GetTick()\r\n    local owner = GetV(V_OWNER, MyID)\r\n    local x, y = GetV(V_POSITION, owner)\r\n    if BaiCombat.config ~= BAI_CONFIG or BaiCombat.id ~= MyID or\r\n       (BaiCombat.tick and now < BaiCombat.tick) or\r\n       (x and y and BaiCombat.x and GetDistance(x, y, BaiCombat.x, BaiCombat.y) > 15) then\r\n        BaiCombat.targets = {}; BaiCombat.blocked = {}\r\n    end\r\n    BaiCombat.config, BaiCombat.id, BaiCombat.tick = BAI_CONFIG, MyID, now\r\n    BaiCombat.x, BaiCombat.y = x, y\r\n    for actor, p in pairs(BaiCombat.targets) do\r\n        if now - p.seen > 20000 then BaiCombat.targets[actor] = nil end\r\n    end\r\n    for actor, p in pairs(BaiCombat.blocked) do\r\n        if now >= p.untilAt or IsOutOfSight(MyID, actor) or\r\n           MonsterDbId(actor) ~= p.raw then BaiCombat.blocked[actor] = nil end\r\n    end\r\nend\r\nfunction BaiCombat.isBlocked(actor)\r\n    local p = BaiCombat.blocked[actor]\r\n    return p ~= nil and GetTick() < p.untilAt and MonsterDbId(actor) == p.raw\r\nend\r\nfunction BaiCombat.stalled()\r\n    local actor = MyEnemy\r\n    -- Explicit commands and PvP remain under player control. Bound tank mobs\r\n    -- intentionally wait at the owner, so their lack of progress is expected.\r\n    if actor == 0 or actor == manualCombatTarget or IsMonster(actor) ~= 1 or\r\n       currentPvpAction == \"TankBound\" or\r\n       (MyState ~= CHASE_ST and MyState ~= ATTACK_ST) then return false end\r\n    if GetV(V_MOTION, actor) == MOTION_DEAD or IsOutOfSight(MyID, actor) then return false end\r\n    local now, distance = GetTick(), GetDistance2(MyID, actor)\r\n    local sp = tonumber(GetV(V_SP, MyID))\r\n    local ok, hp = pcall(GetV, V_HP, actor)\r\n    hp = ok and tonumber(hp) or nil\r\n    if hp and hp <= 0 then hp = nil end -- enemy HP is not exposed by every client\r\n    local p = BaiCombat.targets[actor]\r\n    if not p or p.raw ~= MonsterDbId(actor) then\r\n        p = { raw=MonsterDbId(actor), at=now, distance=distance, hp=hp, sp=sp, state=MyState }\r\n        BaiCombat.targets[actor] = p\r\n    end\r\n    p.seen = now\r\n    if p.state ~= MyState or (distance >= 0 and distance < p.distance) or\r\n       (hp and p.hp and hp < p.hp) then\r\n        p.at, p.distance = now, distance\r\n    end\r\n    -- When enemy HP is unavailable, accept attack motion as a conservative\r\n    -- fallback. Never declare a working fight stuck merely because HP is hidden.\r\n    if not hp and MyState == ATTACK_ST and GetV(V_MOTION, MyID) == MOTION_ATTACK then p.at = now end\r\n    if not hp and sp and p.sp and sp < p.sp then p.at = now end\r\n    p.hp, p.sp, p.state = hp, sp, MyState\r\n    local timeout = MyState == CHASE_ST and 8000 or 15000\r\n    if now - p.at < timeout then return false end\r\n    BaiCombat.blocked[actor] = { raw=p.raw, untilAt=now + 10000 }\r\n    BaiCombat.targets[actor] = nil\r\n    BaiDebug.run(BaiDebug.event, \"reasons\", \"unreachable:\" .. tostring(actor),\r\n        \"TARGET_WAIT reason=NO_PROGRESS target=\" .. tostring(actor) .. \" retry_ms=10000\" .. BaiDebug.mode(), false)\r\n    return true\r\nend\r\n\r\nlocal function IsMonsterFreeForUs(monster)\r\n    if monster ~= manualCombatTarget and BaiCombat.isBlocked(monster) then return false end\r\n    if not BAI_CONFIG.preventKillSteal then return true end\r\n    -- Explicit manual commands stay under player control. Automatic targets are\r\n    -- re-checked continuously so BAI drops them if another player takes the fight.\r\n    if monster == manualCombatTarget then return true end\r\n\r\n    local owner = GetV(V_OWNER, MyID)\r\n    local monsterTarget = GetV(V_TARGET, monster)\r\n    if monsterTarget == owner or monsterTarget == MyID or IsPartyMember(monsterTarget) then return true end\r\n    if GetV(V_TARGET, owner) == monster or PartyMemberTargeting(monster) then return true end\r\n\r\n    -- Some monsters temporarily target themselves while buffing. That is not KS.\r\n    if monsterTarget == monster then\r\n        local actors = TickActors()\r\n        for _, actor in ipairs(actors) do\r\n            if actor ~= MyID and actor ~= owner and actor ~= monster and not IsPartyMember(actor) then\r\n                local motion = GetV(V_MOTION, actor)\r\n                if motion ~= MOTION_DEAD and GetV(V_TARGET, actor) == monster then\r\n                    return false\r\n                end\r\n            end\r\n        end\r\n        return true\r\n    end\r\n\r\n    local actors = TickActors()\r\n    for _, actor in ipairs(actors) do\r\n        if actor ~= MyID and actor ~= owner and actor ~= monster and not IsPartyMember(actor) then\r\n            local motion = GetV(V_MOTION, actor)\r\n            if motion ~= MOTION_DEAD and GetV(V_TARGET, actor) == monster then\r\n                return false\r\n            end\r\n        end\r\n    end\r\n    if monsterTarget ~= 0 and monsterTarget ~= owner and monsterTarget ~= MyID and not IsPartyMember(monsterTarget) then return false end\r\n    return true\r\nend\r\n\r\nlocal currentCombatSource = \"auto\"\r\n\r\nlocal function AcceptCombatTarget(monster, manual, source)\r\n    BaiTraffic.cancel(false)\r\n    acceptedCombatTarget = monster\r\n    if manual then\r\n        manualCombatTarget = monster\r\n        currentCombatSource = \"manual\"\r\n    else\r\n        manualCombatTarget = 0\r\n        currentCombatSource = source or \"auto\"\r\n    end\r\n    BaiDebug.run(BaiDebug.accepted, monster, manual == true)\r\nend\r\n\r\nlocal function IsPassiveDefenseTarget(target)\r\n    if not BAI_Passive or target == 0 then return false end\r\n    if currentPvpAction ~= nil and target == acceptedCombatTarget then return true end\r\n    local owner = GetV(V_OWNER, MyID)\r\n    if BAI_CONFIG.passiveProtectOwner and GetV(V_TARGET, target) == owner then return true end\r\n    if BAI_CONFIG.passiveProtectSelf and GetV(V_TARGET, target) == MyID then return true end\r\n    return target == acceptedCombatTarget\r\nend\r\n\r\nlocal function BeyondCombatDistance()\r\n    local owner=GetV(V_OWNER,MyID)\r\n    if owner==0 then return false end\r\n    local maxDistance=math.max(1,math.min(30,tonumber(BAI_CONFIG.maxCombatDistanceFromOwner) or 12))\r\n    local d=GetDistance2(owner,MyID)\r\n    return d==-1 or d>maxDistance\r\nend\r\n\r\nlocal function SkillsAllowedByOwnerDistance()\r\n    local owner=GetV(V_OWNER,MyID)\r\n    if owner==0 then return true end\r\n    local maxDistance=math.max(1,math.min(30,tonumber(BAI_CONFIG.maxSkillDistanceFromOwner) or 8))\r\n    local d=GetDistance2(owner,MyID)\r\n    return d~=-1 and d<=maxDistance\r\nend\r\n\r\nlocal MonsterActionAllowed\r\n\r\nlocal function PickAssistTarget()\r\n    local owner = GetV(V_OWNER, MyID)\r\n    local target = owner ~= 0 and GetV(V_TARGET, owner) or 0\r\n    if target ~= 0 and IsMonster(target) == 1 and GetV(V_MOTION, target) ~= MOTION_DEAD and MonsterActionAllowed(target) and IsMonsterFreeForUs(target) then\r\n        return target\r\n    end\r\n\r\n    if BAI_CONFIG.partyEnabled == true and BAI_CONFIG.partyAssistMembers == true then\r\n        local bestAssist, bestAssistDistance = 0, 99999\r\n        EnsurePartyFriendsLoaded()\r\n        for _, actor in ipairs(TickActors()) do\r\n            if IsPartyMember(actor) and GetV(V_MOTION, actor) ~= MOTION_DEAD then\r\n                local partyTarget = GetV(V_TARGET, actor)\r\n                if partyTarget ~= 0 and IsMonster(partyTarget) == 1 and GetV(V_MOTION, partyTarget) ~= MOTION_DEAD and MonsterActionAllowed(partyTarget) and IsMonsterFreeForUs(partyTarget) then\r\n                    local d = GetDistance2(MyID, partyTarget)\r\n                    if d ~= -1 and d < bestAssistDistance then bestAssist, bestAssistDistance = partyTarget, d end\r\n                end\r\n            end\r\n        end\r\n        if bestAssist ~= 0 then return bestAssist end\r\n    end\r\n    return 0\r\nend\r\n\r\nlocal function CurrentPvpMode()\r\n    if BAI_Passive then\r\n        return BAI_CONFIG.pvpPassive or {}\r\n    end\r\n    return BAI_CONFIG.pvpAggressive or {}\r\nend\r\n\r\nlocal function PvpRuleForActor(actor)\r\n    if actor == nil or actor == 0 then return nil, nil end\r\n    if IsMonster(actor) == 1 then return nil, nil end\r\n\r\n    local owner = GetV(V_OWNER, MyID)\r\n    if actor == MyID or actor == owner then return nil, nil end\r\n\r\n    local ok, jobId = pcall(GetV, V_HOMUNTYPE, actor)\r\n    if not ok or jobId == nil then return nil, nil end\r\n    jobId = tonumber(jobId)\r\n    if jobId == nil then return nil, nil end\r\n\r\n    local rules = BAI_CONFIG.pvpClassRules or {}\r\n    for _, rule in ipairs(rules) do\r\n        if tonumber(rule.jobId) == jobId then\r\n            return rule, jobId\r\n        end\r\n    end\r\n\r\n    -- Keine Klassenregel: Job-ID bleibt bekannt, die Werte kommen aus dem\r\n    -- Standard des aktuellen PvP-Modus.\r\n    return nil, jobId\r\nend\r\n\r\nlocal function PvpValuesForRule(rule, mode)\r\n    mode = mode or CurrentPvpMode()\r\n\r\n    if rule == nil then\r\n        return mode.action or \"Ignore\",\r\n               math.max(1, math.min(20, tonumber(mode.priority) or 5)),\r\n               math.max(1, math.min(30, tonumber(mode.maxDistance) or 8))\r\n    end\r\n\r\n    if BAI_Passive then\r\n        return rule.passiveAction or \"Ignore\",\r\n               math.max(1, math.min(20, tonumber(rule.passivePriority) or 5)),\r\n               math.max(1, math.min(30, tonumber(rule.passiveMaxDistance) or 8))\r\n    end\r\n\r\n    return rule.aggressiveAction or \"Ignore\",\r\n           math.max(1, math.min(20, tonumber(rule.aggressivePriority) or 5)),\r\n           math.max(1, math.min(30, tonumber(rule.aggressiveMaxDistance) or 8))\r\nend\r\n\r\nlocal function PvpReactionAllowed(actor, mode)\r\n    if not BAI_Passive then\r\n        return true, 3\r\n    end\r\n\r\n    local owner = GetV(V_OWNER, MyID)\r\n    local actorTarget = GetV(V_TARGET, actor)\r\n    local ownerTarget = GetV(V_TARGET, owner)\r\n\r\n    local ownerThreat = mode.defendOwner and actorTarget == owner\r\n    local selfThreat = mode.defendSelf and actorTarget == MyID\r\n    local assist = mode.assistOwnerImmediately and ownerTarget == actor\r\n\r\n    if not ownerThreat and not selfThreat and not assist then\r\n        return false, 99\r\n    end\r\n\r\n    if ownerThreat and selfThreat then\r\n        return true, 0\r\n    end\r\n\r\n    if mode.ownerPriority then\r\n        if ownerThreat then return true, 0 end\r\n        if assist then return true, 1 end\r\n        if selfThreat then return true, 2 end\r\n    else\r\n        if selfThreat then return true, 0 end\r\n        if ownerThreat then return true, 1 end\r\n        if assist then return true, 2 end\r\n    end\r\n\r\n    return true, 3\r\nend\r\n\r\nlocal function FindPvpTarget()\r\n    if not BAI_CONFIG.pvpEnabled then return 0, nil, nil, nil end\r\n\r\n    local owner = GetV(V_OWNER, MyID)\r\n    local mode = CurrentPvpMode()\r\n    local best = 0\r\n    local bestAction = nil\r\n    local bestJobId = nil\r\n    local bestMaxDistance = nil\r\n    local bestPriority = 999\r\n    local bestReason = 999\r\n    local bestDistance = 99999\r\n\r\n    for _, actor in ipairs(TickActors()) do\r\n        if actor ~= MyID and actor ~= owner and IsMonster(actor) == 0 and GetV(V_MOTION, actor) ~= MOTION_DEAD then\r\n            local rule, jobId = PvpRuleForActor(actor)\r\n            if jobId ~= nil then\r\n                local action, priority, maxDistance = PvpValuesForRule(rule, mode)\r\n                local allowed, reason = PvpReactionAllowed(actor, mode)\r\n                local actorTarget = GetV(V_TARGET, actor)\r\n                local ownerTarget = GetV(V_TARGET, owner)\r\n                local isDefenseThreat = (mode.defendOwner and actorTarget == owner) or (mode.defendSelf and actorTarget == MyID) or (mode.assistOwnerImmediately and ownerTarget == actor)\r\n                local defenseOverride = rule ~= nil and rule.defendEvenIfIgnored and isDefenseThreat\r\n                if action ~= \"Ignore\" or defenseOverride then\r\n                    if allowed then\r\n                        if action == \"Ignore\" then action = \"NormalAndSkills\" end\r\n                        local d = GetDistance2(owner, actor)\r\n                        if d ~= -1 and d <= maxDistance then\r\n                            if priority < bestPriority or\r\n                               (priority == bestPriority and reason < bestReason) or\r\n                               (priority == bestPriority and reason == bestReason and d < bestDistance) then\r\n                                best = actor\r\n                                bestAction = action\r\n                                bestJobId = jobId\r\n                                bestMaxDistance = maxDistance\r\n                                bestPriority = priority\r\n                                bestReason = reason\r\n                                bestDistance = d\r\n                            end\r\n                        end\r\n                    end\r\n                end\r\n            end\r\n        end\r\n    end\r\n\r\n    return best, bestAction, bestJobId, bestMaxDistance\r\nend\r\n\r\nlocal function PvpTargetStillAllowed()\r\n    if currentPvpAction == nil or MyEnemy == 0 then return true end\r\n\r\n    local rule, jobId = PvpRuleForActor(MyEnemy)\r\n    if jobId == nil or jobId ~= currentPvpJobId then return false end\r\n\r\n    local mode = CurrentPvpMode()\r\n    local action, _, maxDistance = PvpValuesForRule(rule, mode)\r\n    if action == \"Ignore\" then\r\n        local owner = GetV(V_OWNER, MyID)\r\n        local actorTarget = GetV(V_TARGET, MyEnemy)\r\n        local ownerTarget = GetV(V_TARGET, owner)\r\n        local threat = (mode.defendOwner and actorTarget == owner) or (mode.defendSelf and actorTarget == MyID) or (mode.assistOwnerImmediately and ownerTarget == MyEnemy)\r\n        if rule == nil or not rule.defendEvenIfIgnored or not threat then return false end\r\n        action = \"NormalAndSkills\"\r\n    end\r\n\r\n    local owner = GetV(V_OWNER, MyID)\r\n    local d = GetDistance2(owner, MyEnemy)\r\n    if d == -1 or d > maxDistance then return false end\r\n\r\n    currentPvpAction = action\r\n    currentPvpMaxDistance = maxDistance\r\n    return true\r\nend\r\n\r\nlocal function PercentOf(value, maximum)\r\n    if maximum == nil or maximum <= 0 then return 100 end\r\n    return (value * 100) / maximum\r\nend\r\n\r\n-- HP loss is a sampled indication, not a server-confirmed hit event.\r\nlocal BaiCastling = {}\r\nfunction BaiCastling.ownerTargeted(owner)\r\n    for _, actor in ipairs(TickActors()) do\r\n        if actor ~= MyID and actor ~= owner and GetV(V_MOTION, actor) ~= MOTION_DEAD and\r\n           GetV(V_TARGET, actor) == owner and (IsMonster(actor) == 1 or BAI_CONFIG.pvpEnabled == true) then\r\n            return true\r\n        end\r\n    end\r\n    return false\r\nend\r\nfunction BaiCastling.sample()\r\n    local owner, now = GetV(V_OWNER, MyID), GetTick()\r\n    local hp, maxHp = tonumber(GetV(V_HP, owner)), tonumber(GetV(V_MAXHP, owner))\r\n    local x, y = GetV(V_POSITION, owner)\r\n    local reset = BaiCastling.owner ~= owner or BaiCastling.cfg ~= BAI_CONFIG or\r\n        not hp or not maxHp or hp <= 0 or maxHp <= 0 or\r\n        BaiCastling.maxHp ~= maxHp or (BaiCastling.at and (now < BaiCastling.at or now-BaiCastling.at > 2000)) or\r\n        (BaiCastling.x and x and (math.abs(x-BaiCastling.x) > 15 or math.abs(y-BaiCastling.y) > 15))\r\n    if reset then\r\n        BaiCastling.hitAt = nil\r\n    elseif BaiCastling.hp and hp < BaiCastling.hp then\r\n        BaiCastling.hitAt = now\r\n    end\r\n    BaiCastling.owner, BaiCastling.cfg = owner, BAI_CONFIG\r\n    BaiCastling.hp, BaiCastling.maxHp, BaiCastling.at = hp, maxHp, now\r\n    BaiCastling.x, BaiCastling.y = x, y\r\nend\r\nfunction BaiCastling.condition(rule)\r\n    local c = rule.castling or {}\r\n    local owner = GetV(V_OWNER, MyID)\r\n    local hp, maxHp = tonumber(GetV(V_HP, owner)), tonumber(GetV(V_MAXHP, owner))\r\n    if not hp or not maxHp or hp <= 0 or maxHp <= 0 then return false end\r\n    local homuHp, homuMax = tonumber(GetV(V_HP, MyID)), tonumber(GetV(V_MAXHP, MyID))\r\n    if not homuHp or not homuMax or homuHp <= 0 or homuMax <= 0 or\r\n       PercentOf(homuHp, homuMax) < (tonumber(c.minHomuHp) or 0) then return false end\r\n    if MyState == CHASE_ST and c.allowChasing == false then return false end\r\n    local targeted = BaiCastling.ownerTargeted(owner)\r\n    if c.onlyOwnerTargeted == true and not targeted then return false end\r\n    local limit = tonumber(rule.ownerHpBelow) or 0\r\n    if c.trigger == nil or c.trigger == \"LegacyHp\" then\r\n        return limit > 0 and PercentOf(hp, maxHp) < limit\r\n    end\r\n    if limit > 0 and PercentOf(hp, maxHp) >= limit then return false end\r\n    if c.trigger == \"OwnerTargeted\" then return targeted end\r\n    if c.trigger ~= \"OwnerHpLoss\" then return false end\r\n    local now = GetTick()\r\n    return BaiCastling.hitAt ~= nil and now >= BaiCastling.hitAt and now-BaiCastling.hitAt <= 1000\r\nend\r\n\r\nlocal function AutoSkillIntervalReady(rule, now)\r\n    local interval = math.max(1000, tonumber(rule.intervalMs) or 1000)\r\n    local key = rule.ruleId or tostring(rule.id) .. \":\" .. tostring(rule.level)\r\n    local last = autoSkillLastUse[key]\r\n    if tonumber(rule.id) == 8005 then\r\n        if BaiCastling.lastUse and now-BaiCastling.lastUse < interval then return false end\r\n        if last == nil and rule.castling and rule.castling.trigger ~= \"LegacyHp\" then return true end\r\n    end\r\n    if last == nil then\r\n        -- Tank mode can use this interval check without running the normal auto-skill loop.\r\n        -- Start the shared skill timer here as well, otherwise `or now` resets the\r\n        -- reference time on every Tank check and offensive Tank skills never become ready.\r\n        if autoSkillSystemStartedAt == nil then autoSkillSystemStartedAt = now end\r\n        last = autoSkillSystemStartedAt\r\n    end\r\n    return now - last >= interval\r\nend\r\n\r\nlocal function AutoSkillHealthCondition(rule)\r\n    local owner = GetV(V_OWNER, MyID)\r\n    local kind = rule.kind\r\n    if tonumber(rule.id) == 8005 then return BaiCastling.condition(rule) end\r\n\r\n    if kind == \"HealOwner\" or kind == \"DefensiveOwner\" then\r\n        local limit = tonumber(rule.ownerHpBelow) or 0\r\n        if limit <= 0 then return false end\r\n        local hp = GetV(V_HP, owner)\r\n        local maxHp = GetV(V_MAXHP, owner)\r\n        return PercentOf(hp, maxHp) < limit\r\n    end\r\n\r\n    if kind == \"HealEither\" then\r\n        -- The trigger target only decides whose HP makes BAI cast the skill.\r\n        -- The game still decides the actual target/effect of skills such as Chaotic Blessings.\r\n        local target = rule.healHpTarget or \"Either\"\r\n        if target == \"Homunculus\" then\r\n            local limit = tonumber(rule.homuHpBelow) or 0\r\n            return limit > 0 and PercentOf(GetV(V_HP, MyID), GetV(V_MAXHP, MyID)) < limit\r\n        elseif target == \"Owner\" then\r\n            local limit = tonumber(rule.ownerHpBelow) or 0\r\n            return limit > 0 and PercentOf(GetV(V_HP, owner), GetV(V_MAXHP, owner)) < limit\r\n        end\r\n        local ownerLimit = tonumber(rule.ownerHpBelow) or 0\r\n        local homuLimit = tonumber(rule.homuHpBelow) or 0\r\n        local ownerLow = ownerLimit > 0 and PercentOf(GetV(V_HP, owner), GetV(V_MAXHP, owner)) < ownerLimit\r\n        local homuLow = homuLimit > 0 and PercentOf(GetV(V_HP, MyID), GetV(V_MAXHP, MyID)) < homuLimit\r\n        return ownerLow or homuLow\r\n    end\r\n\r\n    if kind == \"SelfEmergency\" then\r\n        local limit = tonumber(rule.homuHpBelow) or 0\r\n        if limit <= 0 then return false end\r\n        return PercentOf(GetV(V_HP, MyID), GetV(V_MAXHP, MyID)) < limit\r\n    end\r\n\r\n    return true\r\nend\r\n\r\nlocal function GlobalSkillPauseReady(now)\r\n    local pause = math.max(0, tonumber(BAI_CONFIG.globalSkillPauseMs) or 2000)\r\n    if pause <= 0 or lastAnySkillUse == nil then\r\n        return true\r\n    end\r\n    return now - lastAnySkillUse >= pause\r\nend\r\n\r\nlocal function MarkAnySkillUse(now)\r\n    lastAnySkillUse = now\r\nend\r\n\r\nlocal MonsterRuleForActor, CurrentMonsterAction, EffectiveMonsterSkillLevel\r\n\r\nlocal function TryUseOneAutoSkillKind(kind, now, rules)\r\n    rules = rules or BAI_CONFIG.skills\r\n    if rules == nil then return false end\r\n\r\n    local owner = GetV(V_OWNER, MyID)\r\n    local currentSp = GetV(V_SP, MyID)\r\n    local candidates = {}\r\n\r\n    -- First build the list of rules of this kind. We rotate through this list\r\n    -- instead of always starting at rule #1. That prevents two levels of the\r\n    -- same skill from starving each other.\r\n    for _, rule in ipairs(rules) do\r\n        if rule.enabled and rule.kind == kind then\r\n            local allowed = true\r\n            -- Monster Rules only restrict OFFENSIVE skills. Healing, buffs and\r\n            -- defensive/emergency skills keep running globally during combat.\r\n            if kind == \"Offensive\" and MyEnemy ~= 0 and IsMonster(MyEnemy) == 1 then\r\n                local monsterRule = MonsterRuleForActor(MyEnemy)\r\n                local forcedSkillId = monsterRule and tonumber(monsterRule.attackSkillId) or 0\r\n                if rule.onlyMonsterRules == true then\r\n                    allowed = monsterRule ~= nil and forcedSkillId ~= nil and forcedSkillId > 0 and tonumber(rule.id) == forcedSkillId\r\n                elseif forcedSkillId ~= nil and forcedSkillId > 0 and tonumber(rule.id) ~= forcedSkillId then\r\n                    allowed = false\r\n                end\r\n            end\r\n            if allowed then table.insert(candidates, rule) end\r\n        end\r\n    end\r\n\r\n    local count = #candidates\r\n    if count == 0 then return false end\r\n\r\n    local startIndex = tonumber(autoSkillRoundRobin[kind]) or 1\r\n    if startIndex < 1 or startIndex > count then startIndex = 1 end\r\n\r\n    for offset = 0, count - 1 do\r\n        local index = ((startIndex - 1 + offset) % count) + 1\r\n        local rule = candidates[index]\r\n        local minSp = math.max(0, tonumber(rule.minSp) or 0)\r\n        if tonumber(rule.id) == 8005 then\r\n            -- Standard Castling costs 10 SP at every level (rAthena skill_db).\r\n            minSp = math.max(minSp, 10 + math.max(0, tonumber((rule.castling or {}).spReserve) or 0))\r\n        end\r\n\r\n        if currentSp < minSp and BaiDebug.enabled(\"reasons\") then\r\n            BaiDebug.run(BaiDebug.event, \"reasons\", \"sp:\" .. tostring(rule.id),\r\n
