      \"SKILL_WAIT reason=SP id=\" .. tostring(rule.id) .. \" SP=\" .. tostring(currentSp) .. \" minSP=\" .. tostring(minSp) .. BaiDebug.mode(), false)\r\n        end\r\n        if currentSp >= minSp and\r\n           AutoSkillIntervalReady(rule, now) and\r\n           AutoSkillHealthCondition(rule) then\r\n\r\n            local used = false\r\n            if BaiDebug.enabled(\"skills\") then BaiDebug.skillContext = { kind=kind, level=rule.level } end\r\n\r\n            if kind == \"Offensive\" then\r\n                if MyEnemy ~= 0 and GetV(V_MOTION, MyEnemy) ~= MOTION_DEAD then\r\n                    -- Resolve the effective level from the CURRENT monster first.\r\n                    -- The global skill level is only the fallback when this monster has\r\n                    -- no dedicated Monster Rule. This keeps every offensive cast path\r\n                    -- consistent instead of patching the level after skill selection.\r\n                    local castLevel = EffectiveMonsterSkillLevel(MyEnemy, tonumber(rule.level) or 1)\r\n                    local distance = GetDistance2(MyID, MyEnemy)\r\n                    local range = tonumber(GetV(V_SKILLATTACKRANGE_LEVEL, MyID, rule.id, castLevel)) or 0\r\n                    if distance >= 0 and distance <= range then\r\n                        MySkillLevel = castLevel\r\n                        local _, issued = SkillObject(MyID, castLevel, rule.id, MyEnemy)\r\n                        if issued then MarkAnySkillUse(now); used = true end\r\n                    end\r\n                end\r\n            elseif kind == \"HealOwner\" or kind == \"DefensiveOwner\" then\r\n                local _, issued = SkillObject(MyID, tonumber(rule.level) or 1, rule.id, owner)\r\n                if issued then MarkAnySkillUse(now); used = true end\r\n            elseif kind == \"HealEither\" or kind == \"Buff\" or kind == \"SelfEmergency\" then\r\n                local _, issued = SkillObject(MyID, tonumber(rule.level) or 1, rule.id, MyID)\r\n                if issued then MarkAnySkillUse(now); used = true end\r\n            end\r\n\r\n            if used then\r\n                local key = rule.ruleId or tostring(rule.id) .. \":\" .. tostring(rule.level)\r\n                autoSkillLastUse[key] = now\r\n                if tonumber(rule.id) == 8005 then\r\n                    BaiCastling.lastUse, BaiCastling.hitAt = now, nil\r\n                end\r\n\r\n                -- Next successful search starts with the rule after this one.\r\n                -- Example with Caprice Lv1 + Lv5:\r\n                -- Lv1 -> next search begins at Lv5 -> next begins at Lv1.\r\n                autoSkillRoundRobin[kind] = (index % count) + 1\r\n                return true\r\n            end\r\n        end\r\n    end\r\n\r\n    return false\r\nend\r\n\r\nlocal function AutoOffensiveTargetAllowed()\r\n    -- Support and emergency skills have their own triggers. Offensive skills\r\n    -- must pass the same live-target checks as a normal automatic attack.\r\n    if MyState ~= CHASE_ST and MyState ~= ATTACK_ST then return false end\r\n    if MyEnemy == nil or MyEnemy == 0 or IsMonster(MyEnemy) ~= 1 or\r\n       GetV(V_MOTION, MyEnemy) == MOTION_DEAD or IsOutOfSight(MyID, MyEnemy) then return false end\r\n\r\n    -- A real manual attack remains under the player's control, including the\r\n    -- existing explicit-command exception to automatic KS and leash checks.\r\n    if MyEnemy == manualCombatTarget then return true end\r\n\r\n    if not MonsterActionAllowed(MyEnemy) or not IsMonsterFreeForUs(MyEnemy) or BeyondCombatDistance() then\r\n        return false\r\n    end\r\n    local owner = GetV(V_OWNER, MyID)\r\n    if owner ~= 0 then\r\n        local leash = math.max(1, math.min(30, tonumber(BAI_CONFIG.maxCombatDistanceFromOwner) or 12))\r\n        local targetDistance = GetDistance2(owner, MyEnemy)\r\n        if targetDistance == -1 or targetDistance > leash then return false end\r\n    end\r\n\r\n    local ownerMoving = OwnerIsMoving()\r\n    local finishStartedFight = BAI_CONFIG.finishCurrentTargetWhileOwnerMoving and currentTargetAttackStarted\r\n    if ownerMoving and ((BAI_Passive and not IsPassiveDefenseTarget(MyEnemy)) or\r\n       (not BAI_CONFIG.attackWhileOwnerMoving and not finishStartedFight)) then return false end\r\n    if ownerMoving and BAI_CONFIG.attackWhileOwnerMoving and not finishStartedFight then\r\n        local movingRange = math.max(1, math.min(15, tonumber(BAI_CONFIG.attackWhileOwnerMovingRange) or 5))\r\n        local distance = GetDistance2(owner, MyEnemy)\r\n        if distance == -1 or distance > movingRange then return false end\r\n    end\r\n    return true\r\nend\r\n\r\nlocal function TryUseAutoSkill(supportOnly)\r\n    if not BAI_CONFIG.autoSkillsEnabled then return false end\r\n    if BAI_CONFIG.skills == nil or #BAI_CONFIG.skills == 0 then return false end\r\n\r\n    -- Manual move/hold/patrol commands should never be interrupted by automatic skills.\r\n    if MyState ~= IDLE_ST and MyState ~= CHASE_ST and MyState ~= ATTACK_ST then\r\n        return false\r\n    end\r\n\r\n    if not SkillsAllowedByOwnerDistance() then\r\n        return false\r\n    end\r\n\r\n    local now = GetTick()\r\n    if autoSkillSystemStartedAt == nil then\r\n        autoSkillSystemStartedAt = now\r\n        return false\r\n    end\r\n\r\n    if not GlobalSkillPauseReady(now) then\r\n        return false\r\n    end\r\n\r\n    -- Fixed global priority for now:\r\n    -- emergency/defense/heal > buffs > attack skills.\r\n    if TryUseOneAutoSkillKind(\"SelfEmergency\", now) then return true end\r\n    if TryUseOneAutoSkillKind(\"DefensiveOwner\", now) then return true end\r\n    if TryUseOneAutoSkillKind(\"HealOwner\", now) then return true end\r\n    if TryUseOneAutoSkillKind(\"HealEither\", now) then return true end\r\n    if supportOnly then return false end\r\n    if TryUseOneAutoSkillKind(\"Buff\", now) then return true end\r\n    if MyEnemy ~= 0 and IsMonster(MyEnemy) == 1 then\r\n        local action = select(1, CurrentMonsterAction(MyEnemy))\r\n        if action == \"NormalOnly\" or action == \"Ignore\" then return false end\r\n    end\r\n    if not AutoOffensiveTargetAllowed() then return false end\r\n    if TryUseOneAutoSkillKind(\"Offensive\", now) then return true end\r\n\r\n    return false\r\nend\r\n\r\n\r\nlocal function PvpGlobalSkillPauseReady(now)\r\n    local pause = math.max(0, tonumber(BAI_CONFIG.pvpGlobalSkillPauseMs) or 2000)\r\n    if pause <= 0 or lastAnySkillUse == nil then\r\n        return true\r\n    end\r\n    return now - lastAnySkillUse >= pause\r\nend\r\n\r\nlocal function TryUsePvpAutoSkill()\r\n    if currentPvpAction == nil or MyEnemy == 0 then return false end\r\n    if currentPvpAction == \"NormalOnly\" then return false end\r\n    if not BAI_CONFIG.pvpSkillsEnabled then return false end\r\n    if BAI_CONFIG.pvpSkills == nil or #BAI_CONFIG.pvpSkills == 0 then return false end\r\n\r\n    if MyState ~= IDLE_ST and MyState ~= CHASE_ST and MyState ~= ATTACK_ST then\r\n        return false\r\n    end\r\n\r\n    if not SkillsAllowedByOwnerDistance() then\r\n        return false\r\n    end\r\n\r\n    local now = GetTick()\r\n    if autoSkillSystemStartedAt == nil then\r\n        autoSkillSystemStartedAt = now\r\n        return false\r\n    end\r\n\r\n    if not PvpGlobalSkillPauseReady(now) then\r\n        return false\r\n    end\r\n\r\n    if TryUseOneAutoSkillKind(\"SelfEmergency\", now, BAI_CONFIG.pvpSkills) then return true end\r\n    if TryUseOneAutoSkillKind(\"DefensiveOwner\", now, BAI_CONFIG.pvpSkills) then return true end\r\n    if TryUseOneAutoSkillKind(\"HealOwner\", now, BAI_CONFIG.pvpSkills) then return true end\r\n    if TryUseOneAutoSkillKind(\"HealEither\", now, BAI_CONFIG.pvpSkills) then return true end\r\n    if TryUseOneAutoSkillKind(\"Buff\", now, BAI_CONFIG.pvpSkills) then return true end\r\n    if TryUseOneAutoSkillKind(\"Offensive\", now, BAI_CONFIG.pvpSkills) then return true end\r\n\r\n    return false\r\nend\r\n\r\nMonsterRuleForActor = function(actor)\r\n    if actor == nil or actor == 0 or IsMonster(actor) ~= 1 then return nil end\r\n    local ok, mobId = pcall(GetV, V_HOMUNTYPE, actor)\r\n    if not ok then return nil end\r\n    mobId = tonumber(mobId)\r\n    if mobId == nil then return nil end\r\n    for _, rule in ipairs(BAI_CONFIG.monsterRules or {}) do\r\n        if tonumber(rule.monsterId) == mobId then return rule end\r\n    end\r\n    return nil\r\nend\r\n\r\nlocal function PlantProtectionState(actor)\r\n    local mobId = MonsterDbId(actor)\r\n    if mobId == nil then return 0 end\r\n    local protected = false\r\n    if BAI_CONFIG.ignoreSummonedPlants and (mobId == 1500 or mobId == 1555 or mobId == 1579 or mobId == 1589 or mobId == 1590) then protected = true end\r\n    if BAI_CONFIG.ignoreNormalPlants and (mobId == 1078 or mobId == 1079 or mobId == 1080 or mobId == 1081 or mobId == 1082 or mobId == 1083 or mobId == 1084 or mobId == 1085 or mobId == 1750 or mobId == 1878 or mobId == 2147 or mobId == 2148) then protected = true end\r\n    if not protected then return 0 end\r\n    local owner = GetV(V_OWNER, MyID)\r\n    local target = GetV(V_TARGET, actor)\r\n    -- 2 = direct defense is explicitly allowed; 1 = protected and blocked.\r\n    if target == owner or target == MyID then return 2 end\r\n    return 1\r\nend\r\n\r\nlocal function MonsterPriority(actor)\r\n    local rule = MonsterRuleForActor(actor)\r\n    if rule == nil then return 5 end\r\n    return math.max(1, math.min(10, tonumber(rule.priority) or 5))\r\nend\r\n\r\nMonsterActionAllowed = function(actor)\r\n    -- Event NPCs must never be selected by BAI automatically.\r\n    -- A genuine manual Homunculus attack command remains under player control.\r\n    local mobId = MonsterDbId(actor)\r\n    if actor ~= manualCombatTarget and (mobId == 1345 or mobId == 2414) then return false end\r\n    local plantState = PlantProtectionState(actor)\r\n    if plantState == 1 then return false end\r\n    if plantState == 2 then return true end\r\n    local rule = MonsterRuleForActor(actor)\r\n    if rule == nil then\r\n        local action = BAI_CONFIG.defaultMonsterAction or \"NormalAndSkills\"\r\n        if action == \"Ignore\" then return false end\r\n        return not BAI_Passive\r\n    end\r\n    local action = rule.action or \"NormalAndSkills\"\r\n    if action == \"Ignore\" then return false end\r\n    if BAI_Passive and not rule.attackWhenPassive then return false end\r\n    return true\r\nend\r\n\r\nCurrentMonsterAction = function(actor)\r\n    if PlantProtectionState(actor) == 2 then return \"NormalAndSkills\", nil end\r\n    local rule = MonsterRuleForActor(actor)\r\n    return rule and (rule.action or \"NormalAndSkills\") or (BAI_CONFIG.defaultMonsterAction or \"NormalAndSkills\"), rule\r\nend\r\n\r\n-- One authoritative resolver for offensive skill levels against monsters.\r\n-- A Monster Rule always wins, including level 1. The general Skills page is\r\n-- used only when the current monster has no special rule at all.\r\nEffectiveMonsterSkillLevel = function(actor, fallbackLevel)\r\n    local fallback = math.max(1, math.min(5, tonumber(fallbackLevel) or 1))\r\n    if actor == nil or actor == 0 or IsMonster(actor) ~= 1 then return fallback end\r\n    local rule = MonsterRuleForActor(actor)\r\n    local effective = rule and math.max(1, math.min(5, tonumber(rule.skillLevel) or fallback)) or fallback\r\n    BaiDebug.run(BaiDebug.skillLevel, actor, fallback, effective, rule)\r\n    return effective\r\nend\r\n\r\n\r\n-- Snipe uses an independent skill target, never assigns MyEnemy or MySkill.\r\n-- We can observe execution hints, not a damage event or guaranteed hit.\r\nfunction BaiSnipe.options()\r\n    local s = BAI_CONFIG and BAI_CONFIG.sniper\r\n    if type(s) == \"table\" and s.enabled == true and type(s.rules) == \"table\" then return s end\r\n    return nil\r\nend\r\nfunction BaiSnipe.value(key, actor, skill, level)\r\n    if key == nil then return nil end\r\n    local ok, value = pcall(GetV, key, actor, skill, level)\r\n    if not ok then return nil end\r\n    return tonumber(value)\r\nend\r\nfunction BaiSnipe.log(message, reason)\r\n    local category = reason and \"reasons\" or \"skills\"\r\n    BaiDebug.run(BaiDebug.event, category, \"snipe:\" .. message,\r\n        \"SNIPE \" .. message .. \" main_target=\" .. tostring(MyEnemy) .. BaiDebug.mode(), false)\r\nend\r\nfunction BaiSnipe.cancel(reason)\r\n    local p = BaiSnipe.pending\r\n    if p then\r\n        BaiSnipe.log(\"UNCONFIRMED target=\" .. tostring(p.actor) ..\r\n            \" reason=\" .. reason .. \" attempts=\" .. tostring(p.record.attempts), true)\r\n        BaiSnipe.pending = nil\r\n    end\r\nend\r\nfunction BaiSnipe.beforeSkill()\r\n    if not BaiSnipe.issuing then BaiSnipe.cancel(\"OTHER_SKILL\") end\r\nend\r\nfunction BaiSnipe.begin()\r\n    local now = GetTick()\r\n    if BaiSnipe.myid ~= MyID or (BaiSnipe.tick ~= nil and now < BaiSnipe.tick) then\r\n        BaiSnipe.pending, BaiSnipe.records, BaiSnipe.lastCasts = nil, {}, {}\r\n    end\r\n    BaiSnipe.myid, BaiSnipe.tick, BaiSnipe.actors = MyID, now, nil\r\n    local p = BaiSnipe.pending\r\n    if p then\r\n        if p.config ~= BAI_CONFIG or not BaiSnipe.options() then\r\n            BaiSnipe.cancel(\"MODE_CHANGED\")\r\n        else\r\n            local sp = BaiSnipe.value(V_SP, MyID)\r\n            if sp ~= nil and p.sp ~= nil and sp < p.sp then\r\n                -- No other skill has been issued while this record was pending.\r\n                -- A foreign SP drain can still mimic this signal: it is NOT hit proof.\r\n                p.record.confirmed = p.record.confirmed + 1\r\n                BaiSnipe.log(\"EXECUTION_HINT target=\" .. tostring(p.actor) ..\r\n                    \" evidence=SP_DROP confirmed=\" .. tostring(p.record.confirmed) ..\r\n                    \" requested=\" .. tostring(p.applications) .. \" hits=UNKNOWN\", false)\r\n                BaiSnipe.pending = nil\r\n            elseif IsMonster(p.actor) ~= 1 or GetV(V_MOTION, p.actor) == MOTION_DEAD or\r\n                IsOutOfSight(MyID, p.actor) then\r\n                BaiSnipe.cancel(\"TARGET_LOST\")\r\n            elseif now - p.at >= p.timeout then\r\n                BaiSnipe.cancel(\"TIMEOUT\")\r\n            end\r\n        end\r\n    end\r\nend\r\nfunction BaiSnipe.snapshot()\r\n    if BaiSnipe.actors then return BaiSnipe.actors end\r\n    local actors, visible, now = TickActors(), {}, GetTick()\r\n    for _, actor in ipairs(actors) do visible[actor] = true end\r\n    for key, record in pairs(BaiSnipe.records) do\r\n        if visible[record.actor] then\r\n            record.lastSeen = now\r\n            if GetV(V_MOTION, record.actor) == MOTION_DEAD then record.dead = true end\r\n        elseif now - record.lastSeen > 30000 then\r\n            BaiSnipe.records[key] = nil\r\n        end\r\n    end\r\n    BaiSnipe.actors = actors\r\n    return actors\r\nend\r\nfunction BaiSnipe.contextAllowed()\r\n    if not BaiSnipe.options() or BAI_CONFIG.tankEnabled or currentPvpAction ~= nil then return false end\r\n    if MyState ~= IDLE_ST and MyState ~= CHASE_ST and MyState ~= ATTACK_ST then return false end\r\n    if MySkill ~= 0 or BaiTraffic.manual or BaiTraffic.startupWaiting() then return false end\r\n    if MyState == IDLE_ST and List.size(ResCmdList) > 0 then return false end\r\n    if BeyondCombatDistance() or not SkillsAllowedByOwnerDistance() then return false end\r\n    if OwnerIsMoving() and BAI_CONFIG.attackWhileOwnerMoving ~= true then return false end\r\n    return true\r\nend\r\nfunction BaiSnipe.record(rule, actor)\r\n    local mode = tostring(BAI_ACTIVE_T or 1)\r\n    local key = mode .. \":\" .. tostring(rule.ruleId or rule.monsterId) .. \":\" .. tostring(actor)\r\n    local record = BaiSnipe.records[key]\r\n    if record == nil or record.raw ~= rule.monsterId or\r\n        (record.dead and GetV(V_MOTION, actor) ~= MOTION_DEAD) then\r\n        record = { actor=actor, raw=rule.monsterId, confirmed=0, attempts=0, lastSeen=GetTick() }\r\n        BaiSnipe.records[key] = record\r\n    end\r\n    record.lastSeen = GetTick()\r\n    return record\r\nend\r\nfunction BaiSnipe.candidate(actor, rule)\r\n    if type(actor) ~= \"number\" or actor <= 0 or actor == MyID or\r\n        IsMonster(actor) ~= 1 or GetV(V_MOTION, actor) == MOTION_DEAD then return false end\r\n    if BaiSnipe.value(V_HOMUNTYPE, actor) ~= tonumber(rule.monsterId) then return false end\r\n    -- Deliberately no target claim: a snipe does not get the manual target's KS bypass.\r\n    if not IsMonsterFreeForUs(actor) or not MonsterActionAllowed(actor) then return false end\r\n    local action = CurrentMonsterAction(actor)\r\n    if action == \"NormalOnly\" or action == \"Ignore\" then return false end\r\n    local owner = GetV(V_OWNER, MyID)\r\n    local behavior = BAI_CONFIG.attackBehavior or \"Active\"\r\n    if behavior == \"Passive\" and actor ~= MyEnemy then return false end\r\n    if behavior == \"Assist\" and actor ~= MyEnemy and\r\n        GetV(V_TARGET, owner) ~= actor and not PartyMemberTargeting(actor) then return false end\r\n    local ownerDistance = GetDistance2(owner, actor)\r\n    if ownerDistance == -1 or ownerDistance > (tonumber(BAI_CONFIG.maxCombatDistanceFromOwner) or 12) then return false end\r\n    if OwnerIsMoving() and ownerDistance > (tonumber(BAI_CONFIG.attackWhileOwnerMovingRange) or 5) then return false end\r\n    local range = BaiSnipe.value(V_SKILLATTACKRANGE_LEVEL, MyID, tonumber(rule.skillId), tonumber(rule.level))\r\n    if range == nil or range <= 0 then\r\n        BaiSnipe.log(\"BLOCK reason=SKILL_RANGE_UNAVAILABLE skill=\" .. tostring(rule.skillId), true)\r\n        return false\r\n    end\r\n    local distance = GetDistance2(MyID, actor)\r\n    return distance ~= -1 and distance <= range, distance\r\nend\r\nfunction BaiSnipe.try()\r\n    if not BaiSnipe.contextAllowed() then\r\n        -- Do not continue a pending automatic action during a manual state/return.\r\n        BaiSnipe.cancel(\"CONTEXT_CHANGED\")\r\n        return false\r\n    end\r\n    -- Avoid immediately cancelling the just-issued cast with a Move or Attack.\r\n    -- The normal target is retained throughout this bounded confirmation window.\r\n    if BaiSnipe.pending then return true end\r\n    local now, options = GetTick(), BaiSnipe.options()\r\n    if not GlobalSkillPauseReady(now) then return false end\r\n    local sp = BaiSnipe.value(V_SP, MyID)\r\n    if sp == nil then return false end\r\n    local best, bestRule, bestRecord, bestDistance = nil, nil, nil, math.huge\r\n    local actors = BaiSnipe.snapshot()\r\n    BaiSnipe.lastCasts = BaiSnipe.lastCasts or {}\r\n    for _,rule in ipairs(options.rules) do\r\n        local skill = tonumber(rule.skillId)\r\n        -- No intimacy-consuming or unsupported skill is implicitly enabled.\r\n        local supported = (BAI_CONFIG.homunculus == \"Vanilmirth\" and skill == 8013) or\r\n            (BAI_CONFIG.homunculus == \"Filir\" and skill == 8009)\r\n        local interval = math.max(100, tonumber(rule.intervalMs) or 3000)\r\n        local skillKey = tostring(BAI_ACTIVE_T or 1) .. \":\" .. tostring(skill)\r\n        local last = BaiSnipe.lastCasts[skillKey]\r\n        if rule.enabled == true and supported and sp >= math.max(0, tonumber(rule.minSp) or 0) and\r\n            (last == nil or now - last >= interval) then\r\n            for _,actor in ipairs(actors) do\r\n                local eligible, distance = BaiSnipe.candidate(actor, rule)\r\n                if eligible then\r\n                    local record = BaiSnipe.record(rule, actor)\r\n                    local count = math.max(1, math.min(100, tonumber(rule.applications) or 1))\r\n                    local extra = math.max(0, math.min(5, tonumber(rule.extraAttempts) or 0))\r\n                    if record.confirmed < count and record.attempts < count + extra and\r\n                        (distance < bestDistance or (distance == bestDistance and (best == nil or actor < best))) then\r\n                        best, bestRule, bestRecord, bestDistance = actor, rule, record, distance\r\n                    end\r\n                end\r\n            end\r\n        end\r\n    end\r\n    if best == nil then return false end\r\n    local level = math.max(1, math.min(5, tonumber(bestRule.level) or 1))\r\n    if BaiDebug.enabled(\"skills\") then BaiDebug.skillContext = { kind=\"Snipe\", level=level } end\r\n    BaiSnipe.issuing = true\r\n    local _, issued = SkillObject(MyID, level, bestRule.skillId, best)\r\n    BaiSnipe.issuing = false\r\n    if not issued then return false end\r\n    bestRecord.attempts = bestRecord.attempts + 1\r\n    bestRecord.lastSeen = now\r\n    BaiSnipe.lastCasts[tostring(BAI_ACTIVE_T or 1) .. \":\" .. tostring(bestRule.skillId)] = now\r\n    MarkAnySkillUse(now)\r\n    BaiSnipe.pending = {\r\n        actor=best, config=BAI_CONFIG, record=bestRecord, sp=sp, at=now,\r\n        timeout=math.max(500, math.min(10000, tonumber(options.confirmationTimeoutMs) or 1500)),\r\n        applications=math.max(1, math.min(100, tonumber(bestRule.applications) or 1))\r\n    }\r\n    BaiSnipe.log(\"ISSUED target=\" .. tostring(best) .. \" raw_id=\" .. tostring(bestRule.monsterId) ..\r\n        \" skill=\" .. tostring(bestRule.skillId) .. \" level=\" .. tostring(level) ..\r\n        \" attempt=\" .. tostring(bestRecord.attempts) .. \" hits=UNKNOWN\", false)\r\n    return true\r\nend\r\n\r\nlocal function TankExcluded(actor)\r\n    local mobId = MonsterDbId(actor)\r\n    if mobId == nil then return true end\r\n\r\n    if BAI_CONFIG.tankIgnoreSummonedPlants ~= false then\r\n        if mobId == 1500 or mobId == 1555 or mobId == 1579 or mobId == 1589 or mobId == 1590 then return true end\r\n    end\r\n    if BAI_CONFIG.tankIgnoreNormalPlants ~= false then\r\n        if mobId == 1078 or mobId == 1079 or mobId == 1080 or mobId == 1081 or mobId == 1082 or\r\n           mobId == 1083 or mobId == 1084 or mobId == 1085 or mobId == 1750 or mobId == 1878 or mobId == 2147 or mobId == 2148 then return true end\r\n    end\r\n\r\n    for _, blockedId in ipairs(BAI_CONFIG.tankExcludedMonsterIds or {}) do\r\n        if tonumber(blockedId) == mobId then return true end\r\n    end\r\n    return false\r\nend\r\n\r\nlocal function TankActorAlive(actor)\r\n    if actor == nil or actor == 0 or IsMonster(actor) ~= 1 then return false end\r\n    if GetV(V_MOTION, actor) == MOTION_DEAD then return false end\r\n    local ok, hp = pcall(GetV, V_HP, actor)\r\n    if ok and tonumber(hp) == 0 then return false end\r\n    return true\r\nend\r\n\r\nlocal function TankWithinArea(actor)\r\n    local owner = GetV(V_OWNER, MyID)\r\n    if owner == 0 or actor == 0 then return false end\r\n    local d = GetDistance2(owner, actor)\r\n    local radius = math.max(4, math.min(15, tonumber(BAI_CONFIG.tankMaxDistance) or 10))\r\n    return d ~= -1 and d <= radius\r\nend\r\n\r\n-- Common validity. The Tank Area is intentionally checked separately so bound\r\n-- mobs can remain known while the owner is moving without making the Homunculus\r\n-- chase them outside the configured area.\r\nlocal function TankValidMonster(actor)\r\n    local owner = GetV(V_OWNER, MyID)\r\n    return actor ~= nil and actor ~= 0 and actor ~= MyID and actor ~= owner and\r\n           TankActorAlive(actor) and not TankExcluded(actor) and IsMonsterFreeForUs(actor)\r\nend\r\n\r\nlocal function TankEligibleInArea(actor)\r\n    return TankValidMonster(actor) and TankWithinArea(actor)\r\nend\r\n\r\n-- A command is a pull attempt, not proof of a hit. Remember only actual output\r\n-- and let the client update aggro before offering the same fresh monster again.\r\nfunction BaiTank.begin()\r\n    local now=GetTick()\r\n    if BaiTank.config~=BAI_CONFIG or BaiTank.id~=MyID or\r\n       (BaiTank.tick and now<BaiTank.tick) then BaiTank.pulls={}; BaiTank.wait=nil end\r\n    BaiTank.config,BaiTank.id,BaiTank.tick=BAI_CONFIG,MyID,now\r\n    for actor,p in pairs(BaiTank.pulls) do\r\n        if IsOutOfSight(MyID,actor) or not TankActorAlive(actor) or\r\n           MonsterDbId(actor)~=p.raw or GetV(V_TARGET,actor)==MyID then\r\n            BaiTank.pulls[actor]=nil\r\n        elseif now>=p.retryAt then\r\n            if p.kind==\"SkillObject\" and not BaiTank.skillRetryReady(actor) then\r\n                p.retryAt=now+100\r\n            else BaiTank.pulls[actor]=nil end\r\n        end\r\n    end\r\nend\r\nfunction BaiTank.note(kind,args,spBefore)\r\n    if not BAI_CONFIG.tankEnabled or\r\n       (currentPvpAction~=\"TankFresh\" and currentPvpAction~=\"TankRescue\") then return end\r\n    local actor=kind==\"Attack\" and args[2] or (kind==\"SkillObject\" and args[4])\r\n    if not actor or actor~=MyEnemy then return end\r\n    local now=GetTick()\r\n    local retry=math.max(500,math.min(10000,tonumber(BAI_CONFIG.tankAggroRetryMs) or 1800))\r\n    if currentPvpAction==\"TankRescue\" then retry=1000 end\r\n    retry=math.max(retry,kind==\"SkillObject\" and 1300 or 500)\r\n    local p={actor=actor,raw=MonsterDbId(actor),at=now,retryAt=now+retry,kind=kind,\r\n        sp=spBefore,deadline=now+(kind==\"Attack\" and 350 or 1200)}\r\n    BaiTank.pulls[actor]=p; BaiTank.wait=p\r\n    BaiDebug.run(BaiDebug.event,\"skills\",\"tank_pull:\"..actor,\r\n        \"TANK_PULL_ATTEMPT target=\"..actor..\" command=\"..kind..\" hits=UNKNOWN\"..BaiDebug.mode(),false)\r\nend\r\nfunction BaiTank.waiting()\r\n    local p=BaiTank.wait\r\n    if not p then return false end\r\n    local now=GetTick()\r\n    local elapsed=now-p.at\r\n    local sp=BaiSnipe.value(V_SP,MyID)\r\n    local executed=p.completed or GetV(V_TARGET,p.actor)==MyID or\r\n        (p.kind==\"Attack\" and elapsed>=100 and GetV(V_MOTION,MyID)==MOTION_ATTACK) or\r\n        (p.kind==\"SkillObject\" and elapsed>=250 and p.sp and sp and sp<p.sp)\r\n    if executed or now>=p.deadline or not TankActorAlive(p.actor) or IsOutOfSight(MyID,p.actor) then\r\n        BaiTank.wait=nil\r\n        return false\r\n    end\r\n    return true\r\nend\r\nfunction BaiTank.hasPending()\r\n    return next(BaiTank.pulls)~=nil\r\nend\r\n\r\n-- Absolute priority. Rescue is still limited by the Tank Area, which is the\r\n-- configured safety leash around the owner and prevents chasing off-screen mobs.\r\nlocal function TankRescueVictim(victim)\r\n    local owner = GetV(V_OWNER, MyID)\r\n    return victim ~= nil and victim ~= 0 and\r\n        (victim == owner or (BAI_CONFIG.partyEnabled == true and\r\n         BAI_CONFIG.partyProtectMembers == true and IsPartyMember(victim)))\r\nend\r\n\r\nlocal function PickTankOwnerThreat()\r\n    local owner = GetV(V_OWNER, MyID)\r\n    if owner == 0 then return 0 end\r\n    local best, bestDistance = 0, 99999\r\n    for _, actor in ipairs(TickActors()) do\r\n        local victim = GetV(V_TARGET, actor)\r\n        if TankEligibleInArea(actor) and TankRescueVictim(victim) then\r\n            local d = GetDistance2(MyID, actor)\r\n            if d ~= -1 and d < bestDistance then best, bestDistance = actor, d end\r\n        end\r\n    end\r\n    return best\r\nend\r\n\r\n-- Fresh = visible, valid monster in Tank Area whose aggro is not on the Homu yet.\r\n-- A mob targeting another actor is already rejected by Kill-Steal protection.\r\nlocal function PickFreshTankTarget()\r\n    local owner = GetV(V_OWNER, MyID)\r\n    local best, bestDistance = 0, 99999\r\n    for _, actor in ipairs(TickActors()) do\r\n        if TankEligibleInArea(actor) then\r\n            local target = GetV(V_TARGET, actor)\r\n            if target ~= MyID and target ~= owner and not BaiTank.pulls[actor] then\r\n                local d = GetDistance2(MyID, actor)\r\n                if d ~= -1 and d < bestDistance then best, bestDistance = actor, d end\r\n            end\r\n        end\r\n    end\r\n    return best\r\nend\r\n\r\nlocal function PickBoundTankTarget()\r\n    if BAI_CONFIG.tankAttackBoundWhenIdle ~= true then return 0 end\r\n    local best, bestDistance = 0, 99999\r\n    for _, actor in ipairs(TickActors()) do\r\n        if TankEligibleInArea(actor) and GetV(V_TARGET, actor) == MyID then\r\n            local d = GetDistance2(MyID, actor)\r\n            if d ~= -1 and d < bestDistance then best, bestDistance = actor, d end\r\n        end\r\n    end\r\n    return best\r\nend\r\n\r\nlocal function TankHasBoundMonster()\r\n    for _, actor in ipairs(TickActors()) do\r\n        if TankValidMonster(actor) and GetV(V_TARGET, actor) == MyID then return true end\r\n    end\r\n    return false\r\nend\r\n\r\nlocal function TankHasAnyMonsterInArea()\r\n    for _, actor in ipairs(TickActors()) do\r\n        if TankEligibleInArea(actor) then return true end\r\n    end\r\n    return false\r\nend\r\n\r\n-- Tank hold distance is a ceiling, not a target ring. Being closer is fine.\r\nlocal function TankAtHoldPosition()\r\n    local owner = GetV(V_OWNER, MyID)\r\n    if owner == 0 then return true end\r\n    local d = GetDistance2(owner, MyID)\r\n    local hold = math.max(2, math.min(10, tonumber(BAI_CONFIG.tankDistance) or 5))\r\n    return d ~= -1 and d <= hold\r\nend\r\n\r\nlocal function MoveToTankHoldPosition()\r\n    local owner = GetV(V_OWNER, MyID)\r\n    if owner ~= 0 and not TankAtHoldPosition() then MoveToOwner(MyID) end\r\nend\r\n\r\nlocal function TankSupportSkill()\r\n    local now = GetTick()\r\n    -- Tank healing/defensive skills use the same per-rule intervals and HP\r\n    -- conditions as the normal skill system, but are evaluated while Tank mode\r\n    -- owns the state machine.\r\n    if TryUseOneAutoSkillKind(\"HealOwner\", now, BAI_CONFIG.tankSkills) then return true end\r\n    if TryUseOneAutoSkillKind(\"HealEither\", now, BAI_CONFIG.tankSkills) then return true end\r\n    if TryUseOneAutoSkillKind(\"DefensiveOwner\", now, BAI_CONFIG.tankSkills) then return true end\r\n    if TryUseOneAutoSkillKind(\"SelfEmergency\", now, BAI_CONFIG.tankSkills) then return true end\r\n    if TryUseOneAutoSkillKind(\"Buff\", now, BAI_CONFIG.tankSkills) then return true end\r\n    return false\r\nend\r\n\r\nlocal function TankOffensiveSkill(target, allowSkills)\r\n    if allowSkills ~= true then return false end\r\n    local now = GetTick()\r\n    local currentSp = GetV(V_SP, MyID)\r\n    local globalMinSp = math.max(0, tonumber(BAI_CONFIG.tankMinSpForAttackSkills) or 0)\r\n    if currentSp < globalMinSp then return false end\r\n\r\n    local targetDistance = GetDistance2(MyID, target)\r\n    if targetDistance == -1 then return false end\r\n\r\n    local enabled = {}\r\n    for _, rule in ipairs(BAI_CONFIG.tankSkills or {}) do\r\n        local level = math.max(1, math.min(10, tonumber(rule.level) or 1))\r\n        local skillId = tonumber(rule.id) or 0\r\n        local skillRange = 0\r\n        if skillId > 0 then skillRange = GetV(V_SKILLATTACKRANGE_LEVEL, MyID, skillId, level) or 0 end\r\n\r\n        if rule.enabled and rule.kind == \"Offensive\" and skillId > 0 and\r\n           currentSp >= math.max(0, tonumber(rule.minSp) or 0) and AutoSkillIntervalReady(rule, now) and\r\n           targetDistance <= skillRange then\r\n            table.insert(enabled, rule)\r\n        end\r\n    end\r\n    if #enabled == 0 then return false end\r\n\r\n    local nextCursor = (tankSkillCursor % #enabled) + 1\r\n    local rule = enabled[nextCursor]\r\n    local _, issued = SkillObject(MyID, math.max(1, math.min(10, tonumber(rule.level) or 1)), tonumber(rule.id) or 0, target)\r\n    if not issued then return false end\r\n    tankSkillCursor = nextCursor\r\n    local key = rule.ruleId or tostring(rule.id) .. \":\" .. tostring(rule.level)\r\n    autoSkillLastUse[key] = now\r\n    lastAnySkillUse = now\r\n    return true\r\nend\r\n\r\n-- If a ranged pull needs retrying, wait for a usable ranged rule rather than\r\n-- immediately converting that same attempt into a walk to normal-attack range.\r\nfunction BaiTank.skillRetryReady(target)\r\n    local sp=tonumber(GetV(V_SP,MyID)) or 0\r\n    if sp<(tonumber(BAI_CONFIG.tankMinSpForAttackSkills) or 0) then return true end\r\n    local distance=GetDistance2(MyID,target)\r\n    local possible=false\r\n    for _,rule in ipairs(BAI_CONFIG.tankSkills or {}) do\r\n        local id=tonumber(rule.id) or 0\r\n        local level=math.max(1,math.min(10,tonumber(rule.level) or 1))\r\n        if rule.enabled and rule.kind==\"Offensive\" and id>0 and sp>=(tonumber(rule.minSp) or 0) and\r\n           distance~=-1 and distance<=(GetV(V_SKILLATTACKRANGE_LEVEL,MyID,id,level) or 0) then\r\n            possible=true\r\n            if AutoSkillIntervalReady(rule,GetTick()) then return true end\r\n        end\r\n    end\r\n    return not possible\r\nend\r\n\r\nlocal function TankAttack(target, mode)\r\n    -- There is no Tank attack timer. This function may be reached on every AI tick.\r\n    -- Ragnarok/ASPD decides when a normal Attack command can actually produce a hit.\r\n    local allowSkills = true\r\n    if mode == \"bound\" then allowSkills = BAI_CONFIG.tankUseSkillsOnBound == true end\r\n    if mode == \"rescue\" then allowSkills = BAI_CONFIG.tankUseSkillsForOwnerRescue ~= false end\r\n\r\n    if TankOffensiveSkill(target, allowSkills) then\r\n        ResetAttackDance()\r\n        return true\r\n    end\r\n\r\n    -- Rescue without skills means a normal rescue attack even if normal attacks\r\n    -- were disabled for ordinary Tank pulling. Owner rescue must never become inert.\r\n    if mode == \"rescue\" or BAI_CONFIG.tankNormalAttack ~= false then\r\n        if mode == \"bound\" then\r\n            return AttackWithDance(target)\r\n        end\r\n        ResetAttackDance()\r\n        local _, issued = Attack(MyID, target)\r\n        return issued\r\n    end\r\n    return false\r\nend\r\n\r\nlocal function TankClearCombat()\r\n    ResetAutoTarget()\r\n    currentPvpAction = nil\r\n    tankAttackingBoundFallback = false\r\nend\r\n\r\nlocal function TankStart(target, action)\r\n    BaiTraffic.cancel(false)\r\n    if BaiTank.wait and BaiTank.wait.actor~=target then BaiTank.wait=nil end\r\n    tankAttackingBoundFallback = action == \"TankBound\"\r\n    currentPvpAction = action\r\n    MyEnemy = target\r\n    MySkill = 0\r\n    currentTargetAttackStarted = false\r\n    MyState = CHASE_ST\r\nend\r\n\r\nfunction BaiTank.advancePull()\r\n    if MyEnemy~=0 and (currentPvpAction==\"TankFresh\" or currentPvpAction==\"TankRescue\") and\r\n       (not TankEligibleInArea(MyEnemy) or IsOutOfSight(MyID,MyEnemy)) then\r\n        BaiTank.pulls[MyEnemy]=nil; BaiTank.wait=nil\r\n        return false\r\n    end\r\n    if BaiTank.waiting() then return true end\r\n    if currentPvpAction==\"TankFresh\" and BaiTank.pulls[MyEnemy] then\r\n        local p=BaiTank.pulls[MyEnemy]\r\n        TankClearCombat(); MyState=IDLE_ST\r\n        -- Attack starts client auto-attacking. Cancel that loop after the first\r\n        -- execution hint before selecting the next mob. A ranged skill needs no chase.\r\n        if p.kind==\"Attack\" then\r\n            local x,y=GetV(V_POSITION,MyID)\r\n            Move(MyID,x,y)\r\n        end\r\n        return true\r\n    end\r\n    -- Rescue retains absolute priority, but does not spam the same unconfirmed pull.\r\n    return currentPvpAction==\"TankRescue\" and BaiTank.pulls[MyEnemy]~=nil\r\nend\r\n\r\nlocal function PickNearestMonster(maxOwnerDistance)\r\n    local owner = GetV(V_OWNER, MyID)\r\n    local actors = TickActors()\r\n    local best = 0\r\n    local bestDistance = 99999\r\n    local bestPriority = 999\r\n\r\n    for _, actor in ipairs(actors) do\r\n        if actor ~= MyID and actor ~= owner and IsMonster(actor) == 1 then\r\n            local motion = GetV(V_MOTION, actor)\r\n            if motion ~= MOTION_DEAD and IsMonsterFreeForUs(actor) and MonsterActionAllowed(actor) then\r\n                local d = GetDistance2(MyID, actor)\r\n                local ownerDistanceOk = true\r\n                local od = GetDistance2(owner, actor)\r\n\r\n                -- Never acquire a fresh monster that already lies outside the\r\n                -- configured combat leash. Previously BAI started chasing it,\r\n                -- hit the owner-distance limit, returned, then immediately\r\n                -- selected the same monster again -> visible back-and-forth.\r\n                local combatLeash = math.max(1, math.min(30, tonumber(BAI_CONFIG.maxCombatDistanceFromOwner) or 12))\r\n                ownerDistanceOk = od ~= -1 and od <= combatLeash\r\n\r\n                if maxOwnerDistance ~= nil then\r\n                    ownerDistanceOk = ownerDistanceOk and od <= maxOwnerDistance\r\n                end\r\n\r\n                local priority = MonsterPriority(actor)\r\n                if d ~= -1 and ownerDistanceOk and (priority < bestPriority or (priority == bestPriority and d < bestDistance)) then\r\n                    best = actor\r\n                    bestPriority = priority\r\n                    bestDistance = d\r\n                end\r\n            end\r\n        end\r\n    end\r\n\r\n    return best\r\nend\r\n\r\n-- Evaluate the live reason, not the historical source of a fight. An owner\r\n-- rescue becomes ordinary self defense once the attacker changes its target.\r\nlocal function DefenseKind(actor)\r\n    if actor == nil or actor == 0 then return nil end\r\n    local victim = GetV(V_TARGET, actor)\r\n    local owner = GetV(V_OWNER, MyID)\r\n    if victim == owner and owner ~= 0 and BAI_CONFIG.passiveProtectOwner then return \"owner\" end\r\n    if victim == MyID and BAI_CONFIG.passiveProtectSelf then return \"self\" end\r\n    if victim ~= owner and victim ~= MyID and BAI_CONFIG.partyEnabled == true and\r\n       BAI_CONFIG.partyProtectMembers == true and IsPartyMember(victim) then return \"party\" end\r\n    return nil\r\nend\r\n\r\nlocal function DefenseOverridesPriority(actor)\r\n    local kind = DefenseKind(actor)\r\n    -- Party protection retains its separate existing policy. The new checkbox\r\n    -- applies only to the owner, never to the Homunculus's own defense.\r\n    return kind == \"party\" or (kind == \"owner\" and BAI_CONFIG.ownerDefenseOverridesPriority == true)\r\nend\r\n\r\nlocal function FindMonsterTargeting(actor)\r\n    if actor == nil or actor == 0 then return 0 end\r\n    local owner = GetV(V_OWNER, MyID)\r\n    local leash = math.max(1, math.min(30, tonumber(BAI_CONFIG.maxCombatDistanceFromOwner) or 12))\r\n    local best, bestPriority, bestDistance = 0, 999, 99999\r\n    for _, monster in ipairs(TickActors()) do\r\n        if monster ~= MyID and IsMonster(monster) == 1 and GetV(V_MOTION, monster) ~= MOTION_DEAD and\r\n           GetV(V_TARGET, monster) == actor and MonsterActionAllowed(monster) and IsMonsterFreeForUs(monster) then\r\n            local d, od = GetDistance2(MyID, monster), GetDistance2(owner, monster)\r\n            local priority = MonsterPriority(monster)\r\n            if d ~= -1 and od ~= -1 and od <= leash and\r\n               (priority < bestPriority or (priority == bestPriority and d < bestDistance)) then\r\n                best, bestPriority, bestDistance = monster, priority, d\r\n            end\r\n        end\r\n    end\r\n    return best\r\nend\r\n\r\nlocal function PickDefenseTarget()\r\n    local owner = GetV(V_OWNER, MyID)\r\n    local ownerThreat = BAI_CONFIG.passiveProtectOwner and FindMonsterTargeting(owner) or 0\r\n    if ownerThreat ~= 0 and BAI_CONFIG.ownerDefenseOverridesPriority == true then return ownerThreat end\r\n\r\n    if BAI_CONFIG.partyEnabled == true and BAI_CONFIG.partyProtectMembers == true then\r\n        EnsurePartyFriendsLoaded()\r\n        local best, bestPriority, bestDistance = 0, 999, 99999\r\n        for friend, enabled in pairs(partyFriends) do\r\n            if enabled == true then\r\n                local threat = FindMonsterTargeting(friend)\r\n                if threat ~= 0 then\r\n                    local priority, d = MonsterPriority(threat), GetDistance2(MyID, threat)\r\n                    if priority < bestPriority or (priority == bestPriority and d < bestDistance) then\r\n                        best, bestPriority, bestDistance = threat, priority, d\r\n                    end\r\n                end\r\n            end\r\n        end\r\n        if best ~= 0 then return best end\r\n    end\r\n\r\n    local selfThreat = BAI_CONFIG.passiveProtectSelf and FindMonsterTargeting(MyID) or 0\r\n    local defense = ownerThreat ~= 0 and ownerThreat or selfThreat\r\n    if ownerThreat ~= 0 and selfThreat ~= 0 then\r\n        local ownerPriority, selfPriority = MonsterPriority(ownerThreat), MonsterPriority(selfThreat)\r\n        if selfPriority < ownerPriority or (selfPriority == ownerPriority and\r\n           not BAI_CONFIG.passiveOwnerPriority and GetDistance2(MyID, selfThreat) < GetDistance2(MyID, ownerThreat)) then\r\n            defense = selfThreat\r\n        end\r\n    end\r\n    if defense == 0 then return 0 end\r\n\r\n    if (MyState == CHASE_ST or MyState == ATTACK_ST) and MyEnemy ~= 0 and\r\n       IsMonster(MyEnemy) == 1 and GetV(V_MOTION, MyEnemy) ~= MOTION_DEAD and\r\n       not IsOutOfSight(MyID, MyEnemy) and MonsterActionAllowed(MyEnemy) and IsMonsterFreeForUs(MyEnemy) then\r\n        -- Do not reclaim a lower-priority attacker on the tick after an interrupt.\r\n        if MonsterPriority(MyEnemy) < MonsterPriority(defense) then return 0 end\r\n    elseif currentPvpAction == nil then\r\n        -- Initial selection and selection after a kill use the same ranking.\r\n        -- Passive never hunts an unrelated monster just because self defense is on.\r\n        local normal, behavior = 0, BAI_CONFIG.attackBehavior or \"Active\"\r\n        if behavior == \"Active\" and BAI_CONFIG.pvpEnabled ~= true then\r\n            if not OwnerIsMoving() then\r\n                normal = PickNearestMonster()\r\n            elseif BAI_CONFIG.attackWhileOwnerMoving == true then\r\n                normal = PickNearestMonster(math.max(1, math.min(15, tonumber(BAI_CONFIG.attackWhileOwnerMovingRange) or 5)))\r\n            end\r\n        elseif behavior == \"Assist\" then\r\n            normal = PickAssistTarget()\r\n        end\r\n        if normal ~= 0 and MonsterPriority(normal) < MonsterPriority(defense) then return 0 end\r\n    end\r\n    return defense\r\nend\r\n\r\nlocal function StartChase(id)\r\n    if id == nil or id == 0 then return end\r\n    BaiTraffic.cancel(false)\r\n    MyEnemy = id\r\n    MySkill = 0\r\n    currentTargetAttackStarted = false\r\n    MyState = CHASE_ST\r\nend\r\n\r\nlocal function TryReactToDefense()\r\n    if MyState ~= CHASE_ST and MyState ~= ATTACK_ST then return false end\r\n    if MyEnemy ~= 0 and MyEnemy == manualCombatTarget then return false end\r\n    local defense = PickDefenseTarget()\r\n    if defense == 0 or defense == MyEnemy then return false end\r\n    ResetAttackDance()\r\n    AcceptCombatTarget(defense, false, \"defense\")\r\n    currentPvpAction, currentPvpJobId, currentPvpMaxDistance = nil, nil, nil\r\n    StartChase(defense)\r\n    return true\r\nend\r\n\r\nlocal function TryInterruptForHigherPriorityMonster()\r\n    -- Ranged automatic skills can keep a fight in CHASE_ST. Re-evaluate both\r\n    -- combat states so priority does not depend on reaching normal attack range.\r\n    if MyState ~= ATTACK_ST and MyState ~= CHASE_ST then return false end\r\n    if MyEnemy == 0 or currentPvpAction ~= nil then return false end\r\n    if IsMonster(MyEnemy) ~= 1 or GetV(V_MOTION, MyEnemy) == MOTION_DEAD then return false end\r\n    if currentCombatSource == \"assist\" or currentCombatSource == \"pvp\" then\r\n        BaiDebug.run(BaiDebug.block, \"PROTECTED_SOURCE\")\r\n        return false\r\n    end\r\n    if DefenseOverridesPriority(MyEnemy) then\r\n        BaiDebug.run(BaiDebug.block, \"DEFENSE_PRIORITY\")\r\n        return false\r\n    end\r\n    local isManual = MyEnemy == manualCombatTarget or currentCombatSource == \"manual\"\r\n    local currentPriority = MonsterPriority(MyEnemy)\r\n    local owner = GetV(V_OWNER, MyID)\r\n    local combatLeash = math.max(1, math.min(30, tonumber(BAI_CONFIG.maxCombatDistanceFromOwner) or 12))\r\n    if OwnerIsMoving() then\r\n        if BAI_CONFIG.attackWhileOwnerMoving ~= true then return false end\r\n        combatLeash = math.min(combatLeash, math.max(1, math.min(15, tonumber(BAI_CONFIG.attackWhileOwnerMovingRange) or 5)))\r\n    end\r\n    local behavior = BAI_CONFIG.attackBehavior or \"Active\"\r\n    local assist = behavior == \"Assist\" and PickAssistTarget() or 0\r\n    local best, bestPriority, bestDistance = 0, 999, 99999\r\n    for _,actor in ipairs(TickActors()) do\r\n        if type(actor) == \"number\" and actor > 0 and actor ~= MyID and actor ~= owner and actor ~= MyEnemy and IsMonster(actor) == 1 then\r\n            local rule = MonsterRuleForActor(actor)\r\n            local reason = nil\r\n            if rule == nil then reason = \"NO_RULE\"\r\n            elseif rule.interruptCurrentTarget ~= true then reason = \"INTERRUPT_OFF\"\r\n            elseif isManual and rule.interruptManualTargets ~= true then reason = \"MANUAL_PROTECTED\"\r\n            elseif currentCombatSource == \"defense\" and behavior ~= \"Active\" and\r\n                DefenseKind(actor) == nil and actor ~= assist then reason = \"MODE_RESTRICTED\"\r\n            elseif GetV(V_MOTION, actor) == MOTION_DEAD then reason = \"DEAD\"\r\n            elseif not IsMonsterFreeForUs(actor) then reason = \"KS\"\r\n            elseif not MonsterActionAllowed(actor) then reason = \"EXCLUDED\"\r\n            else\r\n                local priority = MonsterPriority(actor)\r\n                local d, od = GetDistance2(MyID,actor), GetDistance2(owner,actor)\r\n                if priority >= currentPriority then reason = \"PRIORITY_NOT_HIGHER\"\r\n                elseif d == -1 or od == -1 or od > combatLeash then reason = \"OUTSIDE_LEASH\"\r\n                elseif priority < bestPriority or (priority == bestPriority and d < bestDistance) then\r\n                    best, bestPriority, bestDistance = actor, priority, d\r\n                end\r\n            end\r\n            if reason then BaiDebug.run(BaiDebug.rejected, reason, actor) end\r\n        end\r\n    end\r\n    if best == 0 then BaiDebug.run(BaiDebug.block, \"NO_ELIGIBLE_CANDIDATE\"); return false end\r\n    BaiDebug.run(BaiDebug.switched, MyEnemy, best, currentPriority, bestPriority, isManual)\r\n    -- Drop the old manual claim AND the old target-bound pending skill.\r\n    -- Explicit future queued commands remain the user's commands.\r\n    ResetAttackDance()\r\n    manualCombatTarget = 0\r\n    AcceptCombatTarget(best, false, \"auto\")\r\n    MyEnemy = best\r\n    MySkill, MySkillLevel = 0, 0\r\n    currentTargetAttackStarted = false\r\n    MyState = CHASE_ST\r\n    return true\r\nend\r\n\r\n-- Look for another valid combat target after a fight and also while regrouping.\r\n-- Fresh targets are still filtered by the normal combat leash, so a monster\r\n-- outside the allowed owner distance cannot cause return/chase oscillation.\r\nlocal function TryContinueAfterDefeatedTarget()\r\n    -- Rank owner/self defense against normal monster priority; only the explicit\r\n    -- owner override and the separate party-protection policy take precedence.\r\n    local defenseTarget = PickDefenseTarget()\r\n    if defenseTarget ~= 0 then\r\n        currentPvpAction = nil\r\n        currentPvpJobId = nil\r\n        currentPvpMaxDistance = nil\r\n        AcceptCombatTarget(defenseTarget, false, \"defense\")\r\n        returnToOwnerAfterCombat = false\r\n        StartChase(defenseTarget)\r\n        return true\r\n    end\r\n\r\n    local attackBehavior = BAI_CONFIG.attackBehavior or \"Active\"\r\n    if attackBehavior == \"Assist\" then\r\n        local assistTarget = PickAssistTarget()\r\n        if assistTarget ~= 0 then\r\n            AcceptCombatTarget(assistTarget, false, \"assist\")\r\n            returnToOwnerAfterCombat = false\r\n            StartChase(assistTarget)\r\n            return true\r\n        end\r\n        return false\r\n    end\r\n\r\n    if attackBehavior ~= \"Active\" then return false end\r\n\r\n    if BAI_CONFIG.pvpEnabled then\r\n        local pvpTarget, pvpAction, pvpJobId, pvpMaxDistance = FindPvpTarget()\r\n        if pvpTarget ~= 0 then\r\n            currentPvpAction = pvpAction\r\n            currentPvpJobId = pvpJobId\r\n            currentPvpMaxDistance = pvpMaxDistance\r\n            AcceptCombatTarget(pvpTarget, false, \"pvp\")\r\n            returnToOwnerAfterCombat = false\r\n            StartChase(pvpTarget)\r\n            return true\r\n        end\r\n    end\r\n\r\n    local enemy = PickNearestMonster()\r\n    if enemy ~= 0 then\r\n        AcceptCombatTarget(enemy, false, \"auto\")\r\n        returnToOwnerAfterCombat = false\r\n        StartChase(enemy)\r\n        return true\r\n    end\r\n\r\n    return false\r\nend\r\n\r\n-- ---------------- Manual command handling ----------------\r\n-- Direct clicks on players are delivered by RO as a normal MOVE command on many\r\n-- clients. When Party/Friends is enabled and PvP is disabled, let the Homunculus\r\n-- complete that move first. Once it has stopped, inspect the originally clicked\r\n-- cell. If a visible non-monster actor occupies that cell, use it as the friend\r\n-- target. Normal ground clicks remain normal MOVE commands.\r\nlocal function FindFriendActorAtMoveDestination()\r\n    if BAI_CONFIG.partyEnabled ~= true or BAI_CONFIG.pvpEnabled == true then return 0 end\r\n\r\n    local owner = GetV(V_OWNER, MyID)\r\n    local fallback = 0\r\n    for _, actor in ipairs(TickActors()) do\r\n        if actor ~= MyID and GetV(V_MOTION, actor) ~= MOTION_DEAD and IsMonster(actor) ~= 1 then\r\n            local ax, ay = GetV(V_POSITION, actor)\r\n            if ax == MyDestX and ay == MyDestY then\r\n                if actor == owner then return actor end\r\n                if fallback == 0 then fallback = actor end\r\n            end\r\n        end\r\n    end\r\n    return fallback\r\nend\r\n\r\nlocal function TryFriendActionAfterMove()\r\n    if not friendMoveProbePending then return false end\r\n    friendMoveProbePending = false\r\n\r\n    if BAI_CONFIG.partyEnabled ~= true or BAI_CONFIG.pvpEnabled == true then return false end\r\n\r\n    local actor = FindFriendActorAtMoveDestination()\r\n    if actor == 0 then return false end\r\n\r\n    local owner = GetV(V_OWNER, MyID)\r\n    if actor == owner then\r\n        return StartFriendShowcase()\r\n    end\r\n    return StartFriendToggle(actor)\r\nend\r\n\r\nlocal function OnMOVE_CMD(x, y)\r\n    Move(MyID, x, y)\r\n    MyDestX = x\r\n    MyDestY = y\r\n    MyEnemy = 0\r\n    MySkill = 0\r\n    friendMoveProbePending = BAI_CONFIG.partyEnabled == true and BAI_CONFIG.pvpEnabled ~= true\r\n    friendMoveProbeStarted = GetTick()\r\n    friendMoveProbeSawMovement = false\r\n    MyState = MOVE_CMD_ST\r\nend\r\n\r\nlocal function OnSTOP_CMD()\r\n    friendMoveProbePending = false\r\n    if GetV(V_MOTION, MyID) ~= MOTION_STAND then\r\n        local x, y = GetV(V_POSITION, MyID)\r\n        Move(MyID, x, y)\r\n    end\r\n    ResetAutoTarget()\r\n    MyState = IDLE_ST\r\nend\r\n\r\nlocal function OnATTACK_OBJECT_CMD(id)\r\n    if BAI_CONFIG.partyEnabled == true and BAI_CONFIG.pvpEnabled ~= true and id ~= nil and id ~= 0 and id ~= MyID and IsMonster(id) ~= 1 then\r\n        local owner = GetV(V_OWNER, MyID)\r\n        if id == owner then\r\n            if StartFriendShowcase() then return end\r\n        elseif StartFriendToggle(id) then\r\n            return\r\n        end\r\n    end\r\n\r\n    currentPvpAction = nil\r\n    currentPvpJobId = nil\r\n    currentPvpMaxDistance = nil\r\n    AcceptCombatTarget(id, true)\r\n    MySkill = 0\r\n    MyEnemy = id\r\n    currentTargetAttackStarted = false\r\n    MyState = CHASE_ST\r\nend\r\n\r\nlocal function OnATTACK_AREA_CMD(x, y)\r\n    Move(MyID, x, y)\r\n    MyDestX = x\r\n    MyDestY = y\r\n    MyEnemy = 0\r\n    MyState = ATTACK_AREA_CMD_ST\r\nend\r\n\r\nlocal function OnPATROL_CMD(x, y)\r\n    MyPatrolX, MyPatrolY = GetV(V_POSITION, MyID)\r\n    MyDestX = x\r\n    MyDestY = y\r\n    Move(MyID, x, y)\r\n    MyState = PATROL_CMD_ST\r\nend\r\n\r\nlocal function OnHOLD_CMD()\r\n    ResetAutoTarget()\r\n    MyState = HOLD_CMD_ST\r\nend\r\n\r\nlocal function OnSKILL_OBJECT_CMD(level, skill, id)\r\n    currentPvpAction = nil\r\n    currentPvpJobId = nil\r\n    currentPvpMaxDistance = nil\r\n    AcceptCombatTarget(id, true)\r\n    MySkillLevel = level\r\n    MySkill = skill\r\n    MyEnemy = id\r\n    currentTargetAttackStarted = false\r\n    MyState = CHASE_ST\r\nend\r\n\r\nlocal function OnSKILL_AREA_CMD(level, skill, x, y)\r\n    Move(MyID, x, y)\r\n    MyDestX = x\r\n    MyDestY = y\r\n    MySkillLevel = level\r\n    MySkill = skill\r\n    MyState = SKILL_AREA_CMD_ST\r\nend\r\n\r\nlocal function OnFOLLOW_CMD()\r\n    if BAI_ACTIVE_T == 1 then\r\n        BAI_ACTIVE_T = 2\r\n        BAI_CONFIG = BAI_T2_CONFIG\r\n    else\r\n        BAI_ACTIVE_T = 1\r\n        BAI_CONFIG = BAI_T1_CONFIG\r\n    end\r\n    -- T1/T2 are equal behavior slots; neither slot is implicitly passive.\r\n    BAI_Passive = false\r\n    ResetAutoTarget()\r\n    MyState = IDLE_ST\r\n    TraceAI(\"BAI: T\" .. tostring(BAI_ACTIVE_T) .. \" - \" .. tostring(BAI_CONFIG.modeName or \"\"))\r\n    -- Alt+T changes the slot but must not restart or bypass the one-time delay.\r\n    if not BaiTraffic.startupWaiting() then RunIdleMovement() end\r\nend\r\n\r\nlocal function ProcessCommand(msg)\r\n    BaiTraffic.manualCommand()\r\n    if msg[1] == MOVE_CMD then\r\n        OnMOVE_CMD(msg[2], msg[3])\r\n    elseif msg[1] == STOP_CMD then\r\n        OnSTOP_CMD()\r\n    elseif msg[1] == ATTACK_OBJECT_CMD then\r\n        OnATTACK_OBJECT_CMD(msg[2])\r\n    elseif msg[1] == ATTACK_AREA_CMD then\r\n        OnATTACK_AREA_CMD(msg[2], msg[3])\r\n    elseif msg[1] == PATROL_CMD then\r\n        OnPATROL_CMD(msg[2], msg[3])\r\n    elseif msg[1] == HOLD_CMD then\r\n        OnHOLD_CMD()\r\n    elseif msg[1] == SKILL_OBJECT_CMD then\r\n        OnSKILL_OBJECT_CMD(msg[2], msg[3], msg[4])\r\n    elseif msg[1] == SKILL_AREA_CMD then\r\n        OnSKILL_AREA_CMD(msg[2], msg[3], msg[4], msg[5])\r\n    elseif msg[1] == FOLLOW_CMD then\r\n        OnFOLLOW_CMD()\r\n    end\r\nend\r\n\r\n-- ---------------- Automatic states ----------------\r\nlocal function OnIDLE_ST()\r\n    if BAI_CONFIG.tankEnabled then\r\n        -- Priority 1: owner rescue is checked on every AI tick before anything else.\r\n        local rescue = PickTankOwnerThreat()\r\n        if rescue ~= 0 then\r\n            tankForceHoldAfterRescue = false\r\n            TankStart(rescue, \"TankRescue\")\r\n            return\r\n        end\r\n\r\n        if TankSupportSkill() then return end\r\n\r\n        if BaiTank.advancePull() then return end\r\n\r\n        -- After rescue aggro transfers to the Homu, go back to Tank position first.\r\n        if tankForceHoldAfterRescue then\r\n            if not TankAtHoldPosition() then\r\n                TankClearCombat()\r\n                MoveToTankHoldPosition()\r\n                return\r\n            end\r\n            tankForceHoldAfterRescue = false\r\n        end\r\n\r\n        -- Priority 2: pull a fresh monster. This is checked before bound combat.\r\n        local fresh = PickFreshTankTarget()\r\n        if fresh ~= 0 then\r\n            TankStart(fresh, \"TankFresh\")\r\n            return\r\n        end\r\n\r\n        -- All available mobs are already tanked. Regroup to the owner first.\r\n        if (TankHasBoundMonster() or TankHasAnyMonsterInArea()) and not TankAtHoldPosition() then\r\n            TankClearCombat()\r\n            MoveToTankHoldPosition()\r\n            return\r\n        end\r\n\r\n        -- At Tank position: continuously fight a bound mob if configured.\r\n        local bound = PickBoundTankTarget()\r\n        if bound ~= 0 then\r\n            TankStart(bound, \"TankBound\")\r\n            return\r\n        end\r\n\r\n        -- No usable monster remains: normal configured idle movement.\r\n        TankClearCombat()\r\n        if BaiTank.hasPending() then MoveToTankHoldPosition() else RunIdleMovement() end\r\n        return\r\n    end\r\n\r\n    -- After combat, return to the owner only while there is no valid target.\r\n    -- Keep scanning during the regroup: if a valid monster/player appears within\r\n    -- the configured combat limits, interrupt the return and fight it. When the\r\n    -- area is clear again, resume returning to the owner. Idle movement starts\r\n    -- only after the regroup has actually completed.\r\n    if returnToOwnerAfterCombat then\r\n        if TryContinueAfterDefeatedTarget() then return end\r\n        RunIdleMovement()\r\n        return\r\n    end\r\n\r\n    -- Already learned friends are still protected while PvP is active.\r\n    local defenseTarget = PickDefenseTarget()\r\n    if defenseTarget ~= 0 then\r\n        currentPvpAction = nil\r\n        currentPvpJobId = nil\r\n        currentPvpMaxDistance = nil\r\n        AcceptCombatTarget(defenseTarget, false, \"defense\")\r\n        StartChase(defenseTarget)\r\n        return\r\n    end\r\n\r\n    local reserved = List.popleft(ResCmdList)\r\n    if reserved ~= nil then\r\n        ProcessCommand(reserved)\r\n        return\r\n    end\r\n\r\n    local attackBehavior = BAI_CONFIG.attackBehavior or \"Active\"\r\n\r\n    if attackBehavior == \"Assist\" then\r\n        local assistTarget = PickAssistTarget()\r\n        if assistTarget ~= 0 then\r\n            AcceptCombatTarget(assistTarget, false, \"assist\")\r\n            StartChase(assistTarget)\r\n            return\r\n        end\r\n    end\r\n\r\n    if attackBehavior == \"Active\" and BAI_CONFIG.pvpEnabled then\r\n        local pvpTarget, pvpAction, pvpJobId, pvpMaxDistance = FindPvpTarget()\r\n        if pvpTarget ~= 0 then\r\n            currentPvpAction = pvpAction\r\n            currentPvpJobId = pvpJobId\r\n            currentPvpMaxDistance = pvpMaxDistance\r\n            AcceptCombatTarget(pvpTarget, false, \"pvp\")\r\n            StartChase(pvpTarget)\r\n            return\r\n        end\r\n    end\r\n\r\n    if OwnerIsMoving() then\r\n        -- While the player is moving, idle routes/wander/orbit pause. Only Active\r\n        -- may acquire fresh automatic targets, and only when explicitly enabled.\r\n        if attackBehavior ~= \"Active\" or not BAI_CONFIG.attackWhileOwnerMoving then\r\n            ResetAutoTarget()\r\n            FollowMovingOwner()\r\n            return\r\n        end\r\n\r\n        local movingRange = math.max(1, math.min(15, tonumber(BAI_CONFIG.attackWhileOwnerMovingRange) or 5))\r\n        local movingEnemy = PickNearestMonster(movingRange)\r\n        if movingEnemy ~= 0 then\r\n            AcceptCombatTarget(movingEnemy, false, \"auto\")\r\n            StartChase(movingEnemy)\r\n        else\r\n            FollowMovingOwner()\r\n        end\r\n        return\r\n    end\r\n\r\n    if attackBehavior == \"Active\" then\r\n        local enemy = PickNearestMonster()\r\n        if enemy ~= 0 then\r\n            AcceptCombatTarget(enemy, false, \"auto\")\r\n            StartChase(enemy)\r\n            return\r\n        end\r\n    end\r\n\r\n    RunIdleMovement()\r\nend\r\n\r\nlocal function OnCHASE_ST()\r\n    if BAI_CONFIG.tankEnabled then\r\n        -- Every Tank tick starts with owner rescue, even while chasing something else.\r\n        local rescue = PickTankOwnerThreat()\r\n        if rescue ~= 0 and (currentPvpAction ~= \"TankRescue\" or rescue ~= MyEnemy) then\r\n            tankForceHoldAfterRescue = false\r\n            TankStart(rescue, \"TankRescue\")\r\n            return\r\n        end\r\n\r\n        if TankSupportSkill() then return end\r\n\r\n        if BaiTank.advancePull() then return end\r\n\r\n        -- A new monster instantly interrupts bound combat.\r\n        if currentPvpAction == \"TankBound\" then\r\n            local fresh = PickFreshTankTarget()\r\n            if fresh ~= 0 then TankStart(fresh, \"TankFresh\"); return end\r\n        end\r\n\r\n        if MyEnemy == 0 or not TankValidMonster(MyEnemy) or IsOutOfSight(MyID, MyEnemy) then\r\n            TankClearCombat(); MyState = IDLE_ST\r\n            if not TankHasAnyMonsterInArea() then\r\n                tankForceHoldAfterRescue = false\r\n                RunIdleMovement()\r\n            end\r\n            return\r\n        end\r\n\r\n        local owner = GetV(V_OWNER, MyID)\r\n        local targetOfEnemy = GetV(V_TARGET, MyEnemy)\r\n\r\n        -- Fresh mob is complete only when server state says its aggro is on the Homu.\r\n        if currentPvpAction == \"TankFresh\" and targetOfEnemy == MyID then\r\n            TankClearCombat(); MyState = IDLE_ST; return\r\n        end\r\n\r\n        -- Rescue is complete once no protected owner/friend is the target. If the Homu got\r\n        -- aggro, force the Tank-position phase before normal tanking continues.\r\n        if currentPvpAction == \"TankRescue\" and not TankRescueVictim(targetOfEnemy) then\r\n            tankForceHoldAfterRescue = targetOfEnemy == MyID\r\n            TankClearCombat(); MyState = IDLE_ST\r\n            if tankForceHoldAfterRescue and not TankAtHoldPosition() then MoveToTankHoldPosition() end\r\n            return\r\n        end\r\n\r\n        -- Fresh/rescue targets may only be chased while they are inside Tank Area.\r\n        -- Bound mobs outside the area are never chased; hold near owner and let them come.\r\n        if not TankWithinArea(MyEnemy) then\r\n            TankClearCombat(); MyState = IDLE_ST\r\n            if TankHasBoundMonster() then MoveToTankHoldPosition() else RunIdleMovement() end\r\n            return\r\n        end\r\n\r\n        if currentPvpAction == \"TankBound\" and not TankAtHoldPosition() then\r\n            TankClearCombat(); MyState = IDLE_ST; MoveToTankHoldPosition(); return\r\n        end\r\n\r\n        -- Offensive Tank skills may be cast from their own skill range. Do this\r\n        -- before checking normal attack range so ranged skills such as Caprice do\r\n        -- not force the Homunculus to walk all the way up to the monster first.\r\n        local chaseMode = \"fresh\"\r\n        if currentPvpAction == \"TankRescue\" then chaseMode = \"rescue\" end\r\n        if currentPvpAction == \"TankBound\" then chaseMode = \"bound\" end\r\n        local allowChaseSkills = true\r\n        if chaseMode == \"bound\" then allowChaseSkills = BAI_CONFIG.tankUseSkillsOnBound == true end\r\n        if chaseMode == \"rescue\" then allowChaseSkills = BAI_CONFIG.tankUseSkillsForOwnerRescue ~= false end\r\n        if TankOffensiveSkill(MyEnemy, allowChaseSkills) then\r\n            currentTargetAttackStarted = true\r\n            return\r\n        end\r\n\r\n        if IsInAttackSight(MyID, MyEnemy) then MyState = ATTACK_ST; return end\r\n        local x, y = GetV(V_POSITION_APPLY_SKILLATTACKRANGE, MyEnemy, MySkill, MySkillLevel)\r\n        MyDestX, MyDestY = x, y\r\n        Move(MyID, x, y)\r\n        return\r\n    end\r\n\r\n    -- Defense and priority are resolved together in RunAiTick before skills.\r\n\r\n    -- Automatic monster targets are not permanently accepted. Re-check KS while\r\n    -- chasing/attacking so a target is released if another player engages it.\r\n    if currentPvpAction == nil and MyEnemy ~= 0 and IsMonster(MyEnemy) == 1 and\r\n       MyEnemy ~= manualCombatTarget and not IsMonsterFreeForUs(MyEnemy) then\r\n        ResetAutoTarget()\r\n        MyState = IDLE_ST\r\n        return\r\n    end\r\n\r\n    if MyEnemy ~= 0 and MyEnemy ~= manualCombatTarget and BeyondCombatDistance() then\r\n        ResetAutoTarget()\r\n        MyState = IDLE_ST\r\n        FollowMovingOwner()\r\n        return\r\n    end\r\n\r\n    if currentPvpAction ~= nil and not PvpTargetStillAllowed() then\r\n        ResetAutoTarget()\r\n        MyState = IDLE_ST\r\n        return\r\n    end\r\n\r\n    local ownerMoving = OwnerIsMoving()\r\n    local finishStartedFight = BAI_CONFIG.finishCurrentTargetWhileOwnerMoving and currentTargetAttackStarted\r\n\r\n    if MyEnemy ~= manualCombatTarget and ownerMoving and\r\n       ((BAI_Passive and not IsPassiveDefenseTarget(MyEnemy)) or\r\n        ((not BAI_CONFIG.attackWhileOwnerMoving) and not finishStartedFight)) then\r\n        ResetAutoTarget()\r\n        MyState = IDLE_ST\r\n        FollowMovingOwner()\r\n        return\r\n    end\r\n\r\n    if MyEnemy ~= manualCombatTarget and ownerMoving and BAI_CONFIG.attackWhileOwnerMoving and not finishStartedFight then\r\n        local owner = GetV(V_OWNER, MyID)\r\n        local movingRange = math.max(1, math.min(15, tonumber(BAI_CONFIG.attackWhileOwnerMovingRange) or 5))\r\n        local d = GetDistance2(owner, MyEnemy)\r\n        if d == -1 or d > movingRange then\r\n            ResetAutoTarget()\r\n            MyState = IDLE_ST\r\n            FollowMovingOwner()\r\n            return\r\n        end\r\n    end\r\n\r\n    if MyEnemy ~= 0 and GetV(V_MOTION, MyEnemy) == MOTION_DEAD then\r\n        ResetAutoTarget()\r\n        if TryContinueAfterDefeatedTarget() then return end\r\n        MyState = IDLE_ST\r\n        return\r\n    end\r\n\r\n    if MyEnemy == 0 or IsOutOfSight(MyID, MyEnemy) then\r\n        ResetAutoTarget()\r\n        MyState = IDLE_ST\r\n        return\r\n    end\r\n\r\n    -- Alt+T passive cancels only automatic combat. Manual attacks still work because\r\n    -- the user explicitly gave an ATTACK_OBJECT_CMD while passive.\r\n    if IsInAttackSight(MyID, MyEnemy) then\r\n        MyState = ATTACK_ST\r\n        return\r\n    end\r\n\r\n    local x, y = GetV(V_POSITION_APPLY_SKILLATTACKRANGE, MyEnemy, MySkill, MySkillLevel)\r\n    if MyDestX ~= x or MyDestY ~= y or GetV(V_MOTION, MyID) == MOTION_STAND then\r\n        MyDestX = x\r\n        MyDestY = y\r\n        Move(MyID, x, y)\r\n    end\r\nend\r\n\r\nlocal function OnATTACK_ST()\r\n    if BAI_CONFIG.tankEnabled then\r\n        -- Rescue check happens before every possible next attack command.\r\n        local rescue = PickTankOwnerThreat()\r\n        if rescue ~= 0 and (currentPvpAction ~= \"TankRescue\" or rescue ~= MyEnemy) then\r\n            tankForceHoldAfterRescue = false\r\n            TankStart(rescue, \"TankRescue\")\r\n            return\r\n        end\r\n\r\n        if TankSupportSkill() then return end\r\n\r\n        if BaiTank.advancePull() then return end\r\n\r\n        -- New mobs have priority over continuous attacks on already bound mobs.\r\n        if currentPvpAction == \"TankBound\" then\r\n            local fresh = PickFreshTankTarget()\r\n            if fresh ~= 0 then TankStart(fresh, \"TankFresh\"); return end\r\n        end\r\n\r\n        if MyEnemy == 0 or not TankValidMonster(MyEnemy) or IsOutOfSight(MyID, MyEnemy) then\r\n            TankClearCombat(); MyState = IDLE_ST\r\n            if not TankHasAnyMonsterInArea() then\r\n                tankForceHoldAfterRescue = false\r\n                RunIdleMovement()\r\n            end\r\n            return\r\n        end\r\n\r\n        local owner = GetV(V_OWNER, MyID)\r\n        local targetOfEnemy = GetV(V_TARGET, MyEnemy)\r\n\r\n        if currentPvpAction == \"TankFresh\" and targetOfEnemy == MyID then\r\n            TankClearCombat(); MyState = IDLE_ST; return\r\n        end\r\n\r\n        if currentPvpAction == \"TankRescue\" and not TankRescueVictim(targetOfEnemy) then\r\n            tankForceHoldAfterRescue = targetOfEnemy == MyID\r\n            TankClearCombat(); MyState = IDLE_ST\r\n            if tankForceHoldAfterRescue and not TankAtHoldPosition() then MoveToTankHoldPosition() end\r\n            return\r\n        end\r\n\r\n        if not TankWithinArea(MyEnemy) then\r\n            TankClearCombat(); MyState = IDLE_ST\r\n            if TankHasBoundMonster() then MoveToTankHoldPosition() else RunIdleMovement() end\r\n            return\r\n        end\r\n\r\n        if currentPvpAction == \"TankBound\" and not TankAtHoldPosition() then\r\n            TankClearCombat(); MyState = IDLE_ST; MoveToTankHoldPosition(); return\r\n        end\r\n\r\n        if not IsInAttackSight(MyID, MyEnemy) then MyState = CHASE_ST; return end\r\n\r\n        local mode = \"fresh\"\r\n        if currentPvpAction == \"TankRescue\" then mode = \"rescue\" end\r\n        if currentPvpAction == \"TankBound\" then mode = \"bound\" end\r\n\r\n        -- IMPORTANT: do NOT reset to IDLE after an issued attack. Staying in ATTACK_ST\r\n        -- lets Attack() be offered again on the next AI tick and therefore avoids an\r\n        -- artificial BAI delay on top of the Homunculus ASPD. The priority checks above\r\n        -- still run before every next attack.\r\n        if TankAttack(MyEnemy, mode) then currentTargetAttackStarted = true end\r\n        return\r\n    end\r\n\r\n    -- Defense and priority are resolved together in RunAiTick before skills.\r\n\r\n    -- Automatic monster targets are not permanently accepted. Re-check KS while\r\n    -- chasing/attacking so a target is released if another player engages it.\r\n    if currentPvpAction == nil and MyEnemy ~= 0 and IsMonster(MyEnemy) == 1 and\r\n       MyEnemy ~= manualCombatTarget and not IsMonsterFreeForUs(MyEnemy) then\r\n        ResetAutoTarget()\r\n        MyState = IDLE_ST\r\n        return\r\n    end\r\n\r\n    if MyEnemy ~= 0 and MyEnemy ~= manualCombatTarget and BeyondCombatDistance() then\r\n        ResetAutoTarget()\r\n        MyState = IDLE_ST\r\n        FollowMovingOwner()\r\n        return\r\n    end\r\n\r\n    if currentPvpAction ~= nil and not PvpTargetStillAllowed() then\r\n        ResetAutoTarget()\r\n        MyState = IDLE_ST\r\n        return\r\n    end\r\n\r\n    local ownerMoving = OwnerIsMoving()\r\n    local finishStartedFight = BAI_CONFIG.finishCurrentTargetWhileOwnerMoving and currentTargetAttackStarted\r\n\r\n    if MyEnemy ~= manualCombatTarget and ownerMoving and\r\n       ((BAI_Passive and not IsPassiveDefenseTarget(MyEnemy)) or\r\n        ((not BAI_CONFIG.attackWhileOwnerMoving) and not finishStartedFight)) then\r\n        ResetAutoTarget()\r\n        MyState = IDLE_ST\r\n        FollowMovingOwner()\r\n        return\r\n    end\r\n\r\n    if MyEnemy ~= manualCombatTarget and ownerMoving and BAI_CONFIG.attackWhileOwnerMoving and not finishStartedFight then\r\n        local owner = GetV(V_OWNER, MyID)\r\n        local movingRange = math.max(1, math.min(15, tonumber(BAI_CONFIG.attackWhileOwnerMovingRange) or 5))\r\n        local d = GetDistance2(owner, MyEnemy)\r\n        if d == -1 or d > movingRange then\r\n            ResetAutoTarget()\r\n            MyState = IDLE_ST\r\n            FollowMovingOwner()\r\n            return\r\n        end\r\n    end\r\n\r\n    if MyEnemy ~= 0 and GetV(V_MOTION, MyEnemy) == MOTION_DEAD then\r\n        ResetAutoTarget()\r\n        if TryContinueAfterDefeatedTarget() then return end\r\n        MyState = IDLE_ST\r\n        return\r\n    end\r\n\r\n    if MyEnemy == 0 or IsOutOfSight(MyID, MyEnemy) then\r\n        ResetAutoTarget()\r\n        MyState = IDLE_ST\r\n        return\r\n    end\r\n\r\n    if not IsInAttackSight(MyID, MyEnemy) then\r\n        MyState = CHASE_ST\r\n        return\r\n    end\r\n\r\n    if MySkill == 0 then\r\n        local monsterAction = nil\r\n        if currentPvpAction == nil and MyEnemy ~= 0 and IsMonster(MyEnemy) == 1 then monsterAction = select(1, CurrentMonsterAction(MyEnemy)) end\r\n        if currentPvpAction == \"SkillsOnly\" or monsterAction == \"SkillsOnly\" then\r\n            -- PvP class rule explicitly forbids normal attacks.\r\n            -- Automatic PvP skills are evaluated in AI() before state processing.\r\n            return\r\n        end\r\n        if AttackWithDance(MyEnemy) then currentTargetAttackStarted = true end\r\n    else\r\n        if SkillsAllowedByOwnerDistance() then\r\n            local castLevel = MySkillLevel\r\n            if currentPvpAction == nil and MyEnemy ~= 0 and IsMonster(MyEnemy) == 1 and MyEnemy ~= manualCombatTarget then\r\n                castLevel = EffectiveMonsterSkillLevel(MyEnemy, castLevel)\r\n                MySkillLevel = castLevel\r\n            end\r\n            ResetAttackDance()\r\n            BaiTraffic.explicitSkill = MyEnemy == manualCombatTarget\r\n            local _, issued = SkillObject(MyID, castLevel, MySkill, MyEnemy)\r\n            if not issued then return end\r\n            currentTargetAttackStarted = true\r\n        else\r\n            if AttackWithDance(MyEnemy) then currentTargetAttackStarted = true end\r\n        end\r\n        MySkill = 0\r\n    end\r\nend\r\n\r\nlocal function OnMOVE_CMD_ST()\r\n    local x, y = GetV(V_POSITION, MyID)\r\n    local motion = GetV(V_MOTION, MyID)\r\n\r\n    if friendMoveProbePending then\r\n        if motion ~= MOTION_STAND then friendMoveProbeSawMovement = true end\r\n\r\n        -- A player occupies the clicked cell, so the Homunculus usually stops on\r\n        -- the adjacent cell and can never satisfy x==MyDestX/y==MyDestY. Wait until\r\n        -- movement has actually happened and stopped. The small fallback delay also\r\n        -- covers the case where the Homunculus was already directly beside the target.\r\n        local settled = motion == MOTION_STAND and (friendMoveProbeSawMovement or (GetTick() - friendMoveProbeStarted) >= 700)\r\n        if settled then\r\n            if TryFriendActionAfterMove() then return end\r\n            MyState = IDLE_ST\r\n            return\r\n        end\r\n    end\r\n\r\n    if x == MyDestX and y == MyDestY then\r\n        friendMoveProbePending = false\r\n        MyState = IDLE_ST\r\n    end\r\nend\r\n\r\nlocal function OnATTACK_AREA_CMD_ST()\r\n    local x, y = GetV(V_POSITION, MyID)\r\n    if x == MyDestX and y == MyDestY then MyState = IDLE_ST end\r\nend\r\n\r\nlocal function OnPATROL_CMD_ST()\r\n    local x, y = GetV(V_POSITION, MyID)\r\n    if x == MyDestX and y == MyDestY then\r\n        MyDestX, MyPatrolX = MyPatrolX, x\r\n        MyDestY, MyPatrolY = MyPatrolY, y\r\n        Move(MyID, MyDestX, MyDestY)\r\n    end\r\nend\r\n\r\nlocal function OnHOLD_CMD_ST()\r\n    -- HOLD remains a manual command. Do not perform autonomous movement here.\r\nend\r\n\r\nlocal function OnSKILL_AREA_CMD_ST()\r\n    local x, y = GetV(V_POSITION, MyID)\r\n    if GetDistance(x, y, MyDestX, MyDestY) <= GetV(V_SKILLATTACKRANGE_LEVEL, MyID, MySkill, MySkillLevel) then\r\n        BaiTraffic.explicitSkill = true\r\n        local _, issued = SkillGround(MyID, MySkillLevel, MySkill, MyDestX, MyDestY)\r\n        if not issued then return end\r\n        MyState = IDLE_ST\r\n        MySkill = 0\r\n    end\r\nend\r\n\r\n-- v14 opt-in output limiter. No packets are inspected; these are client API calls.\r\n-- Keep the v13 level meanings; the added fine presets do not reinterpret saved profiles.\r\n-- Skills commit their existing timers ONLY after an actual client API call.\r\nfunction BaiTraffic.level()\r\n    return math.max(0, math.min(6, math.floor(tonumber(BAI_CONFIG.lagReductionLevel) or 0)))\r\nend\r\nfunction BaiTraffic.interval()\r\n    local levels = { [0]=0, [1]=100, [2]=200, [3]=400, [4]=1, [5]=10, [6]=50 }\r\n    return levels[BaiTraffic.level()]\r\nend\r\nfunction BaiTraffic.preserveAttacks()\r\n    -- Missing field in an older profile defaults to the new normal-attack protection.\r\n    return BAI_CONFIG.lagReductionPreserveNormalAttacks ~= false\r\nend\r\nfunction BaiTraffic.drop(key)\r\n    if BaiTraffic[key] then\r\n        BaiTraffic.suppressed = (BaiTraffic.suppressed or 0) + 1\r\n        BaiTraffic[key] = nil\r\n    end\r\nend\r\nfunction BaiTraffic.cancel(resetRate)\r\n    BaiTraffic.drop(\"move\")\r\n    BaiTraffic.drop(\"attack\")\r\n    if resetRate then\r\n        BaiTraffic.lastOutput, BaiTraffic.lastMove, BaiTraffic.lastAttack = nil, nil, nil\r\n        BaiTraffic.followPath = nil\r\n    end\r\nend\r\nfunction BaiTraffic.startupWaiting()\r\n    if BaiTraffic.startDone then return false end\r\n    if BaiTraffic.startAt == nil then return false end\r\n    local elapsed = GetTick() - BaiTraffic.startAt\r\n    if elapsed < 0 or elapsed >= BaiTraffic.startDelay then\r\n        BaiTraffic.startDone = true\r\n        return false\r\n    end\r\n    return true\r\nend\r\nfunction BaiTraffic.begin(myid)\r\n    local now = GetTick()\r\n    if BaiTraffic.startAt == nil then\r\n        BaiTraffic.startAt = now\r\n        BaiTraffic.startDelay = math.max(0, math.min(10000, tonumber(BAI_CONFIG.aiStartDelayMs) or 0))\r\n        BaiTraffic.startDone = BaiTraffic.startDelay == 0\r\n    end\r\n    if BaiTraffic.config ~= BAI_CONFIG or BaiTraffic.id ~= myid or\r\n       (BaiTraffic.lastTick ~= nil and now < BaiTraffic.lastTick) then\r\n        BaiTraffic.cancel(true)\r\n    end\r\n    BaiTraffic.config, BaiTraffic.id, BaiTraffic.lastTick = BAI_CONFIG, myid, now\r\n    BaiTraffic.manual, BaiTraffic.skillThisTick = false, false\r\nend\r\nfunction BaiTraffic.manualCommand()\r\n    BaiSnipe.cancel(\"MANUAL_COMMAND\")\r\n    -- Explicit commands invalidate unsent automatic work, even at the same coordinates.\r\n    BaiTraffic.cancel(true)\r\n    BaiTraffic.manual = true\r\n    BaiTank.pulls={}; BaiTank.wait=nil\r\nend\r\nfunction BaiTraffic.ready()\r\n    local now = GetTick()\r\n    return not BaiTraffic.skillThisTick and (BaiTraffic.lastOutput == nil or\r\n        now < BaiTraffic.lastOutput or now - BaiTraffic.lastOutput >= BaiTraffic.interval())\r\nend\r\n-- Follow geometry follows AzzyAI 1.56 BetterMoveToOwnerXY: clamp each axis\r\n-- to the owner's configured near-cell neighbourhood. Implemented here inside BAI's existing\r\n-- command pipeline, so manual commands, startup delay and Lag Reduction still apply.\r\n-- This is a BAI adaptation, not a replacement of the combat/idle state machine.\r\nfunction BaiTraffic.prepareOwnerMove(myid, arrivalDistance, targetDistance, followMode)\r\n    local owner = GetV(V_OWNER, myid)\r\n    if owner == nil or owner == 0 then\r\n        BaiTraffic.followPath = nil\r\n        return nil, \"NO_OWNER\"\r\n    end\r\n    local now = GetTick()\r\n    local ox, oy = GetV(V_POSITION, owner)\r\n    local mx, my = GetV(V_POSITION, myid)\r\n    local valid = type(ox) == \"number\" and type(oy) == \"number\" and\r\n        type(mx) == \"number\" and type(my) == \"number\" and ox >= 0 and oy >= 0 and mx >= 0 and my >= 0\r\n    local followX,followY=nil,nil\r\n    if (followMode==\"moving\" or followMode==\"stopped\") and valid then\r\n        -- Resolve both heading and target at output time so lag queues cannot\r\n        -- send an old direction after a turn or continue the path after a stop.\r\n        local moving=OwnerIsMoving()\r\n        followX,followY=BaiTraffic.followTarget(owner,ox,oy,now,moving)\r\n        targetDistance=math.abs(BaiTraffic.followDistance(moving))\r\n        arrivalDistance=targetDistance+(moving and 1 or 0)\r\n    end\r\n    if valid and ((followX and mx==followX and my==followY) or\r\n       (not followX and (arrivalDistance or 0)>0 and math.max(math.abs(mx-ox),math.abs(my-oy))<=arrivalDistance)) then\r\n        -- A previously issued directional path may still run past a stopped owner.\r\n        -- Cancel that destination once when already within the desired radius.\r\n        local previous=BaiTraffic.followPath\r\n        if previous and previous.directedFollow and previous.id==myid and previous.owner==owner and\r\n           (previous.args[2]~=mx or previous.args[3]~=my) and GetV(V_MOTION,myid)==MOTION_MOVE then\r\n            return {id=myid,owner=owner,config=BAI_CONFIG,at=now,x=ox,y=oy,valid=true,\r\n                kind=\"Move\",args={myid,mx,my},tries=0,history={}}, \"DIRECTED_STOP\"\r\n        end\r\n        BaiTraffic.followPath = nil\r\n        return nil, \"ARRIVED\"\r\n    end\r\n    local previous = BaiTraffic.followPath\r\n    if previous and
