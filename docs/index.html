rofilo {0}","Name for {0}":"Nome di {0}","{0} is ready to download.":"{0} è pronto da scaricare.","Up to date: Lua {0}.":"Aggiornato: Lua {0}.","Update check unavailable: {0}":"Controllo aggiornamenti non disponibile: {0}","Import failed: {0}":"Importazione fallita: {0}","Unavailable ({0})":"Non disponibile ({0})","{0} results":"{0} risultati","{0} results · first 20 shown":"{0} risultati · primi 20 mostrati","Applies to the selected profile and T mode. Changes are saved automatically in this browser.":"Vale per il profilo e il modo T selezionati. Le modifiche vengono salvate automaticamente in questo browser.","This mode is for {0}. Please select that homunculus first.":"Questo modo è per {0}. Seleziona prima quell’omuncolo.","Enable Attack Dance Mini":"Attiva Attack Dance Mini","Attack Dance Mini requires AI.lua from this web version. Download both AI.lua and BAI_Config.lua again.":"Attack Dance Mini richiede il file AI.lua di questa versione web. Scarica di nuovo AI.lua e BAI_Config.lua insieme."},"help":{"attackBehavior":"Attivo cerca automaticamente i mostri. Passivo non cerca bersagli normali, ma permette comandi manuali. Assistenza aiuta contro il bersaglio del proprietario. La difesa attivata separatamente resta valida. Il nome del modo T non determina il comportamento.","attackDance":"L’omuncolo si muove tra gli attacchi, aumentando leggermente la velocità di attacco.","attackGeneral":"Controlla la selezione automatica normale e le distanze. Le schede vicine contengono abilità e regole dei mostri. La protezione si imposta in Difesa; Tank e PvP hanno regole proprie.","combatDistance":"Distanza dal proprietario in caselle. I nuovi bersagli automatici devono rientrare nel limite. Se si allontana troppo nel combattimento normale, abbandona il bersaglio e segue il proprietario. Bersagli manuali e Tank hanno regole separate.","defaultMonsterAction":"Per mostri senza regola: Solo abilità disattiva gli attacchi normali; Nessuna abilità permette solo attacchi normali; Entrambi permette tutti e due; Niente li ignora automaticamente.","defense":"La difesa rispetta la priorità dei mostri. Solo la deroga del proprietario può prevalere; è disattivata per impostazione predefinita. L’autodifesa agisce senza bersagli idonei più prioritari. Protezione e assistenza agli amici hanno regole proprie.","finishFight":"Non segue subito il proprietario: continua il combattimento iniziato entro la distanza impostata.","healHpTarget":"Sceglie gli HP che attivano l’abilità. Solo omuncolo ignora gli HP del proprietario. Uno dei due si attiva quando viene superata una soglia HP abilitata.","idleInterval":"Intervallo in millisecondi delle decisioni di movimento per Vagare, Orbita e Percorso. 1000 ms = un secondo. Non è la frequenza generale dell’AI né un ritardo di attacco.","idleMode":"Fuori combattimento: Vagare è casuale; Orbita gira intorno al proprietario; Percorso segue i punti. In questa versione, Fermo e Segui proprietario si comportano quasi allo stesso modo e tengono l’omuncolo vicino.","idleRadius":"Raggio per Vagare e Orbita. Percorso usa i propri punti. Le distanze di seguito in movimento e da fermo sono separate. Non è il raggio di attacco automatico.","killSteal":"Evita di intervenire nei combattimenti altrui. Attacca solo mostri liberi o già in lotta con te, il tuo omuncolo o un giocatore della sua lista amici.","lagReduction":"Intervallo minimo in millisecondi tra i comandi automatici limitati. Riduce i comandi inviati, ma può rallentare la risposta.","modeTransfer":"Esporta questo modo T per salvarlo o condividerlo. L’importazione sostituisce le impostazioni del modo T selezionato.","monsterBehavior":"Non attaccare esclude il mostro dalla selezione normale. Nessuna abilità: solo attacchi normali. Solo abilità: nessun colpo normale. Normale + abilità: entrambi. I limiti riguardano l’offensiva; cure, potenziamenti, difesa ed emergenza mantengono le proprie condizioni.","monsterLevel":"Sostituisce il livello offensivo generale contro questo mostro, inclusi livello 1 e selezione Automatica. Usa livelli appresi. Cure, potenziamenti e difesa mantengono i propri livelli.","monsterRules":"Le regole riguardano solo la voce selezionata. Senza regola: abilità generali e priorità 5. Cerca per nome, ID AI o MidgardHub; se i numeri coincidono, scegli il nome corretto. I simboli i spiegano le colonne.","monsterSkill":"Automatica usa le regole offensive generali abilitate. Scegliere un’abilità limita l’offensiva contro questo mostro. Deve essere appresa e attivata in Abilità. Soglia SP e intervallo restano validi. Cure e potenziamenti non sono limitati a questa abilità.","moveAttack":"Permette nuovi attacchi mentre il proprietario si muove. Se disattivato, lo segue senza iniziare nuovi combattimenti.","moveRange":"Distanza massima in caselle tra un nuovo bersaglio e il proprietario in movimento. Resta valido il limite generale di combattimento.","normalPlants":"Esclude piante normali come Green Plant dalla selezione automatica normale.","onlyMonsterRules":"Questa abilità offensiva viene usata solo se la regola del mostro la seleziona esattamente. Automatica non vale come autorizzazione esplicita.","overview":"Mostra il modo selezionato. T1 e T2 sono configurabili, senza ruoli Attivo/Passivo fissi. Solo le opzioni esplicitamente condivise valgono per entrambi. Salva conserva il profilo; Installa genera UserAI per il gioco.","overviewPvp":"Attiva PvP. Quando è attivo non puoi aggiungere o rimuovere giocatori dalla lista amici.","overviewTank":"Attiva Tank. Configura comportamento e abilità nella pagina Tank.","ownerPriority":"Se entrambi sono attaccati con pari priorità, preferisce proteggere il proprietario. Se disattivato, decide la distanza. Una priorità superiore prevale comunque. La deroga separata del proprietario può prevalere sulla priorità.","party":"Alt + clic destro su un giocatore lo aggiunge agli amici; ripetere lo rimuove. L’omuncolo lo raggiunge e gli gira intorno. Alt + clic destro sul tuo personaggio fa visitare gli amici salvati vicini. Il PvP deve essere disattivato per modificare la lista.","partyAssist":"Considera i bersagli degli amici conosciuti. Richiede lista amici attiva e comportamento Assistenza per l’assistenza normale.","partyProtect":"Protegge i giocatori nella lista salvata. Richiede gruppo/amici attivo. Non riconosce automaticamente i membri del gruppo non salvati.","preserveNormalAttacks":"Esclude gli attacchi normali dal ritardo aggiuntivo per mantenere al meglio la velocità normale (ASPD).","priority":"1 è la priorità massima; 10 la minima. Senza regola: 5. La selezione iniziale risolve le parità con la distanza. Cambiare in combattimento richiede Interrompi bersaglio sul nuovo mostro.","protectOwner":"Reagisce ai mostri idonei che attaccano il tuo personaggio. Senza deroga del proprietario rispetta la priorità. Può agire senza ricerca attiva normale. Restano valide protezione e distanze.","protectSelf":"Reagisce agli aggressori dell’omuncolo senza sostituire bersagli idonei più prioritari. Lasciare un bersaglio difensivo richiede le caselle di interruzione. Può riprendere dopo la sconfitta del bersaglio prioritario.","route":"Fino a 30 punti nella griglia 15×15, seguiti in ordine quando il proprietario è fermo. P indica il proprietario; un altro clic rimuove un punto. I quattro angoli X sono bloccati. Cancella percorso svuota la lista.","routeTimeout":"Se un punto non viene raggiunto entro questo tempo in millisecondi, passa al successivo. Utile per gli ostacoli, senza garantire di trovare un cammino. Solo Percorso.","routeTolerance":"Distanza in caselle per considerare raggiunto un punto. 0 richiede la casella esatta; valori maggiori tollerano piccoli scarti. Solo Percorso.","sharedLag":"Mantiene uguali l’intervallo lag e l’esenzione degli attacchi normali in T1 e T2. Le modifiche valgono per entrambi finché l’opzione è attiva.","skillDistance":"Distanza massima dell’omuncolo dal proprietario in caselle per abilità automatiche normali. Non è la portata verso il mostro. Anche cure e supporto automatici possono attendere fuori dal limite.","skillFields":"Attivato abilita la regola. Livello: solo appreso. SP minimi è assoluto, non percentuale. Intervallo: minimo tra comandi; devono permetterlo anche disponibilità, HP e pausa globale. HP sotto % attiva sotto la soglia. 0 disattiva quel criterio HP, non SP.","skillPause":"Intervallo minimo aggiuntivo tra comandi di abilità automatiche normali, in secondi. Vale insieme all’intervallo di ogni regola. 0 disattiva questa pausa, non i tempi imposti dal gioco.","skills":"Aggiungi regole per abilità apprese: livello, SP minimi e intervallo. Sono possibili più regole per abilità. I criteri HP riguardano cure/protezione. Le regole dei mostri possono limitare scelta e livello offensivi.","skillsEnabled":"Attiva o disattiva insieme le regole normali delle abilità. Ogni regola deve anche essere attiva. Tank e PvP hanno liste e controlli propri.","startupDelay":"Attesa in millisecondi dopo il caricamento dell’AI prima delle azioni automatiche. Dopo cambio mappa o teletrasporto vale se il client ricarica l’AI. 0 ms la disattiva.","summonedPlants":"Esclude piante evocate da un Alchemist dalla selezione automatica normale.","tankArea":"Raggio di selezione intorno al proprietario in caselle. Anche il soccorso è limitato all’area. Non è la distanza desiderata di mantenimento.","tankBound":"Combatte mostri già concentrati sull’omuncolo senza nuovi bersagli o soccorsi in attesa. I nuovi bersagli idonei restano prioritari.","tankBoundSkills":"Permette abilità offensive contro mostri già concentrati sull’omuncolo. Livelli, SP e intervalli Tank restano validi. Cure e supporto mantengono le proprie condizioni.","tankDistance":"Distanza desiderata dal proprietario dopo aver raccolto i mostri, in caselle. Quando sono tutti concentrati sull’omuncolo, torna entro questa distanza e segue il proprietario se si allontana. Area Tank è separata.","tankExclusions":"Esclude mostri da Tank. Cerca per nome o ID e aggiungi la voce corretta. Usa consapevolmente gli ID personalizzati: gli ID noti sono convertiti nell’esportazione; numeri uguali non indicano sempre lo stesso mostro.","tankMode":"Attira prima i nuovi mostri idonei nell’area, torna alla distanza Tank e può combattere quelli già concentrati su di sé. Nuovi bersagli e soccorso hanno priorità. Sostituisce il combattimento normale e disattiva PvP. Abilità ed esclusioni si impostano qui. Tenta prima una sola attrazione; dopo un breve controllo dell’esecuzione passa al successivo. Un’abilità a distanza non provoca subito un inseguimento in mischia. Senza aggro riprova più tardi. Un comando inviato non conferma un colpo.","tankNormal":"Permette attacchi normali in Tank anche senza abilità offensive pronte. Senza di essi, attirare aggro dipende dalle abilità disponibili.","tankPlants":"Esclude le piante normali e i funghi indicati da Tank. Indipendente da Attacco normale.","tankRescue":"Permette abilità offensive per attirare un aggressore del proprietario. Se disattivato, usa attacchi normali. Restano valide area, esclusioni e protezione.","tankSkillFields":"Livello appreso; SP minimi assoluti; intervallo in secondi prima della ripetizione. HP sotto % appare per cure/protezione. Controlla HP di sceglie la salute osservata, non necessariamente il bersaglio curato: Chaotic Blessings è casuale nel gioco.","tankSkills":"Lista esclusiva di Tank. Regole PvE normali e livelli offensivi per mostro non la controllano. Usa abilità e livelli appresi. L’offensiva rispetta anche gli SP generali Tank; cure/protezione usano i propri intervalli e HP.","tankSp":"SP minimi aggiuntivi assoluti per l’offensiva Tank. Vale anche la soglia di ogni regola. Con SP bassi può subentrare un attacco normale, se abilitato.","tankSummoned":"Esclude le piante evocate indicate da Tank. Indipendente da Attacco normale.","targetSwitching":"Entrambe le caselle riguardano il NUOVO mostro. Interrompi bersaglio richiede un numero di priorità inferiore; pari non basta. Anche bersagli manuali permette di sostituire un bersaglio manuale. Controllato durante inseguimento e attacco, anche a distanza. L’autodifesa non blocca; proteggere il proprietario blocca solo con la deroga attiva in Difesa. Restano validi amici, assistenza/PvP, distanze, protezione dal furto ed esclusioni. Sniper mantiene la finestra limitata di conferma.","ownerDefenseOverridesPriority":"Disattivato per impostazione predefinita; solo per aggressori del tuo personaggio. Attivo: difendere il proprietario prevale sulla priorità. Disattivo: può combattere prima un mostro idoneo più prioritario. Il cambio in combattimento richiede le caselle di interruzione. L’autodifesa non riceve mai questa deroga. Richiede protezione del proprietario; salvato per modo T.","followMovingDistance":"Positivi: dietro al giocatore, es. +14 = 14 caselle dietro. 0: la sua posizione. Negativi: davanti, es. −3 = 3 davanti. Direzione del movimento recente; ruotare da fermo non è rilevabile. Senza direzione recente segue normalmente alla distanza assoluta. Da fermo vale la distanza separata. Posizione desiderata, non distanza garantita: velocità, ostacoli e client possono cambiarla. Modo T selezionato.","followStoppedDistance":"Positivi: dietro; negativi: davanti; 0: sul giocatore. Mantiene l’ultima direzione; le rotazioni da fermo non sono rilevate. Movimento −3/fermo −3 mantiene tre caselle davanti; −5/−2 avvicina a due. Senza direzione nota usa il valore assoluto come distanza normale sul lato attuale. Vagare, orbita o percorso riprendono all’arrivo. Combattimento, distanza Tank e comandi manuali restano validi.","tankAggroRetry":"Attesa prima di riprovare un mostro ancora non concentrato sull’omuncolo. Predefinito 1800 ms. Preferisce altri mostri nuovi nel frattempo. Il controllo dell’esecuzione può aumentare l’attesa reale. Il soccorso è controllato separatamente e ritentato prima.","castling":"Soglia HP: 0 disattiva i criteri di perdita/bersaglio. Una perdita HP non conferma un colpo; le cure tra cicli AI possono nasconderla. Restano validi intervallo e SP minimi.","attackDanceMini":"Invia i comandi di movimento alla casella attuale dell’homunculus anziché a una casella vicina. Solo una variante di Attack Dance può essere attiva per modalità T. Come la versione classica, funziona solo con riduzione del lag disattivata, minima (1 ms) o leggera (10 ms). Sperimentale: una maggiore velocità di attacco non è ancora stata confermata nel gioco. Scarica di nuovo AI.lua e BAI_Config.lua da Installa."}}};
const UI_EN = {"Protokoll kann gerade nicht gelesen werden: ":"Cannot read log right now: ","Ansicht leeren":"Clear view","v-Betas konnten nicht geladen werden: ":"Could not load v-betas: ","Nur aktuelles Ziel":"Current target only","Nur Spielchat (TraceValue)":"Game chat only (TraceValue)","Ausgewählte v-Beta installieren":"Install selected v-beta","v-Betas laden":"Load v-betas","v-Betas werden geladen …":"Loading v-betas …","Monster-IDs werden im Spiel ausgegeben. Zum Mitlesen hier zusätzlich TraceAI oder BAI_Debug.log aktivieren.":"Monster IDs are displayed in-game. To read a log here, also enable TraceAI or BAI_Debug.log.","Monster in der Nähe":"Nearby monsters","Noch kein Protokoll. USER_AI-Ordner wählen, Diagnose aktivieren, installieren und die AI neu laden. Für TraceAI zusätzlich /traceai einschalten.":"No log yet. Select USER_AI, enable diagnostics, install and reload the AI. Also enable /traceai for TraceAI output.","Keine gültigen v-Beta-Releases gefunden.":"No valid v-beta releases found.","Aktualisieren":"Refresh","USER_AI-Ordner fehlt":"USER_AI folder missing","Sichtbare Monster":"Visible monsters","Aktiv: sucht selbstständig gültige Monster.\nPassiv: keine normale automatische Zielsuche; manuelle Befehle\nbleiben möglich. Assistieren: unterstützt das Ziel des Besitzers.\nSeparat aktivierte Verteidigung bleibt möglich. Der Name eines\nT-Modus (z. B. Passive) legt das Angriffsverhalten nicht fest.":"Active: searches for eligible monsters automatically.\nPassive: no normal automatic target search; manual commands\nremain available. Assist: helps against the owner's target.\nSeparately enabled defense can still apply. A T mode name\n(such as Passive) does not determine its attack behavior.","Dein Homunculus bewegt sich zwischen den Angriffen. Dadurch kann er etwas schneller angreifen.":"Your Homunculus moves between attacks, which can slightly increase its attack speed.","Diese Seite legt die normale automatische Zielsuche und ihre\nEntfernungsgrenzen fest. Skills und Monsterregeln stehen in den\nNachbarreitern. Schutzregeln sind separat unter Verteidigung;\nTank und PvP verwenden ihre eigenen Kampfregeln.":"This page controls normal automatic targeting and distance limits.\nUse the neighboring tabs for skills and monster rules.\nProtection is configured separately under Defense;\nTank and PvP use their own combat rules.","Entfernung in Feldern vom Besitzer. Neue automatische Ziele\nmüssen innerhalb dieser Grenze liegen. Entfernt sich der Homunculus\nim normalen automatischen Kampf zu weit, wird das Ziel freigegeben\nund zum Besitzer zurückgekehrt. Manuelle Ziele und Tank haben\neigene Regeln.":"Distance in cells from the owner. New automatic targets must be\ninside this limit. If the Homunculus moves too far away during\nnormal automatic combat, the target is released and it follows\nthe owner. Manual targets and Tank have separate rules.","Bestimmt das Verhalten gegen Monster ohne eigene Monster-Regel.\nNur Skills verhindert normale Angriffe, Keine Skills erlaubt nur normale Angriffe,\nBeides erlaubt beides und Gar nichts ignoriert solche Monster automatisch.":"Controls monsters without their own Monster Rule.\nSkills only disables normal attacks, No skills allows only normal attacks,\nBoth allows both, and Nothing ignores those monsters automatically.","Spieler- und Selbstverteidigung beachten die Monster-Priorität.\nNur der zusätzliche Spieler-Vorrang kann sie überstimmen;\ndieser ist standardmäßig aus. Selbstverteidigung greift, wenn\nkein höher priorisiertes zulässiges Ziel ansteht.\nFreundes-Verteidigung und Assistenz behalten ihre eigenen Regeln.":"Owner and self-defense respect monster priority.\nOnly the additional owner override can take precedence;\nit is off by default. Self-defense applies when no eligible\nhigher-priority target takes precedence.\nFriend protection and assistance keep their separate rules.","Der Homunculus folgt dem Spieler nicht sofort, sondern führt einen bereits\nbegonnenen Kampf bis zur eingestellten Kampfentfernung weiter.":"The Homunculus does not follow the owner immediately; an already started\nfight continues up to the configured combat distance.","Legt fest, wessen HP diesen Heil-/Spezialskill auslösen.\nNur Homunculus ignoriert die Spieler-HP vollständig.\nEiner von beiden löst aus, sobald eine aktivierte HP-Grenze unterschritten wird.":"Chooses whose HP triggers this healing/special skill.\nHomunculus only completely ignores the owner's HP.\nEither one triggers when an enabled HP threshold is crossed.","Zeitabstand in Millisekunden für Leerlauf-Bewegungsentscheidungen\nbei Wander, Orbit und Route. 1000 ms sind eine Sekunde.\nKein allgemeiner AI-Takt und keine Angriffspause.":"Interval in milliseconds for idle movement decisions in\nWander, Orbit and Route. 1000 ms is one second.\nThis is not the overall AI tick rate or an attack delay.","Bewegungsverhalten außerhalb eines Kampfes. Wander bewegt sich zufällig,\nOrbit läuft um den Spieler und Route folgt den gesetzten Rasterpunkten.\nStill und Follow Owner verhalten sich im aktuellen Stand praktisch gleich und halten das Homu beim Spieler.":"Movement outside combat. Wander moves randomly, Orbit circles the owner,\nand Route follows the selected grid points.\nIn the current build, Still and Follow Owner behave practically the same and keep the Homunculus near the owner.","Radius in Feldern um den Spieler für Wander und Orbit.\nDie Route verwendet ihre eigenen Rasterpunkte.\nDie Abstände beim Folgen und nach dem Anhalten werden getrennt eingestellt.\nDas ist keine Reichweite für automatische Angriffe.":"Radius around the owner for Wander and Orbit.\nRoute uses its own grid points.\nMoving and stopped follow distances are configured separately.\nThis is not an automatic attack range.","Verhindert, dass dein Homunculus automatisch in fremde Kämpfe eingreift. Er greift nur Monster an, die frei sind oder bereits gegen dich, deinen Homunculus oder einen Spieler aus seiner Freundesliste kämpfen.":"Prevents your Homunculus from automatically interfering in other players' fights. It only attacks monsters that are free or already fighting you, your Homunculus or a player on its friend list.","Legt einen Mindestabstand in Millisekunden zwischen gedrosselten automatischen AI-Befehlen fest. Dadurch werden weniger Befehle gesendet; der Homunculus kann jedoch langsamer reagieren.":"Sets a minimum interval in milliseconds between throttled automatic AI commands. This reduces command output but can make the Homunculus respond more slowly.","Exportiert die Einstellungen dieses T-Modus als Datei, damit du sie sichern oder mit Freunden teilen kannst. Ein Import lädt eine solche Datei und ersetzt die Einstellungen des ausgewählten T-Modus.":"Exports this T mode's settings to a file so you can save them or share them with friends. Import loads such a file and replaces the settings of the selected T mode.","Nicht angreifen: keine normale automatische Auswahl dieses Monsters.\nKeine Skills: nur normale Angriffe. Nur Skills: keine normalen Schläge.\nNormal + Skills: beides verwenden. Die Skill-Einschränkung betrifft\nAngriffsskills; Heilung, Buffs, Defensiv- und Notfallskills behalten\nihre eigenen Bedingungen.":"Do not attack: exclude this monster from normal automatic selection.\nNo skills: normal attacks only. Skills only: no normal hits.\nNormal + skills: allow both. Skill restrictions affect offensive\nskills; healing, buffs, defensive and emergency skills retain\ntheir own conditions.","Überschreibt das allgemeine Level des Angriffsskills gegen dieses\nMonster, auch bei Level 1 und Auswahl Automatisch.\nNur ein tatsächlich gelerntes Level einstellen.\nHeil-, Buff- und Defensivskills behalten ihre eigenen Level.":"Overrides the general offensive skill level against this monster,\nincluding level 1 and the Automatic selection.\nChoose a level the Homunculus has actually learned.\nHealing, buff and defensive skills keep their own levels.","Sonderregeln gelten nur für den ausgewählten Monstereintrag.\nOhne Regel gelten die allgemeinen Skills und Priorität 5.\nSuche nach Namen, AI-ID oder MidgardHub-ID; bei gleichen Nummern\nden passenden benannten Eintrag wählen. Die i-Punkte in den\nSpaltenüberschriften erklären die Einstellungen für alle Zeilen.":"Special rules apply only to the selected monster entry.\nWithout a rule, general skills and priority 5 apply.\nSearch by name, AI ID or MidgardHub ID; if numbers collide,\nchoose the correct named entry. The i markers in the column\nheaders explain the settings for every row.","Automatisch verwendet die aktivierten normalen Angriffsskill-Regeln.\nEin ausgewählter Skill begrenzt die Angriffsskills gegen dieses Monster.\nEr muss auch auf der Skills-Seite aktiviert und gelernt sein.\nSP-Grenze und Intervall dieser Skillregel gelten weiter.\nHeilung und Buffs werden nicht auf diesen Skill eingeschränkt.":"Automatic uses enabled general offensive skill rules.\nSelecting a skill restricts offensive skills against this monster.\nIt must also be learned and enabled on the Skills tab.\nIts SP threshold and interval still apply.\nHealing and buffs are not restricted to that selected skill.","Der Homunculus greift neue Ziele auch an, während der Spieler läuft.\nWenn deaktiviert, folgt der Homunculus dem Spieler, statt neue Kämpfe zu beginnen.":"The Homunculus may attack new targets while the owner is moving.\nWhen disabled, it follows the owner instead of starting new fights.","Maximaler Abstand eines neuen automatischen Ziels vom laufenden\nBesitzer, in Feldern. Wird für die Zielsuche beim Laufen verwendet;\ndie allgemeine Kampfgrenze gilt zusätzlich.":"Maximum distance of a new automatic target from the moving owner,\nin cells. Used for targeting while moving;\nthe general combat-distance limit still applies.","Schließt einfache Pflanzen wie Green Plant von der normalen automatischen Zielauswahl aus.":"Excludes ordinary plants such as Green Plant from normal automatic target selection.","Wenn aktiviert, wird dieser Angriffsskill nur gegen Monster verwendet,\nbei denen genau dieser Skill in den Monster-Regeln ausgewählt wurde.\n'Automatisch' zählt dabei nicht als ausdrückliche Freigabe.":"When enabled, this offensive skill is only used against monsters\nwhere this exact skill is selected in Monster Rules.\n'Automatic' does not count as an explicit permission.","Die Übersicht zeigt die Einstellungen des ausgewählten T-Modus.\nT1 und T2 sind zwei frei einstellbare Modi, nicht fest Aktiv/Passiv.\nNur ausdrücklich gemeinsam markierte Einstellungen gelten für beide.\nSpeichern sichert das Profil; Installieren erzeugt die UserAI für das Spiel.":"The overview shows the selected T mode.\nT1 and T2 are two configurable modes, not fixed Active/Passive slots.\nOnly settings explicitly marked as shared apply to both.\nSave stores the profile; Install generates the UserAI used by the game.","Aktiviert den PvP-Modus. Solange er aktiv ist, lassen sich keine Spieler in die Freundesliste des Homunculus aufnehmen oder daraus entfernen.":"Enables PvP mode. While it is active, you cannot add players to your Homunculus's friend list or remove them.","Aktiviert die Tank-Funktion. Das Verhalten und die zugehörigen Skills stellst du auf der Tank-Seite ein.":"Enables Tank mode. Configure its behavior and skills on the Tank page.","Wenn Spieler und Homunculus angegriffen werden und die\nAngreifer dieselbe Monster-Priorität haben: Spielerschutz bevorzugen.\nOhne Haken entscheidet bei Gleichstand die Entfernung.\nHöhere Monster-Prioritäten bleiben maßgeblich. Der separate\nSpieler-Vorrang kann die Monster-Priorität ausdrücklich überstimmen.":"When the owner and Homunculus are both attacked and their\nattackers have equal monster priority, prefer owner protection.\nUnchecked: distance breaks a tie. Higher monster priority still wins.\nThe separate owner override can explicitly take precedence\nover monster priority.","Mit Alt + Rechtsklick auf einen anderen Spieler fügst du ihn zur Freundesliste deines Homunculus hinzu. Bei einem bereits gespeicherten Freund entfernst du ihn wieder. Der Homunculus läuft selbstständig zu dem Spieler und umrundet ihn.\n\nMit Alt + Rechtsklick auf deinen eigenen Charakter besucht dein Homunculus die gespeicherten Freunde in der Nähe. PvP muss zum Ein- und Austragen ausgeschaltet sein.":"Alt + right-click another player to add them to your Homunculus's friend list. Repeat this on a saved friend to remove them. The Homunculus moves to the selected player and circles them on its own.\n\nAlt + right-click your own character to have your Homunculus visit saved friends nearby. PvP must be disabled to add or remove friends.","Erlaubt der Assistenz-Zielsuche, Ziele bekannter Freunde\nzu berücksichtigen. Benötigt die aktivierte Freundesliste.\nFür normale aktive Unterstützung Angriffsverhalten Assistieren wählen.":"Allows assist targeting to consider known friends' targets.\nRequires the enabled friend list.\nChoose Assist attack behavior for normal assistance.","Schützt Spieler aus der gespeicherten Freundesliste.\nBenötigt Party / Freunde aktivieren. Nicht gespeicherte\nParty-Mitglieder werden dadurch nicht automatisch erkannt.":"Protects players in the saved friend list.\nRequires Enable party / friends. Unsaved party members\nare not automatically recognized by this option.","Nimmt normale Angriffe von der zusätzlichen Lag-Pause aus, damit der Homunculus möglichst mit seiner gewohnten Angriffsgeschwindigkeit (ASPD) zuschlägt.":"Exempts normal attacks from the extra lag delay so the Homunculus can keep as close as possible to its normal attack speed (ASPD).","1 ist die höchste Priorität, 10 die niedrigste. Ohne Regel gilt 5.\nBei gleicher Priorität wird für die erste automatische Auswahl\ndas nähere gültige Ziel bevorzugt. Für einen Wechsel im laufenden\nKampf braucht das neue Monster zusätzlich Wechsel erzwingen.":"1 is highest priority, 10 is lowest. Monsters without a rule use 5.\nFor initial automatic selection, equally ranked eligible targets\nare ordered by distance. Switching during a running fight also\nrequires Interrupt target on the new monster.","Reagiert auf gültige Monsterangreifer deines Spielers.\nOhne zusätzlichen Spieler-Vorrang gilt die Monster-Priorität.\nKann auch ohne aktive normale Zielsuche greifen.\nSchutz- und Entfernungsregeln bleiben maßgeblich.":"Reacts to eligible monsters attacking your character.\nWithout the additional owner override, monster priority applies.\nCan apply even without normal active target searching.\nProtection rules and distance limits still apply.","Reagiert auf gültige Monster, die den Homunculus angreifen.\nHöher priorisierte zulässige Ziele werden dadurch nicht verdrängt.\nBeim Wechsel vom Verteidigungsziel gelten die Wechsel-Haken.\nNach dem priorisierten Ziel kann die Selbstverteidigung wieder greifen.":"Reacts to eligible monsters attacking the Homunculus.\nIt does not displace eligible higher-priority targets.\nSwitching away from a defense target requires the interrupt checkboxes.\nSelf-defense can resume after the higher-priority target is defeated.","Wähle im 15×15-Raster bis zu 30 Punkte aus, die dein Homunculus\nin dieser Reihenfolge abläuft, wenn der Spieler still steht.\nP markiert den Spieler; erneutes Anklicken entfernt einen Punkt.\nDie vier X-Ecken sind gesperrt. Route löschen leert die Punktliste.":"Select up to 30 points in the 15×15 grid. The Homunculus follows\nthem in order while the owner is standing still. P marks the owner;\nclick a point again to remove it. The four X corners are blocked.\nClear route empties the point list.","Wird ein Routenpunkt nicht innerhalb dieser Millisekunden erreicht,\nwechselt die Route zum nächsten Punkt. Hilft bei Hindernissen;\nist keine garantierte Wegfindung. Gilt nur für Route.":"If a route point is not reached within this many milliseconds,\nthe route advances to the next point. Useful for obstacles,\nbut not a guarantee of pathfinding. Applies only to Route.","Abstand in Feldern, in dem ein Routenpunkt als erreicht gilt.\n0 verlangt die genaue Zielzelle. Größere Werte tolerieren\nkleine Abweichungen. Gilt nur für Route.":"Distance in cells within which a route point counts as reached.\n0 requires the exact target cell. Larger values tolerate\nsmall differences. Applies only to Route.","Gleicht das Lag-Intervall und die Option „Normale Angriffe nicht drosseln“ zwischen T1 und T2 ab. Solange der Haken gesetzt ist, gelten Änderungen für beide Modi.":"Keeps the lag interval and the 'Do not throttle normal attacks' option the same for T1 and T2. While enabled, changes apply to both modes.","Maximaler Abstand des Homunculus zum Besitzer für normale\nautomatische Skills, in Feldern. Das ist nicht die Reichweite\ndes Skills zum Monster. Außerhalb dieser Grenze kann auch\nautomatische Heilung oder Unterstützung warten.":"Maximum distance of the Homunculus from the owner for normal\nautomatic skills, in cells. This is not the skill's range to a\nmonster. Automatic healing or support may also wait outside\nthis limit.","Aktiv schaltet diese Regel ein. Skill-Level: nur gelernte Level wählen.\nMindest-SP ist ein absoluter SP-Wert, kein Prozentsatz.\nIntervall ist die Mindestzeit zwischen Ausgaben dieser Regel;\nBereitschaft, HP-Bedingung und globale Skillpause müssen passen.\nHP unter %: löst unterhalb der eingestellten Prozentgrenze aus.\n0 deaktiviert diese HP-Auslösebedingung, nicht die Prüfung auf SP.":"Active enables this rule. Skill level: select only learned levels.\nMinimum SP is an absolute value, not a percentage.\nInterval is the minimum time between commands for this rule;\nreadiness, HP conditions and the global skill pause must also allow it.\nHP below %: triggers below the selected percentage.\n0 disables that HP trigger, not the SP check.","Zusätzlicher Mindestabstand zwischen normalen automatischen\nSkillbefehlen, in Sekunden. Gilt zusätzlich zum Intervall der\neinzelnen Regel. 0 schaltet diese zusätzliche Pause aus.\nSpielseitige Sperrzeiten werden dadurch nicht aufgehoben.":"Additional minimum interval between normal automatic skill\ncommands, in seconds. Applies alongside each rule's interval.\n0 disables this additional pause. It does not remove\nany cooldown imposed by the game.","Lege Regeln für tatsächlich gelernte Skills dieses Homunculus an.\nJede Regel hat Level, Mindest-SP und ein Intervall. Mehrere Regeln\nfür denselben Skill sind möglich. HP-Bedingungen gelten nur für\ndie jeweiligen Heil-/Schutzskills. Monsterregeln können den\nAngriffsskill und sein Level gezielt einschränken.":"Add rules for skills this Homunculus has actually learned.\nEach rule has a level, minimum SP and an interval. Multiple rules\nfor the same skill are possible. HP conditions apply to the\ncorresponding healing/protection skills. Monster rules can\nrestrict offensive skill selection and level.","Schaltet die normalen automatischen Skillregeln gemeinsam ein\noder aus. Die einzelnen Regeln müssen ebenfalls aktiviert sein.\nTank und PvP besitzen eigene Skilllisten und Schalter.":"Enables or disables the normal automatic skill rules together.\nEach individual rule must also be enabled.\nTank and PvP have separate skill lists and controls.","Legt fest, wie viele Millisekunden der Homunculus nach dem Neuladen der AI wartet, bevor automatische Aktionen beginnen. Bei einem Mapwechsel oder Teleport gilt die Pause, wenn der Client dabei die AI neu lädt. 0 ms deaktiviert die Verzögerung.":"Sets how many milliseconds the Homunculus waits after the AI reloads before automatic actions begin. After a map change or teleport, the delay applies if the client reloads the AI. 0 ms disables the delay.","Schließt die beschworenen Pflanzen eines Alchemisten von der normalen automatischen Zielauswahl aus.":"Excludes plants summoned by an Alchemist from normal automatic target selection.","Radius der Tank-Zielsuche um den Besitzer, in Feldern.\nAuch die Besitzerrettung bleibt auf diese Area begrenzt.\nDie Area ist nicht der gewünschte Halteabstand des Homunculus.":"Radius for Tank targeting around the owner, in cells.\nOwner rescue is also limited to this area.\nIt is not the Homunculus' desired holding distance.","Bekämpft bereits am Homunculus gebundene Monster weiter, sobald\nkein frisches Tank-Ziel und keine Besitzerrettung anstehen.\nNeue gültige Ziele werden weiterhin bevorzugt.":"Continues fighting monsters already bound to the Homunculus when\nno fresh Tank target or owner rescue is pending.\nNew eligible targets still take priority.","Erlaubt Angriffsskills gegen bereits getankte Monster.\nDie Tank-Skillregeln mit Level, SP-Grenzen und Intervallen gelten\nweiterhin. Heilung und Unterstützung haben eigene Bedingungen.":"Allows offensive skills against already tanked monsters.\nTank skill levels, SP thresholds and intervals still apply.\nHealing and support retain their own conditions.","Gewünschter Abstand zum Besitzer nach dem Sammeln der Monster,\nin Feldern. Ist alles gebunden, kehrt der Homunculus bis zu\ndiesem Abstand zurück. Er folgt entsprechend, wenn der Besitzer\nsich entfernt. Die Tank-Area ist davon getrennt.":"Desired distance from the owner after gathering monsters, in cells.\nOnce all are bound, the Homunculus returns within this distance\nand follows when the owner moves away.\nTank Area is a separate setting.","Diese Liste schließt Monster vom Tanken aus. Suche über Namen\noder ID und füge den passenden Katalogeintrag hinzu.\nEigene IDs nur bewusst verwenden. Bekannte Katalog-IDs werden\nbeim Export zugeordnet; gleiche Zahlen sind nicht immer derselbe Typ.":"This list excludes monsters from Tank targeting. Search by name\nor ID and add the matching catalog entry.\nUse custom IDs deliberately. Known catalog IDs are mapped during\nexport; matching numbers do not always mean the same monster type.","Neue gültige Monster in der Tank-Area werden zuerst angetankt.\nDanach kehrt der Homunculus auf Tank-Abstand zum Besitzer zurück\nund kann gebundene Monster weiter bekämpfen. Neue Ziele und\nBesitzerrettung haben Vorrang. Tank ersetzt den normalen\nAngriffsmodus; PvP wird beim Einschalten deaktiviert.\nTank-Skills und Ausschlüsse werden hier separat eingestellt.\nNeue Monster erhalten zunächst einen Angriffsversuch. Nach einer kurzen Ausführungsprüfung kommt das nächste Monster dran. Ein Fernskill führt dabei nicht direkt zum Nahkampf. Bleibt die Aggro aus, folgt später ein erneuter Versuch. Ein ausgegebener Befehl ist kein bestätigter Treffer.":"Fresh eligible monsters inside the Tank Area are pulled first.\nThe Homunculus then returns to Tank distance from the owner\nand may continue fighting bound monsters. Fresh targets and\nowner rescue take priority. Tank replaces normal combat;\nenabling it disables PvP. Configure Tank skills and exclusions\nseparately on this page.\nFresh monsters first receive one pull attempt. After a short execution check, the next monster is selected. A ranged skill does not immediately lead to melee pursuit. If aggro is not acquired, the pull is retried later. An issued command is not a confirmed hit.","Erlaubt normale Angriffe im Tank-Modus, auch als Alternative,\nwenn kein zulässiger Angriffsskill bereit ist.\nOhne normalen Angriff ist das Antanken auf verfügbare Skills angewiesen.":"Allows normal attacks in Tank mode, including when no eligible\noffensive skill is ready. Without normal attacks, pulling aggro\ndepends on available skills.","Schließt die hinterlegten normalen Plants und Pilze aus der\nTank-Zielsuche aus. Unabhängig vom normalen Angriffstab.":"Excludes the listed normal Plants and mushrooms from Tank\ntargeting. Independent of the normal Attack tab.","Erlaubt Angriffsskills beim Ablösen eines Angreifers vom Besitzer.\nAusgeschaltet verwendet der Rettungspfad normale Angriffe.\nTank-Area, Ausschlüsse und die vorhandenen Schutzprüfungen gelten weiter.":"Allows offensive skills when pulling an attacker off the owner.\nWhen disabled, the rescue path uses normal attacks.\nTank Area, exclusions and existing protection checks still apply.","Level: gelerntes Skill-Level. Min. SP: absoluter Mindestwert.\nIntervall: früheste erneute Ausgabe dieser Skillregel in Sekunden.\nHP unter % wird nur bei passenden Heil-/Schutzskills angeboten.\nHP prüfen von wählt die überwachte Person, nicht zwingend das\ntatsächliche Heilziel; Chaotic Blessings entscheidet spielseitig zufällig.":"Level: learned skill level. Min. SP: absolute minimum amount.\nInterval: earliest repeat of this skill rule in seconds.\nHP below % is shown for relevant healing/protection skills.\nCheck HP of selects whose health is monitored, not necessarily\nthe actual healing target; Chaotic Blessings is randomized by the game.","Diese Skillliste gilt nur für Tank. Normale PvE-Skillregeln und\nmonsterbezogene Angriffsskill-Level werden dafür nicht verwendet.\nWähle gelernte Skills und Level. Offensive Skills beachten auch\ndie allgemeine Tank-SP-Grenze. Heil-/Schutzskills verwenden\nihr Intervall und ihre HP-Bedingungen.":"This skill list is used only by Tank. Normal PvE skill rules and\nmonster-specific offensive skill levels do not control it.\nChoose learned skills and levels. Offensive skills also respect\nthe general Tank SP limit. Healing/protection skills use their\nintervals and HP conditions.","Zusätzliche Mindest-SP für offensive Tank-Skills als absoluter Wert.\nDie SP-Grenze jeder Tank-Skillregel gilt ebenfalls.\nBei zu wenig SP kann ein normaler Angriff übernehmen, wenn erlaubt.":"Additional minimum SP for offensive Tank skills, as an absolute value.\nEach Tank skill rule's SP threshold also applies.\nA normal attack may take over when SP is too low, if enabled.","Schließt die hinterlegten beschworenen Plants aus der Tank-Zielsuche\naus. Dieser Haken ist unabhängig vom normalen Angriffstab.":"Excludes the listed summoned Plants from Tank targeting.\nThis setting is independent of the normal Attack tab.","Beide Haken gehören zum NEUEN Monster in dieser Zeile.\nWechsel erzwingen: wechselt zu einer kleineren Prioritätszahl.\nGleiche Priorität reicht nicht. Auch manuelle Ziele: erlaubt\nzusätzlich das Ablösen eines manuell gewählten Monsters.\nGeprüft beim Verfolgen und Angreifen, auch während Fernskills.\nSelbstverteidigung blockiert diesen Wechsel nicht. Spielerschutz\nblockiert ihn nur mit aktiviertem Spieler-Vorrang unter Verteidigung.\nFreundes-Verteidigung, Assist/PvP sowie Distanz-, KS- und\nAusschlussregeln bleiben geschützt. Laufende Snipes behalten\nihr begrenztes Bestätigungsfenster.":"Both checkboxes belong to the NEW monster in this row.\nInterrupt target: switch to a lower priority number. Equal priority\nis not enough. Also manual targets: additionally permits replacing\na manually selected monster. Checked while chasing and attacking,\nincluding ranged skills. Self-defense does not block the switch.\nOwner protection blocks it only when its override is enabled\non the Defense page. Friend protection, assist/PvP, distance limits,\nkill-steal protection and exclusions remain protected.\nOngoing snipes keep their bounded confirmation window.","100 ms – Normal":"100 ms – Normal","10 ms – Leicht":"10 ms – Light","1. Start":"1. Getting started","1 ms – Minimal":"1 ms – Minimal","200 ms – Stark":"200 ms – Strong","2. T1 und T2":"2. T1 and T2","3. Angriff und Skills":"3. Combat and skills","400 ms – Sehr stark":"400 ms – Very strong","4. Monsterregeln und manuelle Ziele":"4. Monster rules and manual targets","50 ms – Mittel":"50 ms – Medium","5. Bewegung und Verteidigung":"5. Movement and defense","6. Tank-Modus":"6. Tank mode","7. Lag Reduction und Startpause":"7. Lag Reduction and startup delay","8. Übertragen und Hilfe":"8. Sharing modes and help","Aktiv":"Enabled","Aktiv sucht Monster selbstständig, Passiv lässt die normale automatische Zielsuche aus, Assistieren hilft am Ziel des Besitzers. Separat aktivierte Verteidigung bleibt möglich. Skillregeln brauchen ein gelerntes Level, genug SP und ein passendes Intervall; Heil- und Schutzskills haben zusätzlich ihre HP-Bedingungen.":"Active searches for monsters, Passive disables normal automatic target searching, and Assist helps against the owner's target. Separately enabled defense may still apply. Skill rules require a learned level, enough SP and the configured interval; healing and protection skills also have their HP conditions.","Aggressiv":"Aggressive","Darstellung":"Appearance","Darstellung, Installation und Programmeinstellungen.":"Appearance, installation and application settings.","Programm":"Application","Gilt für":"Applies to","Assistieren":"Assist","Ziele von Party-Mitgliedern unterstützen":"Assist party members' targets","Mindestens ein Profil muss vorhanden bleiben.":"At least one profile must remain.","Angriff":"Attack","Angriffsverhalten":"Attack behavior","Angriffsart und Grenzen; Details über die i-Punkte.":"Attack behavior and limits; click the i buttons for details.","Angriffstanz (Animation Canceling)":"Attack Dance (Animation Canceling)","Angriff T2":"Attack T2","Beim Start automatisch nach Updates suchen":"Automatically check for updates at startup","Verfügbare Version":"Available version","BAI ist aktuell.":"BAI is up to date.","BAI Update verfügbar":"BAI Update Available","BAI v-Beta verfügbar":"BAI v-beta available","BAI wurde installiert.\n\nIm Spiel /hoai aktivieren. Falls die User-AI bereits aktiv war, Homunculus neu rufen oder einmal reloggen.":"BAI was installed.\n\nEnable /hoai in-game. If User AI was already active, recall the Homunculus or relog once.","Abbrechen":"Cancel","Felder vom Spieler":"cells from owner","Änderungen werden mit „Speichern“ unten übernommen.":"Changes are applied with “Save” below.","Nach Updates suchen":"Check for updates","Suche nach BAI-Updates …":"Checking for BAI updates …","Suche nach internen v-Betas …":"Checking for internal v-betas …","Profil und passenden Homunculus wählen, Einstellungen vornehmen und speichern. Installieren schreibt AI.lua und BAI_Config.lua in den hinterlegten USER_AI-Ordner. Im Spiel die UserAI mit /hoai aktivieren; nach Änderungen den Homunculus neu rufen oder neu einloggen.":"Choose a profile and the correct Homunculus, adjust the settings and save. Install writes AI.lua and BAI_Config.lua to the saved USER_AI folder. Enable UserAI with /hoai in the game; after changes, recall the Homunculus or log in again.","Wähle Still, Folgen, Wander, Orbit oder eine eigene Route. Routenpunkte werden relativ zum Besitzer angelegt; P zeigt seine Position. Unter Verteidigung stellst du Besitzer-, Selbst- und Freundesschutz ein. Freunde werden im Spiel verwaltet, nicht automatisch aus der Party gelesen. Die i-Punkte erklären Ablauf und Grenzen.":"Choose Still, Follow, Wander, Orbit or your own route. Route points are relative to the owner; P marks their position. Defense controls owner, self and friend protection. Friends are managed in the game, not automatically read from the party. The i markers explain the workflow and limits.","Route löschen":"Clear route","Schutz- und Assistenzregeln des ausgewählten T-Modus einstellen.":"Configure defense and assistance rules for the selected T mode.","Bewegungsverhalten des ausgewählten T-Modus einstellen.":"Configure movement behavior for the selected T mode.","PvP-Verhalten des ausgewählten T-Modus einstellen.":"Configure PvP behavior for the selected T mode.","Downgrade bestätigen":"Confirm Downgrade","v-Beta-Downgrade bestätigen":"Confirm v-beta downgrade","Kontakt":"Contact","Aktuellen Kampf weiterführen bis":"Continue current fight up to","Versionsliste konnte nicht geladen werden: ":"Could not load version list: ","Credits":"Credits","Aktuelles Profil":"Current profile","Debug":"Debug","Party-Mitglieder verteidigen":"Defend party members","Verteidigung":"Defense","Verteidigung T2":"Defense T2","Profil löschen":"Delete profile","Beschreibung":"Description","Keine normalen Pflanzen angreifen":"Do not attack normal Plants","Beschworene Plants nicht angreifen":"Do not attack summoned Plants","Normale Angriffe nicht drosseln":"Do not throttle normal attacks","Party / Freunde aktivieren":"Enable party / friends","PvP-Verhalten aktivieren":"Enable PvP behavior","Tank-Modus aktivieren":"Enable tank mode","Exportieren erzeugt eine .baimode-Datei des ausgewählten Modus, keine installierte UserAI. Ein bestätigter Import ersetzt diesen Modus und speichert das Profil; bei verknüpfter Lag Reduction gelten die importierten Lag-Werte für beide Modi. Die i-Punkte zeigen Hilfe beim Darüberfahren, Anklicken oder mit der Tastatur (Tab und Enter).":"Export creates a .baimode file for the selected mode, not an installed UserAI. A confirmed import replaces that mode and saves the profile; with shared Lag Reduction, imported lag values apply to both modes. Hover over or click an i marker for help, or reach it with Tab and press Enter.","T-Modus exportieren":"Export T mode","Die Datei ist keine gültige BAI-Modusdatei.":"The file is not a valid BAI mode file.","Bereits angegriffenen Gegner beim Loslaufen zu Ende bekämpfen":"Finish the current target when the owner starts moving","Schriftgröße":"Font size","Allgemein":"General","GitHub wurde erfolgreich geprüft, aber es wurde kein gültiges BAI-Release mit Updatepaket und SHA-256-Datei gefunden.":"GitHub was checked successfully, but no valid BAI release with an update package and SHA-256 file was found.","Versteckter Diagnosebereich.":"Hidden diagnostics area.","Homunculus":"Homunculus","Homu beschützt sich selbst":"Homunculus protects itself","Homu beschützt Spieler, wenn er angegriffen wird":"Homunculus protects the owner when attacked","T-Modus importieren":"Import T mode","Installieren":"Install","BAI installieren / Profil anwenden":"Install BAI / Apply Profile","Ausgewählte Version installieren":"Install selected version","Installation":"Installation","Installation fehlgeschlagen.":"Installation failed.","Intervall in ms":"Interval in ms","Klassen & Priorität":"Jobs & Priority","Beim Laufen des Spielers weiterhin automatisch neue Gegner angreifen":"Keep acquiring new targets while the owner is moving","Lag Reduction begrenzt wiederholte automatische Befehle. Größere Millisekundenwerte sparen mehr Wiederholungen, können aber träger reagieren. Normale Angriffe können davon ausgenommen werden. Dance ist bei Aus, 1 und 10 ms verfügbar. Die Startverzögerung wartet nur einmal nach dem Laden der AI, nicht nach Alt+T oder jedem Zielwechsel.":"Lag Reduction limits repeated automatic commands. Larger millisecond values reduce more repeats but may respond more slowly. Normal attacks can be exempted. Dance is available with Off, 1 and 10 ms. Startup delay waits only once after the AI loads, not after Alt+T or each target change.","\n\nLag Reduction ist verknüpft: Das Lag-Intervall und die Ausnahme für normale Angriffe werden auch im anderen T-Modus übernommen.":"\n\nLag Reduction is linked: the lag interval and normal-attack exemption will also be applied to the other T mode.","Sprache":"Language","Versionsliste wird geladen …":"Loading version list …","Max. Angriffsentfernung beim Laufen:":"Max. attack distance while moving:","Monster-Regeln":"Monster rules","Bewegung":"Movement","Bewegungsart":"Movement mode","Bewegung T2":"Movement T2","Neues Profil":"New profile","Keine installierbaren Versionen gefunden.":"No installable versions found.","Keine neuere v-Beta gefunden.":"No newer v-beta found.","Es ist noch kein gültiger USER_AI-Ordner gespeichert. Bitte hinterlege den Ordner zuerst unter „Einstellungen“.":"No valid USER_AI folder has been saved yet. Please select it in Settings first.","Keine gültigen Update-Informationen gefunden.":"No valid update information found.","Aus":"Off","Einmalige Startverzögerung (ms)":"One-time startup delay (ms)","Übersicht":"Overview","Übersicht T2":"Overview T2","Bei gleicher Prio: Spieler vor Homu":"Equal priority: owner before Homunculus","Passiv":"Passive","Bitte einen Namen eingeben.":"Please enter a name.","Kill Steal verhindern":"Prevent Kill Steal","Priorität":"Priority","Priorität 1 ist die höchste. Klassenregeln besitzen eigene Prioritäten; die Standard-Priorität gilt nur für nicht eingetragene Klassen.":"Priority 1 is the highest. Job rules have their own priorities; the default priority only applies to jobs without a custom rule.","Profil gelöscht.":"Profile deleted.","Profilname":"Profile name","Profil zurückgesetzt.":"Profile reset.","Profilstatus und wichtigste Einstellungen auf einen Blick.":"Profile status and key settings at a glance.","Profile":"Profiles","Monster gezielt an den Homunculus binden und vom Spieler weg halten.":"Pull monsters onto the Homunculus and keep them away from the owner.","Radius um Besitzer":"Radius around owner","Bereit":"Ready","Fenstergröße und Position merken":"Remember window size and position","Profil umbenennen":"Rename profile","Profilplatz zurücksetzen":"Reset profile slot","Route: Ankunftstoleranz":"Route: arrival tolerance","Route: Punkte im Raster auswählen.":"Route: select points in the grid.","Route: Timeout in ms":"Route: timeout in ms","Speichern":"Save","Suche über Namen, AI-ID oder MidgardHub-ID. Die Regel bestimmt Verhalten, Angriffsskill und Level für dieses Monster. Priorität 1 ist die höchste, 10 die niedrigste; ohne Regel gilt 5. Wechsel erzwingen wird beim neuen, höher priorisierten Monster aktiviert. Manuelle Ziele bleiben geschützt, solange dort nicht zusätzlich Auch manuelle Ziele eingeschaltet ist. Distanz- und weitere Schutzregeln bleiben wirksam.":"Search by name, AI ID or MidgardHub ID. A rule sets behavior, offensive skill and level for that monster. Priority 1 is highest, 10 lowest; monsters without a rule use 5. Enable Interrupt target on the new, higher-priority monster. Manual targets remain protected unless Also manual targets is enabled there too. Distance and other protection rules still apply.","AI\\USER_AI Ordner auswählen":"Select AI\\USER_AI folder","Ordner auswählen, in dem Ragnarok Zero die USER_AI lädt. Mit „Installieren“ unten wird das aktuelle Profil dorthin geschrieben.":"Select the folder from which Ragnarok Zero loads USER_AI. Use “Install” below to write the current profile there.","Profil auswählen, benennen und Homunculus festlegen.":"Select, name and configure a Homunculus profile.","Der ausgewählte Ordner existiert nicht.":"The selected folder does not exist.","Ausgewählter T-Modus":"Selected T mode","Die ausgewählte v-Beta konnte nicht installiert werden.\n\n":"The selected v-beta could not be installed.\n\n","Die ausgewählte Version konnte nicht installiert werden.\n\n":"The selected version could not be installed.\n\n","Einstellungen":"Settings","Einstellungen gespeichert.":"Settings saved.","Lag Reduction für T1 und T2 gemeinsam":"Share Lag Reduction between T1 and T2","T1 und T2 gemeinsam":"Shared by T1 and T2","Kompakte Anleitung zu den wichtigsten Möglichkeiten.":"A short guide to the main features.","Über neue Updates informieren":"Show notifications for new updates","Skills":"Skills","T1 / T2 tauschen":"Swap T1 / T2","T1 und T2 vollständig tauschen?\n\nNamen und alle Einstellungen der beiden T-Modi werden vertauscht.":"Swap T1 and T2 completely?\n\nNames and all settings of both T modes will be swapped.","T-Modus Bewegung":"T mode movement","Name des T-Modus:":"T mode name:","Tank sammelt gültige Monster in der Tank-Area, bevorzugt frische Ziele und schützt den Besitzer. Nach dem Sammeln kehrt der Homunculus auf Tank-Abstand zurück. Tank verwendet eine eigene Skill- und Ausschlussliste statt der normalen Monster-Angriffsregeln. Beim Einschalten wird PvP deaktiviert.":"Tank gathers eligible monsters within the Tank Area, prioritizes fresh targets and protects the owner. After gathering, the Homunculus returns within Tank distance. Tank uses separate skill and exclusion lists instead of the normal monster attack rules. Enabling Tank disables PvP.","Tank":"Tanking","Tank T2":"Tanking T2","Im aktuellen Profil gibt es ungespeicherte Änderungen.\n\nJa = Speichern und fortfahren\nNein = Änderungen verwerfen\nAbbrechen = Hier bleiben":"There are unsaved changes in the current profile.\n\nYes = Save and continue\nNo = Discard changes\nCancel = Stay here","In den Einstellungen gibt es ungespeicherte Änderungen.\n\nJa = Speichern und fortfahren\nNein = Änderungen verwerfen\nAbbrechen = Hier bleiben":"There are unsaved changes in Settings.\n\nYes = Save and continue\nNo = Discard changes\nCancel = Stay here","Die FormatVersion dieser Modusdatei wird nicht unterstützt.":"This mode file format version is not supported.","Zwei frei einstellbare Modi pro Profil: jeweils eigene Angriffe, Skills, Monsterregeln, Bewegung und Tank-Einstellungen. Die Namen bestimmen das Verhalten nicht. Im Spiel startet die erzeugte AI mit T1; Alt+T wechselt zwischen beiden Modi. Lag-Einstellungen können ausdrücklich verknüpft werden.":"Two configurable modes per profile, each with its own combat, skills, monster rules, movement and Tank settings. Their names do not determine behavior. The generated AI starts in T1; Alt+T switches modes in the game. Lag settings can be explicitly linked.","Ungespeicherte Änderungen":"Unsaved Changes","Update abgebrochen.":"Update cancelled.","Die Updateprüfung konnte nicht abgeschlossen werden.\n\n":"The update check could not be completed.\n\n","Updateprüfung fehlgeschlagen.":"Update check failed.","Update geprüft. BAI wird für die Installation beendet …":"Update verified. BAI will close for installation …","Updates":"Updates","Skills verwenden":"Use Skills","Skills bis Entfernung vom Spieler":"Use skills up to this distance from owner","USER_AI Ordner":"USER_AI folder","USER_AI-Ordner geändert – bitte speichern.":"USER_AI folder changed – please save.","Die v-Beta-Prüfung konnte nicht abgeschlossen werden.\n\n":"The v-beta check could not be completed.\n\n","v-Beta-Prüfung fehlgeschlagen.":"v-beta check failed.","v-Beta-Installation fehlgeschlagen.":"v-beta installation failed.","v-Beta-Update abgebrochen.":"v-beta update cancelled.","v-B out a rule use 5.","Wähle eine Regel zum Bearbeiten. Gezählt wird pro einzelnem Monster; Hinweise auf Ausführungen sind keine bestätigten Treffer.":"Select a rule to edit. Counts apply to each individual monster; execution hints are not confirmed hits.","Anzahl":"Count","Nein":"No","Spieler-Verteidigung vor Monster-Priorität":"Owner defense overrides monster priority","Standard: aus. Gilt nur für Angreifer deines Spielers.\nAn: Spieler-Verteidigung hat Vorrang vor Monster-Prioritäten.\nAus: Ein höher priorisiertes Monster kann zuerst bekämpft werden.\nBeim Wechsel im Kampf gelten weiterhin die Wechsel-Haken.\nDie Selbstverteidigung des Homunculus erhält diesen Vorrang nie.\nSetzt aktivierten Spielerschutz voraus; wird je T-Modus gespeichert.":"Default: off. Applies only to monsters attacking your character.\nOn: owner defense takes precedence over monster priorities.\nOff: an eligible higher-priority monster can be fought first.\nSwitching during combat still requires the interrupt checkboxes.\nHomunculus self-defense never receives this override.\nRequires owner protection; saved separately for each T mode.","Abstand beim Laufen (−14 bis +14 Felder)":"Moving distance (−14 to +14 cells)","Abstand nach dem Anhalten (−14 bis +14 Felder)":"Stopped distance (−14 to +14 cells)","Positive Werte = Zielposition hinter dem Spieler, z. B. +14 für 14 Felder dahinter.\n0 = Zielposition beim Spieler. Negative Werte = Zielposition vor dem Spieler, z. B. −3 für 3 Felder davor.\nDie Richtung wird aus der letzten Bewegung abgeleitet und bei Kurven angepasst. Drehen im Stand wird nicht erkannt.\nOhne aktuelle Laufrichtung folgt der Homu mit dem Betrag des eingestellten Abstands normal. Nach dem Anhalten gilt der separate Standabstand.\nDie Zielposition ist keine garantierte Entfernung: Geschwindigkeit, Hindernisse und die Reaktion des Clients können den tatsächlichen Abstand verändern. Gilt für den ausgewählten T-Modus.":"Positive values = aim behind the player, e.g. +14 for 14 cells behind.\n0 = aim at the player. Negative values = aim ahead of the player, e.g. −3 for 3 cells ahead.\nDirection is derived from the latest movement and updated when turning. Turning in place cannot be detected.\nWithout a recent movement direction, the Homunculus follows normally using the absolute distance. After stopping, the separate stopped distance applies.\nThis is a target position, not a guaranteed gap: speed, obstacles and client response can change the actual distance. Applies to the selected T mode.","Positive Werte = Standposition hinter dem Spieler. Negative Werte = Standposition vor dem Spieler. 0 = Position beim Spieler.\nMaßgeblich ist die letzte erkannte Laufrichtung. Diese bleibt nach dem Anhalten gespeichert; Drehen im Stand wird nicht erkannt.\nBeispiel: Laufen −3 und Stand −3 hält das Ziel drei Felder vor dem Spieler. Laufen −5 und Stand −2 lässt den Homu vorne auf zwei Felder herankommen.\nOhne bekannte Richtung gilt der Betrag als normaler Abstand auf der aktuellen Seite.\nWander-, Orbit- oder Routenbewegung beginnt nach Erreichen der Standposition wieder. Kampfregeln, Tank-Halteabstand und manuelle Befehle gelten weiterhin.":"Positive values = stand behind the player. Negative values = stand ahead of the player. 0 = stand at the player.\nThe last detected movement direction is retained after stopping. Turning in place cannot be detected.\nExample: moving −3 and stopped −3 keeps the target three cells ahead. Moving −5 and stopped −2 brings the Homunculus closer to two cells ahead.\nWithout a known direction, the absolute value is used as a normal distance on the current side.\nWander, orbit or route movement resumes after reaching the stand position. Combat rules, Tank holding distance and manual commands still apply.","Erneuter Sammelversuch (ms)":"Retry unbound pull (ms)","Wartezeit, bevor ein bereits angegriffenes, aber noch nicht gebundenes Monster erneut zum Sammeln ausgewählt wird. Standard: 1800 ms.\nWährenddessen werden andere neue Monster bevorzugt. Die kurze Ausführungsprüfung eines Skills kann die tatsächliche Mindestwartezeit verlängern. Spielerrettung wird unabhängig davon häufiger geprüft.":"Wait before selecting an attempted but still unbound monster for another pull. Default: 1800 ms.\nOther fresh monsters are preferred meanwhile. The short skill execution check may increase the actual minimum wait. Owner rescue is checked independently and retried sooner.","Auslöser":"Trigger","Besitzer verliert HP (Treffer-Indiz)":"Owner loses HP (hit indication)","Gegner zielt auf Besitzer":"Enemy targets owner","Nur Besitzer-HP-Schwelle (bisher)":"Owner HP threshold only (legacy)","Amistr mindestens HP (%)":"Minimum Amistr HP (%)","SP nach Cast reservieren":"SP reserve after cast","Nur wenn Gegner auf Besitzer zielt":"Only while an enemy targets owner","Auch beim Verfolgen einsetzen":"Allow while chasing","HP-Schwelle: 0 = aus bei Treffer/Ziel-Auslöser. HP-Verlust ist kein bestätigter Treffer; Heilung zwischen AI-Ticks kann ihn verdecken. Intervall und Mindest-SP gelten zusätzlich.":"HP threshold: 0 = disabled for loss/target triggers. HP loss is not a confirmed hit; healing between AI ticks can mask it. Interval and minimum SP also apply.","Berufe/Priorität":"Classes / priority","Im Browser speichern":"Save in browser","Profil herunterladen":"Download profile","Angriffe + Skills":"Attacks + skills","Nur normale Angriffe":"Normal attacks only","Ignorieren":"Ignore","Stehen":"Stand still","Besitzer folgen":"Follow owner","Umherwandern":"Wander","Besitzer umkreisen":"Orbit owner","Route":"Route","HP-Schwellenwert (bisherig)":"HP threshold (legacy)","Besitzer verliert HP":"Owner loses HP","Besitzer wird anvisiert":"Owner is targeted","Besitzer":"Owner","Minimal (1 ms)":"Minimal (1 ms)","Leicht (10 ms)":"Light (10 ms)","Mittel (50 ms)":"Medium (50 ms)","Stark (200 ms)":"Strong (200 ms)","Sehr stark (400 ms)":"Very strong (400 ms)","Dunkel":"Dark","Hell":"Light","Schließen":"Close","Hilfe":"Help","Bereit
