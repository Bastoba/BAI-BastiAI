 (previous.id ~= myid or previous.owner ~= owner or\r\n        previous.config ~= BAI_CONFIG or now < previous.at) then previous=nil end\r\n    if previous and now == previous.at then return nil, \"SAME_TICK\" end\r\n    local plan = { id=myid, owner=owner, config=BAI_CONFIG, at=now, x=ox, y=oy, valid=valid,\r\n        kind=\"MoveToOwner\", args={myid}, tries=0, history={} }\r\n    -- No guessed coordinates when either actor has not entered view yet.\r\n    if not valid then return plan, \"UNKNOWN_POSITION\" end\r\n\r\n    local moving = GetV(V_MOTION, myid) == MOTION_MOVE\r\n    local tries = previous and previous.tries or 0\r\n    local range = math.max(0,math.min(14,tonumber(targetDistance) or 1))\r\n    local reason = previous and \"FOLLOW_REFRESH\" or \"FOLLOW_START\"\r\n    local panic = 3 -- AzzyAI 1.56 Defaults.lua: FollowTryPanic=3\r\n    -- Azzy's staged recovery: first move closer, then try the native owner path.\r\n    -- Count actual output attempts, not queued requests; reset when moving again.\r\n    if not moving and tries > panic then\r\n        if tries > 3 * panic then\r\n            BaiTraffic.followPath=nil\r\n            return nil, \"RECOVERY_RESET\"\r\n        elseif tries > 2 * panic then\r\n            reason=\"STUCK_NATIVE\"\r\n        else\r\n            range=1\r\n            reason=\"STUCK_CLOSE\"\r\n            followX,followY=nil,nil\r\n        end\r\n    end\r\n    plan.tries = moving and 0 or tries+1\r\n    local dx = followX or math.max(ox-range, math.min(ox+range, mx))\r\n    local dy = followY or math.max(oy-range, math.min(oy+range, my))\r\n    if followX and (reason==\"FOLLOW_START\" or reason==\"FOLLOW_REFRESH\") then\r\n        reason=previous and \"DIRECTED_REFRESH\" or \"DIRECTED_START\"\r\n    end\r\n    if dx == mx and dy == my then\r\n        BaiTraffic.followPath=nil\r\n        return nil, \"ARRIVED\"\r\n    end\r\n    plan.dx, plan.dy = dx, dy\r\n    -- Retain only five actual follow positions. Detect a nearby destination\r\n    -- revisited while bouncing; ordinary straight/diagonal progress is unaffected.\r\n    local history = previous and previous.history or {}\r\n    if reason ~= \"STUCK_NATIVE\" and math.abs(mx-dx)<=1 and math.abs(my-dy)<=1 then\r\n        for _, pos in ipairs(history) do\r\n            if pos.x==dx and pos.y==dy then reason=\"BOUNCE_NATIVE\"; break end\r\n        end\r\n    end\r\n    plan.history[1]={x=mx,y=my}\r\n    for i=1,math.min(4,#history) do plan.history[i+1]=history[i] end\r\n    -- BAI has no Azzy occupied-cell map/long-path splitter. Keep the native\r\n    -- fallback for very long paths instead of emitting an unchecked distant cell.\r\n    local pathLength=GetDistance(mx,my,dx,dy)\r\n    if pathLength>15 then\r\n        if followX and reason~=\"STUCK_NATIVE\" and reason~=\"BOUNCE_NATIVE\" then\r\n            -- Extended signed distances can place the goal across the owner.\r\n            -- Approach it in short steps instead of repeatedly returning to owner.\r\n            local fraction=13/pathLength\r\n            dx=math.floor(mx+(dx-mx)*fraction+0.5)\r\n            dy=math.floor(my+(dy-my)*fraction+0.5)\r\n            plan.dx,plan.dy=dx,dy\r\n            reason=\"DIRECTED_STAGE\"\r\n        else reason=\"LONG_PATH_NATIVE\" end\r\n    end\r\n    if reason ~= \"STUCK_NATIVE\" and reason ~= \"BOUNCE_NATIVE\" and reason ~= \"LONG_PATH_NATIVE\" then\r\n        plan.kind=\"Move\"\r\n        plan.args={myid,dx,dy}\r\n        plan.directedFollow=followX~=nil\r\n    end\r\n    return plan, reason\r\nend\r\n\r\nfunction BaiTraffic.send(kind, args, keepWindow)\r\n    local followPath = nil\r\n    local followReason, arrivalDistance = nil, nil\r\n    if kind == \"MoveToOwner\" then\r\n        -- Resolve against current positions when actually sending, not when\r\n        -- queuing. Suppression must not advance a timer or remember an unsent path.\r\n        arrivalDistance = args[2]\r\n        followPath, followReason = BaiTraffic.prepareOwnerMove(args[1], arrivalDistance, args[3], args[4])\r\n        BaiDebug.followRun(BaiDebug.followDecision, followReason)\r\n        if followPath == nil then\r\n            BaiTraffic.suppressed = (BaiTraffic.suppressed or 0) + 1\r\n            return nil, false\r\n        end\r\n        kind, args = followPath.kind, followPath.args\r\n        if kind == \"Move\" then MyDestX,MyDestY=args[2],args[3] end\r\n    end\r\n    local raw = BaiTraffic.raw[kind]\r\n    local tankSpBefore=nil\r\n    if kind == \"SkillObject\" or kind == \"SkillGround\" then\r\n        BaiSnipe.beforeSkill()\r\n        -- A support/other cast must not masquerade as execution of a pending pull.\r\n        BaiTank.wait=nil\r\n        tankSpBefore=BaiSnipe.value(V_SP,MyID)\r\n    end\r\n    -- Existing native functions are called directly. A call is not proof of a hit.\r\n    if kind == \"Attack\" or kind == \"SkillObject\" or kind == \"SkillGround\" then\r\n        BaiDebug.run(BaiDebug.command, kind, (table.unpack or unpack)(args))\r\n    end\r\n    local result = raw((table.unpack or unpack)(args))\r\n    BaiTank.note(kind,args,tankSpBefore)\r\n    BaiDebug.followRun(BaiDebug.followSent, kind, args, followReason, arrivalDistance)\r\n    -- Any actual combat, skill, route or manual movement replaces the follow\r\n    -- path. Merely considering or queuing such a command does not replace it.\r\n    BaiTraffic.followPath = followPath\r\n    if kind == \"Attack\" or kind == \"SkillObject\" then\r\n        -- Only commands actually sent to a monster can produce a public chat ID.\r\n        pcall(BaiDebug.attacked, kind == \"Attack\" and args[2] or args[4])\r\n    end\r\n    BaiTraffic.sent = (BaiTraffic.sent or 0) + 1\r\n    if not keepWindow then BaiTraffic.lastOutput = GetTick() end\r\n    if BaiTraffic.level() > 0 and kind == \"Attack\" and args[2] == MyEnemy then currentTargetAttackStarted = true end\r\n    return result, true\r\nend\r\nfunction BaiTraffic.request(kind, ...)\r\n    BaiTraffic.requested = (BaiTraffic.requested or 0) + 1\r\n    local args = {...}\r\n    if BaiTraffic.level() == 0 or BaiTraffic.manual then\r\n        return BaiTraffic.send(kind, args)\r\n    end\r\n    local key = kind == \"Attack\" and \"attack\" or \"move\"\r\n    if BaiTraffic[key] then BaiTraffic.drop(key) end\r\n    BaiTraffic[key] = { kind=kind, args=args, target=MyEnemy, config=BAI_CONFIG, at=GetTick() }\r\n    -- Queued is deliberately not reported as issued to the state machine.\r\n    return nil, false\r\nend\r\nfunction BaiTraffic.skill(kind, ...)\r\n    BaiTraffic.requested = (BaiTraffic.requested or 0) + 1\r\n    local args = {...}\r\n    local explicit = BaiTraffic.explicitSkill == true\r\n    BaiTraffic.explicitSkill = false\r\n    if BaiTraffic.level() > 0 and not BaiTraffic.manual and not explicit and not BaiTraffic.ready() then\r\n        BaiTraffic.suppressed = (BaiTraffic.suppressed or 0) + 1\r\n        BaiDebug.skillContext = nil\r\n        return nil, false\r\n    end\r\n    if BaiTraffic.level() > 0 then BaiTraffic.cancel(false) end\r\n    local result, issued = BaiTraffic.send(kind, args)\r\n    BaiTraffic.skillThisTick = true\r\n    BaiDebug.skillContext = nil\r\n    return result, issued\r\nend\r\nfunction BaiTraffic.valid(request)\r\n    if not request or request.config ~= BAI_CONFIG or request.target ~= MyEnemy then return false end\r\n    local age = GetTick() - request.at\r\n    if age < 0 or age > 2000 then return false end\r\n    if request.kind == \"Attack\" then\r\n        if MyState ~= ATTACK_ST or MyEnemy == 0 or GetV(V_MOTION,MyEnemy) == MOTION_DEAD then return false end\r\n        if not IsInAttackSight(MyID,MyEnemy) then return false end\r\n        if MyEnemy ~= manualCombatTarget then\r\n            if BeyondCombatDistance() then return false end\r\n            if IsMonster(MyEnemy) == 1 and not IsMonsterFreeForUs(MyEnemy) then return false end\r\n        end\r\n        if BAI_CONFIG.tankEnabled then\r\n            if not TankValidMonster(MyEnemy) then return false end\r\n        elseif currentPvpAction == nil and IsMonster(MyEnemy) == 1 then\r\n            if not MonsterActionAllowed(MyEnemy) then return false end\r\n            local action = CurrentMonsterAction(MyEnemy)\r\n            if action == \"SkillsOnly\" then return false end\r\n        end\r\n        return true\r\n    end\r\n    -- A chase movement must not survive arrival, target loss, or a new state.\r\n    if request.target ~= 0 then\r\n        return MyState == CHASE_ST and not IsOutOfSight(MyID,MyEnemy) and\r\n            GetV(V_MOTION,MyEnemy) ~= MOTION_DEAD\r\n    end\r\n    return MyState == IDLE_ST or MyState == MOVE_CMD_ST or MyState == PATROL_CMD_ST or\r\n        MyState == ATTACK_AREA_CMD_ST or MyState == SKILL_AREA_CMD_ST or MyState == FRIEND_CIRCLE_ST\r\nend\r\nfunction BaiTraffic.signature(request)\r\n    local a = request.args\r\n    if request.kind == \"MoveToOwner\" then\r\n        local owner = GetV(V_OWNER,MyID)\r\n        local x,y = GetV(V_POSITION,owner)\r\n        return \"owner:\" .. tostring(owner) .. \":\" .. tostring(x) .. \":\" .. tostring(y)\r\n    end\r\n    return request.kind .. \":\" .. table.concat(a, \":\") .. \":target=\" .. tostring(request.target)\r\nend\r\nfunction BaiTraffic.finish()\r\n    if BaiTraffic.level() == 0 then return end\r\n    for _,key in ipairs({\"move\",\"attack\"}) do\r\n        if BaiTraffic[key] and not BaiTraffic.valid(BaiTraffic[key]) then BaiTraffic.drop(key) end\r\n    end\r\n    if BaiTraffic.startupWaiting() or BaiTraffic.skillThisTick then return end\r\n\r\n    -- A valid normal hit is not held back by the lag timer when this option is on.\r\n    -- Do not move the shared timer: otherwise frequent hits would starve skills/following.\r\n    if BaiTraffic.attack and BaiTraffic.preserveAttacks() then\r\n        local request = BaiTraffic.attack\r\n        BaiTraffic.attack = nil\r\n        BaiTraffic.drop(\"move\")\r\n        BaiTraffic.send(request.kind, request.args, true)\r\n        return\r\n    end\r\n\r\n    if not BaiTraffic.ready() then return end\r\n    local key = BaiTraffic.attack and \"attack\" or (BaiTraffic.move and \"move\" or nil)\r\n    if not key then return end\r\n    local request = BaiTraffic[key]\r\n    local now = GetTick()\r\n    local signature = BaiTraffic.signature(request)\r\n    local lastKey = key == \"attack\" and \"lastAttack\" or \"lastMove\"\r\n    local last = BaiTraffic[lastKey]\r\n    -- The selected interval is the normal-hit minimum when throttling is requested.\r\n    -- Owner following refreshes its near-owner destination each output cycle.\r\n    -- The shared lag window applies; other moves retain their duplicate filter.\r\n    local repeatInterval = (key == \"attack\" and 1 or 2) * BaiTraffic.interval()\r\n    if request.kind ~= \"MoveToOwner\" and last and last.signature == signature and now >= last.at and\r\n       now-last.at < repeatInterval then return end\r\n    BaiTraffic[key] = nil\r\n    if key == \"attack\" then BaiTraffic.drop(\"move\") end\r\n    local _, issued = BaiTraffic.send(request.kind, request.args)\r\n    if issued then BaiTraffic[lastKey] = { signature=signature, at=now } end\r\nend\r\nfunction BaiTraffic.dance(myid, target, x, y, backX, backY)\r\n    -- One atomic Move -> Attack -> Move group. It is never carried into another tick.\r\n    BaiTraffic.requested = (BaiTraffic.requested or 0) + 3\r\n    if BaiTraffic.interval() > 10 or (not BaiTraffic.manual and not BaiTraffic.ready()) then\r\n        BaiTraffic.suppressed = (BaiTraffic.suppressed or 0) + 3\r\n        if BaiTraffic.preserveAttacks() and not BaiTraffic.skillThisTick then\r\n            local _, issued = Attack(myid, target)\r\n            return issued\r\n        end\r\n        return false\r\n    end\r\n    BaiTraffic.cancel(false)\r\n    BaiTraffic.send(\"Move\", {myid, x, y})\r\n    BaiTraffic.send(\"Attack\", {myid, target})\r\n    BaiTraffic.send(\"Move\", {myid, backX, backY})\r\n    return true\r\nend\r\nfunction BaiTraffic.report()\r\n    if not BaiDebug.enabled(\"traffic\") then return end\r\n    local now = GetTick()\r\n    if BaiTraffic.reportAt == nil then BaiTraffic.reportAt=now; return end\r\n    if now >= BaiTraffic.reportAt and now-BaiTraffic.reportAt < 5000 then return end\r\n    BaiTraffic.reportAt = now\r\n    BaiDebug.write(\"LAG level=\" .. tostring(BaiTraffic.level()) .. \" window_ms=\" .. tostring(BaiTraffic.interval()) ..\r\n        \" normal_unthrottled=\" .. tostring(BaiTraffic.preserveAttacks()) ..\r\n        \" dance_allowed=\" .. tostring(BaiTraffic.interval() <= 10) ..\r\n        \" requested=\" .. tostring(BaiTraffic.requested or 0) .. \" sent=\" .. tostring(BaiTraffic.sent or 0) ..\r\n        \" suppressed=\" .. tostring(BaiTraffic.suppressed or 0) ..\r\n        \" pending=\" .. tostring((BaiTraffic.move and 1 or 0)+(BaiTraffic.attack and 1 or 0)) ..\r\n        \" startup_wait=\" .. tostring(BaiTraffic.startupWaiting()) .. \" counters=client_API_calls_not_packets\" .. BaiDebug.mode())\r\nend\r\n-- During the one-time startup delay, only work explicitly requested by the\r\n-- player is advanced. No automatic target acquisition/support/tank logic runs.\r\nfunction BaiTraffic.manualStartupStep()\r\n    BaiTraffic.manual = true\r\n    if MyEnemy ~= 0 and MyEnemy == manualCombatTarget and (MyState == CHASE_ST or MyState == ATTACK_ST) then\r\n        if GetV(V_MOTION,MyEnemy) == MOTION_DEAD or IsOutOfSight(MyID,MyEnemy) then\r\n            ResetAutoTarget(); MyState=IDLE_ST; return\r\n        end\r\n        if not IsInAttackSight(MyID,MyEnemy) then\r\n            local x,y = GetV(V_POSITION_APPLY_SKILLATTACKRANGE,MyEnemy,MySkill,MySkillLevel)\r\n            MyDestX,MyDestY=x,y\r\n            Move(MyID,x,y)\r\n            MyState=CHASE_ST\r\n        else\r\n            MyState=ATTACK_ST\r\n            if MySkill ~= 0 then\r\n                if SkillsAllowedByOwnerDistance() then SkillObject(MyID,MySkillLevel,MySkill,MyEnemy); MySkill=0 end\r\n            else\r\n                Attack(MyID,MyEnemy)\r\n            end\r\n        end\r\n    elseif MyState == MOVE_CMD_ST then OnMOVE_CMD_ST()\r\n    elseif MyState == ATTACK_AREA_CMD_ST then OnATTACK_AREA_CMD_ST()\r\n    elseif MyState == PATROL_CMD_ST then OnPATROL_CMD_ST()\r\n    elseif MyState == HOLD_CMD_ST then OnHOLD_CMD_ST()\r\n    elseif MyState == SKILL_AREA_CMD_ST then OnSKILL_AREA_CMD_ST()\r\n    elseif MyState == FRIEND_CIRCLE_ST then OnFRIEND_CIRCLE_ST()\r\n    end\r\nend\r\n\r\n-- Optional diagnostics. This table never selects targets or issues game commands.\r\n-- TraceAI is used for diagnostic logs. Numeric chat IDs use TraceValue, as in\r\n-- the supplied working ID reader. No speculative text-chat API or startup test messages.\r\nfunction BaiDebug.options()\r\n    if type(BAI_CONFIG) ~= \"table\" then return nil end\r\n    local d = BAI_CONFIG.debug\r\n    if type(d) ~= \"table\" or d.enabled ~= true then return nil end\r\n    if d.toTrace ~= true and d.toFile ~= true then return nil end\r\n    return d\r\nend\r\nfunction BaiDebug.enabled(category)\r\n    local d = BaiDebug.options()\r\n    if not d then return false end\r\n    -- Category checkboxes select log content; the numeric chat channel is separate.\r\n    if d.toTrace ~= true and d.toFile ~= true then return false end\r\n    if d.onlyId == true then return category == \"ids\" end\r\n    return d[category] == true\r\nend\r\nfunction BaiDebug.run(fn, ...)\r\n    -- Diagnostics may fail without stopping the actual combat logic.\r\n    if not BaiDebug.options() or type(fn) ~= \"function\" then return end\r\n    pcall(fn, ...)\r\nend\r\nfunction BaiDebug.value(key, actor)\r\n    if key == nil then return nil end\r\n    local ok, a, b = pcall(GetV, key, actor)\r\n    if not ok then return nil end\r\n    return a, b\r\nend\r\n-- Optional follow recorder, enabled by the existing traffic debug category. Counts are exact within each sample; at most eight\r\n-- detailed commands are retained per 250 ms. Excess events are explicitly counted.\r\n-- TraceAI and the dedicated bounded file receive the same lines. File writes are\r\n-- batched once per second; no diagnostic function issues gameplay commands.\r\nfunction BaiDebug.followRun(fn, ...)\r\n    if BaiDebug.enabled(\"traffic\") and type(fn) == \"function\" then pcall(fn, ...) end\r\nend\r\nfunction BaiDebug.followData()\r\n    if not BaiDebug.followRecording then\r\n        BaiDebug.followRecording = { ticks=0, counts={}, decisions={}, events={}, omitted=0, buffer={} }\r\n    end\r\n    return BaiDebug.followRecording\r\nend\r\nfunction BaiDebug.followWrite(body)\r\n    local d = BaiDebug.followData()\r\n    local line = \"[BAI-FOLLOW v0.2.7v3] t=\" .. tostring(GetTick()) .. \" \" .. body\r\n    local options = BaiDebug.options()\r\n    if not options then return end\r\n    if options.toTrace == true and type(BaiDebug.rawTrace) == \"function\" then pcall(BaiDebug.rawTrace, line) end\r\n    if options.toFile == true and #d.buffer < 64 then table.insert(d.buffer, line) end\r\nend\r\nfunction BaiDebug.followFlush(now)\r\n    local d = BaiDebug.followData()\r\n    if d.flushedAt and now >= d.flushedAt and now-d.flushedAt < 1000 then return end\r\n    d.flushedAt = now\r\n    local lines = d.buffer\r\n    d.buffer = {}\r\n    local options = BaiDebug.options()\r\n    if not options or options.toFile ~= true or d.fileStopped or #lines == 0 then return end\r\n    if type(io) ~= \"table\" or type(io.open) ~= \"function\" then d.fileStopped=true; return end\r\n    local ok, file = pcall(io.open, \"./AI/USER_AI/BAI_Follow.log\", \"a\")\r\n    if not ok or not file then d.fileStopped=true; return end\r\n    local written = pcall(function()\r\n        local length = file:seek(\"end\")\r\n        local block = table.concat(lines, \"\\n\") .. \"\\n\"\r\n        if length and length + #block <= 2097152 then\r\n            if not file:write(block) then d.fileStopped=true end\r\n        else d.fileStopped=true end\r\n    end)\r\n    local closed, closeResult = pcall(function() return file:close() end)\r\n    if not closed or not closeResult then d.fileStopped=true end\r\n    if not written then d.fileStopped=true end\r\nend\r\nfunction BaiDebug.followMotion(actor)\r\n    local motion = BaiDebug.value(V_MOTION, actor)\r\n    if motion == MOTION_MOVE then return \"MOVE\" end\r\n    if motion == MOTION_STAND then return \"STAND\" end\r\n    return tostring(motion)\r\nend\r\nfunction BaiDebug.followPositions()\r\n    local owner = BaiDebug.value(V_OWNER, MyID)\r\n    local ox, oy = nil, nil\r\n    if owner and owner ~= 0 then ox, oy = BaiDebug.value(V_POSITION, owner) end\r\n    local mx, my = BaiDebug.value(V_POSITION, MyID)\r\n    local distance = \"UNKNOWN\"\r\n    if type(ox)==\"number\" and type(oy)==\"number\" and type(mx)==\"number\" and type(my)==\"number\" and\r\n       ox>=0 and oy>=0 and mx>=0 and my>=0 then distance=tostring(GetDistance(ox,oy,mx,my)) end\r\n    local path = BaiTraffic.followPath\r\n    return \" owner=\" .. tostring(owner) .. \" owner_pos=\" .. tostring(ox) .. \",\" .. tostring(oy) ..\r\n        \" owner_motion=\" .. (owner and owner~=0 and BaiDebug.followMotion(owner) or \"UNKNOWN\") ..\r\n        \" homu=\" .. tostring(MyID) .. \" homu_pos=\" .. tostring(mx) .. \",\" .. tostring(my) ..\r\n        \" homu_motion=\" .. BaiDebug.followMotion(MyID) .. \" distance=\" .. distance ..\r\n        \" last_follow_owner_pos=\" .. (path and (tostring(path.x)..\",\"..tostring(path.y)) or \"NONE\") ..\r\n        \" last_follow_destination=\" .. (path and path.kind==\"Move\" and (tostring(path.dx)..\",\"..tostring(path.dy)) or \"NATIVE_OR_NONE\") ..\r\n        \" stopped_tries=\" .. tostring(path and path.tries or 0)\r\nend\r\nfunction BaiDebug.followDecision(reason)\r\n    local d = BaiDebug.followData()\r\n    reason = reason or \"UNKNOWN\"\r\n    d.decisions[reason] = (d.decisions[reason] or 0) + 1\r\nend\r\nfunction BaiDebug.followSent(kind, args, reason, arrivalDistance)\r\n    local d = BaiDebug.followData()\r\n    d.counts[kind] = (d.counts[kind] or 0) + 1\r\n    d.lastCommand = kind\r\n    if kind == \"Attack\" then return end -- counted in every sample, never spammed per hit\r\n    if #d.events >= 8 then d.omitted=d.omitted+1; return end\r\n    local details = \"\"\r\n    if reason then details = \" follow_reason=\" .. tostring(reason) .. \" arrival=\" .. tostring(arrivalDistance or 0) end\r\n    if kind == \"Move\" then\r\n        details = details .. \" destination=\" .. tostring(args[2]) .. \",\" .. tostring(args[3])\r\n    elseif kind == \"SkillObject\" or kind == \"SkillGround\" then\r\n        details = \" level=\" .. tostring(args[2]) .. \" skill=\" .. tostring(args[3]) .. \" target=\" .. tostring(args[4])\r\n        if kind == \"SkillGround\" then details=details..\",\"..tostring(args[5]) end\r\n    end\r\n    table.insert(d.events, \"API_CMD at=\" .. tostring(GetTick()) .. \" kind=\" .. kind .. details ..\r\n        \" manual=\" .. tostring(BaiTraffic.manual == true) .. BaiDebug.mode() .. BaiDebug.followPositions())\r\nend\r\nfunction BaiDebug.followStep(command)\r\n    local d = BaiDebug.followData()\r\n    d.ticks = d.ticks + 1\r\n    if command ~= NONE_CMD then d.input=command end\r\nend\r\nfunction BaiDebug.followSample()\r\n    local now = GetTick()\r\n    local d = BaiDebug.followData()\r\n    if d.sampleAt and now >= d.sampleAt and now-d.sampleAt < 250 then return end\r\n    if not d.started then\r\n        BaiDebug.followWrite(\"START movement=azzy_style moving_range=\" .. tostring(BaiTraffic.followDistance(true)) ..\r\n            \" moving_arrival=\" .. tostring(math.abs(BaiTraffic.followDistance(true))+1) ..\r\n            \" stopped_range=\" .. tostring(BaiTraffic.followDistance(false)) ..\r\n            \" refresh=each_follow_cycle\" ..\r\n            \" native_MoveToOwner=fallback_only lag_policy=BAI\" ..\r\n            \" sample_ms=250 max_cmd_details_per_sample=8 file=AI/USER_AI/BAI_Follow.log\" ..\r\n            \" positions=client_GetV_not_server_path calls=not_packets\")\r\n        d.started=true\r\n    end\r\n    if d.config ~= BAI_CONFIG then\r\n        d.config=BAI_CONFIG\r\n        local idle = CurrentIdle() or {}\r\n        BaiDebug.followWrite(\"CONFIG\" .. BaiDebug.mode() .. \" lag=\" .. tostring(BaiTraffic.level()) ..\r\n            \" lag_ms=\" .. tostring(BaiTraffic.interval()) .. \" tank=\" .. tostring(BAI_CONFIG.tankEnabled) ..\r\n            \" idle=\" .. tostring(idle.mode) .. \" radius=\" .. tostring(idle.radius) ..\r\n            \" moving_range=\" .. tostring(BaiTraffic.followDistance(true)) ..\r\n            \" stopped_range=\" .. tostring(BaiTraffic.followDistance(false)) ..\r\n            \" attack_moving=\" .. tostring(BAI_CONFIG.attackWhileOwnerMoving) ..\r\n            \" finish_fight=\" .. tostring(BAI_CONFIG.finishCurrentTargetWhileOwnerMoving) ..\r\n            \" combat_distance=\" .. tostring(BAI_CONFIG.maxCombatDistanceFromOwner) ..\r\n            \" auto_skills=\" .. tostring(BAI_CONFIG.autoSkillsEnabled))\r\n    end\r\n    for _, event in ipairs(d.events) do BaiDebug.followWrite(event) end\r\n    local counts, decisions = {}, {}\r\n    for _, kind in ipairs({\"MoveToOwner\",\"Move\",\"Attack\",\"SkillObject\",\"SkillGround\"}) do\r\n        table.insert(counts, kind .. \":\" .. tostring(d.counts[kind] or 0))\r\n    end\r\n    for _, reason in ipairs({\"FOLLOW_START\",\"FOLLOW_REFRESH\",\"DIRECTED_START\",\"DIRECTED_REFRESH\",\"DIRECTED_STAGE\",\"DIRECTED_STOP\",\"STUCK_CLOSE\",\"STUCK_NATIVE\",\"BOUNCE_NATIVE\",\"LONG_PATH_NATIVE\",\"RECOVERY_RESET\",\"UNKNOWN_POSITION\",\"ARRIVED\",\"SAME_TICK\",\"NO_OWNER\"}) do\r\n        if d.decisions[reason] then table.insert(decisions,reason..\":\"..tostring(d.decisions[reason])) end\r\n    end\r\n    local elapsed = d.sampleAt and now-d.sampleAt or 0\r\n    BaiDebug.followWrite(\"SAMPLE span_ms=\" .. tostring(elapsed) .. \" ticks=\" .. tostring(d.ticks) .. BaiDebug.mode() ..\r\n        BaiDebug.followPositions() .. \" calls=\" .. table.concat(counts,\",\") ..\r\n        \" decisions=\" .. table.concat(decisions,\",\") .. \" details_omitted=\" .. tostring(d.omitted) ..\r\n        \" input=\" .. tostring(d.input or NONE_CMD) .. \" enemy=\" .. tostring(MyEnemy) ..\r\n        \" last_cmd=\" .. tostring(d.lastCommand or \"NONE\") ..\r\n        \" queued_move=\" .. tostring(BaiTraffic.move and BaiTraffic.move.kind or \"NONE\") ..\r\n        \" queued_attack=\" .. tostring(BaiTraffic.attack~=nil) .. \" snipe_pending=\" .. tostring(BaiSnipe.pending~=nil) ..\r\n        \" file_stopped=\" .. tostring(d.fileStopped==true))\r\n    d.sampleAt, d.ticks, d.counts, d.decisions, d.events, d.omitted, d.input = now, 0, {}, {}, {}, 0, nil\r\n    BaiDebug.followFlush(now)\r\nend\r\nfunction BaiDebug.mode()\r\n    local states = { [0]=\"IDLE\", [1]=\"FOLLOW\", [2]=\"CHASE\", [3]=\"ATTACK\" }\r\n    return \" T\" .. tostring(BAI_ACTIVE_T or 1) .. \" state=\" .. (states[MyState] or tostring(MyState)) ..\r\n        \" source=\" .. tostring(currentCombatSource or \"auto\")\r\nend\r\n-- A separate budget prevents verbose file logging from starving ID messages.\r\nfunction BaiDebug.chatId(raw, public)\r\n    local d = BaiDebug.options()\r\n    if not public then return false end\r\n    if type(BaiDebug.rawTraceValue) ~= \"function\" then return false end\r\n    local id = tonumber(raw)\r\n    if not id or id <= 0 or id >= math.huge or id ~= math.floor(id) then return false end\r\n    local window = math.floor(GetTick() / 1000)\r\n    if BaiDebug.chatWindow ~= window then BaiDebug.chatWindow, BaiDebug.chatLines = window, 0 end\r\n    if (BaiDebug.chatLines or 0) >= 8 then return false end\r\n    BaiDebug.chatLines = (BaiDebug.chatLines or 0) + 1\r\n    -- Pass a NUMBER, exactly like TraceValue(mobID) in the supplied client AI.\r\n    -- An absent/throwing client function cannot stop combat or select a target.\r\n    local ok = pcall(BaiDebug.rawTraceValue, id)\r\n    return ok\r\nend\r\nfunction BaiDebug.attacked(actor)\r\n    if type(BAI_CONFIG) ~= \"table\" or BAI_CONFIG.showAttackedMonsterIdsInChat ~= true then return end\r\n    if type(actor) ~= \"number\" or actor <= 0 or IsMonster(actor) ~= 1 then return end\r\n    local raw = tonumber(BaiDebug.value(V_HOMUNTYPE, actor))\r\n    if not raw or raw <= 0 then return end\r\n    local now = GetTick()\r\n    local seen = BaiDebug.attackedSeen or {}\r\n    BaiDebug.attackedSeen = seen\r\n    local previous = seen[actor]\r\n    if previous and previous.raw == raw and now >= previous.at and now - previous.at <= 30000 then\r\n        previous.at = now\r\n        return\r\n    end\r\n    if BaiDebug.chatId(raw, true) then seen[actor] = { raw=raw, at=now } end\r\n    -- Actor IDs may be reused. Keep only recent encounters.\r\n    if not BaiDebug.attackedPruned or now < BaiDebug.attackedPruned or now - BaiDebug.attackedPruned >= 10000 then\r\n        BaiDebug.attackedPruned = now\r\n        for id, entry in pairs(seen) do\r\n            if now < entry.at or now - entry.at > 30000 then seen[id] = nil end\r\n        end\r\n    end\r\nend\r\nfunction BaiDebug.write(body)\r\n    local d = BaiDebug.options()\r\n    if not d or (d.toTrace ~= true and d.toFile ~= true) then return false end\r\n    local now = GetTick()\r\n    local window = math.floor(now / 1000)\r\n    if BaiDebug.window ~= window then BaiDebug.window, BaiDebug.lines = window, 0 end\r\n    if (BaiDebug.lines or 0) >= 24 then return false end\r\n    BaiDebug.lines = (BaiDebug.lines or 0) + 1\r\n    local line = d.onlyId == true and body or (\"[BAI-TRACE v0.2.7v3] t=\" .. tostring(now) .. \" \" .. body)\r\n    if d.toTrace == true and type(BaiDebug.rawTrace) == \"function\" then pcall(BaiDebug.rawTrace, line) end\r\n    if d.toFile == true and type(io) == \"table\" and type(io.open) == \"function\" then\r\n        -- Fixed dedicated diagnostic path; never touches profile/config/game data.\r\n        -- Stop at 2 MiB instead of growing forever; delete/archive the log manually to continue.\r\n        local file = io.open(\"./AI/USER_AI/BAI_Debug.log\", \"a\")\r\n        if file then\r\n            local length = file:seek(\"end\")\r\n            if length and length + #line + 1 <= 2097152 then file:write(line, \"\\n\") end\r\n            file:close()\r\n        end\r\n    end\r\n    return true\r\nend\r\nfunction BaiDebug.event(category, key, body, immediate)\r\n    if not BaiDebug.enabled(category) then return end\r\n    local now = GetTick()\r\n    local d = BaiDebug.options()\r\n    local interval = math.max(250, math.min(10000, tonumber(d.intervalMs) or 1000))\r\n    BaiDebug.last = BaiDebug.last or {}\r\n    local previous = BaiDebug.last[key]\r\n    if previous and now >= previous.at and now - previous.at < interval and\r\n       (not immediate or previous.body == body) then return end\r\n    if BaiDebug.write(body) then BaiDebug.last[key] = { at=now, body=body } end\r\nend\r\nfunction BaiDebug.actor(actor)\r\n    local raw = BaiDebug.value(V_HOMUNTYPE, actor)\r\n    local rule = actor and actor > 0 and MonsterRuleForActor(actor) or nil\r\n    local catalog = rule and rule.catalogId or nil\r\n    local hub = rule and rule.midgardHubId or nil\r\n    local identity = (BAI_CONFIG.monsterIdentities or {})[tonumber(raw) or 0]\r\n    if identity then catalog = catalog or identity.catalogId; hub = hub or identity.midgardHubId end\r\n    return \"actor=\" .. tostring(actor) .. \" ai_id=\" .. tostring(raw) .. \" catalog_id=\" .. tostring(catalog or \"UNKNOWN\") ..\r\n        \" hub_id=\" .. tostring(hub or \"UNKNOWN\") .. \" rule=\" .. tostring(rule and rule.monsterId or \"NONE\")\r\nend\r\nfunction BaiDebug.command(kind, id, level, skill, target)\r\n    if not BaiDebug.enabled(\"skills\") then return end\r\n    if kind == \"Attack\" then\r\n        BaiDebug.event(\"skills\", \"attack\", \"CMD Attack target=\" .. tostring(level) .. BaiDebug.mode(), false)\r\n        return\r\n    end\r\n    local context = BaiDebug.skillContext\r\n    local suffix = context and (\" path=\" .. tostring(context.kind) .. \" global_lv=\" .. tostring(context.level)) or \" path=ManualOrSpecial\"\r\n    BaiDebug.event(\"skills\", \"cmd:\" .. tostring(kind), \"CMD \" .. kind .. \" id=\" .. tostring(skill) ..\r\n        \" SENT_LV=\" .. tostring(level) .. \" target=\" .. tostring(target) .. suffix .. BaiDebug.mode(), true)\r\nend\r\nfunction BaiDebug.skillLevel(actor, fallback, effective, rule)\r\n    if not BaiDebug.enabled(\"skills\") and not BaiDebug.enabled(\"rules\") then return end\r\n    local category = BaiDebug.enabled(\"skills\") and \"skills\" or \"rules\"\r\n    BaiDebug.event(category, \"resolve:\" .. tostring(actor), \"RESOLVE \" .. BaiDebug.actor(actor) ..\r\n        \" global_lv=\" .. tostring(fallback) .. \" effective_lv=\" .. tostring(effective) .. BaiDebug.mode(), true)\r\nend\r\nfunction BaiDebug.rejected(reason, actor)\r\n    if not BaiDebug.enabled(\"reasons\") then return end\r\n    BaiDebug.event(\"reasons\", \"reject:\" .. tostring(actor) .. \":\" .. reason,\r\n        \"INT_REJECT reason=\" .. reason .. \" \" .. BaiDebug.actor(actor) .. \" current=\" .. tostring(MyEnemy) .. BaiDebug.mode(), false)\r\nend\r\nfunction BaiDebug.block(reason)\r\n    if not BaiDebug.enabled(\"reasons\") then return end\r\n    BaiDebug.event(\"reasons\", \"block:\" .. reason, \"INT_BLOCK reason=\" .. reason .. \" target=\" .. tostring(MyEnemy) .. BaiDebug.mode(), false)\r\nend\r\nfunction BaiDebug.accepted(actor, manual)\r\n    if BaiDebug.enabled(\"switches\") then\r\n        BaiDebug.event(\"switches\", \"accepted\", \"ACCEPT old=\" .. tostring(MyEnemy) .. \" new=\" .. tostring(actor) ..\r\n            \" manual=\" .. tostring(manual) .. \" \" .. BaiDebug.actor(actor) .. BaiDebug.mode(), true)\r\n    end\r\nend\r\nfunction BaiDebug.switched(old, new, oldPriority, newPriority, manual)\r\n    BaiDebug.event(\"switches\", \"switch\", \"INT_SWITCH old=\" .. tostring(old) .. \" old_prio=\" .. tostring(oldPriority) ..\r\n        \" new=\" .. tostring(new) .. \" new_prio=\" .. tostring(newPriority) .. \" released_manual=\" .. tostring(manual) .. BaiDebug.mode(), true)\r\nend\r\nfunction BaiDebug.snapshot(command)\r\n    local d = BaiDebug.options()\r\n    if not d then return end\r\n    local now = GetTick()\r\n    -- All throttles/deduplication are reset per T configuration, not shared across T1/T2.\r\n    if BaiDebug.cfg ~= BAI_CONFIG then\r\n        BaiDebug.cfg, BaiDebug.last, BaiDebug.seen, BaiDebug.scanAt = BAI_CONFIG, {}, {}, nil\r\n        BaiDebug.configDone = false\r\n    end\r\n    if BaiDebug.enabled(\"state\") then\r\n        BaiDebug.event(\"state\", \"state\", \"STATE target=\" .. tostring(MyEnemy) ..\r\n            \" client_target=\" .. tostring(BaiDebug.value(V_TARGET,MyID)) .. \" command=\" .. tostring(command) ..\r\n            \" SP=\" .. tostring(BaiDebug.value(V_SP,MyID)) .. BaiDebug.mode(), false)\r\n    end\r\n    if BaiDebug.enabled(\"config\") and not BaiDebug.configDone then\r\n        -- Output one bounded line; individual rules are visible in the rules category.\r\n        BaiDebug.event(\"config\", \"config\", \"CONFIG profile=\" .. tostring(BAI_CONFIG.profileSlot) ..\r\n            \" rules=\" .. tostring(#(BAI_CONFIG.monsterRules or {})) .. \" autoSkills=\" .. tostring(BAI_CONFIG.autoSkillsEnabled) ..\r\n            \" tank=\" .. tostring(BAI_CONFIG.tankEnabled) .. \" config_load=\" .. tostring(configOk) .. BaiDebug.mode(), true)\r\n        BaiDebug.configDone = true\r\n    end\r\n    local interval = math.max(250, math.min(10000, tonumber(d.intervalMs) or 1000))\r\n    if BaiDebug.scanAt and now >= BaiDebug.scanAt and now - BaiDebug.scanAt < interval then return end\r\n    BaiDebug.scanAt = now\r\n    if not (BaiDebug.enabled(\"ids\") or BaiDebug.enabled(\"rules\") or BaiDebug.enabled(\"queries\")) then return end\r\n    BaiDebug.seen = BaiDebug.seen or {}\r\n    local scope = d.scope or \"Target\"\r\n    local targets = scope == \"Target\" and { MyEnemy } or TickActors()\r\n    local seenThisTick, count = {}, 0\r\n    for _,actor in ipairs(targets) do\r\n        if type(actor) == \"number\" and actor > 0 and not seenThisTick[actor] and IsMonster(actor) == 1 and\r\n           BaiDebug.value(V_MOTION, actor) ~= MOTION_DEAD then\r\n            seenThisTick[actor] = true\r\n            local distance = GetDistance2(MyID, actor)\r\n            if scope ~= \"Nearby\" or (distance >= 0 and distance <= (tonumber(d.distance) or 2)) then\r\n                local raw = tonumber(BaiDebug.value(V_HOMUNTYPE, actor))\r\n                if raw and raw > 0 then\r\n                    local known = BaiDebug.seen[actor]\r\n                    if known and (known.raw ~= raw or now < known.at or now-known.at > 30000) then known = nil end\r\n                    known = known or { raw=raw }\r\n                    known.at = now\r\n                    BaiDebug.seen[actor] = known\r\n                    if BaiDebug.enabled(\"ids\") and (not d.once or not known.printed) then\r\n                        local body = d.onlyId == true and tostring(raw) or (\"MONSTER_ID \" .. BaiDebug.actor(actor) .. BaiDebug.mode())\r\n                        if BaiDebug.write(body) then known.printed = true end\r\n                    end\r\n                    if BaiDebug.enabled(\"rules\") then\r\n                        local rule = MonsterRuleForActor(actor)\r\n                        BaiDebug.event(\"rules\", \"rule:\" .. tostring(actor), \"RULE \" .. BaiDebug.actor(actor) ..\r\n                            \" skill_lv=\" .. tostring(rule and rule.skillLevel or \"GLOBAL\") ..\r\n                            \" priority=\" .. tostring(rule and rule.priority or 5) ..\r\n                            \" interrupt=\" .. tostring(rule and rule.interruptCurrentTarget == true or false) ..\r\n                            \" also_manual=\" .. tostring(rule and rule.interruptManualTargets == true or false), false)\r\n                    end\r\n                    if BaiDebug.enabled(\"queries\") and not known.probed then\r\n                        local query = \"ID_PROBE actor=\" .. tostring(actor) .. \" V_TYPE[\" .. tostring(V_TYPE) .. \"]=\" ..\r\n                            tostring(BaiDebug.value(V_TYPE,actor)) .. \" V_HOMUNTYPE[\" .. tostring(V_HOMUNTYPE) .. \"]=\" ..\r\n                            tostring(raw) .. \" V_MERTYPE[\" .. tostring(V_MERTYPE) .. \"]=\" .. tostring(BaiDebug.value(V_MERTYPE,actor))\r\n                        if BaiDebug.write(query) then known.probed = true end\r\n                    end\r\n                end\r\n            end\r\n            count = count + 1\r\n            if count >= 64 then break end\r\n        end\r\n    end\r\n    -- Bound caches; \"once\" means once per encounter, reset after 30 s unseen or an AI reload.\r\n    for actor,entry in pairs(BaiDebug.seen) do\r\n        if now < entry.at or now-entry.at > 30000 then BaiDebug.seen[actor] = nil end\r\n    end\r\n    for key,entry in pairs(BaiDebug.last or {}) do\r\n        if now < entry.at or now-entry.at > 30000 then BaiDebug.last[key] = nil end\r\n    end\r\nend\r\n\r\nfunction AfterSkill(myid)\r\n    if myid==MyID and BaiTank.wait and BaiTank.wait.kind==\"SkillObject\" then BaiTank.wait.completed=true end\r\n    if BaiSnipe.pending and myid == MyID then\r\n        BaiSnipe.log(\"CALLBACK target=\" .. tostring(BaiSnipe.pending.actor) ..\r\n            \" evidence=AFTER_SKILL hits=UNKNOWN\", false)\r\n    end\r\n    -- No cooldown value is exposed by the official AI API.\r\n    -- This event only tells us that a skill completed.\r\n    lastAnySkillUse = GetTick()\r\nend\r\n\r\nlocal function RunAiTick(myid)\r\n    MyID = myid\r\n    if BAI_CONFIG.partyEnabled == true then EnsurePartyFriendsLoaded() end\r\n\r\n    local msg = GetMsg(myid)\r\n    local rmsg = GetResMsg(myid)\r\n\r\n    if msg[1] == NONE_CMD then\r\n        if rmsg[1] ~= NONE_CMD and List.size(ResCmdList) < 10 then\r\n            L dle movement to start immediately on the next AI tick.\r\n    acceptedCombatTarget = 0\r\n    manualCombatTarget = 0\r\n    lastIdleTick = 0\r\n    if hadCombatTarget then returnToOwnerAfterCombat = true end\r\nend\r\n\r\nlocal function DistanceFromOwner()\r\n    return GetDistanceFromOwner(MyID)\r\nend\r\n\r\nlocal function CurrentIdle()\r\n    if BAI_Passive then return BAI_CONFIG.passiveIdle end\r\n    return BAI_CONFIG.aggressiveIdle\r\nend\r\n\r\n-- Distances belong to the active T mode's existing idle/movement settings.\r\nfunction BaiTraffic.followDistance(moving)\r\n    local idle = CurrentIdle() or {}\r\n    local value = tonumber(moving and idle.movingFollowDistance or idle.stoppedFollowDistance)\r\n    if not value then\r\n        if moving then value=1\r\n        elseif idle.mode==\"Still\" or idle.mode==\"FollowOwner\" then value=tonumber(idle.radius) or 3\r\n        else value=math.min(3,tonumber(idle.radius) or 3) end\r\n    end\r\n    if value~=value then value=1 end\r\n    return math.max(-14,math.min(14,math.floor(value)))\r\nend\r\n-- The client exposes position, not facing. Only recent, continuous position\r\n-- changes provide a heading; never project a teleport or a stale observation.\r\nfunction BaiTraffic.observeHeading(owner,x,y,now)\r\n    if not owner or owner==0 or type(x)~=\"number\" or type(y)~=\"number\" or\r\n       x~=x or y~=y or x<0 or y<0 then\r\n        BaiTraffic.ownerHeading=nil\r\n        return\r\n    end\r\n    local h=BaiTraffic.ownerHeading\r\n    if not h or h.owner~=owner or now<h.sampleAt or\r\n       (now-h.sampleAt>1000 and (x~=h.x or y~=h.y)) then\r\n        BaiTraffic.ownerHeading={owner=owner,x=x,y=y,sampleAt=now}\r\n        return\r\n    end\r\n    local dx,dy=x-h.x,y-h.y\r\n    local span=math.max(math.abs(dx),math.abs(dy))\r\n    if span>15 then\r\n        h.dx,h.dy,h.changedAt=nil,nil,nil\r\n    elseif span>0 then\r\n        h.dx,h.dy,h.changedAt=dx/span,dy/span,now\r\n    end\r\n    h.x,h.y,h.sampleAt=x,y,now\r\nend\r\nfunction BaiTraffic.followTarget(owner,x,y,now,moving)\r\n    local distance=BaiTraffic.followDistance(moving)\r\n    if distance==0 then return x,y end\r\n    local h=BaiTraffic.ownerHeading\r\n    if not h or h.owner~=owner or not h.changedAt or\r\n       now<h.changedAt or (moving and now-h.changedAt>=500) then return nil end\r\n    -- At rest keep the last known heading: a forward stand position must not\r\n    -- disappear when the movement observation's freshness window expires.\r\n    -- Positive is behind; negative is ahead. Use map-cell distance and round\r\n    -- symmetrically so mirrored directions produce mirrored destinations.\r\n    local function round(value)\r\n        if value<0 then return -math.floor(-value+0.5) end\r\n        return math.floor(value+0.5)\r\n    end\r\n    local dx,dy=round(-h.dx*distance),round(-h.dy*distance)\r\n    if x+dx<0 or y+dy<0 then return nil end\r\n    return x+dx,y+dy\r\nend\r\nfunction BaiTraffic.ownerFollowDistance()\r\n    local owner = GetV(V_OWNER,MyID)\r\n    if not owner or owner==0 then return -1 end\r\n    local ox,oy=GetV(V_POSITION,owner)\r\n    local mx,my=GetV(V_POSITION,MyID)\r\n    if type(ox)~=\"number\" or type(oy)~=\"number\" or type(mx)~=\"number\" or type(my)~=\"number\" or\r\n       ox<0 or oy<0 or mx<0 or my<0 then return -1 end\r\n    -- Follow geometry uses square map cells; diagonal targets must satisfy the\r\n    -- same arrival metric, otherwise a finished path can block idle routes.\r\n    return math.max(math.abs(ox-mx),math.abs(oy-my))\r\nend\r\n\r\nlocal function OwnerIsMoving()\r\n    local owner = GetV(V_OWNER, MyID)\r\n    if owner == 0 then\r\n        observedOwner, observedOwnerX, observedOwnerY = nil, nil, nil\r\n        ownerStoppedSince = nil\r\n        BaiTraffic.ownerHeading = nil\r\n        return false\r\n    end\r\n\r\n    local now = GetTick()\r\n    local x, y = GetV(V_POSITION, owner)\r\n    BaiTraffic.observeHeading(owner,x,y,now)\r\n    local validPosition = type(x) == \"number\" and type(y) == \"number\" and x >= 0 and y >= 0\r\n    local changedPosition = validPosition and observedOwner == owner and observedOwnerX ~= nil and\r\n        (x ~= observedOwnerX or y ~= observedOwnerY)\r\n    if observedOwner ~= owner then ownerStoppedSince = nil end\r\n    observedOwner = owner\r\n    if validPosition then observedOwnerX, observedOwnerY = x, y\r\n    else observedOwnerX, observedOwnerY = nil, nil end\r\n\r\n    -- Position updates also count as movement when the client briefly reports\r\n    -- a standing/other animation. Repeated checks in one tick retain the grace.\r\n    if GetV(V_MOTION, owner) == MOTION_MOVE or changedPosition then\r\n        ownerStoppedSince = nil\r\n        return true\r\n    end\r\n\r\n    -- After the owner stops, keep treating him as moving for 500 ms.\r\n    -- This prevents the AI from immediately switching back to route/aggro\r\n    -- during tiny pauses between movement updates.\r\n    if ownerStoppedSince == nil or now < ownerStoppedSince then\r\n        ownerStoppedSince = now\r\n    end\r\n\r\n    return now - ownerStoppedSince < 500\r\nend\r\n\r\nfunction BaiTraffic.atStoppedPosition()\r\n    local owner=GetV(V_OWNER,MyID)\r\n    if not owner or owner==0 then return false end\r\n    local ox,oy=GetV(V_POSITION,owner)\r\n    local mx,my=GetV(V_POSITION,MyID)\r\n    if type(ox)~=\"number\" or type(oy)~=\"number\" or type(mx)~=\"number\" or type(my)~=\"number\" or\r\n       ox<0 or oy<0 or mx<0 or my<0 then return false end\r\n    local tx,ty=BaiTraffic.followTarget(owner,ox,oy,GetTick(),false)\r\n    if tx then return mx==tx and my==ty end\r\n    -- Without a known direction, retain ordinary near-owner following.\r\n    return math.max(math.abs(mx-ox),math.abs(my-oy))<=math.abs(BaiTraffic.followDistance(false))\r\nend\r\n\r\nlocal function FollowMovingOwner()\r\n    local owner = GetV(V_OWNER, MyID)\r\n    if owner ~= 0 then\r\n        returnToOwnerAfterMovement = true\r\n        local distance = math.abs(BaiTraffic.followDistance(true))\r\n        MoveToOwner(MyID, distance + 1, distance, \"moving\")\r\n    end\r\nend\r\n\r\nlocal function MoveNearOwner(x, y)\r\n    local ownerX, ownerY = GetV(V_POSITION, GetV(V_OWNER, MyID))\r\n    Move(MyID, ownerX + x, ownerY + y)\r\nend\r\n\r\nlocal function RunIdleMovement()\r\n    -- This entry is also used by Tank with no mobs and by post-combat regroup.\r\n    -- Neither may resume a stationary route while the owner is walking away.\r\n    if OwnerIsMoving() then\r\n        FollowMovingOwner()\r\n        return\r\n    end\r\n    local cfg = CurrentIdle()\r\n    if cfg == nil then return end\r\n\r\n    local mode = cfg.mode or \"Still\"\r\n    local radius = math.max(1, tonumber(cfg.radius) or 3)\r\n    local interval = math.max(250, tonumber(cfg.intervalMs) or 2500)\r\n    local now = GetTick()\r\n\r\n    -- After following or an automatic/manual fight, regroup before resuming\r\n    -- Still/Wander/Orbit/Route. This prevents the Homu from remaining at the\r\n    -- position of the last defeated target.\r\n    if returnToOwnerAfterCombat or returnToOwnerAfterMovement then\r\n        local returnDistance = math.abs(BaiTraffic.followDistance(false))\r\n        if not BaiTraffic.atStoppedPosition() or (BaiTraffic.followPath and BaiTraffic.followPath.directedFollow) then\r\n            MoveToOwner(MyID, returnDistance, returnDistance, \"stopped\")\r\n            return\r\n        end\r\n        returnToOwnerAfterCombat = false\r\n        returnToOwnerAfterMovement = false\r\n        lastIdleTick = 0\r\n        -- Start idle movement from a clean movement state. Otherwise an old\r\n        -- route target from before combat can immediately time out and leave\r\n        -- the Homu standing at the owner instead of resuming the route.\r\n        routeTargetX = nil\r\n        routeTargetY = nil\r\n        routeMoveStarted = 0\r\n    end\r\n\r\n    if mode == \"Still\" or mode == \"FollowOwner\" then\r\n        -- Both modes hold the selected stand position; roaming uses the other modes.\r\n        local stopDistance = math.abs(BaiTraffic.followDistance(false))\r\n        if not BaiTraffic.atStoppedPosition() then\r\n            MoveToOwner(MyID, stopDistance, stopDistance, \"stopped\")\r\n        end\r\n        return\r\n    end\r\n\r\n    if now - lastIdleTick < interval then\r\n        return\r\n    end\r\n    lastIdleTick = now\r\n\r\n    if mode == \"Wander\" then\r\n        local dx = math.random(-radius, radius)\r\n        local dy = math.random(-radius, radius)\r\n        -- Avoid constantly choosing the owner's exact cell.\r\n        if dx == 0 and dy == 0 then dx = 1 end\r\n        MoveNearOwner(dx, dy)\r\n        return\r\n    end\r\n\r\n    if mode == \"Orbit\" then\r\n        local points = {\r\n            { radius, 0 }, { radius, radius }, { 0, radius }, { -radius, radius },\r\n            { -radius, 0 }, { -radius, -radius }, { 0, -radius }, { radius, -radius }\r\n        }\r\n        local p = points[orbitStep]\r\n        MoveNearOwner(p[1], p[2])\r\n        orbitStep = orbitStep + 1\r\n        if orbitStep > #points then orbitStep = 1 end\r\n    end\r\n    if mode == \"Route\" then\r\n        local route = cfg.route or {}\r\n        if #route == 0 then return end\r\n        if routeStep > #route then routeStep = 1 end\r\n\r\n        local owner = GetV(V_OWNER, MyID)\r\n        local ownerX, ownerY = GetV(V_POSITION, owner)\r\n        local myX, myY = GetV(V_POSITION, MyID)\r\n        local tolerance = math.max(0, tonumber(cfg.routeArrivalTolerance) or 0)\r\n        local timeoutMs = math.max(1000, tonumber(cfg.routeTimeoutMs) or 5000)\r\n\r\n        local p = route[routeStep]\r\n        local tx = ownerX + (tonumber(p.x) or 0)\r\n        local ty = ownerY + (tonumber(p.y) or 0)\r\n\r\n        -- If the owner moved, the waypoint moves with the owner too.\r\n        if routeTargetX ~= tx or routeTargetY ~= ty then\r\n            routeTargetX, routeTargetY = tx, ty\r\n            routeMoveStarted = now\r\n            Move(MyID, tx, ty)\r\n            return\r\n        end\r\n\r\n        local reached = GetDistance(myX, myY, tx, ty) <= tolerance\r\n        local timedOut = (now - routeMoveStarted) >= timeoutMs\r\n\r\n        if reached or timedOut then\r\n            routeStep = routeStep + 1\r\n            if routeStep > #route then routeStep = 1 end\r\n            routeTargetX, routeTargetY = nil, nil\r\n            routeMoveStarted = 0\r\n            lastIdleTick = now\r\n            return\r\n        end\r\n\r\n        -- Re-issue movement if the homunculus stopped before reaching the point.\r\n        if GetV(V_MOTION, MyID) == MOTION_STAND then\r\n            Move(MyID, tx, ty)\r\n        end\r\n    end\r\nend\r\n\r\nlocal function PartyFriendFilePath()\r\n    local owner = GetV(V_OWNER, MyID)\r\n    return \"./AI/USER_AI/BAI_Friends_\" .. tostring(owner or 0) .. \".txt\"\r\nend\r\n\r\nlocal function SavePartyFriends()\r\n    if BAI_CONFIG.partyEnabled ~= true then return end\r\n    local ids = {}\r\n    for actor, enabled in pairs(partyFriends) do\r\n        if enabled == true and tonumber(actor) and tonumber(actor) > 0 then\r\n            table.insert(ids, tonumber(actor))\r\n        end\r\n    end\r\n    table.sort(ids)\r\n    local file = io.open(PartyFriendFilePath(), \"w\")\r\n    if file == nil then\r\n        TraceAI(\"BAI: could not save friend list\")\r\n        return\r\n    end\r\n    for _, actor in ipairs(ids) do\r\n        file:write(tostring(actor), \"\\n\")\r\n    end\r\n    file:close()\r\nend\r\n\r\nlocal function EnsurePartyFriendsLoaded()\r\n    if partyFriendsLoaded then return end\r\n    partyFriendsLoaded = true\r\n    partyFriends = {}\r\n\r\n    -- Keep v36/manual profile IDs as a one-time compatibility seed.\r\n    for _, friendId in ipairs(BAI_CONFIG.partyMemberActorIds or {}) do\r\n        local actor = tonumber(friendId) or 0\r\n        if actor > 0 then partyFriends[actor] = true end\r\n    end\r\n\r\n    local file = io.open(PartyFriendFilePath(), \"r\")\r\n    if file ~= nil then\r\n        for line in file:lines() do\r\n            local actor = tonumber(line)\r\n            if actor ~= nil and actor > 0 then partyFriends[actor] = true end\r\n        end\r\n        file:close()\r\n    elseif next(partyFriends) ~= nil then\r\n        SavePartyFriends()\r\n    end\r\nend\r\n\r\nlocal function IsPartyMember(actor)\r\n    if BAI_CONFIG.partyEnabled ~= true or actor == nil or actor == 0 then return false end\r\n    EnsurePartyFriendsLoaded()\r\n    return partyFriends[tonumber(actor) or 0] == true\r\nend\r\n\r\nlocal function FriendCircleResetWaypoint()\r\n    friendMotionWaypointX = nil\r\n    friendMotionWaypointY = nil\r\n    friendMotionWaypointStarted = 0\r\nend\r\n\r\nlocal function FriendCircleFinishCurrent()\r\n    if friendMotionPendingAction == \"add\" and friendMotionActor ~= 0 then\r\n        partyFriends[friendMotionActor] = true\r\n        SavePartyFriends()\r\n        TraceAI(\"BAI: friend added \" .. tostring(friendMotionActor))\r\n    elseif friendMotionPendingAction == \"remove\" and friendMotionActor ~= 0 then\r\n        partyFriends[friendMotionActor] = nil\r\n        SavePartyFriends()\r\n        TraceAI(\"BAI: friend removed \" .. tostring(friendMotionActor))\r\n    end\r\n    friendMotionPendingAction = nil\r\nend\r\n\r\nlocal function FriendCircleStartActor(actor, rounds, pendingAction)\r\n    friendMotionActor = actor or 0\r\n    friendMotionRounds = math.max(1, tonumber(rounds) or 1)\r\n    friendMotionRound = 1\r\n    friendMotionStep = 1\r\n    friendMotionPendingAction = pendingAction\r\n    FriendCircleResetWaypoint()\r\n    ResetAutoTarget()\r\n    MyEnemy = 0\r\n    MySkill = 0\r\n    MyState = FRIEND_CIRCLE_ST\r\nend\r\n\r\nlocal function StartFriendToggle(actor)\r\n    EnsurePartyFriendsLoaded()\r\n    if actor == nil or actor == 0 or actor == MyID then return false end\r\n    if IsMonster(actor) == 1 then return false end\r\n    local action = IsPartyMember(actor) and \"remove\" or \"add\"\r\n    friendMotionQueue = {}\r\n    friendMotionQueueIndex = 0\r\n    FriendCircleStartActor(actor, 2, action)\r\n    return true\r\nend\r\n\r\nlocal function StartFriendShowcase()\r\n    EnsurePartyFriendsLoaded()\r\n    local owner = GetV(V_OWNER, MyID)\r\n    friendMotionQueue = {}\r\n    friendMotionQueueIndex = 1\r\n    if owner ~= nil and owner ~= 0 then table.insert(friendMotionQueue, owner) end\r\n\r\n    for _, actor in ipairs(TickActors()) do\r\n        if actor ~= owner and actor ~= MyID and IsPartyMember(actor) and GetV(V_MOTION, actor) ~= MOTION_DEAD then\r\n            table.insert(friendMotionQueue, actor)\r\n        end\r\n    end\r\n\r\n    if #friendMotionQueue == 0 then return false end\r\n    FriendCircleStartActor(friendMotionQueue[1], 1, nil)\r\n    return true\r\nend\r\n\r\nlocal function FriendCircleAdvanceActor()\r\n    FriendCircleFinishCurrent()\r\n    if #friendMotionQueue > 0 then\r\n        friendMotionQueueIndex = friendMotionQueueIndex + 1\r\n        if friendMotionQueueIndex <= #friendMotionQueue then\r\n            FriendCircleStartActor(friendMotionQueue[friendMotionQueueIndex], 1, nil)\r\n            return\r\n        end\r\n    end\r\n    friendMotionQueue = {}\r\n    friendMotionQueueIndex = 0\r\n    friendMotionActor = 0\r\n    FriendCircleResetWaypoint()\r\n    MyState = IDLE_ST\r\nend\r\n\r\nlocal function OnFRIEND_CIRCLE_ST()\r\n    if BAI_CONFIG.partyEnabled ~= true or friendMotionActor == 0 then\r\n        FriendCircleAdvanceActor()\r\n        return\r\n    end\r\n\r\n    local tx, ty = GetV(V_POSITION, friendMotionActor)\r\n    if tx == nil or ty == nil or (tx == 0 and ty == 0) then\r\n        FriendCircleAdvanceActor()\r\n        return\r\n    end\r\n\r\n    local offsets = {\r\n        {0, -1},\r\n        {1, 0},\r\n        {0, 1},\r\n        {-1, 0}\r\n    }\r\n    local offset = offsets[friendMotionStep] or offsets[1]\r\n    local wx, wy = tx + offset[1], ty + offset[2]\r\n    local now = GetTick()\r\n\r\n    if friendMotionWaypointX ~= wx or friendMotionWaypointY ~= wy then\r\n        friendMotionWaypointX, friendMotionWaypointY = wx, wy\r\n        friendMotionWaypointStarted = now\r\n        Move(MyID, wx, wy)\r\n        return\r\n    end\r\n\r\n    local mx, my = GetV(V_POSITION, MyID)\r\n    local reached = mx == wx and my == wy\r\n    local timedOut = now - friendMotionWaypointStarted >= 700\r\n    if not reached and not timedOut then\r\n        if GetV(V_MOTION, MyID) == MOTION_STAND then Move(MyID, wx, wy) end\r\n        return\r\n    end\r\n\r\n    friendMotionStep = friendMotionStep + 1\r\n    FriendCircleResetWaypoint()\r\n    if friendMotionStep <= 4 then return end\r\n\r\n    friendMotionStep = 1\r\n    friendMotionRound = friendMotionRound + 1\r\n    if friendMotionRound <= friendMotionRounds then return end\r\n    FriendCircleAdvanceActor()\r\nend\r\n\r\nlocal function PartyMemberTargeting(monster)\r\n    if BAI_CONFIG.partyEnabled ~= true or BAI_CONFIG.partyAssistMembers ~= true then return false end\r\n    for _, actor in ipairs(TickActors()) do\r\n        if IsPartyMember(actor) and GetV(V_MOTION, actor) ~= MOTION_DEAD and GetV(V_TARGET, actor) == monster then\r\n            return true\r\n        end\r\n    end\r\n    return false\r\nend\r\n\r\nlocal function MonsterDbId(actor)\r\n    local ok, mobId = pcall(GetV, V_HOMUNTYPE, actor)\r\n    if not ok then return nil end\r\n    return tonumber(mobId)\r\nend\r\n\r\nBaiCombat = { targets = {}, blocked = {} }\r\nfunction BaiCombat.begin()\r\n    local now = GetTick()\r\n    local owner = GetV(V_OWNER, MyID)\r\n    local x, y = GetV(V_POSITION, owner)\r\n    if BaiCombat.config ~= BAI_CONFIG or BaiCombat.id ~= MyID or\r\n       (BaiCombat.tick and now < BaiCombat.tick) or\r\n       (x and y and BaiCombat.x and GetDistance(x, y, BaiCombat.x, BaiCombat.y) > 15) then\r\n        BaiCombat.targets = {}; BaiCombat.blocked = {}\r\n    end\r\n    BaiCombat.config, BaiCombat.id, BaiCombat.tick = BAI_CONFIG, MyID, now\r\n    BaiCombat.x, BaiCombat.y = x, y\r\n    for actor, p in pairs(BaiCombat.targets) do\r\n        if now - p.seen > 20000 then BaiCombat.targets[actor] = nil end\r\n    end\r\n    for actor, p in pairs(BaiCombat.blocked) do\r\n        if now >= p.untilAt or IsOutOfSight(MyID, actor) or\r\n           MonsterDbId(actor) ~= p.raw then BaiCombat.blocked[actor] = nil end\r\n    end\r\nend\r\nfunction BaiCombat.isBlocked(actor)\r\n    local p = BaiCombat.blocked[actor]\r\n    return p ~= nil and GetTick() < p.untilAt and MonsterDbId(actor) == p.raw\r\nend\r\nfunction BaiCombat.stalled()\r\n    local actor = MyEnemy\r\n    -- Explicit commands and PvP remain under player control. Bound tank mobs\r\n    -- intentionally wait at the owner, so their lack of progress is expected.\r\n    if actor == 0 or actor == manualCombatTarget or IsMonster(actor) ~= 1 or\r\n       currentPvpAction == \"TankBound\" or\r\n       (MyState ~= CHASE_ST and MyState ~= ATTACK_ST) then return false end\r\n    if GetV(V_MOTION, actor) == MOTION_DEAD or IsOutOfSight(MyID, actor) then return false end\r\n    local now, distance = GetTick(), GetDistance2(MyID, actor)\r\n    local sp = tonumber(GetV(V_SP, MyID))\r\n    local ok, hp = pcall(GetV, V_HP, actor)\r\n    hp = ok and tonumber(hp) or nil\r\n    if hp and hp <= 0 then hp = nil end -- enemy HP is not exposed by every client\r\n    local p = BaiCombat.targets[actor]\r\n    if not p or p.raw ~= MonsterDbId(actor) then\r\n        p = { raw=MonsterDbId(actor), at=now, distance=distance, hp=hp, sp=sp, state=MyState }\r\n        BaiCombat.targets[actor] = p\r\n    end\r\n    p.seen = now\r\n    if p.state ~= MyState or (distance >= 0 and distance < p.distance) or\r\n       (hp and p.hp and hp < p.hp) then\r\n        p.at, p.distance = now, distance\r\n    end\r\n    -- When enemy HP is unavailable, accept attack motion as a conservative\r\n    -- fallback. Never declare a working fight stuck merely because HP is hidden.\r\n    if not hp and MyState == ATTACK_ST and GetV(V_MOTION, MyID) == MOTION_ATTACK then p.at = now end\r\n    if not hp and sp and p.sp and sp < p.sp then p.at = now end\r\n    p.hp, p.sp, p.state = hp, sp, MyState\r\n    local timeout = MyState == CHASE_ST and 8000 or 15000\r\n    if now - p.at < timeout then return false end\r\n    BaiCombat.blocked[actor] = { raw=p.raw, untilAt=now + 10000 }\r\n    BaiCombat.targets[actor] = nil\r\n    BaiDebug.run(BaiDebug.event, \"reasons\", \"unreachable:\" .. tostring(actor),\r\n        \"TARGET_WAIT reason=NO_PROGRESS target=\" .. tostring(actor) .. \" retry_ms=10000\" .. BaiDebug.mode(), false)\r\n    return true\r\nend\r\n\r\nlocal function IsMonsterFreeForUs(monster)\r\n    if monster ~= manualCombatTarget and BaiCombat.isBlocked(monster) then return false end\r\n    if not BAI_CONFIG.preventKillSteal then return true end\r\n    -- Explicit manual commands stay under player control. Automatic targets are\r\n    -- re-checked continuously so BAI drops them if another player takes the fight.\r\n    if monster == manualCombatTarget then return true end\r\n\r\n    local owner = GetV(V_OWNER, MyID)\r\n    local monsterTarget = GetV(V_TARGET, monster)\r\n    if monsterTarget == owner or monsterTarget == MyID or IsPartyMember(monsterTarget) then return true end\r\n    if GetV(V_TARGET, owner) == monster or PartyMemberTargeting(monster) then return true end\r\n\r\n    -- Some monsters temporarily target themselves while buffing. That is not KS.\r\n    if monsterTarget == monster then\r\n        local actors = TickActors()\r\n        for _, actor in ipairs(actors) do\r\n            if actor ~= MyID and actor ~= owner and actor ~= monster and not IsPartyMember(actor) then\r\n                local motion = GetV(V_MOTION, actor)\r\n                if motion ~= MOTION_DEAD and GetV(V_TARGET, actor) == monster then\r\n                    return false\r\n                end\r\n            end\r\n        end\r\n        return true\r\n    end\r\n\r\n    local actors = TickActors()\r\n    for _, actor in ipairs(actors) do\r\n        if actor ~= MyID and actor ~= owner and actor ~= monster and not IsPartyMember(actor) then\r\n            local motion = GetV(V_MOTION, actor)\r\n            if motion ~= MOTION_DEAD and GetV(V_TARGET, actor) == monster then\r\n                return false\r\n            end\r\n        end\r\n    end\r\n    if monsterTarget ~= 0 and monsterTarget ~= owner and monsterTarget ~= MyID and not IsPartyMember(monsterTarget) then return false end\r\n    return true\r\nend\r\n\r\nlocal currentCombatSource = \"auto\"\r\n\r\nlocal function AcceptCombatTarget(monster, manual, source)\r\n    BaiTraffic.cancel(false)\r\n    acceptedCombatTarget = monster\r\n    if manual then\r\n        manualCombatTarget = monster\r\n        currentCombatSource = \"manual\"\r\n    else\r\n        manualCombatTarget = 0\r\n        currentCombatSource = source or \"auto\"\r\n    end\r\n    BaiDebug.run(BaiDebug.accepted, monster, manual == true)\r\nend\r\n\r\nlocal function IsPassiveDefenseTarget(target)\r\n    if not BAI_Passive or target == 0 then return false end\r\n    if currentPvpAction ~= nil and target == acceptedCombatTarget then return true end\r\n    local owner = GetV(V_OWNER, MyID)\r\n    if BAI_CONFIG.passiveProtectOwner and GetV(V_TARGET, target) == owner then return true end\r\n    if BAI_CONFIG.passiveProtectSelf and GetV(V_TARGET, target) == MyID then return true end\r\n    return target == acceptedCombatTarget\r\nend\r\n\r\nlocal function BeyondCombatDistance()\r\n    local owner=GetV(V_OWNER,MyID)\r\n    if owner==0 then return false end\r\n    local maxDistance=math.max(1,math.min(30,tonumber(BAI_CONFIG.maxCombatDistanceFromOwner) or 12))\r\n    local d=GetDistance2(owner,MyID)\r\n    return d==-1 or d>maxDistance\r\nend\r\n\r\nlocal function SkillsAllowedByOwnerDistance()\r\n    local owner=GetV(V_OWNER,MyID)\r\n    if owner==0 then return true end\r\n    local maxDistance=math.max(1,math.min(30,tonumber(BAI_CONFIG.maxSkillDistanceFromOwner) or 8))\r\n    local d=GetDistance2(owner,MyID)\r\n    return d~=-1 and d<=maxDistance\r\nend\r\n\r\nlocal MonsterActionAllowed\r\n\r\nlocal function PickAssistTarget()\r\n    local owner = GetV(V_OWNER, MyID)\r\n    local target = owner ~= 0 and GetV(V_TARGET, owner) or 0\r\n    if target ~= 0 and IsMonster(target) == 1 and GetV(V_MOTION, target) ~= MOTION_DEAD and MonsterActionAllowed(target) and IsMonsterFreeForUs(target) then\r\n        return target\r\n    end\r\n\r\n    if BAI_CONFIG.partyEnabled == true and BAI_CONFIG.partyAssistMembers == true then\r\n        local bestAssist, bestAssistDistance = 0, 99999\r\n        EnsurePartyFriendsLoaded()\r\n        for _, actor in ipairs(TickActors()) do\r\n            if IsPartyMember(actor) and GetV(V_MOTION, actor) ~= MOTION_DEAD then\r\n                local partyTarget = GetV(V_TARGET, actor)\r\n                if partyTarget ~= 0 and IsMonster(partyTarget) == 1 and GetV(V_MOTION, partyTarget) ~= MOTION_DEAD and MonsterActionAllowed(partyTarget) and IsMonsterFreeForUs(partyTarget) then\r\n                    local d = GetDistance2(MyID, partyTarget)\r\n                    if d ~= -1 and d < bestAssistDistance then bestAssist, bestAssistDistance = partyTarget, d end\r\n                end\r\n            end\r\n        end\r\n        if bestAssist ~= 0 then return bestAssist end\r\n    end\r\n    return 0\r\nend\r\n\r\nlocal function CurrentPvpMode()\r\n    if BAI_Passive then\r\n        return BAI_CONFIG.pvpPassive or {}\r\n    end\r\n    return BAI_CONFIG.pvpAggressive or {}\r\nend\r\n\r\nlocal function PvpRuleForActor(actor)\r\n    if actor == nil or actor == 0 then return nil, nil end\r\n    if IsMonster(actor) == 1 then return nil, nil end\r\n\r\n    local owner = GetV(V_OWNER, MyID)\r\n    if actor == MyID or actor == owner then return nil, nil end\r\n\r\n    local ok, jobId = pcall(GetV, V_HOMUNTYPE, actor)\r\n    if not ok or jobId == nil then return nil, nil end\r\n    jobId = tonumber(jobId)\r\n    if jobId == nil then return nil, nil end\r\n\r\n    local rules = BAI_CONFIG.pvpClassRules or {}\r\n    for _, rule in ipairs(rules) do\r\n        if tonumber(rule.jobId) == jobId then\r\n            return rule, jobId\r\n        end\r\n    end\r\n\r\n    -- Keine Klassenregel: Job-ID bleibt bekannt, die Werte kommen aus dem\r\n    -- Standard des aktuellen PvP-Modus.\r\n    return nil, jobId\r\nend\r\n\r\nlocal function PvpValuesForRule(rule, mode)\r\n    mode = mode or CurrentPvpMode()\r\n\r\n    if rule == nil then\r\n        return mode.action or \"Ignore\",\r\n               math.max(1, math.min(20, tonumber(mode.priority) or 5)),\r\n               math.max(1, math.min(30, tonumber(mode.maxDistance) or 8))\r\n    end\r\n\r\n    if BAI_Passive then\r\n        return rule.passiveAction or \"Ignore\",\r\n               math.max(1, math.min(20, tonumber(rule.passivePriority) or 5)),\r\n               math.max(1, math.min(30, tonumber(rule.passiveMaxDistance) or 8))\r\n    end\r\n\r\n    return rule.aggressiveAction or \"Ignore\",\r\n           math.max(1, math.min(20, tonumber(rule.aggressivePriority) or 5)),\r\n           math.max(1, math.min(30, tonumber(rule.aggressiveMaxDistance) or 8))\r\nend\r\n\r\nlocal function PvpReactionAllowed(actor, mode)\r\n    if not BAI_Passive then\r\n        return true, 3\r\n    end\r\n\r\n    local owner = GetV(V_OWNER, MyID)\r\n    local actorTarget = GetV(V_TARGET, actor)\r\n    local ownerTarget = GetV(V_TARGET, owner)\r\n\r\n    local ownerThreat = mode.defendOwner and actorTarget == owner\r\n    local selfThreat = mode.defendSelf and actorTarget == MyID\r\n    local assist = mode.assistOwnerImmediately and ownerTarget == actor\r\n\r\n    if not ownerThreat and not selfThreat and not assist then\r\n        return false, 99\r\n    end\r\n\r\n    if ownerThreat and selfThreat then\r\n        return true, 0\r\n    end\r\n\r\n    if mode.ownerPriority then\r\n        if ownerThreat then return true, 0 end\r\n        if assist then return true, 1 end\r\n        if selfThreat then return true, 2 end\r\n    else\r\n        if selfThreat then return true, 0 end\r\n        if ownerThreat then return true, 1 end\r\n        if assist then return true, 2 end\r\n    end\r\n\r\n    return true, 3\r\nend\r\n\r\nlocal function FindPvpTarget()\r\n    if not BAI_CONFIG.pvpEnabled then return 0, nil, nil, nil end\r\n\r\n    local owner = GetV(V_OWNER, MyID)\r\n    local mode = CurrentPvpMode()\r\n    local best = 0\r\n    local bestAction = nil\r\n    local bestJobId = nil\r\n    local bestMaxDistance = nil\r\n    local bestPriority = 999\r\n    local bestReason = 999\r\n    local bestDistance = 99999\r\n\r\n    for _, actor in ipairs(TickActors()) do\r\n        if actor ~= MyID and actor ~= owner and IsMonster(actor) == 0 and GetV(V_MOTION, actor) ~= MOTION_DEAD then\r\n            local rule, jobId = PvpRuleForActor(actor)\r\n            if jobId ~= nil then\r\n                local action, priority, maxDistance = PvpValuesForRule(rule, mode)\r\n                local allowed, reason = PvpReactionAllowed(actor, mode)\r\n                local actorTarget = GetV(V_TARGET, actor)\r\n                local ownerTarget = GetV(V_TARGET, owner)\r\n                local isDefenseThreat = (mode.defendOwner and actorTarget == owner) or (mode.defendSelf and actorTarget == MyID) or (mode.assistOwnerImmediately and ownerTarget == actor)\r\n                local defenseOverride = rule ~= nil and rule.defendEvenIfIgnored and isDefenseThreat\r\n                if action ~= \"Ignore\" or defenseOverride then\r\n                    if allowed then\r\n                        if action == \"Ignore\" then action = \"NormalAndSkills\" end\r\n                        local d = GetDistance2(owner, actor)\r\n                        if d ~= -1 and d <= maxDistance then\r\n                            if priority < bestPriority or\r\n                               (priority == bestPriority and reason < bestReason) or\r\n                               (priority == bestPriority and reason == bestReason and d < bestDistance) then\r\n                                best = actor\r\n                                bestAction = action\r\n                                bestJobId = jobId\r\n                                bestMaxDistance = maxDistance\r\n                                bestPriority = priority\r\n                                bestReason = reason\r\n                                bestDistance = d\r\n                            end\r\n                        end\r\n                    end\r\n                end\r\n            end\r\n        end\r\n    end\r\n\r\n    return best, bestAction, bestJobId, bestMaxDistance\r\nend\r\n\r\nlocal function PvpTargetStillAllowed()\r\n    if currentPvpAction == nil or MyEnemy == 0 then return true end\r\n\r\n    local rule, jobId = PvpRuleForActor(MyEnemy)\r\n    if jobId == nil or jobId ~= currentPvpJobId then return false end\r\n\r\n    local mode = CurrentPvpMode()\r\n    local action, _, maxDistance = PvpValuesForRule(rule, mode)\r\n    if action == \"Ignore\" then\r\n        local owner = GetV(V_OWNER, MyID)\r\n        local actorTarget = GetV(V_TARGET, MyEnemy)\r\n        local ownerTarget = GetV(V_TARGET, owner)\r\n        local threat = (mode.defendOwner and actorTarget == owner) or (mode.defendSelf and actorTarget == MyID) or (mode.assistOwnerImmediately and ownerTarget == MyEnemy)\r\n        if rule == nil or not rule.defendEvenIfIgnored or not threat then return false end\r\n        action = \"NormalAndSkills\"\r\n    end\r\n\r\n    local owner = GetV(V_OWNER, MyID)\r\n    local d = GetDistance2(owner, MyEnemy)\r\n    if d == -1 or d > maxDistance then return false end\r\n\r\n    currentPvpAction = action\r\n    currentPvpMaxDistance = maxDistance\r\n    return true\r\nend\r\n\r\nlocal function PercentOf(value, maximum)\r\n    if maximum == nil or maximum <= 0 then return 100 end\r\n    return (value * 100) / maximum\r\nend\r\n\r\n-- HP loss is a sampled indication, not a server-confirmed hit event.\r\nlocal BaiCastling = {}\r\nfunction BaiCastling.ownerTargeted(owner)\r\n    for _, actor in ipairs(TickActors()) do\r\n        if actor ~= MyID and actor ~= owner and GetV(V_MOTION, actor) ~= MOTION_DEAD and\r\n           GetV(V_TARGET, actor) == owner and (IsMonster(actor) == 1 or BAI_CONFIG.pvpEnabled == true) then\r\n            return true\r\n        end\r\n    end\r\n    return false\r\nend\r\nfunction BaiCastling.sample()\r\n    local owner, now = GetV(V_OWNER, MyID), GetTick()\r\n    local hp, maxHp = tonumber(GetV(V_HP, owner)), tonumber(GetV(V_MAXHP, owner))\r\n    local x, y = GetV(V_POSITION, owner)\r\n    local reset = BaiCastling.owner ~= owner or BaiCastling.cfg ~= BAI_CONFIG or\r\n        not hp or not maxHp or hp <= 0 or maxHp <= 0 or\r\n        BaiCastling.maxHp ~= maxHp or (BaiCastling.at and (now < BaiCastling.at or now-BaiCastling.at > 2000)) or\r\n        (BaiCastling.x and x and (math.abs(x-BaiCastling.x) > 15 or math.abs(y-BaiCastling.y) > 15))\r\n    if reset then\r\n        BaiCastling.hitAt = nil\r\n    elseif BaiCastling.hp and hp < BaiCastling.hp then\r\n        BaiCastling.hitAt = now\r\n    end\r\n    BaiCastling.owner, BaiCastling.cfg = owner, BAI_CONFIG\r\n    BaiCastling.hp, BaiCastling.maxHp, BaiCastling.at = hp, maxHp, now\r\n    BaiCastling.x, BaiCastling.y = x, y\r\nend\r\nfunction BaiCastling.condition(rule)\r\n    local c = rule.castling or {}\r\n    local owner = GetV(V_OWNER, MyID)\r\n    local hp, maxHp = tonumber(GetV(V_HP, owner)), tonumber(GetV(V_MAXHP, owner))\r\n    if not hp or not maxHp or hp <= 0 or maxHp <= 0 then return false end\r\n    local homuHp, homuMax = tonumber(GetV(V_HP, MyID)), tonumber(GetV(V_MAXHP, MyID))\r\n    if not homuHp or not homuMax or homuHp <= 0 or homuMax <= 0 or\r\n       PercentOf(homuHp, homuMax) < (tonumber(c.minHomuHp) or 0) then return false end\r\n    if MyState == CHASE_ST and c.allowChasing == false then return false end\r\n    local targeted = BaiCastling.ownerTargeted(owner)\r\n    if c.onlyOwnerTargeted == true and not targeted then return false end\r\n    local limit = tonumber(rule.ownerHpBelow) or 0\r\n    if c.trigger == nil or c.trigger == \"LegacyHp\" then\r\n        return limit > 0 and PercentOf(hp, maxHp) < limit\r\n    end\r\n    if limit > 0 and PercentOf(hp, maxHp) >= limit then return false end\r\n    if c.trigger == \"OwnerTargeted\" then return targeted end\r\n    if c.trigger ~= \"OwnerHpLoss\" then return false end\r\n    local now = GetTick()\r\n    return BaiCastling.hitAt ~= nil and now >= BaiCastling.hitAt and now-BaiCastling.hitAt <= 1000\r\nend\r\n\r\nlocal function AutoSkillIntervalReady(rule, now)\r\n    local interval = math.max(1000, tonumber(rule.intervalMs) or 1000)\r\n    local key = rule.ruleId or tostring(rule.id) .. \":\" .. tostring(rule.level)\r\n    local last = autoSkillLastUse[key]\r\n    if tonumber(rule.id) == 8005 then\r\n        if BaiCastling.lastUse and now-BaiCastling.lastUse < interval then return false end\r\n        if last == nil and rule.castling and rule.castling.trigger ~= \"LegacyHp\" then return true end\r\n    end\r\n    if last == nil then\r\n        -- Tank mode can use this interval check without running the normal auto-skill loop.\r\n        -- Start the shared skill timer here as well, otherwise `or now` resets the\r\n        -- reference time on every Tank check and offensive Tank skills never become ready.\r\n        if autoSkillSystemStartedAt == nil then autoSkillSystemStartedAt = now end\r\n        last = autoSkillSystemStartedAt\r\n    end\r\n    return now - last >= interval\r\nend\r\n\r\nlocal function AutoSkillHealthCondition(rule)\r\n    local owner = GetV(V_OWNER, MyID)\r\n    local kind = rule.kind\r\n    if tonumber(rule.id) == 8005 then return BaiCastling.condition(rule) end\r\n\r\n    if kind == \"HealOwner\" or kind == \"DefensiveOwner\" then\r\n        local limit = tonumber(rule.ownerHpBelow) or 0\r\n        if limit <= 0 then return false end\r\n        local hp = GetV(V_HP, owner)\r\n        local maxHp = GetV(V_MAXHP, owner)\r\n        return PercentOf(hp, maxHp) < limit\r\n    end\r\n\r\n    if kind == \"HealEither\" then\r\n        -- The trigger target only decides whose HP makes BAI cast the skill.\r\n        -- The game still decides the actual target/effect of skills such as Chaotic Blessings.\r\n        local target = rule.healHpTarget or \"Either\"\r\n        if target == \"Homunculus\" then\r\n            local limit = tonumber(rule.homuHpBelow) or 0\r\n            return limit > 0 and PercentOf(GetV(V_HP, MyID), GetV(V_MAXHP, MyID)) < limit\r\n        elseif target == \"Owner\" then\r\n            local limit = tonumber(rule.ownerHpBelow) or 0\r\n            return limit > 0 and PercentOf(GetV(V_HP, owner), GetV(V_MAXHP, owner)) < limit\r\n        end\r\n        local ownerLimit = tonumber(rule.ownerHpBelow) or 0\r\n        local homuLimit = tonumber(rule.homuHpBelow) or 0\r\n        local ownerLow = ownerLimit > 0 and PercentOf(GetV(V_HP, owner), GetV(V_MAXHP, owner)) < ownerLimit\r\n        local homuLow = homuLimit > 0 and PercentOf(GetV(V_HP, MyID), GetV(V_MAXHP, MyID)) < homuLimit\r\n        return ownerLow or homuLow\r\n    end\r\n\r\n    if kind == \"SelfEmergency\" then\r\n        local limit = tonumber(rule.homuHpBelow) or 0\r\n        if limit <= 0 then return false end\r\n        return PercentOf(GetV(V_HP, MyID), GetV(V_MAXHP, MyID)) < limit\r\n    end\r\n\r\n    return true\r\nend\r\n\r\nlocal function GlobalSkillPauseReady(now)\r\n    local pause = math.max(0, tonumber(BAI_CONFIG.globalSkillPauseMs) or 2000)\r\n    if pause <= 0 or lastAnySkillUse == nil then\r\n        return true\r\n    end\r\n    return now - lastAnySkillUse >= pause\r\nend\r\n\r\nlocal function MarkAnySkillUse(now)\r\n    lastAnySkillUse = now\r\nend\r\n\r\nlocal MonsterRuleForActor, CurrentMonsterAction, EffectiveMonsterSkillLevel\r\n\r\nlocal function TryUseOneAutoSkillKind(kind, now, rules)\r\n    rules = rules or BAI_CONFIG.skills\r\n    if rules == nil then return false end\r\n\r\n    local owner = GetV(V_OWNER, MyID)\r\n    local currentSp = GetV(V_SP, MyID)\r\n    local candidates = {}\r\n\r\n    -- First build the list of rules of this kind. We rotate through this list\r\n    -- instead of always starting at rule #1. That prevents two levels of the\r\n    -- same skill from starving each other.\r\n    for _, rule in ipairs(rules) do\r\n        if rule.enabled and rule.kind == kind then\r\n            local allowed = true\r\n            -- Monster Rules only restrict OFFENSIVE skills. Healing, buffs and\r\n            -- defensive/emergency skills keep running globally during combat.\r\n            if kind == \"Offensive\" and MyEnemy ~= 0 and IsMonster(MyEnemy) == 1 then\r\n                local monsterRule = MonsterRuleForActor(MyEnemy)\r\n                local forcedSkillId = monsterRule and tonumber(monsterRule.attackSkillId) or 0\r\n                if rule.onlyMonsterRules == true then\r\n                    allowed = monsterRule ~= nil and forcedSkillId ~= nil and forcedSkillId > 0 and tonumber(rule.id) == forcedSkillId\r\n                elseif forcedSkillId ~= nil and forcedSkillId > 0 and tonumber(rule.id) ~= forcedSkillId then\r\n                    allowed = false\r\n                end\r\n            end\r\n            if allowed then table.insert(candidates, rule) end\r\n        end\r\n    end\r\n\r\n    local count = #candidates\r\n    if count == 0 then return false end\r\n\r\n    local startIndex = tonumber(autoSkillRoundRobin[kind]) or 1\r\n    if startIndex < 1 or startIndex > count then startIndex = 1 end\r\n\r\n    for offset = 0, count - 1 do\r\n        local index = ((startIndex - 1 + offset) % count) + 1\r\n        local rule = candidates[index]\r\n        local minSp = math.max(0, tonumber(rule.minSp) or 0)\r\n        if tonumber(rule.id) == 8005 then\r\n            -- Standard Castling costs 10 SP at every level (rAthena skill_db).\r\n            minSp = math.max(minSp, 10 + math.max(0, tonumber((rule.castling or {}).spReserve) or 0))\r\n        end\r\n\r\n        if currentSp < minSp and BaiDebug.enabled(\"reasons\") then\r\n            BaiDebug.run(BaiDebug.event, \"reasons\", \"sp:\" .. tostring(rule.id),\r\n                \"SKILL_WAIT reason=SP id=\" .. tostring(rule.id) .. \" SP=\" .. tostring(currentSp) .. \" minSP=\" .. tostring(minSp) .. BaiDebug.mode(), false)\r\n        end\r\n        if currentSp >= minSp and\r\n           AutoSkillIntervalReady(rule, now) and\r\n           AutoSkillHealthCondition(rule) then\r\n\r\n            local used = false\r\n            if BaiDebug.enabled(\"skills\") then BaiDebug.skillContext = { kind=kind, level=rule.level } end\r\n\r\n            if kind == \"Offensive\" then\r\n                if MyEnemy ~= 0 and GetV(V_MOTION, MyEnemy) ~= MOTION_DEAD then\r\n                    -- Resolve the effective level from the CURRENT monster first.\r\n                    -- The global skill level is only the fallback when this monster has\r\n                    -- no dedicated Monster Rule. This keeps every offensive cast path\r\n                    -- consistent instead of patching the level after skill selection.\r\n                    local castLevel = EffectiveMonsterSkillLevel(MyEnemy, tonumber(rule.level) or 1)\r\n                    local distance = GetDistance2(MyID, MyEnemy)\r\n                    local range = tonumber(GetV(V_SKILLATTACKRANGE_LEVEL, MyID, rule.id, castLevel)) or 0\r\n                    if distance >= 0 and distance <= range then\r\n                        MySkillLevel = castLevel\r\n                        local _, issued = SkillObject(MyID, castLevel, rule.id, MyEnemy)\r\n                        if issued then MarkAnySkillUse(now); used = true end\r\n                    end\r\n                end\r
