onstruos","Search results":"Resultados de búsqueda","Enter a name or ID.":"Introduce un nombre o ID.","No monsters found.":"No se han encontrado monstruos.","Select a monster from the search first.":"Selecciona primero un monstruo de la búsqueda.","A rule for this monster already exists.":"Ya existe una regla para este monstruo.","(special skill)":"(habilidad especial)","Homunculus":"Homúnculo","Skills":"Habilidades","Tanking":"Tanque","Tank":"Tanque","Manual":"Manual","Credits":"Créditos","Debug":"Depuración","Name":"Nombre","Radius":"Radio","Assist":"Ayudar","Target":"Objetivo","Visible":"Visible","Nearby":"Cercano","New release {0}. The desktop download above still matches this web version ({1}).":"Nueva versión {0}. La descarga de escritorio sigue correspondiendo a esta versión web ({1}).","GitHub returned {0}":"GitHub respondió {0}","Invalid value: {0}":"Valor no válido: {0}","Unknown value: {0}":"Valor desconocido: {0}","Invalid list: {0}":"Lista no válida: {0}","Invalid section: {0}":"Sección no válida: {0}","Invalid ID: {0}":"ID no válido: {0}","Too many entries: {0}":"Demasiadas entradas: {0}","Text too long: {0}":"Texto demasiado largo: {0}","Download desktop version ({0})":"Descargar versión de escritorio ({0})","Download desktop version {0} as folder ZIP":"Descargar versión de escritorio {0} como ZIP","Web and desktop use Lua {0}.":"Web y escritorio usan Lua {0}.","{0} route points · P = owner":"{0} puntos de ruta · P = dueño","Profile {0}":"Perfil {0}","Name for {0}":"Nombre de {0}","{0} is ready to download.":"{0} está listo para descargar.","Up to date: Lua {0}.":"Actualizado: Lua {0}.","Update check unavailable: {0}":"Comprobación de actualizaciones no disponible: {0}","Import failed: {0}":"Error de importación: {0}","Unavailable ({0})":"No disponible ({0})","{0} results":"{0} resultados","{0} results · first 20 shown":"{0} resultados · se muestran los primeros 20","Applies to the selected profile and T mode. Changes are saved automatically in this browser.":"Se aplica al perfil y modo T seleccionados. Los cambios se guardan automáticamente en este navegador.","This mode is for {0}. Please select that homunculus first.":"Este modo es para {0}. Selecciona primero ese homúnculo.","Enable Attack Dance Mini":"Activar Attack Dance Mini","Attack Dance Mini requires AI.lua from this web version. Download both AI.lua and BAI_Config.lua again.":"Attack Dance Mini requiere el AI.lua de esta versión web. Descarga de nuevo AI.lua y BAI_Config.lua juntos."},"help":{"attackBehavior":"Activo busca monstruos automáticamente. Pasivo no busca objetivos normales, pero permite comandos manuales. Asistir ayuda contra el objetivo del dueño. La defensa activada aparte sigue funcionando. El nombre del modo T no determina el comportamiento.","attackDance":"El homúnculo se mueve entre ataques, lo que puede aumentar ligeramente la velocidad de ataque.","attackGeneral":"Controla la selección automática normal y las distancias. Las pestañas adyacentes contienen habilidades y reglas de monstruos. La protección se configura en Defensa; Tanque y PvP tienen reglas propias.","combatDistance":"Distancia al dueño en casillas. Los nuevos objetivos automáticos deben estar dentro del límite. Si se aleja demasiado durante el combate normal, abandona el objetivo y sigue al dueño. Los objetivos manuales y Tanque tienen reglas distintas.","defaultMonsterAction":"Para monstruos sin regla propia: Solo habilidades desactiva los ataques normales; Sin habilidades permite solo ataques normales; Ambos permite los dos; Nada los ignora automáticamente.","defense":"La defensa respeta la prioridad de los monstruos. Solo la excepción del dueño puede prevalecer; está desactivada por defecto. La autodefensa actúa sin un objetivo válido de mayor prioridad. Proteger y asistir a amigos tiene reglas propias.","finishFight":"No sigue inmediatamente al dueño: continúa el combate iniciado hasta el límite de distancia configurado.","healHpTarget":"Elige qué HP activa esta habilidad. Solo homúnculo ignora los HP del dueño. Cualquiera se activa al cruzar un umbral HP habilitado.","idleInterval":"Intervalo en milisegundos para decidir movimientos de Pasear, Órbita y Ruta. 1000 ms = un segundo. No es la frecuencia general de la AI ni una demora de ataque.","idleMode":"Fuera de combate: Pasear es aleatorio; Órbita rodea al dueño; Ruta sigue los puntos. En esta versión, Quieto y Seguir al dueño se comportan casi igual y mantienen al homúnculo cerca.","idleRadius":"Radio para Pasear y Órbita. Ruta usa sus puntos. Las distancias de seguimiento en movimiento y parado son independientes. No es el alcance de ataque automático.","killSteal":"Evita interferir en combates ajenos. Solo ataca monstruos libres o que ya luchan contra ti, tu homúnculo o alguien de su lista de amigos.","lagReduction":"Intervalo mínimo en milisegundos entre comandos automáticos limitados. Reduce los comandos enviados, pero puede ralentizar la respuesta.","modeTransfer":"Exporta este modo T para guardarlo o compartirlo. Importar reemplaza la configuración del modo T seleccionado.","monsterBehavior":"No atacar excluye el monstruo de la selección normal. Sin habilidades: solo ataques normales. Solo habilidades: sin golpes normales. Normal + habilidades: ambos. Las restricciones afectan a habilidades ofensivas; curación, mejoras, defensa y emergencia conservan sus condiciones.","monsterLevel":"Sustituye el nivel ofensivo general contra este monstruo, incluso nivel 1 y selección Automática. Usa niveles aprendidos. Curación, mejoras y defensa conservan sus niveles.","monsterRules":"Las reglas afectan solo a la entrada seleccionada. Sin regla: habilidades generales y prioridad 5. Busca por nombre, ID de AI o MidgardHub; si coinciden números, elige el nombre correcto. Los símbolos i explican las columnas.","monsterSkill":"Automática usa las reglas ofensivas generales activadas. Seleccionar una habilidad limita la ofensiva contra este monstruo. Debe estar aprendida y activada en Habilidades. Umbral SP e intervalo siguen vigentes. Curación y mejoras no se limitan a esa habilidad.","moveAttack":"Permite nuevos ataques mientras el dueño se mueve. Desactivado: sigue al dueño sin iniciar nuevos combates.","moveRange":"Distancia máxima en casillas entre un nuevo objetivo y el dueño en movimiento. El límite general de combate sigue vigente.","normalPlants":"Excluye plantas normales como Green Plant de la selección automática normal.","onlyMonsterRules":"Esta habilidad ofensiva solo se usa cuando la regla del monstruo selecciona exactamente esta habilidad. Automática no cuenta como permiso explícito.","overview":"Muestra el modo seleccionado. T1 y T2 son configurables, no Activo/Pasivo fijos. Solo las opciones marcadas como compartidas afectan a ambos. Guardar conserva el perfil; Instalar genera UserAI para el juego.","overviewPvp":"Activa PvP. Mientras esté activo no puedes añadir ni quitar jugadores de la lista de amigos.","overviewTank":"Activa Tanque. Configura comportamiento y habilidades en la página Tanque.","ownerPriority":"Si ambos son atacados con igual prioridad, prefiere proteger al dueño. Desactivado: decide la distancia. Una prioridad mayor sigue prevaleciendo. La excepción separada del dueño puede prevalecer sobre la prioridad.","party":"Alt + clic derecho en un jugador lo añade a amigos; repetir lo elimina. El homúnculo se acerca y lo rodea. Alt + clic derecho en tu personaje hace que visite amigos cercanos guardados. PvP debe estar desactivado para modificar la lista.","partyAssist":"Considera objetivos de amigos conocidos. Requiere lista de amigos activada y comportamiento Asistir para asistencia normal.","partyProtect":"Protege jugadores de la lista guardada. Requiere grupo/amigos activado. No reconoce automáticamente miembros del grupo no guardados.","preserveNormalAttacks":"Excluye ataques normales de la demora adicional para conservar al máximo la velocidad normal (ASPD).","priority":"1 es la prioridad máxima; 10 la mínima. Sin regla: 5. La selección inicial desempata por distancia. Cambiar durante combate requiere Interrumpir objetivo en el nuevo monstruo.","protectOwner":"Reacciona a monstruos válidos que atacan a tu personaje. Sin excepción del dueño respeta la prioridad. Puede actuar sin búsqueda activa normal. Se respetan protección y distancias.","protectSelf":"Reacciona a atacantes del homúnculo sin desplazar objetivos válidos de mayor prioridad. Cambiar de objetivo defensivo requiere casillas de interrupción. Puede retomarse tras derrotar el objetivo prioritario.","route":"Hasta 30 puntos en la cuadrícula 15×15, recorridos en orden con el dueño parado. P marca al dueño; otro clic elimina un punto. Las cuatro esquinas X están bloqueadas. Borrar ruta vacía la lista.","routeTimeout":"Si no alcanza un punto dentro de este tiempo en milisegundos, pasa al siguiente. Útil ante obstáculos, sin garantizar encontrar un camino. Solo Ruta.","routeTolerance":"Distancia en casillas para considerar alcanzado un punto. 0 exige la casilla exacta; valores mayores toleran pequeños desvíos. Solo Ruta.","sharedLag":"Mantiene el intervalo de lag y la exención de ataques normales iguales en T1 y T2. Los cambios afectan a ambos mientras esté activado.","skillDistance":"Distancia máxima del homúnculo al dueño en casillas para habilidades automáticas normales. No es el alcance hacia el monstruo. Fuera del límite también puede esperar la curación o apoyo automático.","skillFields":"Activado habilita la regla. Nivel: solo aprendido. SP mínimos es absoluto, no porcentaje. Intervalo: mínimo entre comandos; disponibilidad, HP y pausa global también deben permitirlo. HP por debajo de % activa bajo el umbral. 0 desactiva ese criterio HP, no SP.","skillPause":"Intervalo mínimo adicional entre comandos de habilidades automáticas normales, en segundos. Se aplica junto al intervalo de cada regla. 0 desactiva esta pausa, no los tiempos impuestos por el juego.","skills":"Añade reglas para habilidades aprendidas: nivel, SP mínimos e intervalo. Se permiten varias reglas por habilidad. Los criterios HP corresponden a curación/protección. Las reglas de monstruos pueden limitar selección y nivel ofensivos.","skillsEnabled":"Activa o desactiva conjuntamente las reglas normales de habilidades. Cada regla también debe estar activada. Tanque y PvP tienen listas y controles propios.","startupDelay":"Espera en milisegundos tras recargar la AI antes de actuar automáticamente. Tras cambiar de mapa o teletransportarse se aplica si el cliente recarga la AI. 0 ms la desactiva.","summonedPlants":"Excluye plantas invocadas por un Alchemist de la selección automática normal.","tankArea":"Radio de selección alrededor del dueño en casillas. El rescate también está limitado a esta zona. No es la distancia deseada de mantenimiento.","tankBound":"Combate monstruos ya fijados cuando no hay nuevos objetivos ni rescate pendiente. Los nuevos objetivos válidos conservan prioridad.","tankBoundSkills":"Permite habilidades ofensivas contra monstruos ya fijados. Niveles, SP e intervalos de Tanque siguen vigentes. Curación y apoyo conservan sus condiciones.","tankDistance":"Distancia deseada al dueño tras reunir monstruos, en casillas. Cuando todos están fijados, vuelve dentro de esta distancia y sigue al dueño si se aleja. Zona de Tanque es independiente.","tankExclusions":"Excluye monstruos de Tanque. Busca por nombre o ID y añade la entrada correcta. Usa IDs personalizados conscientemente: los conocidos se convierten al exportar; números iguales no siempre indican el mismo monstruo.","tankMode":"Atrae primero monstruos nuevos válidos en la zona, vuelve a la distancia de Tanque y puede combatir los fijados. Nuevos objetivos y rescate tienen prioridad. Sustituye el combate normal y desactiva PvP. Habilidades y exclusiones se configuran aquí. Primero intenta atraer una vez; tras una breve comprobación de ejecución pasa al siguiente. Una habilidad a distancia no provoca persecución cuerpo a cuerpo inmediata. Sin aggro, reintenta más tarde. Un comando enviado no confirma un impacto.","tankNormal":"Permite ataques normales en Tanque, incluso sin habilidad ofensiva lista. Sin ellos, atraer aggro depende de habilidades disponibles.","tankPlants":"Excluye las plantas normales y setas indicadas de Tanque. Independiente de Ataque normal.","tankRescue":"Permite habilidades ofensivas para atraer un atacante del dueño. Desactivado: usa ataques normales. Se respetan zona, exclusiones y protección.","tankSkillFields":"Nivel aprendido; SP mínimos absolutos; intervalo en segundos antes de repetir. HP por debajo de % aparece para curación/protección. Comprobar HP de elige la salud vigilada, no necesariamente el objetivo curado: Chaotic Blessings es aleatorio en el juego.","tankSkills":"Lista exclusiva de Tanque. Reglas PvE normales y niveles ofensivos por monstruo no la controlan. Usa habilidades y niveles aprendidos. La ofensiva respeta también el SP general de Tanque; curación/protección usa intervalos y HP propios.","tankSp":"SP mínimos adicionales absolutos para ofensiva de Tanque. También vale el umbral de cada regla. Con SP bajos puede sustituirse por ataque normal si está activado.","tankSummoned":"Excluye las plantas invocadas indicadas de Tanque. Independiente de Ataque normal.","targetSwitching":"Ambas casillas afectan al NUEVO monstruo. Interrumpir objetivo exige un número de prioridad menor; igual no basta. También objetivos manuales permite sustituir un objetivo manual. Se comprueba persiguiendo y atacando, incluso a distancia. La autodefensa no bloquea el cambio; proteger al dueño solo lo bloquea con su excepción activada en Defensa. Se respetan amigos, asistencia/PvP, distancias, protección contra robo y exclusiones. Sniper conserva su ventana limitada de confirmación.","ownerDefenseOverridesPriority":"Desactivado por defecto; solo para atacantes de tu personaje. Activado: defender al dueño prevalece sobre prioridad. Desactivado: puede combatir primero un monstruo válido más prioritario. Cambiar durante combate exige casillas de interrupción. La autodefensa nunca recibe esta excepción. Requiere proteger al dueño; se guarda por modo T.","followMovingDistance":"Positivos: detrás del jugador, p. ej. +14 = 14 casillas detrás. 0: su posición. Negativos: delante, p. ej. −3 = 3 delante. Dirección del movimiento reciente; no detecta girar sin moverse. Sin dirección reciente sigue normalmente con distancia absoluta. Al parar aplica la distancia separada de parado. Es posición deseada, no separación garantizada: velocidad, obstáculos y cliente pueden variarla. Modo T seleccionado.","followStoppedDistance":"Positivos: detrás; negativos: delante; 0: junto al jugador. Conserva la última dirección de movimiento; no detecta giros en el sitio. Movimiento −3/parado −3 mantiene tres casillas delante; −5/−2 acerca a dos. Sin dirección conocida usa el valor absoluto como distancia normal en el lado actual. Pasear, órbita o ruta se reanudan al llegar. Combate, distancia Tanque y comandos manuales siguen vigentes.","tankAggroRetry":"Espera antes de reintentar atraer un monstruo aún no fijado. Por defecto 1800 ms. Prefiere otros nuevos mientras tanto. La comprobación de ejecución puede aumentar la espera real. Rescate se comprueba aparte y reintenta antes.","castling":"Umbral HP: 0 desactiva criterios de pérdida/objetivo. Perder HP no confirma un impacto; curarse entre ciclos AI puede ocultarlo. Se respetan intervalo y SP mínimos.","attackDanceMini":"Envía órdenes de movimiento a la celda actual del homúnculo en vez de a una celda adyacente. Solo una variante de Attack Dance puede estar activa por modo T. Como la versión clásica, funciona solo con reducción de lag desactivada, mínima (1 ms) o ligera (10 ms). Experimental: aún no se ha confirmado una mayor velocidad de ataque en el juego. Descarga de nuevo AI.lua y BAI_Config.lua en Instalar."}},"fr":{"ui":{"Aktiv":"Activé","Assistieren":"Assister","Mindestens ein Profil muss vorhanden bleiben.":"Au moins un p ns le jeu. La version de bureau n’est pas nécessaire.","Install provides both Lua files for AI/USER_AI. Back up existing files before replacing them.":"Installer fournit les deux fichiers Lua pour AI/USER_AI. Sauvegardez les fichiers existants avant de les remplacer.","The buttons on the left select two independent T modes. Switch in the game with Alt+T. Attack contains General, Skills, Monster rules and Sniper. Tank and PvP have their own tabs.":"Les boutons à gauche sélectionnent deux modes T indépendants. Changez de mode dans le jeu avec Alt+T. Attaque contient Général, Compétences, Règles des monstres et Sniper. Tank et PvP ont leurs propres onglets.","Profiles lets you choose the homunculus and manage settings. Import and export support desktop profiles and .baimode files.":"Profils permet de choisir l’homoncule et de gérer les paramètres. L’importation et l’exportation prennent en charge les profils de bureau et les fichiers .baimode.","Priority 1 is the highest priority. Class-specific rules determine behavior for each class.":"La priorité 1 est la plus élevée. Les règles de classe déterminent le comportement pour chaque classe.","Imported. Settings are now available in this browser.":"Importé. Les paramètres sont maintenant disponibles dans ce navigateur.","Enter a whole number within the allowed range.":"Saisissez un entier dans la plage autorisée.","Cooldown: 0 to 30 seconds.":"Pause : de 0 à 30 secondes.","ID list saved.":"Liste des ID enregistrée.","Enter positive whole-number IDs":"Saisissez des ID entiers positifs","At least one profile must remain.":"Au moins un profil doit être conservé.","Maximum 1000 rules.":"Maximum de 1000 règles.","Checking for updates …":"Recherche de mises à jour…","Profile number":"Numéro du profil","Startup delay (ms)":"Délai de démarrage (ms)","Share lag settings between T1 and T2":"Partager les paramètres de lag entre T1 et T2","Attack behavior":"Comportement d’attaque","Prevent kill stealing":"Empêcher le vol de monstres"  version":"Charger la version web actuelle","Download a new copy of the local HTML file.":"Téléchargez une nouvelle copie du fichier HTML local.","Profile name":"Nom du profil","Tank mode":"Mode tank","Rule":"Règle","ID list":"Liste des ID","SP":"SP","Lv.":"Niv.","T1 and T2":"T1 et T2","Monster name, AI ID or MidgardHub ID":"Nom du monstre, ID AI ou MidgardHub","Search monsters":"Rechercher des monstres","Search results":"Résultats de recherche","Enter a name or ID.":"Saisissez un nom ou un ID.","No monsters found.":"Aucun monstre trouvé.","Select a monster from the search first.":"Sélectionnez d’abord un monstre dans la recherche.","A rule for this monster already exists.":"Une règle existe déjà pour ce monstre.","(special skill)":"(compétence spéciale)","Homunculus":"Homoncule","Skills":"Compétences","Tanking":"Tank","Tank":"Tank","Manual":"Guide","Credits":"Crédits","Debug":"Débogage","Name":"Nom","Radius":"Rayon","Assist":"Assister","Target":"Cible","Visible":"Visible","Nearby":"À proximité","New release {0}. The desktop download above still matches this web version ({1}).":"Nouvelle version {0}. Le téléchargement de bureau correspond toujours à cette version web ({1}).","GitHub returned {0}":"GitHub a répondu {0}","Invalid value: {0}":"Valeur incorrecte : {0}","Unknown value: {0}":"Valeur inconnue : {0}","Invalid list: {0}":"Liste incorrecte : {0}","Invalid section: {0}":"Section incorrecte : {0}","Invalid ID: {0}":"ID incorrect : {0}","Too many entries: {0}":"Trop d’entrées : {0}","Text too long: {0}":"Texte trop long : {0}","Download desktop version ({0})":"Télécharger la version de bureau ({0})","Download desktop version {0} as folder ZIP":"Télécharger la version de bureau {0} en ZIP","Web and desktop use Lua {0}.":"Web et bureau utilisent Lua {0}.","{0} route points · P = owner":"{0} points de parcours · P = maître","Profile {0}":"Profil {0}","Name for {0}":"Nom de {0}","{0} is ready to download.":"{0} est prêt à télécharger.","Up to date: Lua {0}.":"À jour : Lua {0}.","Update check unavailable: {0}":"Vérification des mises à jour indisponible : {0}","Import failed: {0}":"Échec de l’importation : {0}","Unavailable ({0})":"Indisponible ({0})","{0} results":"{0} résultats","{0} results · first 20 shown":"{0} résultats · 20 premiers affichés","Applies to the selected profile and T mode. Changes are saved automatically in this browser.":"S’applique au profil et au mode T sélectionnés. Les modifications sont enregistrées automatiquement dans ce navigateur.","This mode is for {0}. Please select that homunculus first.":"Ce mode est pour {0}. Sélectionnez d’abord cet homoncule.","Enable Attack Dance Mini":"Activer Attack Dance Mini","Attack Dance Mini requires AI.lua from this web version. Download both AI.lua and BAI_Config.lua again.":"Attack Dance Mini nécessite le fichier AI.lua de cette version web. Téléchargez à nouveau AI.lua et BAI_Config.lua ensemble."},"help":{"attackBehavior":"Actif recherche automatiquement les monstres. Passif ne recherche pas de cibles normales, mais autorise les commandes manuelles. Assistance aide contre la cible du maître. La défense activée séparément reste applicable. Le nom du mode T ne détermine pas le comportement.","attackDance":"L’homoncule se déplace entre les attaques, ce qui peut légèrement augmenter sa vitesse d’attaque.","attackGeneral":"Contrôle la sélection automatique normale et les distances. Les onglets voisins contiennent les compétences et règles des monstres. La protection se règle dans Défense ; Tank et PvP ont leurs propres règles.","combatDistance":"Distance au maître en cases. Les nouvelles cibles automatiques doivent respecter cette limite. Si l’homoncule s’éloigne trop pendant un combat normal, il abandonne la cible et suit le maître. Les cibles manuelles et Tank ont des règles distinctes.","defaultMonsterAction":"Pour les monstres sans règle : Compétences seules désactive les attaques normales ; Sans compétences autorise seulement les attaques normales ; Les deux autorise les deux ; Rien les ignore automatiquement.","defense":"La défense respecte la priorité des monstres. Seule la dérogation du maître peut primer ; elle est désactivée par défaut. L’autodéfense intervient sans cible admissible plus prioritaire. Protection et assistance des amis gardent leurs règles.","finishFight":"Ne suit pas immédiatement le maître : poursuit le combat commencé jusqu’à la limite de distance configurée.","healHpTarget":"Choisit les HP qui déclenchent cette compétence. Homoncule seul ignore les HP du maître. L’un ou l’autre se déclenche lorsqu’un seuil HP activé est franchi.","idleInterval":"Intervalle en millisecondes des décisions de mouvement pour Errance, Orbite et Parcours. 1000 ms = une seconde. Ce n’est ni la fréquence générale de l’AI ni un délai d’attaque.","idleMode":"Hors combat : Errance est aléatoire ; Orbite tourne autour du maître ; Parcours suit les points. Dans cette version, Immobile et Suivre le maître fonctionnent presque pareil et gardent l’homoncule à proximité.","idleRadius":"Rayon pour Errance et Orbite. Parcours utilise ses points. Les distances de suivi en mouvement et à l’arrêt sont distinctes. Ce n’est pas la portée d’attaque automatique.","killSteal":"Empêche d’intervenir dans les combats des autres. Attaque seulement les monstres libres ou combattant déjà le maître, l’homoncule ou un joueur de sa liste d’amis.","lagReduction":"Intervalle minimal en millisecondes entre les commandes automatiques limitées. Réduit les commandes envoyées, mais peut ralentir la réaction.","modeTransfer":"Exporte ce mode T pour le conserver ou le partager. L’importation remplace les réglages du mode T sélectionné.","monsterBehavior":"Ne pas attaquer exclut le monstre de la sélection normale. Sans compétences : attaques normales seules. Compétences seules : aucun coup normal. Normal + compétences : les deux. Les restrictions concernent l’offensive ; soins, améliorations, défense et urgence conservent leurs conditions.","monsterLevel":"Remplace le niveau offensif général contre ce monstre, y compris niveau 1 et sélection Automatique. Utilisez les niveaux appris. Soins, améliorations et défense conservent leurs niveaux.","monsterRules":"Les règles concernent seulement l’entrée sélectionnée. Sans règle : compétences générales et priorité 5. Recherchez par nom, ID AI ou MidgardHub ; si les numéros se recoupent, choisissez le bon nom. Les symboles i expliquent les colonnes.","monsterSkill":"Automatique utilise les règles offensives générales activées. Choisir une compétence limite l’offensive contre ce monstre. Elle doit être apprise et activée dans Compétences. Seuil SP et intervalle s’appliquent toujours. Soins et améliorations ne sont pas limités à cette compétence.","moveAttack":"Permet de nouvelles attaques pendant le déplacement du maître. Désactivé : le suit sans commencer de nouveaux combats.","moveRange":"Distance maximale en cases entre une nouvelle cible et le maître en mouvement. La limite générale de combat reste applicable.","normalPlants":"Exclut les plantes ordinaires comme Green Plant de la sélection automatique normale.","onlyMonsterRules":"Cette compétence offensive est utilisée seulement si la règle du monstre la sélectionne précisément. Automatique ne constitue pas une autorisation explicite.","overview":"Affiche le mode sélectionné. T1 et T2 sont configurables, sans rôle Actif/Passif fixe. Seuls les réglages explicitement partagés affectent les deux. Enregistrer conserve le profil ; Installer génère UserAI pour le jeu.","overviewPvp":"Active le PvP. Tant qu’il est actif, vous ne pouvez ni ajouter ni retirer des joueurs de la liste d’amis.","overviewTank":"Active Tank. Configurez comportement et compétences dans la page Tank.","ownerPriority":"Si les deux sont attaqués avec une priorité identique, préfère protéger le maître. Désactivé : la distance départage. Une priorité supérieure prime toujours. La dérogation séparée du maître peut primer sur la priorité.","party":"Alt + clic droit sur un joueur l’ajoute aux amis ; répéter le retire. L’homoncule le rejoint et tourne autour. Alt + clic droit sur votre personnage fait visiter les amis proches enregistrés. Le PvP doit être désactivé pour modifier la liste.","partyAssist":"Considère les cibles des amis connus. Nécessite la liste d’amis activée et le comportement Assistance pour l’assistance normale.","partyProtect":"Protège les joueurs de la liste enregistrée. Nécessite groupe/amis activé. Ne reconnaît pas automatiquement les membres du groupe non enregistrés.","preserveNormalAttacks":"Exempte les attaques normales du délai supplémentaire pour préserver au mieux la vitesse normale (ASPD).","priority":"1 est la priorité maximale ; 10 la minimale. Sans règle : 5. La sélection initiale départage par distance. Changer pendant un combat nécessite Interrompre la cible sur le nouveau monstre.","protectOwner":"Réagit aux monstres admissibles attaquant votre personnage. Sans dérogation du maître, respecte la priorité. Peut agir sans recherche active normale. Protection et distances restent applicables.","protectSelf":"Réagit aux assaillants de l’homoncule sans remplacer les cibles admissibles plus prioritaires. Quitter une cible défensive nécessite les cases d’interruption. Peut reprendre après la défaite de la cible prioritaire.","route":"Jusqu’à 30 points dans la grille 15×15, suivis dans l’ordre quand le maître est immobile. P indique le maître ; un second clic retire un point. Les quatre coins X sont bloqués. Effacer le parcours vide la liste.","routeTimeout":"Si un point n’est pas atteint dans ce délai en millisecondes, passe au suivant. Utile face aux obstacles, sans garantir la recherche de chemin. Parcours seulement.","routeTolerance":"Distance en cases pour considérer un point atteint. 0 exige la case exacte ; une valeur supérieure tolère de petits écarts. Parcours seulement.","sharedLag":"Garde le même intervalle de lag et la même exemption des attaques normales pour T1 et T2. Les modifications affectent les deux tant que l’option est activée.","skillDistance":"Distance maximale de l’homoncule au maître en cases pour les compétences automatiques normales. Ce n’est pas la portée vers le monstre. Soins et soutien automatiques peuvent aussi attendre hors de la limite.","skillFields":"Activé autorise la règle. Niveau : seulement appris. SP minimum est absolu, pas un pourcentage. Intervalle : minimum entre commandes ; disponibilité, HP et pause globale s’appliquent aussi. HP inférieurs à % déclenche sous le seuil. 0 désactive ce critère HP, pas SP.","skillPause":"Intervalle minimal supplémentaire entre commandes de compétences automatiques normales, en secondes. S’applique avec l’intervalle de chaque règle. 0 désactive cette pause, pas les délais imposés par le jeu.","skills":"Ajoutez des règles pour les compétences apprises : niveau, SP minimum et intervalle. Plusieurs règles par compétence sont possibles. Les critères HP concernent soins/protection. Les règles des monstres peuvent limiter choix et niveau offensifs.","skillsEnabled":"Active ou désactive ensemble les règles normales de compétences. Chaque règle doit aussi être activée. Tank et PvP ont leurs listes et commandes propres.","startupDelay":"Attente en millisecondes après rechargement de l’AI avant les actions automatiques. Après changement de carte ou téléportation, s’applique si le client recharge l’AI. 0 ms la désactive.","summonedPlants":"Exclut les plantes invoquées par un Alchemist de la sélection automatique normale.","tankArea":"Rayon de sélection autour du maître en cases. Le secours est aussi limité à cette zone. Ce n’est pas la distance souhaitée de maintien.","tankBound":"Combat les monstres déjà fixés sans nouvelle cible ni secours en attente. Les nouvelles cibles admissibles restent prioritaires.","tankBoundSkills":"Autorise les compétences offensives contre les monstres déjà fixés. Niveaux, SP et intervalles Tank restent applicables. Soins et soutien conservent leurs conditions.","tankDistance":"Distance souhaitée au maître après rassemblement, en cases. Une fois tous fixés, revient dans cette limite et suit le maître qui s’éloigne. Zone Tank est distincte.","tankExclusions":"Exclut les monstres de Tank. Recherchez par nom ou ID et ajoutez la bonne entrée. Utilisez les ID personnalisés en connaissance de cause : les ID connus sont convertis à l’export ; un même numéro ne désigne pas toujours le même monstre.","tankMode":"Attire d’abord les nouveaux monstres admissibles dans la zone, revient à la distance Tank et peut combattre ceux fixés. Nouvelles cibles et secours sont prioritaires. Remplace le combat normal et désactive PvP. Compétences et exclusions se règlent ici. Tente d’abord une attraction ; après une brève vérification d’exécution, passe au suivant. Une compétence à distance ne lance pas immédiatement une poursuite au corps à corps. Sans aggro, réessaie plus tard. Une commande envoyée ne confirme pas un coup.","tankNormal":"Autorise les attaques normales en Tank, même sans compétence offensive prête. Sans elles, attirer l’aggro dépend des compétences disponibles.","tankPlants":"Exclut les plantes ordinaires et champignons indiqués de Tank. Indépendant d’Attaque normal.","tankRescue":"Autorise les compétences offensives pour attirer un assaillant du maître. Désactivé : utilise les attaques normales. Zone, exclusions et protection restent applicables.","tankSkillFields":"Niveau appris ; SP minimum absolu ; intervalle en secondes avant répétition. HP inférieurs à % apparaît pour soins/protection. Vérifier les HP de choisit la santé surveillée, pas forcément la cible soignée : Chaotic Blessings est aléatoire dans le jeu.","tankSkills":"Liste propre à Tank. Règles PvE normales et niveaux offensifs par monstre ne la contrôlent pas. Utilisez des compétences et niveaux appris. L’offensive respecte aussi le seuil SP général Tank ; soins/protection utilisent leurs intervalles et HP.","tankSp":"SP minimum supplémentaire absolu pour l’offensive Tank. Le seuil de chaque règle s’applique aussi. Avec peu de SP, une attaque normale peut prendre le relais si autorisée.","tankSummoned":"Exclut les plantes invoquées indiquées de Tank. Indépendant d’Attaque normal.","targetSwitching":"Les deux cases concernent le NOUVEAU monstre. Interrompre la cible exige un numéro de priorité inférieur ; égal ne suffit pas. Aussi les cibles manuelles permet de remplacer une cible manuelle. Vérifié pendant poursuite et attaque, même à distance. L’autodéfense ne bloque pas ; protéger le maître bloque seulement avec sa dérogation activée dans Défense. Amis, assistance/PvP, distances, protection contre le vol et exclusions restent respectés. Sniper garde sa fenêtre limitée de confirmation.","ownerDefenseOverridesPriority":"Désactivé par défaut ; seulement pour les assaillants de votre personnage. Activé : défendre le maître prime sur la priorité. Désactivé : peut combattre d’abord un monstre admissible plus prioritaire. Changer pendant un combat exige les cases d’interruption. L’autodéfense n’a jamais cette dérogation. Nécessite protéger le maître ; enregistré par mode T.","followMovingDistance":"Positifs : derrière le joueur, par ex. +14 = 14 cases derrière. 0 : sa position. Négatifs : devant, par ex. −3 = 3 devant. Direction du déplacement récent ; tourner sur place n’est pas détectable. Sans direction récente suit normalement à distance absolue. À l’arrêt, la distance distincte d’arrêt s’applique. Position visée, pas écart garanti : vitesse, obstacles et client peuvent le modifier. Mode T sélectionné.","followStoppedDistance":"Positifs : derrière ; négatifs : devant ; 0 : sur le joueur. Conserve la dernière direction ; les rotations sur place ne sont pas détectées. Mouvement −3/arrêt −3 garde trois cases devant ; −5/−2 rapproche à deux. Sans direction connue utilise la valeur absolue comme distance normale du côté actuel. Errance, orbite ou parcours reprennent à l’arrivée. Combat, distance Tank et commandes manuelles restent applicables.","tankAggroRetry":"Attente avant de réessayer un monstre encore non fixé. Par défaut 1800 ms. Préfère d’autres nouveaux monstres entre-temps. La vérification d’exécution peut augmenter l’attente réelle. Le secours est vérifié séparément et réessayé plus tôt.","castling":"Seuil HP : 0 désactive les critères de perte/cible. Une perte HP ne confirme pas un coup ; un soin entre cycles AI peut la masquer. Intervalle et SP minimum s’appliquent.","attackDanceMini":"Envoie les commandes de déplacement vers la case actuelle de l’homoncule au lieu d’une case voisine. Une seule variante d’Attack Dance peut être active par mode T. Comme la version classique, fonctionne uniquement avec la réduction de latence désactivée, minimale (1 ms) ou légère (10 ms). Expérimental : une vitesse d’attaque supérieure n’a pas encore été confirmée en jeu. Téléchargez à nouveau AI.lua et BAI_Config.lua dans Installer."}},"it":{"ui":{"Aktiv":"Attivo","Assistieren":"Assisti","Mindestens ein Profil muss vorhanden bleiben.":"Deve rimanere almeno un profilo.","Angriff":"Attacco","Angriffsverhalten":"Comportamento di attacco","Angriffsart und Grenzen; Details über die i-Punkte.":"Comportamento e limiti di attacco; premi i per i dettagli.","Nach Updates suchen":"Cerca aggiornamenti","Route löschen":"Cancella percorso","Credits":"Crediti","Aktuelles Profil":"Profilo attuale","Debug":"Debug","Verteidigung":"Difesa","Profil löschen":"Elimina profilo","Tank-Modus aktivieren":"Attiva modalità tank","T-Modus exportieren":"Esporta modalità T","Allgemein":"Generale","Homunculus":"Omuncolo","T-Modus importieren":"Importa modalità T","Installieren":"Installa","Installation":"Installazione","Sprache":"Lingua","Monster-Regeln":"Regole dei mostri","Bewegung":"Movimento","Bewegungsart":"Modalità di movimento","Neues Profil":"Nuovo profilo","Aus":"Disattivato","Übersicht":"Panoramica","Passiv":"Passivo","Priorität":"Priorità","Profilname":"Nome del profilo","Profile":"Profili","Profil umbenennen":"Rinomina profi aricare la pagina non li elimina.","Download AI.lua and BAI_Config.lua. Back up your existing AI/USER_AI folder and copy both files into it. Enable the user AI in the game. The desktop version is not required.":"Scarica AI.lua e BAI_Config.lua. Esegui un backup della cartella AI/USER_AI e copiaci entrambi i file. Attiva l’AI utente nel gioco. La versione desktop non è necessaria.","Install provides both Lua files for AI/USER_AI. Back up existing files before replacing them.":"Installa fornisce entrambi i file Lua per AI/USER_AI. Esegui un backup dei file esistenti prima di sostituirli.","The buttons on the left select two independent T modes. Switch in the game with Alt+T. Attack contains General, Skills, Monster rules and Sniper. Tank and PvP have their own tabs.":"I pulsanti a sinistra selezionano due modalità T indipendenti. Cambia modalità nel gioco con Alt+T. Attacco contiene Generale, Abilità, Regole dei mostri e Sniper. Tank e PvP hanno schede dedicate.","Profiles lets you choose the homunculus and manage settings. Import and export support desktop profiles and .baimode files.":"Profili permette di scegliere l’omuncolo e gestire le impostazioni. Importazione ed esportazione supportano profili desktop e file .baimode.","Priority 1 is the highest priority. Class-specific rules determine behavior for each class.":"La priorità 1 è la più alta. Le regole di classe determinano il comportamento per ogni classe.","Imported. Settings are now available in this browser.":"Importato. Le impostazioni sono ora disponibili in questo browser.","Enter a whole number within the allowed range.":"Inserisci un numero intero nell’intervallo consentito.","Cooldown: 0 to 30 seconds.":"Pausa: da 0 a 30 secondi.","ID list saved.":"Elenco ID salvato.","Enter positive whole-number IDs":"Inserisci ID interi positivi","At least one profile must remain.":"Deve rimanere almeno un profilo.","Maximum 1000 rules.":"Massimo 1000 regole.","Checking for updates …":"Ricerca aggiornamenti…","Profil
