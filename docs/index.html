y-range, math.min(oy+range, my))\r\n    if followX and (reason==\"FOLLOW_START\" or reason==\"FOLLOW_REFRESH\") then\r\n        reason=previous and \"DIRECTED_REFRESH\" or \"DIRECTED_START\"\r\n    end\r\n    if dx == mx and dy == my then\r\n        BaiTraffic.followPath=nil\r\n        return nil, \"ARRIVED\"\r\n    end\r\n    plan.dx, plan.dy = dx, dy\r\n    -- Retain only five actual follow positions. Detect a nearby destination\r\n    -- revisited while bouncing; ordinary straight/diagonal progress is unaffected.\r\n    local history = previous and previous.history or {}\r\n    if reason ~= \"STUCK_NATIVE\" and math.abs(mx-dx)<=1 and math.abs(my-dy)<=1 then\r\n        for _, pos in ipairs(history) do\r\n            if pos.x==dx and pos.y==dy then reason=\"BOUNCE_NATIVE\"; break end\r\n        end\r\n    end\r\n    plan.history[1]={x=mx,y=my}\r\n    for i=1,math.min(4,#history) do plan.history[i+1]=history[i] end\r\n    -- BAI has no Azzy occupied-cell map/long-path splitter. Keep the native\r\n    -- fallback for very long paths instead of emitting an unchecked distant cell.\r\n    local pathLength=GetDistance(mx,my,dx,dy)\r\n    if pathLength>15 then\r\n        if followX and reason~=\"STUCK_NATIVE\" and reason~=\"BOUNCE_NATIVE\" then\r\n            -- Extended signed distances can place the goal across the owner.\r\n            -- Approach it in short steps instead of repeatedly returning to owner.\r\n            local fraction=13/pathLength\r\n            dx=math.floor(mx+(dx-mx)*fraction+0.5)\r\n            dy=math.floor(my+(dy-my)*fraction+0.5)\r\n            plan.dx,plan.dy=dx,dy\r\n            reason=\"DIRECTED_STAGE\"\r\n        else reason=\"LONG_PATH_NATIVE\" end\r\n    end\r\n    if reason ~= \"STUCK_NATIVE\" and reason ~= \"BOUNCE_NATIVE\" and reason ~= \"LONG_PATH_NATIVE\" then\r\n        plan.kind=\"Move\"\r\n        plan.args={myid,dx,dy}\r\n        plan.directedFollow=followX~=nil\r\n    end\r\n    return plan, reason\r\nend\r\n\r\nfunction BaiTraffic.send(kind, args, keepWindow)\r\n    local followPath = nil\r\n    local followReason, arrivalDistance = nil, nil\r\n    if kind == \"MoveToOwner\" then\r\n        -- Resolve against current positions when actually sending, not when\r\n        -- queuing. Suppression must not advance a timer or remember an unsent path.\r\n        arrivalDistance = args[2]\r\n        followPath, followReason = BaiTraffic.prepareOwnerMove(args[1], arrivalDistance, args[3], args[4])\r\n        BaiDebug.followRun(BaiDebug.followDecision, followReason)\r\n        if followPath == nil then\r\n            BaiTraffic.suppressed = (BaiTraffic.suppressed or 0) + 1\r\n            return nil, false\r\n        end\r\n        kind, args = followPath.kind, followPath.args\r\n        if kind == \"Move\" then MyDestX,MyDestY=args[2],args[3] end\r\n    end\r\n    local raw = BaiTraffic.raw[kind]\r\n    local tankSpBefore=nil\r\n    if kind == \"SkillObject\" or kind == \"SkillGround\" then\r\n        BaiSnipe.beforeSkill()\r\n        -- A support/other cast must not masquerade as execution of a pending pull.\r\n        BaiTank.wait=nil\r\n        tankSpBefore=BaiSnipe.value(V_SP,MyID)\r\n    end\r\n    -- Existing native functions are called directly. A call is not proof of a hit.\r\n    if kind == \"Attack\" or kind == \"SkillObject\" or kind == \"SkillGround\" then\r\n        BaiDebug.run(BaiDebug.command, kind, (table.unpack or unpack)(args))\r\n    end\r\n    local result = raw((table.unpack or unpack)(args))\r\n    BaiTank.note(kind,args,tankSpBefore)\r\n    BaiDebug.followRun(BaiDebug.followSent, kind, args, followReason, arrivalDistance)\r\n    -- Any actual combat, skill, route or manual movement replaces the follow\r\n    -- path. Merely considering or queuing such a command does not replace it.\r\n    BaiTraffic.followPath = followPath\r\n    if kind == \"Attack\" or kind == \"SkillObject\" then\r\n        -- Only commands actually sent to a monster can produce a public chat ID.\r\n        pcall(BaiDebug.attacked, kind == \"Attack\" and args[2] or args[4])\r\n    end\r\n    BaiTraffic.sent = (BaiTraffic.sent or 0) + 1\r\n    if not keepWindow then BaiTraffic.lastOutput = GetTick() end\r\n    if BaiTraffic.level() > 0 and kind == \"Attack\" and args[2] == MyEnemy then currentTargetAttackStarted = true end\r\n    return result, true\r\nend\r\nfunction BaiTraffic.request(kind, ...)\r\n    BaiTraffic.requested = (BaiTraffic.requested or 0) + 1\r\n    local args = {...}\r\n    if BaiTraffic.level() == 0 or BaiTraffic.manual then\r\n        return BaiTraffic.send(kind, args)\r\n    end\r\n    local key = kind == \"Attack\" and \"attack\" or \"move\"\r\n    if BaiTraffic[key] then BaiTraffic.drop(key) end\r\n    BaiTraffic[key] = { kind=kind, args=args, target=MyEnemy, config=BAI_CONFIG, at=GetTick() }\r\n    -- Queued is deliberately not reported as issued to the state machine.\r\n    return nil, false\r\nend\r\nfunction BaiTraffic.skill(kind, ...)\r\n    BaiTraffic.requested = (BaiTraffic.requested or 0) + 1\r\n    local args = {...}\r\n    local explicit = BaiTraffic.explicitSkill == true\r\n    BaiTraffic.explicitSkill = false\r\n    if BaiTraffic.level() > 0 and not BaiTraffic.manual and not explicit and not BaiTraffic.ready() then\r\n        BaiTraffic.suppressed = (BaiTraffic.suppressed or 0) + 1\r\n        BaiDebug.skillContext = nil\r\n        return nil, false\r\n    end\r\n    if BaiTraffic.level() > 0 then BaiTraffic.cancel(false) end\r\n    local result, issued = BaiTraffic.send(kind, args)\r\n    BaiTraffic.skillThisTick = true\r\n    BaiDebug.skillContext = nil\r\n    return result, issued\r\nend\r\nfunction BaiTraffic.valid(request)\r\n    if not request or request.config ~= BAI_CONFIG or request.target ~= MyEnemy then return false end\r\n    local age = GetTick() - request.at\r\n    if age < 0 or age > 2000 then return false end\r\n    if request.kind == \"Attack\" then\r\n        if MyState ~= ATTACK_ST or MyEnemy == 0 or GetV(V_MOTION,MyEnemy) == MOTION_DEAD then return false end\r\n        if not IsInAttackSight(MyID,MyEnemy) then return false end\r\n        if MyEnemy ~= manualCombatTarget then\r\n            if BeyondCombatDistance() then return false end\r\n            if IsMonster(MyEnemy) == 1 and not IsMonsterFreeForUs(MyEnemy) then return false end\r\n        end\r\n        if BAI_CONFIG.tankEnabled then\r\n            if not TankValidMonster(MyEnemy) then return false end\r\n        elseif currentPvpAction == nil and IsMonster(MyEnemy) == 1 then\r\n            if not MonsterActionAllowed(MyEnemy) then return false end\r\n            local action = CurrentMonsterAction(MyEnemy)\r\n            if action == \"SkillsOnly\" then return false end\r\n        end\r\n        return true\r\n    end\r\n    -- A chase movement must not survive arrival, target loss, or a new state.\r\n    if request.target ~= 0 then\r\n        return MyState == CHASE_ST and not IsOutOfSight(MyID,MyEnemy) and\r\n            GetV(V_MOTION,MyEnemy) ~= MOTION_DEAD\r\n    end\r\n    return MyState == IDLE_ST or MyState == MOVE_CMD_ST or MyState == PATROL_CMD_ST or\r\n        MyState == ATTACK_AREA_CMD_ST or MyState == SKILL_AREA_CMD_ST or MyState == FRIEND_CIRCLE_ST\r\nend\r\nfunction BaiTraffic.signature(request)\r\n    local a = request.args\r\n    if request.kind == \"MoveToOwner\" then\r\n        local owner = GetV(V_OWNER,MyID)\r\n        local x,y = GetV(V_POSITION,owner)\r\n        return \"owner:\" .. tostring(owner) .. \":\" .. tostring(x) .. \":\" .. tostring(y)\r\n    end\r\n    return request.kind .. \":\" .. table.concat(a, \":\") .. \":target=\" .. tostring(request.target)\r\nend\r\nfunction BaiTraffic.finish()\r\n    if BaiTraffic.level() == 0 then return end\r\n    for _,key in ipairs({\"move\",\"attack\"}) do\r\n        if BaiTraffic[key] and not BaiTraffic.valid(BaiTraffic[key]) then BaiTraffic.drop(key) end\r\n    end\r\n    if BaiTraffic.startupWaiting() or BaiTraffic.skillThisTick then return end\r\n\r\n    -- A valid normal hit is not held back by the lag timer when this option is on.\r\n    -- Do not move the shared timer: otherwise frequent hits would starve skills/following.\r\n    if BaiTraffic.attack and BaiTraffic.preserveAttacks() then\r\n        local request = BaiTraffic.attack\r\n        BaiTraffic.attack = nil\r\n        BaiTraffic.drop(\"move\")\r\n        BaiTraffic.send(request.kind, request.args, true)\r\n        return\r\n    end\r\n\r\n    if not BaiTraffic.ready() then return end\r\n    local key = BaiTraffic.attack and \"attack\" or (BaiTraffic.move and \"move\" or nil)\r\n    if not key then return end\r\n    local request = BaiTraffic[key]\r\n    local now = GetTick()\r\n    local signature = BaiTraffic.signature(request)\r\n    local lastKey = key == \"attack\" and \"lastAttack\" or \"lastMove\"\r\n    local last = BaiTraffic[lastKey]\r\n    -- The selected interval is the normal-hit minimum when throttling is requested.\r\n    -- Owner following refreshes its near-owner destination each output cycle.\r\n    -- The shared lag window applies; other moves retain their duplicate filter.\r\n    local repeatInterval = (key == \"attack\" and 1 or 2) * BaiTraffic.interval()\r\n    if request.kind ~= \"MoveToOwner\" and last and last.signature == signature and now >= last.at and\r\n       now-last.at < repeatInterval then return end\r\n    BaiTraffic[key] = nil\r\n    if key == \"attack\" then BaiTraffic.drop(\"move\") end\r\n    local _, issued = BaiTraffic.send(request.kind, request.args)\r\n    if issued then BaiTraffic[lastKey] = { signature=signature, at=now } end\r\nend\r\nfunction BaiTraffic.dance(myid, target, x, y, backX, backY)\r\n    -- One atomic Move -> Attack -> Move group. It is never carried into another tick.\r\n    BaiTraffic.requested = (BaiTraffic.requested or 0) + 3\r\n    if BaiTraffic.interval() > 10 or (not BaiTraffic.manual and not BaiTraffic.ready()) then\r\n        BaiTraffic.suppressed = (BaiTraffic.suppressed or 0) + 3\r\n        if BaiTraffic.preserveAttacks() and not BaiTraffic.skillThisTick then\r\n            local _, issued = Attack(myid, target)\r\n            return issued\r\n        end\r\n        return false\r\n    end\r\n    BaiTraffic.cancel(false)\r\n    BaiTraffic.send(\"Move\", {myid, x, y})\r\n    BaiTraffic.send(\"Attack\", {myid, target})\r\n    BaiTraffic.send(\"Move\", {myid, backX, backY})\r\n    return true\r\nend\r\nfunction BaiTraffic.report()\r\n    if not BaiDebug.enabled(\"traffic\") then return end\r\n    local now = GetTick()\r\n    if BaiTraffic.reportAt == nil then BaiTraffic.reportAt=now; return end\r\n    if now >= BaiTraffic.reportAt and now-BaiTraffic.reportAt < 5000 then return end\r\n    BaiTraffic.reportAt = now\r\n    BaiDebug.write(\"LAG level=\" .. tostring(BaiTraffic.level()) .. \" window_ms=\" .. tostring(BaiTraffic.interval()) ..\r\n        \" normal_unthrottled=\" .. tostring(BaiTraffic.preserveAttacks()) ..\r\n        \" dance_allowed=\" .. tostring(BaiTraffic.interval() <= 10) ..\r\n        \" requested=\" .. tostring(BaiTraffic.requested or 0) .. \" sent=\" .. tostring(BaiTraffic.sent or 0) ..\r\n        \" suppressed=\" .. tostring(BaiTraffic.suppressed or 0) ..\r\n        \" pending=\" .. tostring((BaiTraffic.move and 1 or 0)+(BaiTraffic.attack and 1 or 0)) ..\r\n        \" startup_wait=\" .. tostring(BaiTraffic.startupWaiting()) .. \" counters=client_API_calls_not_packets\" .. BaiDebug.mode())\r\nend\r\n-- During the one-time startup delay, only work explicitly requested by the\r\n-- player is advanced. No automatic target acquisition/support/tank logic runs.\r\nfunction BaiTraffic.manualStartupStep()\r\n    BaiTraffic.manual = true\r\n    if MyEnemy ~= 0 and MyEnemy == manualCombatTarget and (MyState == CHASE_ST or MyState == ATTACK_ST) then\r\n        if GetV(V_MOTION,MyEnemy) == MOTION_DEAD or IsOutOfSight(MyID,MyEnemy) then\r\n            ResetAutoTarget(); MyState=IDLE_ST; return\r\n        end\r\n        if not IsInAttackSight(MyID,MyEnemy) then\r\n            local x,y = GetV(V_POSITION_APPLY_SKILLATTACKRANGE,MyEnemy,MySkill,MySkillLevel)\r\n            MyDestX,MyDestY=x,y\r\n            Move(MyID,x,y)\r\n            MyState=CHASE_ST\r\n        else\r\n            MyState=ATTACK_ST\r\n            if MySkill ~= 0 then\r\n                if SkillsAllowedByOwnerDistance() then SkillObject(MyID,MySkillLevel,MySkill,MyEnemy); MySkill=0 end\r\n            else\r\n                Attack(MyID,MyEnemy)\r\n            end\r\n        end\r\n    elseif MyState == MOVE_CMD_ST then OnMOVE_CMD_ST()\r\n    elseif MyState == ATTACK_AREA_CMD_ST then OnATTACK_AREA_CMD_ST()\r\n    elseif MyState == PATROL_CMD_ST then OnPATROL_CMD_ST()\r\n    elseif MyState == HOLD_CMD_ST then OnHOLD_CMD_ST()\r\n    elseif MyState == SKILL_AREA_CMD_ST then OnSKILL_AREA_CMD_ST()\r\n    elseif MyState == FRIEND_CIRCLE_ST then OnFRIEND_CIRCLE_ST()\r\n    end\r\nend\r\n\r\n-- Optional diagnostics. This table never selects targets or issues game commands.\r\n-- TraceAI is used for diagnostic logs. Numeric chat IDs use TraceValue, as in\r\n-- the supplied working ID reader. No speculative text-chat API or startup test messages.\r\nfunction BaiDebug.options()\r\n    if type(BAI_CONFIG) ~= \"table\" then return nil end\r\n    local d = BAI_CONFIG.debug\r\n    if type(d) ~= \"table\" or d.enabled ~= true then return nil end\r\n    if d.toTrace ~= true and d.toFile ~= true then return nil end\r\n    return d\r\nend\r\nfunction BaiDebug.enabled(category)\r\n    local d = BaiDebug.options()\r\n    if not d then return false end\r\n    -- Category checkboxes select log content; the numeric chat channel is separate.\r\n    if d.toTrace ~= true and d.toFile ~= true then return false end\r\n    if d.onlyId == true then return category == \"ids\" end\r\n    return d[category] == true\r\nend\r\nfunction BaiDebug.run(fn, ...)\r\n    -- Diagnostics may fail without stopping the actual combat logic.\r\n    if not BaiDebug.options() or type(fn) ~= \"function\" then return end\r\n    pcall(fn, ...)\r\nend\r\nfunction BaiDebug.value(key, actor)\r\n    if key == nil then return nil end\r\n    local ok, a, b = pcall(GetV, key, actor)\r\n    if not ok then return nil end\r\n    return a, b\r\nend\r\n-- Optional follow recorder, enabled by the existing traffic debug category. Counts are exact within each sample; at most eight\r\n-- detailed commands are retained per 250 ms. Excess events are explicitly counted.\r\n-- TraceAI and the dedicated bounded file receive the same lines. File writes are\r\n-- batched once per second; no diagnostic function issues gameplay commands.\r\nfunction BaiDebug.followRun(fn, ...)\r\n    if BaiDebug.enabled(\"traffic\") and type(fn) == \"function\" then pcall(fn, ...) end\r\nend\r\nfunction BaiDebug.followData()\r\n    if not BaiDebug.followRecording then\r\n        BaiDebug.followRecording = { ticks=0, counts={}, decisions={}, events={}, omitted=0, buffer={} }\r\n    end\r\n    return BaiDebug.followRecording\r\nend\r\nfunction BaiDebug.followWrite(body)\r\n    local d = BaiDebug.followData()\r\n    local line = \"[BAI-FOLLOW v0.2.7v3] t=\" .. tostring(GetTick()) .. \" \" .. body\r\n    local options = BaiDebug.options()\r\n    if not options then return end\r\n    if options.toTrace == true and type(BaiDebug.rawTrace) == \"function\" then pcall(BaiDebug.rawTrace, line) end\r\n    if options.toFile == true and #d.buffer < 64 then table.insert(d.buffer, line) end\r\nend\r\nfunction BaiDebug.followFlush(now)\r\n    local d = BaiDebug.followData()\r\n    if d.flushedAt and now >= d.flushedAt and now-d.flushedAt < 1000 then return end\r\n    d.flushedAt = now\r\n    local lines = d.buffer\r\n    d.buffer = {}\r\n    local options = BaiDebug.options()\r\n    if not options or options.toFile ~= true or d.fileStopped or #lines == 0 then return end\r\n    if type(io) ~= \"table\" or type(io.open) ~= \"function\" then d.fileStopped=true; return end\r\n    local ok, file = pcall(io.open, \"./AI/USER_AI/BAI_Follow.log\", \"a\")\r\n    if not ok or not file then d.fileStopped=true; return end\r\n    local written = pcall(function()\r\n        local length = file:seek(\"end\")\r\n        local block = table.concat(lines, \"\\n\") .. \"\\n\"\r\n        if length and length + #block <= 2097152 then\r\n            if not file:write(block) then d.fileStopped=true end\r\n        else d.fileStopped=true end\r\n    end)\r\n    local closed, closeResult = pcall(function() return file:close() end)\r\n    if not closed or not closeResult then d.fileStopped=true end\r\n    if not written then d.fileStopped=true end\r\nend\r\nfunction BaiDebug.followMotion(actor)\r\n    local motion = BaiDebug.value(V_MOTION, actor)\r\n    if motion == MOTION_MOVE then return \"MOVE\" end\r\n    if motion == MOTION_STAND then return \"STAND\" end\r\n    return tostring(motion)\r\nend\r\nfunction BaiDebug.followPositions()\r\n    local owner = BaiDebug.value(V_OWNER, MyID)\r\n    local ox, oy = nil, nil\r\n    if owner and owner ~= 0 then ox, oy = BaiDebug.value(V_POSITION, owner) end\r\n    local mx, my = BaiDebug.value(V_POSITION, MyID)\r\n    local distance = \"UNKNOWN\"\r\n    if type(ox)==\"number\" and type(oy)==\"number\" and type(mx)==\"number\" and type(my)==\"number\" and\r\n       ox>=0 and oy>=0 and mx>=0 and my>=0 then distance=tostring(GetDistance(ox,oy,mx,my)) end\r\n    local path = BaiTraffic.followPath\r\n    return \" owner=\" .. tostring(owner) .. \" owner_pos=\" .. tostring(ox) .. \",\" .. tostring(oy) ..\r\n        \" owner_motion=\" .. (owner and owner~=0 and BaiDebug.followMotion(owner) or \"UNKNOWN\") ..\r\n        \" homu=\" .. tostring(MyID) .. \" homu_pos=\" .. tostring(mx) .. \",\" .. tostring(my) ..\r\n        \" homu_motion=\" .. BaiDebug.followMotion(MyID) .. \" distance=\" .. distance ..\r\n        \" last_follow_owner_pos=\" .. (path and (tostring(path.x)..\",\"..tostring(path.y)) or \"NONE\") ..\r\n        \" last_follow_destination=\" .. (path and path.kind==\"Move\" and (tostring(path.dx)..\",\"..tostring(path.dy)) or \"NATIVE_OR_NONE\") ..\r\n        \" stopped_tries=\" .. tostring(path and path.tries or 0)\r\nend\r\nfunction BaiDebug.followDecision(reason)\r\n    local d = BaiDebug.followData()\r\n    reason = reason or \"UNKNOWN\"\r\n    d.decisions[reason] = (d.decisions[reason] or 0) + 1\r\nend\r\nfunction BaiDebug.followSent(kind, args, reason, arrivalDistance)\r\n    local d = BaiDebug.followData()\r\n    d.counts[kind] = (d.counts[kind] or 0) + 1\r\n    d.lastCommand = kind\r\n    if kind == \"Attack\" then return end -- counted in every sample, never spammed per hit\r\n    if #d.events >= 8 then d.omitted=d.omitted+1; return end\r\n    local details = \"\"\r\n    if reason then details = \" follow_reason=\" .. tostring(reason) .. \" arrival=\" .. tostring(arrivalDistance or 0) end\r\n    if kind == \"Move\" then\r\n        details = details .. \" destination=\" .. tostring(args[2]) .. \",\" .. tostring(args[3])\r\n    elseif kind == \"SkillObject\" or kind == \"SkillGround\" then\r\n        details = \" level=\" .. tostring(args[2]) .. \" skill=\" .. tostring(args[3]) .. \" target=\" .. tostring(args[4])\r\n        if kind == \"SkillGround\" then details=details..\",\"..tostring(args[5]) end\r\n    end\r\n    table.insert(d.events, \"API_CMD at=\" .. tostring(GetTick()) .. \" kind=\" .. kind .. details ..\r\n        \" manual=\" .. tostring(BaiTraffic.manual == true) .. BaiDebug.mode() .. BaiDebug.followPositions())\r\nend\r\nfunction BaiDebug.followStep(command)\r\n    local d = BaiDebug.followData()\r\n    d.ticks = d.ticks + 1\r\n    if command ~= NONE_CMD then d.input=command end\r\nend\r\nfunction BaiDebug.followSample()\r\n    local now = GetTick()\r\n    local d = BaiDebug.followData()\r\n    if d.sampleAt and now >= d.sampleAt and now-d.sampleAt < 250 then return end\r\n    if not d.started then\r\n        BaiDebug.followWrite(\"START movement=azzy_style moving_range=\" .. tostring(BaiTraffic.followDistance(true)) ..\r\n            \" moving_arrival=\" .. tostring(math.abs(BaiTraffic.followDistance(true))+1) ..\r\n            \" stopped_range=\" .. tostring(BaiTraffic.followDistance(false)) ..\r\n            \" refresh=each_follow_cycle\" ..\r\n            \" native_MoveToOwner=fallback_only lag_policy=BAI\" ..\r\n            \" sample_ms=250 max_cmd_details_per_sample=8 file=AI/USER_AI/BAI_Follow.log\" ..\r\n            \" positions=client_GetV_not_server_path calls=not_packets\")\r\n        d.started=true\r\n    end\r\n    if d.config ~= BAI_CONFIG then\r\n        d.config=BAI_CONFIG\r\n        local idle = CurrentIdle() or {}\r\n        BaiDebug.followWrite(\"CONFIG\" .. BaiDebug.mode() .. \" lag=\" .. tostring(BaiTraffic.level()) ..\r\n            \" lag_ms=\" .. tostring(BaiTraffic.interval()) .. \" tank=\" .. tostring(BAI_CONFIG.tankEnabled) ..\r\n            \" idle=\" .. tostring(idle.mode) .. \" radius=\" .. tostring(idle.radius) ..\r\n            \" moving_range=\" .. tostring(BaiTraffic.followDistance(true)) ..\r\n            \" stopped_range=\" .. tostring(BaiTraffic.followDistance(false)) ..\r\n            \" attack_moving=\" .. tostring(BAI_CONFIG.attackWhileOwnerMoving) ..\r\n            \" finish_fight=\" .. tostring(BAI_CONFIG.finishCurrentTargetWhileOwnerMoving) ..\r\n            \" combat_distance=\" .. tostring(BAI_CONFIG.maxCombatDistanceFromOwner) ..\r\n            \" auto_skills=\" .. tostring(BAI_CONFIG.autoSkillsEnabled))\r\n    end\r\n    for _, event in ipairs(d.events) do BaiDebug.followWrite(event) end\r\n    local counts, decisions = {}, {}\r\n    for _, kind in ipairs({\"MoveToOwner\",\"Move\",\"Attack\",\"SkillObject\",\"SkillGround\"}) do\r\n        table.insert(counts, kind .. \":\" .. tostring(d.counts[kind] or 0))\r\n    end\r\n    for _, reason in ipairs({\"FOLLOW_START\",\"FOLLOW_REFRESH\",\"DIRECTED_START\",\"DIRECTED_REFRESH\",\"DIRECTED_STAGE\",\"DIRECTED_STOP\",\"STUCK_CLOSE\",\"STUCK_NATIVE\",\"BOUNCE_NATIVE\",\"LONG_PATH_NATIVE\",\"RECOVERY_RESET\",\"UNKNOWN_POSITION\",\"ARRIVED\",\"SAME_TICK\",\"NO_OWNER\"}) do\r\n        if d.decisions[reason] then table.insert(decisions,reason..\":\"..tostring(d.decisions[reason])) end\r\n    end\r\n    local elapsed = d.sampleAt and now-d.sampleAt or 0\r\n    BaiDebug.followWrite(\"SAMPLE span_ms=\" .. tostring(elapsed) .. \" ticks=\" .. tostring(d.ticks) .. BaiDebug.mode() ..\r\n        BaiDebug.followPositions() .. \" calls=\" .. table.concat(counts,\",\") ..\r\n        \" decisions=\" .. table.concat(decisions,\",\") .. \" details_omitted=\" .. tostring(d.omitted) ..\r\n        \" input=\" .. tostring(d.input or NONE_CMD) .. \" enemy=\" .. tostring(MyEnemy) ..\r\n        \" last_cmd=\" .. tostring(d.lastCommand or \"NONE\") ..\r\n        \" queued_move=\" .. tostring(BaiTraffic.move and BaiTraffic.move.kind or \"NONE\") ..\r\n        \" queued_attack=\" .. tostring(BaiTraffic.attack~=nil) .. \" snipe_pending=\" .. tostring(BaiSnipe.pending~=nil) ..\r\n        \" file_stopped=\" .. tostring(d.fileStopped==true))\r\n    d.sampleAt, d.ticks, d.counts, d.decisions, d.events, d.omitted, d.input = now, 0, {}, {}, {}, 0, nil\r\n    BaiDebug.followFlush(now)\r\nend\r\nfunction BaiDebug.mode()\r\n    local states = { [0]=\"IDLE\", [1]=\"FOLLOW\", [2]=\"CHASE\", [3]=\"ATTACK\" }\r\n    return \" T\" .. tostring(BAI_ACTIVE_T or 1) .. \" state=\" .. (states[MyState] or tostring(MyState)) ..\r\n        \" source=\" .. tostring(currentCombatSource or \"auto\")\r\nend\r\n-- A separate budget prevents verbose file logging from starving ID messages.\r\nfunction BaiDebug.chatId(raw, public)\r\n    local d = BaiDebug.options()\r\n    if not public then return false end\r\n    if type(BaiDebug.rawTraceValue) ~= \"function\" then return false end\r\n    local id = tonumber(raw)\r\n    if not id or id <= 0 or id >= math.huge or id ~= math.floor(id) then return false end\r\n    local window = math.floor(GetTick() / 1000)\r\n    if BaiDebug.chatWindow ~= window then BaiDebug.chatWindow, BaiDebug.chatLines = window, 0 end\r\n    if (BaiDebug.chatLines or 0) >= 8 then return false end\r\n    BaiDebug.chatLines = (BaiDebug.chatLines or 0) + 1\r\n    -- Pass a NUMBER, exactly like TraceValue(mobID) in the supplied client AI.\r\n    -- An absent/throwing client function cannot stop combat or select a target.\r\n    local ok = pcall(BaiDebug.rawTraceValue, id)\r\n    return ok\r\nend\r\nfunction BaiDebug.attacked(actor)\r\n    if type(BAI_CONFIG) ~= \"table\" or BAI_CONFIG.showAttackedMonsterIdsInChat ~= true then return end\r\n    if type(actor) ~= \"number\" or actor <= 0 or IsMonster(actor) ~= 1 then return end\r\n    local raw = tonumber(BaiDebug.value(V_HOMUNTYPE, actor))\r\n    if not raw or raw <= 0 then return end\r\n    local now = GetTick()\r\n    local seen = BaiDebug.attackedSeen or {}\r\n    BaiDebug.attackedSeen = seen\r\n    local previous = seen[actor]\r\n    if previous and previous.raw == raw and now >= previous.at and now - previous.at <= 30000 then\r\n        previous.at = now\r\n        return\r\n    end\r\n    if BaiDebug.chatId(raw, true) then seen[actor] = { raw=raw, at=now } end\r\n    -- Actor IDs may be reused. Keep only recent encounters.\r\n    if not BaiDebug.attackedPruned or now < BaiDebug.attackedPruned or now - BaiDebug.attackedPruned >= 10000 then\r\n        BaiDebug.attackedPruned = now\r\n        for id, entry in pairs(seen) do\r\n            if now < entry.at or now - entry.at > 30000 then seen[id] = nil end\r\n        end\r\n    end\r\nend\r\nfunction BaiDebug.write(body)\r\n    local d = BaiDebug.options()\r\n    if not d or (d.toTrace ~= true and d.toFile ~= true) then return false end\r\n    local now = GetTick()\r\n    local window = math.floor(now / 1000)\r\n    if BaiDebug.window ~= window then BaiDebug.window, BaiDebug.lines = window, 0 end\r\n    if (BaiDebug.lines or 0) >= 24 then return false end\r\n    BaiDebug.lines = (BaiDebug.lines or 0) + 1\r\n    local line = d.onlyId == true and body or (\"[BAI-TRACE v0.2.7v3] t=\" .. tostring(now) .. \" \" .. body)\r\n    if d.toTrace == true and type(BaiDebug.rawTrace) == \"function\" then pcall(BaiDebug.rawTrace, line) end\r\n    if d.toFile == true and type(io) == \"table\" and type(io.open) == \"function\" then\r\n        -- Fixed dedicated diagnostic path; never touches profile/config/game data.\r\n        -- Stop at 2 MiB instead of growing forever; delete/archive the log manually to continue.\r\n        local file = io.open(\"./AI/USER_AI/BAI_Debug.log\", \"a\")\r\n        if file then\r\n            local length = file:seek(\"end\")\r\n            if length and length + #line + 1 <= 2097152 then file:write(line, \"\\n\") end\r\n            file:close()\r\n        end\r\n    end\r\n    return true\r\nend\r\nfunction BaiDebug.event(category, key, body, immediate)\r\n    if not BaiDebug.enabled(category) then return end\r\n    local now = GetTick()\r\n    local d = BaiDebug.options()\r\n    local interval = math.max(250, math.min(10000, tonumber(d.intervalMs) or 1000))\r\n    BaiDebug.last = BaiDebug.last or {}\r\n    local previous = BaiDebug.last[key]\r\n    if previous and now >= previous.at and now - previous.at < interval and\r\n       (not immediate or previous.body == body) then return end\r\n    if BaiDebug.write(body) then BaiDebug.last[key] = { at=now, body=body } end\r\nend\r\nfunction BaiDebug.actor(actor)\r\n    local raw = BaiDebug.value(V_HOMUNTYPE, actor)\r\n    local rule = actor and actor > 0 and MonsterRuleForActor(actor) or nil\r\n    local catalog = rule and rule.catalogId or nil\r\n    local hub = rule and rule.midgardHubId or nil\r\n    local identity = (BAI_CONFIG.monsterIdentities or {})[tonumber(raw) or 0]\r\n    if identity then catalog = catalog or identity.catalogId; hub = hub or identity.midgardHubId end\r\n    return \"actor=\" .. tostring(actor) .. \" ai_id=\" .. tostring(raw) .. \" catalog_id=\" .. tostring(catalog or \"UNKNOWN\") ..\r\n        \" hub_id=\" .. tostring(hub or \"UNKNOWN\") .. \" rule=\" .. tostring(rule and rule.monsterId or \"NONE\")\r\nend\r\nfunction BaiDebug.command(kind, id, level, skill, target)\r\n    if not BaiDebug.enabled(\"skills\") then return end\r\n    if kind == \"Attack\" then\r\n        BaiDebug.event(\"skills\", \"attack\", \"CMD Attack target=\" .. tostring(level) .. BaiDebug.mode(), false)\r\n        return\r\n    end\r\n    local context = BaiDebug.skillContext\r\n    local suffix = context and (\" path=\" .. tostring(context.kind) .. \" global_lv=\" .. tostring(context.level)) or \" path=ManualOrSpecial\"\r\n    BaiDebug.event(\"skills\", \"cmd:\" .. tostring(kind), \"CMD \" .. kind .. \" id=\" .. tostring(skill) ..\r\n        \" SENT_LV=\" .. tostring(level) .. \" target=\" .. tostring(target) .. suffix .. BaiDebug.mode(), true)\r\nend\r\nfunction BaiDebug.skillLevel(actor, fallback, effective, rule)\r\n    if not BaiDebug.enabled(\"skills\") and not BaiDebug.enabled(\"rules\") then return end\r\n    local category = BaiDebug.enabled(\"skills\") and \"skills\" or \"rules\"\r\n    BaiDebug.event(category, \"resolve:\" .. tostring(actor), \"RESOLVE \" .. BaiDebug.actor(actor) ..\r\n        \" global_lv=\" .. tostring(fallback) .. \" effective_lv=\" .. tostring(effective) .. BaiDebug.mode(), true)\r\nend\r\nfunction BaiDebug.rejected(reason, actor)\r\n    if not BaiDebug.enabled(\"reasons\") then return end\r\n    BaiDebug.event(\"reasons\", \"reject:\" .. tostring(actor) .. \":\" .. reason,\r\n        \"INT_REJECT reason=\" .. reason .. \" \" .. BaiDebug.actor(actor) .. \" current=\" .. tostring(MyEnemy) .. BaiDebug.mode(), false)\r\nend\r\nfunction BaiDebug.block(reason)\r\n    if not BaiDebug.enabled(\"reasons\") then return end\r\n    BaiDebug.event(\"reasons\", \"block:\" .. reason, \"INT_BLOCK reason=\" .. reason .. \" target=\" .. tostring(MyEnemy) .. BaiDebug.mode(), false)\r\nend\r\nfunction BaiDebug.accepted(actor, manual)\r\n    if BaiDebug.enabled(\"switches\") then\r\n        BaiDebug.event(\"switches\", \"accepted\", \"ACCEPT old=\" .. tostring(MyEnemy) .. \" new=\" .. tostring(actor) ..\r\n            \" manual=\" .. tostring(manual) .. \" \" .. BaiDebug.actor(actor) .. BaiDebug.mode(), true)\r\n    end\r\nend\r\nfunction BaiDebug.switched(old, new, oldPriority, newPriority, manual)\r\n    BaiDebug.event(\"switches\", \"switch\", \"INT_SWITCH old=\" .. tostring(old) .. \" old_prio=\" .. tostring(oldPriority) ..\r\n        \" new=\" .. tostring(new) .. \" new_prio=\" .. tostring(newPriority) .. \" released_manual=\" .. tostring(manual) .. BaiDebug.mode(), true)\r\nend\r\nfunction BaiDebug.snapshot(command)\r\n    local d = BaiDebug.options()\r\n    if not d then return end\r\n    local now = GetTick()\r\n    -- All throttles/deduplication are reset per T configuration, not shared across T1/T2.\r\n    if BaiDebug.cfg ~= BAI_CONFIG then\r\n        BaiDebug.cfg, BaiDebug.last, BaiDebug.seen, BaiDebug.scanAt = BAI_CONFIG, {}, {}, nil\r\n        BaiDebug.configDone = false\r\n    end\r\n    if BaiDebug.enabled(\"state\") then\r\n        BaiDebug.event(\"state\", \"state\", \"STATE target=\" .. tostring(MyEnemy) ..\r\n            \" client_target=\" .. tostring(BaiDebug.value(V_TARGET,MyID)) .. \" command=\" .. tostring(command) ..\r\n            \" SP=\" .. tostring(BaiDebug.value(V_SP,MyID)) .. BaiDebug.mode(), false)\r\n    end\r\n    if BaiDebug.enabled(\"config\") and not BaiDebug.configDone then\r\n        -- Output one bounded line; individual rules are visible in the rules category.\r\n        BaiDebug.event(\"config\", \"config\", \"CONFIG profile=\" .. tostring(BAI_CONFIG.profileSlot) ..\r\n            \" rules=\" .. tostring(#(BAI_CONFIG.monsterRules or {})) .. \" autoSkills=\" .. tostring(BAI_CONFIG.autoSkillsEnabled) ..\r\n            \" tank=\" .. tostring(BAI_CONFIG.tankEnabled) .. \" config_load=\" .. tostring(configOk) .. BaiDebug.mode(), true)\r\n        BaiDebug.configDone = true\r\n    end\r\n    local interval = math.max(250, math.min(10000, tonumber(d.intervalMs) or 1000))\r\n    if BaiDebug.scanAt and now >= BaiDebug.scanAt and now - BaiDebug.scanAt < interval then return end\r\n    BaiDebug.scanAt = now\r\n    if not (BaiDebug.enabled(\"ids\") or BaiDebug.enabled(\"rules\") or BaiDebug.enabled(\"queries\")) then return end\r\n    BaiDebug.seen = BaiDebug.seen or {}\r\n    local scope = d.scope or \"Target\"\r\n    local targets = scope == \"Target\" and { MyEnemy } or TickActors()\r\n    local seenThisTick, count = {}, 0\r\n    for _,actor in ipairs(targets) do\r\n        if type(actor) == \"number\" and actor > 0 and not seenThisTick[actor] and IsMonster(actor) == 1 and\r\n           BaiDebug.value(V_MOTION, actor) ~= MOTION_DEAD then\r\n            seenThisTick[actor] = true\r\n            local distance = GetDistance2(MyID, actor)\r\n            if scope ~= \"Nearby\" or (distance >= 0 and distance <= (tonumber(d.distance) or 2)) then\r\n                local raw = tonumber(BaiDebug.value(V_HOMUNTYPE, actor))\r\n                if raw and raw > 0 then\r\n                    local known = BaiDebug.seen[actor]\r\n                    if known and (known.raw ~= raw or now < known.at or now-known.at > 30000) then known = nil end\r\n                    known = known or { raw=raw }\r\n                    known.at = now\r\n                    BaiDebug.seen[actor] = known\r\n                    if BaiDebug.enabled(\"ids\") and (not d.once or not known.printed) then\r\n                        local body = d.onlyId == true and tostring(raw) or (\"MONSTER_ID \" .. BaiDebug.actor(actor) .. BaiDebug.mode())\r\n                        if BaiDebug.write(body) then known.printed = true end\r\n                    end\r\n                    if BaiDebug.enabled(\"rules\") then\r\n                        local rule = MonsterRuleForActor(actor)\r\n                        BaiDebug.event(\"rules\", \"rule:\" .. tostring(actor), \"RULE \" .. BaiDebug.actor(actor) ..\r\n                            \" skill_lv=\" .. tostring(rule and rule.skillLevel or \"GLOBAL\") ..\r\n                            \" priority=\" .. tostring(rule and rule.priority or 5) ..\r\n                            \" interrupt=\" .. tostring(rule and rule.interruptCurrentTarget == true or false) ..\r\n                            \" also_manual=\" .. tostring(rule and rule.interruptManualTargets == true or false), false)\r\n                    end\r\n                    if BaiDebug.enabled(\"queries\") and not known.probed then\r\n                        local query = \"ID_PROBE actor=\" .. tostring(actor) .. \" V_TYPE[\" .. tostring(V_TYPE) .. \"]=\" ..\r\n                            tostring(BaiDebug.value(V_TYPE,actor)) .. \" V_HOMUNTYPE[\" .. tostring(V_HOMUNTYPE) .. \"]=\" ..\r\n                            tostring(raw) .. \" V_MERTYPE[\" .. tostring(V_MERTYPE) .. \"]=\" .. tostring(BaiDebug.value(V_MERTYPE,actor))\r\n                        if BaiDebug.write(query) then known.probed = true end\r\n                    end\r\n                end\r\n            end\r\n            count = count + 1\r\n            if count >= 64 then break end\r\n        end\r\n    end\r\n    -- Bound caches; \"once\" means once per encounter, reset after 30 s unseen or an AI reload.\r\n    for actor,entry in pairs(BaiDebug.seen) do\r\n        if now < entry.at or now-entry.at > 30000 then BaiDebug.seen[actor] = nil end\r\n    end\r\n    for key,entry in pairs(BaiDebug.last or {}) do\r\n        if now < entry.at or now-entry.at > 30000 then BaiDebug.last[key] = nil end\r\n    end\r\nend\r\n\r\nfunction AfterSkill(myid)\r\n    if myid==MyID and BaiTank.wait and BaiTank.wait.kind==\"SkillObject\" then BaiTank.wait.completed=true end\r\n    if BaiSnipe.pending and myid == MyID then\r\n        BaiSnipe.log(\"CALLBACK target=\" .. tostring(BaiSnipe.pending.actor) ..\r\n            \" evidence=AFTER_SKILL hits=UNKNOWN\", false)\r\n    end\r\n    -- No cooldown value is exposed by the official AI API.\r $('#language').onchange=e=>{language=e.target.value;try{writePreference('bai-web-language',language);}catch{}render();message('Bereit.');trackLanguage(language);};
$('#profile-download').onclick=exportProfile;$('#help-close').onclick=()=>$('#help-dialog').close();$('#help-dialog').onclick=e=>{if(e.target===$('#help-dialog'))$('#help-dialog').close();};
try{const multi=JSON.parse(readPreference('bai-web-profiles')||'null');const raw=readPreference(STORAGE);if(raw)importData(JSON.parse(raw));if(multi?.profiles?.length){profiles=multi.profiles.map(p=>safeMerge(DEFAULTS,p));profileIndex=Math.min(multi.profileIndex||0,profiles.length-1);state.Profile=profiles[profileIndex];save();}}catch{message('Gespeichertes Profil konnte nicht geladen werden. JSON-Sicherung importieren.',true);}
document.body.classList.toggle('light',readPreference('bai-web-theme')==='Light');const font=Number(readPreference('bai-web-font'));if(font>=8&&font<=18)document.body.style.fontSize=font+'pt';
const keys=new Set();let debugPrevious='Übersicht',latched=false;document.addEventListener('keydown',e=>{keys.add(e.key);if(keys.has('F9')&&keys.has('F12')){e.preventDefault();if(!latched){latched=true;if(page==='Debug')page=debugPrevious;else{debugPrevious=page;page='Debug';}render();}}});document.addEventListener('keyup',e=>{keys.delete(e.key);if(!keys.has('F9')&&!keys.has('F12'))latched=false;});window.addEventListener('blur',()=>{keys.clear();latched=false;});
const dl=$('#monsters');for(const m of MONSTERS){const o=document.createElement('option');o.value=m.Id;o.label=m.Name;dl.append(o);}
render();
startBaiAnalytics();
